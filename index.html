’ mirrors the woman’s confused geography. Conceptually, humour exposes ignorance without bitterness. A critical reading sees the Windrush generation using wit to survive everyday prejudice."]],"th":"Identity · Prejudice · Belonging"}],"pctx":["Berry came to Britain from Jamaica in 1948 as part of the Windrush generation, invited to help rebuild post war Britain but often met with ignorance and racism.","As a Windrush migrant invited to rebuild Britain, Berry exposes the quiet ignorance that made Caribbean citizens feel like outsiders."],"voc":{"v":[["ignorance","lack of knowledge","The woman’s ignorance about Jamaica is gently exposed."],["sincerity","honesty and genuine feeling","Her sincerity makes the speaker generous towards her."]],"m":[["L","Humour and irony","Ireland is near Lapland","The speaker mirrors her confusion to expose ignorance lightly.",1],["S","A single encounter","A conversation on one train journey","One meeting captures the experience of the Windrush generation.",0],["F","Dialogue without speech marks","Voices blend in the lines","The conversational form keeps the tone warm and natural.",0]]}},{"n":"Name Journeys","k":"Raman Mundair","sum":"Mundair was born in India and moved to Manchester as a child. The poem draws on Hindu stories of Rama and Sita and explores how migration changed her name and identity.","quotes":[{"q":"spiritual sari-sisters entwined / in an infinite silk","src":"Name Journeys, Raman Mundair","f":[["Language","The sibilance creates a soft, flowing sound, and ‘entwined’ suggests an unbreakable bond between women across generations."],["Form and structure","The enjambment flows across the line like silk, so the form enacts the continuity of heritage."],["Perceptive reading","‘infinite’ suggests her identity is connected to something timeless and sacred, beyond the reach of migration."],["Context","Saris and the story of Sita connect her to Indian, Hindu culture and female ancestors."],["Writer's intention","Mundair celebrates the beauty and strength of her cultural heritage."],["Critical and conceptual reading","Mundair’s ‘sari-sisters entwined / in an infinite silk’ presents generations of women bound together. Conceptually, heritage is a fabric that cannot be cut. A feminist reading celebrates female lineage across migration."]],"th":"Heritage · Identity · Family"},{"q":"infertile English soil","src":"Name Journeys, Raman Mundair","f":[["Language","‘infertile’ suggests England offered no nourishment for her identity to grow."],["Form and structure","The metaphor continues the imagery of plants and roots, structurally contrasting India’s richness with England’s barrenness."],["Perceptive reading","It may also criticise British society for failing to value the cultures that migrants brought with them."],["Context","Many South Asian families who came to Britain in the 1960s and 70s faced racism and pressure to assimilate."],["Writer's intention","Mundair shows the pain of being uprooted into a culture that does not nurture you."],["Critical and conceptual reading","‘infertile English soil’ suggests England offers no nourishment for her identity. Conceptually, migration uproots the self. A postcolonial reading sees the imagery of roots contrasting India’s richness with English barrenness."]],"th":"Migration · Belonging · Place"},{"q":"a stumble / that filled English mouths","src":"Name Journeys, Raman Mundair","f":[["Language","Her name becomes ‘a stumble’, an awkward obstacle in English speech, showing how her identity was mispronounced and diminished."],["Form and structure","The enjambment creates a pause, so the line itself stumbles, enacting the experience."],["Perceptive reading","The name ‘filled’ English mouths, which may suggest it is too rich and large for English to contain."],["Context","Children of migrants often had names anglicised or mispronounced in school."],["Writer's intention","Mundair wants readers to recognise how names carry identity and history."],["Critical and conceptual reading","Her name becomes ‘a stumble / that filled English mouths’. Conceptually, mispronunciation diminishes identity. A postcolonial reading sees language as a site of everyday exclusion for migrants."]],"th":"Identity · Language · Belonging"}],"pctx":["Mundair was born in India and moved to Manchester as a child. The poem draws on Hindu stories of Rama and Sita and explores how migration changed her name and identity.","Mundair shows how migration to England reshaped her name and identity, while her Hindu heritage remains a source of strength."],"voc":{"v":[["heritage","traditions passed through generations","Mundair connects her name to her Indian heritage."],["diminished","made smaller or less important","In England her name is diminished to ‘a stumble’."]],"m":[["L","Sibilance","spiritual sari-sisters entwined / in an infinite silk","Soft sounds create the flowing bond between generations of women.",1],["S","Journey structure","From India to England","The poem traces her name’s journey across places and time.",0],["F","Enjambment","a stumble / that filled English mouths","The line itself stumbles, enacting the mispronunciation.",1]]}},{"n":"pot","k":"shamshad khan","sum":"khan is a British poet of Pakistani heritage. The speaker addresses a pot taken from its home and displayed in a British museum, linking it to her own sense of displacement.","quotes":[{"q":"you shouldn’t really be moved","src":"pot, shamshad khan","f":[["Language","The speaker addresses the pot directly with ‘you’, giving it human feelings; ‘shouldn’t’ suggests moving it was wrong."],["Form and structure","Lower case letters and loose layout make the poem feel fragile and intimate, like the pot itself."],["Perceptive reading","‘moved’ has a double meaning: physically removed and emotionally affected, linking the object to people uprooted by migration."],["Context","Many museum objects were taken from colonised countries during the British Empire."],["Writer's intention","khan invites readers to question who owns cultural objects and their histories."],["Critical and conceptual reading","khan’s speaker tells the pot ‘you shouldn’t really be moved’, giving it feelings. Conceptually, the displaced object mirrors the displaced person. A postcolonial reading questions museums that display colonial plunder as heritage."]],"th":"Displacement · Power and colonialism · Belonging"},{"q":"you’re not really one of us","src":"pot, shamshad khan","f":[["Language","The pronouns ‘you’ and ‘us’ show exclusion, as if the pot, and the speaker, no longer belong anywhere."],["Form and structure","This line shifts the poem from the pot’s story to the speaker’s own experience of rejection."],["Perceptive reading","It suggests diaspora communities can be rejected by both their new home and their family’s original culture."],["Context","British Asians often describe feeling caught between two cultures."],["Writer's intention","khan reveals the painful sense of not fully belonging in either world."],["Critical and conceptual reading","‘you’re not really one of us’ voices the rejection the pot, and the speaker, receive. Conceptually, belonging is denied from more than one side, leaving the speaker between communities. A critical reading sees the shift from the pot’s story to the speaker’s own as the poem’s emotional turn."]],"th":"Identity · Belonging · Diaspora"},{"q":"more asian than the asians","src":"pot, shamshad khan","f":[["Language","The repetition of ‘asian’ mocks the idea of measuring how authentic someone’s identity is."],["Form and structure","Lower case ‘asian’ removes the formal capital, perhaps questioning fixed labels."],["Perceptive reading","Perceptively, being ‘more asian’ in England may reflect clinging to heritage because of displacement."],["Context","Migrant families often preserve traditions strongly when far from home."],["Writer's intention","khan challenges simple ideas of identity and belonging."],["Critical and conceptual reading","‘more asian than the asians’ mocks the idea that identity can be measured or tested. Conceptually, authenticity becomes an impossible standard. A critical reading notes the lower case ‘asian’ quietly rejecting fixed, capitalised labels."]],"th":"Identity · Culture · Diaspora"}],"pctx":["khan is a British poet of Pakistani heritage. The speaker addresses a pot taken from its home and displayed in a British museum, linking it to her own sense of displacement.","By addressing a museum object taken from its home, khan links colonial plunder to the displacement felt by diaspora communities."],"voc":{"v":[["displacement","being moved from home","The pot’s displacement mirrors the speaker’s."],["authenticity","being genuine","The poem mocks attempts to measure authenticity."]],"m":[["L","Direct address","you shouldn’t really be moved","Speaking to the pot gives it feelings and shows sympathy.",1],["S","Shift to the speaker","you’re not really one of us","The pot’s story becomes the speaker’s experience of rejection.",1],["F","Lower case and loose layout","pot","The fragile form mirrors a delicate object and identity.",1]]}},{"n":"A Wider View","k":"Seni Seneviratne","sum":"Seneviratne was born in Leeds to a Sri Lankan father and English mother. The poem imagines an ancestor who worked in a Leeds flax mill during the Industrial Revolution.","quotes":[{"q":"eyes dry with dust / from twelve hours combing flax","src":"A Wider View, Seni Seneviratne","f":[["Language","The physical detail ‘dry with dust’ shows the harsh conditions, and ‘twelve hours’ emphasises exhausting labour."],["Form and structure","The enjambment stretches the line, mimicking the long working day."],["Perceptive reading","Dry eyes may also suggest he had no time to cry or dream, his emotions worn away by work."],["Context","Victorian mill workers worked long shifts in dusty, dangerous conditions, often from childhood."],["Writer's intention","Seneviratne honours the forgotten workers whose labour built industrial Britain."],["Critical and conceptual reading","The ancestor’s ‘eyes dry with dust’ from twelve hour shifts make labour physical and painful. Conceptually, industrial wealth was built on workers’ bodies. A Marxist reading honours the forgotten mill workers of the Industrial Revolution."]],"th":"Work and class · Heritage · Place"},{"q":"he craved the comfort of a wider view","src":"A Wider View, Seni Seneviratne","f":[["Language","‘craved’ shows intense longing, and ‘wider view’ suggests escape from the narrow, cramped life of the mill."],["Form and structure","The poem’s title is echoed here, making this desire the emotional centre of the poem."],["Perceptive reading","The ‘wider view’ may be literal, the sky above the mill, or a wish for freedom and opportunity denied to his class."],["Context","Leeds grew rich from flax and wool mills, while many workers lived in cramped back to back houses where cholera spread."],["Writer's intention","She shows that working people also had dreams and imagination."],["Critical and conceptual reading","‘he craved the comfort of a wider view’ shows longing for escape from the narrow mill. Conceptually, imagination resists confinement. A critical reading sees the title’s hope passed down to the speaker, who now has the wider view he craved."]],"th":"Freedom · Class · Identity"},{"q":"the curve of past and future generations / arcs between us","src":"A Wider View, Seni Seneviratne","f":[["Language","The ‘curve’ and ‘arcs’ suggest a bridge or rainbow connecting the speaker with her ancestor."],["Form and structure","The poem moves between past and present, and the final image unites them, giving a sense of closure."],["Perceptive reading","‘arcs between us’ suggests heritage is not lost but alive, shaping who she is today."],["Context","Interest in family history has grown, helping people reconnect with working class ancestors."],["Writer's intention","Seneviratne wants readers to value the connection between generations."],["Critical and conceptual reading","The ‘curve of past and future generations’ arcs between speaker and ancestor like a bridge. Conceptually, time is connected rather than broken. A critical reading sees mixed heritage as continuity, not division."]],"th":"Heritage · Family · Time"}],"pctx":["Seneviratne was born in Leeds to a Sri Lankan father and English mother. The poem imagines an ancestor who worked in a Leeds flax mill during the Industrial Revolution.","Seneviratne gives a voice to the forgotten workers of industrial Leeds, connecting her own identity to the labour of past generations."],"voc":{"v":[["exploitation","unfair use of people’s labour","The flax mill shows the exploitation of workers."],["legacy","something handed down","The speaker inherits her ancestor’s legacy."]],"m":[["L","Sensory imagery","eyes dry with dust / from twelve hours combing flax","Physical detail shows exhausting labour.",1],["S","Past and present","the curve of past and future generations / arcs between us","The ending unites ancestor and speaker.",1],["F","Free verse","Irregular lines with enjambment","Long lines mimic the long working day.",0]]}},{"n":"Homing","k":"Liz Berry","sum":"Liz Berry is from the Black Country in the West Midlands. Elocution lessons once pressured people to hide regional accents, which were seen as lower class.","quotes":[{"q":"you kept your accent / in a box","src":"Homing, Liz Berry","f":[["Language","The metaphor presents the accent as something hidden away, suggesting shame or suppression."],["Form and structure","The enjambment separates ‘accent’ from ‘in a box’, mirroring how the voice was separated from the person."],["Perceptive reading","A box also keeps things safe, suggesting the accent was preserved, waiting to be rediscovered."],["Context","In the mid twentieth century, regional accents were often seen as a barrier to social progress."],["Writer's intention","Berry shows how class prejudice made people hide part of their identity."],["Critical and conceptual reading","Berry’s speaker in ‘Homing’ notes the accent kept ‘in a box’, hidden away. Conceptually, regional speech was treated as shameful and suppressed. A class based reading links this to elocution lessons that tried to erase working class voices."]],"th":"Identity · Class · Language"},{"q":"vowels ferrous as nails","src":"Homing, Liz Berry","f":[["Language","‘ferrous’ means containing iron, so the vowels are strong and tough, like the metal industries of the Black Country."],["Form and structure","The simile connects language to place, grounding the accent in industrial heritage."],["Perceptive reading","Nails hold things together, suggesting the accent binds family and community."],["Context","The Black Country was famous for coal, iron and nail making during the Industrial Revolution."],["Writer's intention","Berry celebrates regional accents as part of a proud working class heritage."],["Critical and conceptual reading","‘vowels ferrous as nails’ makes the accent as strong and tough as iron. Conceptually, language is rooted in the Black Country’s industrial heritage of nail making and metalwork. A class based reading celebrates regional speech as a mark of pride rather than shame."]],"th":"Heritage · Place · Identity"},{"q":"forge your voice / in my mouth","src":"Homing, Liz Berry","f":[["Language","The verb ‘forge’ suggests making something strong in a furnace, presenting the speaker as reclaiming her parent’s voice."],["Form and structure","The poem ends with this act of reclamation, moving from suppression to celebration."],["Perceptive reading","It suggests identity is passed down through generations and can be reshaped and kept alive."],["Context","Blacksmithing and metalwork were central to the Black Country’s history."],["Writer's intention","Berry encourages readers to embrace, not hide, their roots."],["Critical and conceptual reading","‘forge your voice / in my mouth’ shows the speaker reclaiming the parent’s hidden accent. Conceptually, suppression becomes celebration, and language passes between generations like a craft. The verb ‘forge’ links speech to the furnace, making identity something made with heat and strength."]],"th":"Family · Identity · Heritage"}],"pctx":["Liz Berry is from the Black Country in the West Midlands. Elocution lessons once pressured people to hide regional accents, which were seen as lower class.","Berry celebrates the Black Country accent that class prejudice once forced people to hide, reclaiming it as a proud inheritance."],"voc":{"v":[["suppression","holding something back","The parent’s accent suffers suppression."],["reclamation","taking something back","The ending is an act of reclamation."]],"m":[["L","Metaphor","you kept your accent / in a box","The accent is hidden away, suggesting shame.",1],["S","Movement to reclamation","forge your voice / in my mouth","The poem moves from hiding to celebrating the accent.",1],["F","Direct address","Spoken to a parent","The intimate form shows love and pride in heritage.",0]]}},{"n":"A Century Later","k":"Imtiaz Dharker","sum":"Dharker was born in Pakistan and grew up in Glasgow. The poem alludes to Malala Yousafzai, shot by the Taliban in 2012 for going to school, and to Owen’s First World War poetry.","quotes":[{"q":"the school-bell is a call to battle","src":"A Century Later, Imtiaz Dharker","f":[["Language","The metaphor turns an everyday school bell into a call to war, showing education as a dangerous struggle."],["Form and structure","It echoes Wilfred Owen’s ‘Anthem for Doomed Youth’, linking the girl to soldiers of the First World War."],["Perceptive reading","It suggests the battle for education is as important as any war fought with weapons."],["Context","Published a century after the First World War began; girls’ education was banned by the Taliban in parts of Pakistan."],["Writer's intention","Dharker presents going to school as an act of bravery."],["Critical and conceptual reading","Dharker’s metaphor turns the school bell into a ‘call to battle’. Conceptually, education becomes a dangerous act of resistance for girls under oppressive regimes. A critical reading links the poem to Malala Yousafzai and echoes Owen’s ‘Anthem for Doomed Youth’."]],"th":"Power and conflict · Education · Courage"},{"q":"cheek still rounded from being fifteen","src":"A Century Later, Imtiaz Dharker","f":[["Language","‘rounded’ suggests youth and innocence, emphasising how young the victim is."],["Form and structure","The physical detail slows the poem down, creating a moment of vulnerability before violence."],["Perceptive reading","It contrasts with the soldiers of 1914, suggesting children are now the ones on the front line."],["Context","Malala was fifteen when she was shot on her school bus."],["Writer's intention","Dharker shocks readers with the youth of those targeted."],["Critical and conceptual reading","‘cheek still rounded from being fifteen’ stresses the victim’s youth and innocence. Conceptually, violence targets the most vulnerable. A critical reading sees the tender physical detail making the girl’s later defiance more powerful."]],"th":"Childhood · Violence · Injustice"},{"q":"You cannot kill a book / or the buzzing in it","src":"A Century Later, Imtiaz Dharker","f":[["Language","The direct address and modal ‘cannot’ make a defiant statement; ‘buzzing’ suggests ideas are alive and energetic."],["Form and structure","The poem ends on this assertion, turning from violence to triumph."],["Perceptive reading","The image develops into ‘a swarm’, suggesting education spreads and cannot be stopped."],["Context","Malala survived and became a global campaigner, winning the Nobel Peace Prize in 2014."],["Writer's intention","Dharker celebrates the power of education to defeat oppression."],["Critical and conceptual reading","‘You cannot kill a book’ declares that ideas outlive violence. Conceptually, knowledge is presented as indestructible and alive, ‘buzzing’ with energy. A critical reading sees the poem turning from victimhood to triumph."]],"th":"Hope and resistance · Education · Power"}],"pctx":["Dharker was born in Pakistan and grew up in Glasgow. The poem alludes to Malala Yousafzai, shot by the Taliban in 2012 for going to school, and to Owen’s First World War poetry.","Alluding to Malala Yousafzai and to Owen’s war poetry, Dharker presents a girl’s right to education as a battle worth fighting."],"voc":{"v":[["defiance","bold resistance","The girl’s defiance makes education a battle."],["resilience","the strength to recover","The ending celebrates resilience."]],"m":[["L","Metaphor","the school-bell is a call to battle","Education becomes a dangerous struggle.",1],["S","Turn to triumph","You cannot kill a book","The poem moves from violence to defiant hope.",1],["F","Allusion to war poetry","Echoes of Owen","Linking her to soldiers gives her heroism.",0]]}},{"n":"The Jewellery Maker","k":"Louisa Adjoa Parker","sum":"Parker is a British poet of Ghanaian and English heritage who writes about ordinary lives. The poem describes a craftsman making gold jewellery for others while his own life stays simple.","quotes":[{"q":"like his father before him, and his father too","src":"The Jewellery Maker, Louisa Adjoa Parker","f":[["Language","The repetition of ‘father’ shows skill passed down through generations."],["Form and structure","The rhythm of the line feels continuous, like the tradition itself."],["Perceptive reading","It may also suggest he is trapped in a cycle, his life shaped by inheritance rather than choice."],["Context","Traditional crafts are often family trades handed down over generations."],["Writer's intention","Parker honours the dignity of inherited skill."],["Critical and conceptual reading","The repetition ‘his father before him, and his father too’ shows skill passed through generations. Conceptually, craft is a form of inheritance and identity. A critical reading sees Parker honouring ordinary working lives that history often overlooks."]],"th":"Heritage · Family · Work"},{"q":"neat as soldiers","src":"The Jewellery Maker, Louisa Adjoa Parker","f":[["Language","The simile shows the precision of his tools, laid out in disciplined rows."],["Form and structure","Military imagery contrasts with the gentle craft, adding dignity and seriousness."],["Perceptive reading","It may hint at the discipline and sacrifice of work, as if his labour is a daily battle."],["Context","Skilled manual work requires precision and long training."],["Writer's intention","Parker presents craftsmanship as worthy of respect."],["Critical and conceptual reading","The simile ‘neat as soldiers’ gives the jeweller’s tools discipline and dignity. Conceptually, precision becomes a kind of devotion. A critical reading notes the military image adds seriousness to a gentle craft."]],"th":"Work · Identity · Pride"},{"q":"warming the metal his hands caress","src":"The Jewellery Maker, Louisa Adjoa Parker","f":[["Language","‘caress’ suggests love and tenderness, showing his emotional connection to his work."],["Form and structure","The poem ends with this gentle image of touch, closing on his contentment."],["Perceptive reading","The love he gives to gold for wealthy buyers contrasts with his own family’s plain, simple jewellery, hinting at inequality."],["Context","Global trade means skilled workers often make luxury goods they cannot afford."],["Writer's intention","Parker shows the quiet beauty and unfairness in his life."],["Critical and conceptual reading","‘warming the metal his hands caress’ shows tenderness towards his work. Conceptually, craft is presented as an act of love. A critical reading sees contentment in a modest life making beauty for others."]],"th":"Inequality · Love · Work"}],"pctx":["Parker is a British poet of Ghanaian and English heritage who writes about ordinary lives. The poem describes a craftsman making gold jewellery for others while his own life stays simple.","Parker honours the dignity of skilled manual work while hinting at the inequality between those who make luxury and those who own it."],"voc":{"v":[["craftsmanship","skill in making things by hand","Parker celebrates the jeweller’s craftsmanship."],["tradition","customs passed down","His skill is a family tradition."]],"m":[["L","Simile","neat as soldiers","Military imagery gives his tools dignity and order.",1],["S","Generations","like his father before him, and his father too","Repetition shows skill passing through time.",1],["F","Gentle ending","warming the metal his hands caress","The poem closes on tenderness and contentment.",1]]}},{"n":"With Birds You’re Never Lonely","k":"Raymond Antrobus","sum":"Antrobus is a British Jamaican poet who is Deaf. The poem moves from a noisy London café to a memory of a New Zealand forest and Māori wisdom about birds.","quotes":[{"q":"I can’t hear the barista / over the coffee machine.","src":"With Birds You’re Never Lonely, Raymond Antrobus","f":[["Language","The plain opening statement shows the frustration of noise for a Deaf person in a busy city."],["Form and structure","Starting in the present tense in a café, the poem later shifts to a forest, contrasting city and nature."],["Perceptive reading","Not hearing may symbolise disconnection from urban life as a whole."],["Context","Antrobus writes about Deaf identity and how hearing society often excludes Deaf people."],["Writer's intention","He invites readers into his sensory experience of the world."],["Critical and conceptual reading","Antrobus opens with noise drowning out the barista, a frustration for a Deaf speaker. Conceptually, the hearing world is presented as overwhelming rather than normal. A disability studies reading challenges the assumption that hearing is the default."]],"th":"Identity · Place · Isolation"},{"q":"I was tuned / into a silence","src":"With Birds You’re Never Lonely, Raymond Antrobus","f":[["Language","‘tuned’ suggests careful listening, turning silence into something he chooses rather than lacks."],["Form and structure","The enjambment creates a pause, letting the silence enter the poem."],["Perceptive reading","It is followed by ‘that was not an absence’, reframing deafness as a different way of experiencing the world."],["Context","Deaf culture challenges the idea that deafness is simply a loss."],["Writer's intention","Antrobus presents silence as rich and meaningful."],["Critical and conceptual reading","‘tuned / into a silence’ reframes silence as a chosen, rich experience. Conceptually, absence becomes presence. A disability studies reading celebrates Deaf perception as a different way of knowing the world."]],"th":"Identity · Nature · Connection"},{"q":"The forest spat all the birds back","src":"With Birds You’re Never Lonely, Raymond Antrobus","f":[["Language","The verb ‘spat’ personifies the forest as alive and energetic, suddenly bursting with sound."],["Form and structure","This moment marks a structural shift from silence to noise."],["Perceptive reading","It suggests nature is not passive but has a voice, linking to Māori belief in nature’s spirit."],["Context","Māori culture values deep connection with the natural world and ancestors."],["Writer's intention","Antrobus suggests that connection to nature can end loneliness."],["Critical and conceptual reading","‘The forest spat all the birds back’ bursts the silence with sudden life. Conceptually, nature becomes vivid and generous. A critical reading sees connection with the natural world overcoming isolation."]],"th":"Nature · Belonging · Culture"}],"pctx":["Antrobus is a British Jamaican poet who is Deaf. The poem moves from a noisy London café to a memory of a New Zealand forest and Māori wisdom about birds.","Antrobus, who is Deaf, reframes silence as a rich experience rather than an absence, challenging assumptions of a hearing society."],"voc":{"v":[["perception","the way we notice the world","Antrobus challenges hearing perceptions of silence."],["affinity","a natural closeness","He feels an affinity with the birds."]],"m":[["L","Metaphor","I was tuned / into a silence","Silence becomes a chosen, rich experience.",1],["S","Shift in setting","From a café to a forest","The move contrasts city noise with natural peace.",0],["F","Free verse","Irregular lines","The open form suits a personal reflection.",0]]}},{"n":"A Portable Paradise","k":"Roger Robinson","sum":"Robinson is a British Trinidadian poet. His collection A Portable Paradise won the 2019 T. S. Eliot Prize and explores migration, racism and resilience.","quotes":[{"q":"white sands, green hills and fresh fish","src":"A Portable Paradise, Roger Robinson","f":[["Language","The list of sensory images describes a Caribbean paradise of beauty and abundance."],["Form and structure","The tricolon gives the memory a rhythmic, comforting quality."],["Perceptive reading","It is idealised, perhaps showing how memory transforms home into something perfect."],["Context","Many Caribbean migrants cherished memories of home while facing hardship in Britain."],["Writer's intention","Robinson celebrates the power of memory and heritage."],["Critical and conceptual reading","Robinson’s tricolon ‘white sands, green hills and fresh fish’ conjures a Caribbean paradise. Conceptually, memory becomes an inner refuge. A postcolonial reading sees heritage sustaining migrants against hardship and racism in Britain."]],"th":"Heritage · Place · Memory"},{"q":"carry it always / on my person","src":"A Portable Paradise, Roger Robinson","f":[["Language","The idea of carrying paradise suggests inner strength and comfort kept within."],["Form and structure","The enjambment separates ‘always’ from ‘on my person’, emphasising permanence."],["Perceptive reading","It may suggest paradise is a state of mind rather than a place, making it impossible to steal."],["Context","The advice comes from his grandmother, linking resilience to family wisdom."],["Writer's intention","Robinson encourages readers to find strength within themselves."],["Critical and conceptual reading","‘carry it always / on my person’ presents paradise as portable. Conceptually, home is carried within rather than tied to a place. A critical reading sees resilience as an inheritance passed from grandmother to grandchild."]],"th":"Resilience · Identity · Family"},{"q":"like the fresh hope / of morning","src":"A Portable Paradise, Roger Robinson","f":[["Language","The simile links paradise to dawn, a symbol of new beginnings."],["Form and structure","The poem ends on hope, giving a positive resolution."],["Perceptive reading","It suggests resilience is renewed daily, despite ‘sustained and daily’ stresses."],["Context","Migrants and working class people often face daily pressures and discrimination."],["Writer's intention","Robinson leaves readers with optimism."],["Critical and conceptual reading","‘like the fresh hope / of morning’ ends the poem with renewal. Conceptually, each day offers a new beginning, however hard the night before. A critical reading sees optimism itself as a form of resistance for migrants facing hostility."]],"th":"Hope · Resilience · Belonging"}],"pctx":["Robinson is a British Trinidadian poet. His collection A Portable Paradise won the 2019 T. S. Eliot Prize and explores migration, racism and resilience.","Robinson, a British Trinidadian poet, presents memory and heritage as an inner refuge against the daily pressures migrants face."],"voc":{"v":[["sanctuary","a place of safety","Memory becomes a portable sanctuary."],["adversity","difficulty or hardship","The speaker carries paradise through adversity."]],"m":[["L","Sensory imagery","white sands, green hills and fresh fish","The tricolon creates a warm, abundant paradise.",1],["S","Hopeful ending","like the fresh hope / of morning","The poem resolves on hope.",1],["F","Instructional voice","carry it always / on my person","Advice passed down gives comfort and strength.",1]]}},{"n":"Like an Heiress","k":"Grace Nichols","sum":"Nichols was born in Guyana and moved to Britain in 1977. The poem describes returning to an Atlantic beach of her childhood, expecting treasure and finding rubbish.","quotes":[{"q":"lone / wave of rubbish","src":"Like an Heiress, Grace Nichols","f":[["Language","The ‘wave of rubbish’ is a shocking metaphor that turns the ocean’s beauty into waste."],["Form and structure","The enjambment isolates ‘lone’, emphasising emptiness and loss."],["Perceptive reading","‘wave’ suggests rubbish is now as natural to the sea as water, a disturbing reversal."],["Context","Plastic pollution in the oceans has become a global environmental crisis."],["Writer's intention","Nichols wants readers to confront the damage humans cause to nature."],["Critical and conceptual reading","Nichols’s ‘wave of rubbish’ replaces the ocean’s beauty with waste. Conceptually, the ‘inheritance’ of the title turns out to be pollution rather than treasure. An ecocritical reading sees global consumer culture washing up on the Caribbean coast of her childhood."]],"th":"Nature · Environment · Loss"},{"q":"car tyres, plastic bottles, styrofoam cups","src":"Like an Heiress, Grace Nichols","f":[["Language","The list of man made objects contrasts with natural beauty."],["Form and structure","The asyndetic list piles up the rubbish, creating a sense of overwhelming waste."],["Perceptive reading","Everyday objects suggest everyone shares responsibility for pollution."],["Context","Consumer culture produces vast amounts of disposable plastic."],["Writer's intention","Nichols criticises modern consumerism."],["Critical and conceptual reading","The asyndetic list of ‘car tyres, plastic bottles, styrofoam cups’ piles up waste without pause. Conceptually, human consumption overwhelms the natural world. An ecocritical reading sees the poem as quiet environmental protest about what future generations will inherit."]],"th":"Environment · Responsibility · Place"},{"q":"the sun’s burning treasury","src":"Like an Heiress, Grace Nichols","f":[["Language","The metaphor presents the sun as a store of wealth, linking to the title ‘heiress’."],["Form and structure","The poem returns to images of treasure, contrasting what she hoped to inherit with what she found."],["Perceptive reading","‘burning’ may hint at climate change, the sun now a threat as well as a treasure."],["Context","Rising temperatures threaten Caribbean and coastal communities."],["Writer's intention","Nichols makes readers consider the planet future generations will inherit."],["Critical and conceptual reading","‘the sun’s burning treasury’ reminds the speaker that nature’s true wealth remains. Conceptually, light and life outlast human rubbish. A critical reading sees fragile hope in what can still be passed on, if it is protected."]],"th":"Nature · Inheritance · The future"}],"pctx":["Nichols was born in Guyana and moved to Britain in 1977. The poem describes returning to an Atlantic beach of her childhood, expecting treasure and finding rubbish.","Returning to the beach of her Guyanese childhood, Nichols confronts plastic pollution and the damaged world future generations will inherit."],"voc":{"v":[["pollution","harmful waste in the environment","The beach is ruined by pollution."],["inheritance","what is passed down","The speaker inherits rubbish rather than treasure."]],"m":[["L","Asyndetic list","car tyres, plastic bottles, styrofoam cups","Piled up waste overwhelms the natural scene.",1],["S","Contrast of treasure and rubbish","the sun’s burning treasury","The poem contrasts what she hoped to inherit with what she found.",1],["F","Free verse with enjambment","lone / wave of rubbish","Isolated words emphasise loss.",1]]}},{"n":"Thirteen","k":"Caleb Femi","sum":"Femi is a British Nigerian poet who grew up in Peckham, South London. The poem describes a thirteen year old Black boy stopped by police and treated as a man.","quotes":[{"q":"the warmth of your teeth","src":"Thirteen, Caleb Femi","f":[["Language","The detail of ‘warmth’ shows the boy’s natural joy and innocence."],["Form and structure","This image comes early, before fear takes over, structurally contrasting innocence with threat."],["Perceptive reading","It suggests his smile is a sign of childhood that the police refuse to see."],["Context","Young Black boys are disproportionately stopped and searched by police in the UK."],["Writer's intention","Femi shows the humanity of the boy."],["Critical and conceptual reading","Femi’s detail of ‘the warmth of your teeth’ captures a thirteen year old’s natural joy. Conceptually, innocence is shown before it is taken. A critical reading sees the poem’s structure moving deliberately from warmth to fear."]],"th":"Childhood · Identity · Innocence"},{"q":"fear condenses on your lips","src":"Thirteen, Caleb Femi","f":[["Language","‘condenses’ suggests fear turning physical, like breath on a cold window."],["Form and structure","The second person ‘you’ draws the reader into the boy’s experience."],["Perceptive reading","It suggests fear silences him, taking away his voice."],["Context","Stop and search can leave young people feeling powerless and criminalised."],["Writer's intention","Femi makes readers feel the injustice personally."],["Critical and conceptual reading","‘fear condenses on your lips’ turns fear into something physical, like breath on glass. Conceptually, racial profiling forces children to carry adult fear. A critical reading exposes how Black boys are treated as threats rather than children."]],"th":"Power and injustice · Race · Fear"},{"q":"black holes","src":"Thirteen, Caleb Femi","f":[["Language","The cosmic metaphor suggests young Black boys are ‘dying stars’, their potential collapsing."],["Form and structure","The poem ends on this image, leaving a bleak conclusion."],["Perceptive reading","Black holes are powerful, perhaps hinting at anger or energy that society cannot contain."],["Context","Racial profiling can damage young people’s sense of self and future."],["Writer's intention","Femi warns readers about the cost of injustice."],["Critical and conceptual reading","The closing metaphor ‘black holes’ suggests futures collapsing into darkness. Conceptually, injustice destroys potential. A critical reading sees a bleak warning about the cost of racism to young lives and to society."]],"th":"Race · Injustice · Loss of childhood"}],"pctx":["Femi is a British Nigerian poet who grew up in Peckham, South London. The poem describes a thirteen year old Black boy stopped by police and treated as a man.","Femi, who grew up in Peckham, exposes how racial profiling robs young Black boys of their childhood."],"voc":{"v":[["injustice","unfair treatment","Femi exposes the injustice of racial profiling."],["innocence","childlike purity","The boy’s innocence is stolen."]],"m":[["L","Metaphor","black holes","Cosmic imagery suggests potential collapsing.",1],["S","Innocence to fear","the warmth of your teeth","Early warmth contrasts with later fear.",1],["F","Second person","fear condenses on your lips","‘your’ forces the reader into the boy’s experience.",1]]}}],"ctx9":[["Romantic and Victorian poets","Wordsworth, Shelley, Brontë and Eliot write about nature, power and the city.","The pre 1914 poems show early concerns about industry, power and human cruelty."],["Migration","Windrush and South Asian migration shaped modern Britain.","Berry and Mundair explore how migrants were seen as outsiders."],["Identity and language","Accents, names and heritage shape who we are.","Homing and Name Journeys present language as a key part of identity."],["Power and injustice","Monarchy, colonialism, racism and police power.","Shelley and Femi, centuries apart, both expose those in power failing the people."],["Environment","Pollution and climate change.","Like an Heiress warns about the planet future generations will inherit."],["Comparison","Compare a named poem with one other.","Grade 9 answers compare methods and context, not just ideas."]]}];
const UNSEEN = {"q1":[{"h":"Paragraph 1: rejecting how others see her","p":[["P","Angelou presents the speaker’s attitude to growing old as one of quiet frustration at the way other people see the elderly, insisting that she has an inner life that others ignore."],["E","She imagines others seeing her ‘sitting quietly, / Like a sack left on the shelf,’."],["T","Angelou uses a simile combined with alliteration in ‘sack’ and ‘shelf’."],["A","The simile suggests that society treats old people like objects: shapeless, useless and put away out of sight. The noun ‘sack’ connotes something heavy, dull and without value, while ‘left on the shelf’ implies being forgotten or abandoned. The hissing sibilance may even hint at the speaker’s irritation at being judged so unfairly."],["W","Angelou may intend to make readers confront the dismissive way they think about older people."],["L","Therefore, the speaker’s attitude begins with a rejection of the role society gives her."],["E","This develops when she explains, ‘I’m listening to myself.’"],["T","Angelou uses a short, simple declarative sentence in the first person."],["A","This suggests that her silence is not emptiness but reflection; she is thoughtful and self sufficient. The reflexive pronoun ‘myself’ implies independence, as if she is her own best company. Alternatively, it could suggest that age has given her wisdom and a deeper understanding of herself."],["W","Angelou wants the reader to see that older people still have rich inner lives."],["L","Overall, the speaker presents growing old as something that others misunderstand rather than something to be pitied."]]},{"h":"Paragraph 2: proud defiance","p":[["P","Angelou also presents the speaker’s attitude as defiant and proud, as she refuses to be pitied."],["E","She commands, ‘Hold! Stop! Don’t pity me!’"],["T","Angelou uses a series of exclamatory imperatives, repeated in the following line."],["A","The short, forceful commands create a sharp, urgent rhythm, suggesting that the speaker is fierce and full of energy, far from the passive ‘sack’ others imagine. The repetition of ‘Hold! Stop!’ shows how strongly she rejects sympathy, as if she is physically holding back other people’s pity. Perhaps the exclamation marks also convey anger that she has to defend her dignity at all."],["W","Angelou may intend to challenge the idea that the elderly should be grateful for pity."],["L","Therefore, the speaker’s attitude to growing old is one of strength and pride."],["E","This defiance is reinforced when she asks only one favour: ‘Don’t bring me no rocking chair.’"],["T","Angelou uses informal language, including a double negative, and the symbol of the rocking chair."],["A","The rocking chair is a familiar symbol of old age, inactivity and giving up, so rejecting it suggests that she refuses to retire from life. The conversational double negative ‘Don’t… no’ creates a warm, humorous voice, implying that she faces age with good humour as well as determination."],["W","Angelou wants the reader to admire the speaker’s spirit and refusal to accept stereotypes."],["L","Overall, the speaker’s attitude is one of humorous but firm resistance to the expectations placed on the old."]]},{"h":"Paragraph 3: acceptance and gratitude","p":[["P","Finally, Angelou presents the speaker as accepting the physical effects of ageing with honesty, humour and gratitude."],["E","She admits she has ‘A little less hair, a little less chin, / A lot less lungs and much less wind.’"],["T","Angelou uses a list with repetition of ‘less’ and rhyme."],["A","The repeated ‘less’ acknowledges her physical decline openly, yet the light, rhythmic rhyme of ‘chin’ and ‘wind’ makes it sound playful rather than tragic. This suggests that she accepts the losses of age without self pity; the comic image of ‘less chin’ even invites the reader to laugh with her."],["W","Angelou may intend to show that ageing can be faced honestly and cheerfully."],["L","Therefore, the speaker’s attitude is one of realistic acceptance."],["E","This leads to the final line, ‘But ain’t I lucky I can still breathe in.’"],["T","Angelou uses the conjunction ‘But’ to create a volta, ending on a rhetorical question without a question mark."],["A","The conjunction ‘But’ turns the poem from loss to celebration, suggesting that being alive matters more than anything she has lost. The adjective ‘lucky’ conveys gratitude, and the simple act of breathing becomes a symbol of life itself. The colloquial ‘ain’t’ keeps her voice warm and genuine to the very end."],["W","Angelou wants the reader to finish the poem uplifted, valuing life at every age."],["L","Overall, the speaker’s attitude to growing old moves from frustration to pride and finally to joyful gratitude."]]}],"q2":[{"h":"Paragraph 1: perspective and voice","p":[["P","Both poets present attitudes to the effects of growing old, but while Angelou’s speaker describes her own ageing with defiance, Williams’s speaker observes her grandmother’s age with tenderness and wonder."],["E","In ‘On Aging’, the speaker insists, ‘I’m the same person I was back then,’."],["T","Angelou uses a first person, conversational voice."],["A","This suggests that age has not changed who she is inside, and the direct voice makes her sound confident and in control of her own story."],["W","Angelou wants readers to see the person behind the ageing body."],["L","Therefore, Angelou presents age from the inside, as an experience the speaker owns."],["E","In contrast, ‘Jessie Emily Schofield’ ends with ‘My mother’s mother under my hands.’"],["T","Williams uses a third person portrait seen through the grandchild’s eyes, ending on a single, simple line."],["A","The phrase ‘My mother’s mother’ emphasises the chain of generations, suggesting love and connection, while ‘under my hands’ shows the grandchild now caring for the woman who once cared for others."],["W","Williams wants the reader to feel the tenderness of caring for an elderly relative."],["L","Overall, Angelou presents ageing as a personal challenge to be faced proudly, whereas Williams presents it as a gentle reversal of roles within a family."]]},{"h":"Paragraph 2: images of frailty","p":[["P","Both poets use physical imagery to present the frailty of age, but with very different effects."],["E","Angelou’s speaker admits, ‘When my bones are stiff and aching, / And my feet won’t climb the stair,’."],["T","Angelou uses concrete physical detail followed by a request that rejects pity."],["A","The adjectives ‘stiff and aching’ acknowledge pain honestly, yet she immediately refuses the rocking chair, suggesting that physical weakness will not defeat her spirit."],["W","Angelou wants readers to separate physical decline from personal worth."],["L","Therefore, Angelou presents frailty as something to be resisted."],["E","In contrast, Williams describes how her grandmother’s ‘wet head felt delicate as a birdskull’."],["T","Williams uses a simile drawn from nature."],["A","The simile presents fragility as something beautiful and precious rather than shameful, and the earlier image of her walking ‘Like a learning child’ suggests that old age brings people full circle, back to the vulnerability of childhood."],["W","Williams wants the reader to respond to age with gentleness and awe."],["L","Overall, both poets acknowledge the body’s decline, but Angelou meets it with defiance, while Williams meets it with tenderness."]]}]};

  const t = cur.t, gs = cur.scope === "all" ? t.groups : [t.groups[+cur.scope]];
  $("#pane").innerHTML = gs.map((g) => `
    <div class="group-h"><h2>${esc(g.n)}</h2><span class="k">${esc(g.k)}</span></div>
    ${g.sum ? `<p class="lede" style="margin-top:0">${esc(g.sum)}</p>` : ""}
    <div class="grid2" style="margin-top:10px">${g.quotes.map((q)=>qCard(q)).join("")}</div>`).join("");
}

// ---------- GAMES ----------
const GAMES = [
  ["flash","Flashcards","Read the quotation, recall the analysis, then flip. Mark what you know."],
  ["gap","Fill the gap","Type the missing words to learn each quotation word for word."],
  ["order","Rebuild the quote","Tap the words in the right order."],
  ["who","Who, where or which poem?","Match each quotation to its character, chapter or poem."],
  ["match","Analysis match","Read Grade 9 analysis and pick the quotation it explains."],
  ["ctx","Context quiz","Choose the context that fits the quotation."],
];
function games(){
  $("#pane").innerHTML = `<div class="games">${GAMES.map(([k,n,d])=>`<button class="game" data-k="${k}"><strong>${n}</strong><span class="small">${d}</span></button>`).join("")}</div><div id="stagebox"></div>`;
  $("#pane").querySelectorAll(".game").forEach((b) => b.onclick = () => startGame(b.dataset.k));
}
function bump(q, ok){ P.m[q.id] = Math.max(0, Math.min(3, (P.m[q.id]||0) + (ok?1:-1))); save(); totals(); }
function startGame(kind){
  const pool = shuffle(scopeQuotes());
  if (kind === "ctx" && !pool.some((q)=>fieldOf(q,/Context/))) { $("#stagebox").innerHTML = `<div class="stage empty">No context notes for this selection.</div>`; return; }
  const n = Math.min(10, pool.length); let i = 0, score = 0;
  const box = $("#stagebox");
  box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  const next = () => { if (i >= n) return done(); const q = pool[i++]; ({flash, gap, order, who, match, ctx})[kind](q); };
  const head = (title) => `<div class="top"><span><b style="color:var(--ink)">${title}</b></span><span>Question ${i} of ${n} · Score ${score}</span></div>`;
  const done = () => { box.innerHTML = `<div class="stage"><h2>Round complete</h2><p class="lede">You scored ${score} out of ${n}. Quotations you got right move towards ‘learnt’.</p><div class="row" style="margin-top:14px"><button class="btn primary" id="again">Play again</button><button class="btn" id="back">Choose another game</button></div></div>`; $("#again").onclick=()=>startGame(kind); $("#back").onclick=games; };
  const nextBtn = () => `<div class="row" style="margin-top:16px"><button class="btn primary" id="nx">${i>=n?"See score":"Next"}</button></div>`;
  const mc = (q, title, prompt, options, correct) => {
    box.innerHTML = `<div class="stage">${head(title)}${prompt}<div class="opts">${options.map((o,ix)=>`<button class="opt" data-i="${ix}">${o}</button>`).join("")}</div><div id="fb"></div></div>`;
    box.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      const ok = +b.dataset.i === correct; if (ok) score++; bump(q, ok);
      box.querySelectorAll(".opt").forEach((x,ix)=>{ x.disabled = true; if (ix===correct) x.classList.add("right"); else if (x===b) x.classList.add("wrong"); });
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"Not quite. The right answer is highlighted."}</p>${nextBtn()}`; $("#nx").onclick = next;
    });
  };
  const distract = (q, fn, k=3) => shuffle(cur.t.all.filter((x)=>x!==q && fn(x) && fn(x)!==fn(q))).reduce((a,x)=>{ if(a.length<k && !a.includes(fn(x))) a.push(fn(x)); return a; },[]);

  function flash(q){
    box.innerHTML = `<div class="stage">${head("Flashcards")}<div class="q">${esc(q.q)}</div><div class="src">${esc(q.src)}</div><p class="small">Say the analysis out loud, then flip.</p><div class="row"><button class="btn hl" id="flip">Flip card</button></div><div id="back"></div></div>`;
    $("#flip").onclick = () => { $("#flip").remove(); $("#back").innerHTML = `<div class="fields">${q.f.map(([l,x])=>`<div class="field"><b>${esc(l)}</b><p>${esc(x)}</p></div>`).join("")}</div><div class="row" style="margin-top:16px"><button class="btn primary" id="k1">I knew it</button><button class="btn" id="k0">Still learning</button></div>`;
      $("#k1").onclick = () => { score++; bump(q,true); next(); }; $("#k0").onclick = () => { bump(q,false); next(); }; };
  }
  function gap(q){
    const words = q.q.split(/\s+/);
    const stop = new Set(["the","and","that","with","from","this","have","they","their","them","your","what","which","when","will","into","then","than","were","been","shall","there"]);
    const cand = words.map((w,ix)=>[norm(w),ix]).filter(([w])=>w.length>=4 && !stop.has(w));
    const pickN = Math.min(words.length > 9 ? 2 : 1, cand.length || 1);
    const hide = shuffle(cand.length ? cand : words.map((w,ix)=>[norm(w),ix])).slice(0,pickN).map(([,ix])=>ix).sort((a,b)=>a-b);
    const shown = words.map((w,ix)=> hide.includes(ix) ? `<span class="blank">${esc(w)}</span>` : esc(w)).join(" ");
    box.innerHTML = `<div class="stage">${head("Fill the gap")}<div class="q">${shown}</div><div class="src">${esc(q.src)}</div>
      <div class="row" style="margin-top:14px">${hide.map((ix,k)=>`<input type="text" id="g${k}" autocomplete="off" aria-label="Missing word ${k+1}" placeholder="Word ${k+1}">`).join("")}<button class="btn primary" id="chk">Check</button><button class="btn" id="hint">Hint</button></div><div id="fb"></div></div>`;
    const first = $("#g0"); first && first.focus({preventScroll:true});
    $("#hint").onclick = () => { hide.forEach((ix,k)=>{ const el=$("#g"+k); if(!el.value) el.placeholder = words[ix].replace(/[^A-Za-z’']/g,"").slice(0,2) + "…"; }); };
    const check = () => {
      const ok = hide.every((ix,k)=> norm($("#g"+k).value) === norm(words[ix]));
      if (ok) score++; bump(q, ok);
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Word perfect.":"Not quite. The full quotation is:"}</p><div class="q" style="font-size:18px">${esc(q.q)}</div>${nextBtn()}`;
      $("#chk").disabled = true; $("#nx").onclick = next;
    };
    $("#chk").onclick = check;
    box.querySelectorAll("input").forEach((el)=> el.onkeydown = (e)=>{ if(e.key==="Enter" && !$("#chk").disabled) check(); });
  }
  function order(q){
    const words = q.q.replace(/ \/ /g," / ").split(/\s+/).filter((w)=>w!=="/");
    if (words.length < 3) return gap(q);
    const tiles = shuffle(words.map((w,ix)=>({w,ix})));
    let built = [];
    box.innerHTML = `<div class="stage">${head("Rebuild the quote")}<div class="src">${esc(q.src)}</div><div class="built" id="built" aria-live="polite"></div><div class="tiles" id="tiles">${tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.w)}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" id="undo">Undo</button></div><div id="fb"></div></div>`;
    const draw = () => { $("#built").textContent = built.map((k)=>tiles[k].w).join(" "); box.querySelectorAll(".tile").forEach((b)=>b.classList.toggle("used", built.includes(+b.dataset.k))); };
    box.querySelectorAll(".tile").forEach((b)=> b.onclick = () => { built.push(+b.dataset.k); draw(); if (built.length === words.length) {
      const ok = built.map((k)=>norm(tiles[k].w)).join(" ") === words.map(norm).join(" ");
      if (ok) score++; bump(q, ok); $("#undo").disabled = true;
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Perfect order.":"Not quite. It should read:"}</p>${ok?"":`<div class="q" style="font-size:18px">${esc(q.q)}</div>`}${nextBtn()}`; $("#nx").onclick = next; } });
    $("#undo").onclick = () => { built.pop(); draw(); };
  }
  function who(q){
    const opts = shuffle([q.g.n, ...distract(q, (x)=>x.g.n)]);
    mc(q, isPoetry(cur.t) ? "Which poem?" : "Who or where?", `<div class="q">${esc(q.q)}</div>`, opts.map(esc), opts.indexOf(q.g.n));
  }
  function match(q){
    const a = fieldOf(q,/Language|Analysis|Layer 1/) || q.f[0][1];
    const opts = shuffle([q.q, ...distract(q,(x)=>x.q)]);
    mc(q, "Analysis match", `<p class="small">Which quotation does this analysis explain?</p><div class="panel" style="background:var(--paper)">${esc(a)}</div>`, opts.map((o)=>`<span class="q" style="font-size:18px">${esc(o)}</span>`), opts.indexOf(q.q));
  }
  function ctx(q){
    const c = fieldOf(q,/Context/); if (!c) return next();
    const opts = shuffle([c, ...distract(q,(x)=>fieldOf(x,/Context/))]);
    mc(q, "Context quiz", `<div class="q">${esc(q.q)}</div><div class="src">${esc(q.src)}</div><p class="small">Which context links best to this quotation?</p>`, opts.map(esc), opts.indexOf(c));
  }
  next();
}

// ---------- PETACWL ETACWL ----------
const STARTERS = {
  P:["[Writer] presents [character/theme] as…","At this point, [writer] portrays…","[Writer] explores the idea that…"],
  E:["This is shown when [character] says, ‘…’","[Writer] describes how ‘…’","This is evident in the line ‘…’"],
  T:["[Writer] uses the metaphor / simile / imperative / juxtaposition…","The technique of… is used here.","The structural choice of…"],
  A:["The word ‘…’ suggests…","This connotes… On a deeper level, …","Alternatively, this could imply…"],
  C:["This reflects the [era] belief that…","A [Victorian / Jacobean / 1945] audience would…","This links to [poet / writer]'s own life, as…"],
  W:["[Writer] intends to criticise / warn / celebrate…","[Writer] wants the reader to feel…","Ultimately, [writer]'s purpose is to…"],
  L:["Therefore, [character/theme] is presented as…","This links back to the question because…","This shows that…"],
};
const STARTERS2 = {
  E:["This idea is developed further when ‘…’","Similarly, later in the text, ‘…’","In contrast, [writer] later writes ‘…’"],
  T:["Here, [writer] uses…","This time, the [technique] of…","The shift to… is significant because…"],
  A:["This deepens the idea because ‘…’ suggests…","Building on this, the word ‘…’ implies…","A more perceptive reading is that…"],
  C:["This would resonate with [audience] because…","This reflects [context] further, as…","Historically, …"],
  W:["Through this, [writer] reinforces the message that…","[Writer] therefore warns / urges…","[Writer]'s purpose here is to…"],
  L:["Overall, [character/theme] is presented as…","Ultimately, this answers the question because…","This builds to the conclusion that…"],
};
const writerOf = (t, q) => isPoetry(t) ? q.src.split(", ").slice(-1)[0] : t.id === "tt" ? q.g.k : t.author;
const gname = (g) => { const n = g.n.replace(/^Chapter \d+: /,""); return g.k === "Theme" ? n.toLowerCase() : n; };
function partner(q){
  const t = cur.t, tags = (q.th||"").split(" · ").filter(Boolean);
  const same = q.g.quotes.filter((x)=>x!==q);
  const other = t.all.filter((x)=>x.g!==q.g && tags.some((tg)=>(x.th||"").includes(tg)));
  return same.length ? same[Math.floor(Math.random()*same.length)] : other[0] || t.all.find((x)=>x!==q);
}
function chain(t, q, first, name){
  const nmc = t.id === "tt" ? `the characters in ‘${name}’` : name;
  const writer = writerOf(t, q);
  const lang = fieldOf(q,/Language|Analysis|Layer 1/) || "", fs = fieldOf(q,/Form|Structure|Layer 2|Method/) || "", alt = fieldOf(q,/Perceptive|Layer 3|In short/) || "", c = fieldOf(q,/Context/) || "", w = fieldOf(q,/intention/i) || "";
  const pill = (k) => `<span class="pill" style="background:${STEP_COL[k]}">${k}</span>`;
  return `${first ? `${pill("P")}${esc(writer)} presents ${esc(nmc)} in a way that reveals ${esc((q.th||"its key ideas").split(" · ").slice(0,2).join(" and ").toLowerCase())}. ` : ""}
    ${pill("E")}${first ? "This is shown in the line" : "This idea is developed further in the line"} ‘${esc(q.q)}’${first ? "" : ` (${esc(q.src)})`}.
    ${pill("T")}${esc(fs || "Name the method here.")}
    ${pill("A")}${esc(lang)} ${esc(alt)}
    ${c ? `${pill("C")}${esc(c)}` : ""}
    ${w ? `${pill("W")}${esc(w)}` : ""}
    ${pill("L")}${first ? `Therefore, ${esc(writer)} presents ${esc(nmc)} as…` : `Overall, ${esc(writer)} presents ${esc(nmc)} as… which answers the question because…`}`;
}
function petacwl(){
  const t = cur.t, pool = scopeQuotes(), q = pool[Math.floor(Math.random()*pool.length)], q2 = partner(q);
  const stepRow = (s, st, n) => `<div class="step"><span class="L" style="background:${STEP_COL[s]}">${s}</span><div class="body"><b>${STEP_NAME[s]}${n ? " (second quotation)" : ""}</b>${st[s].map((x)=>`<p class="small">${esc(x)}</p>`).join("")}</div></div>`;
  $("#pane").innerHTML = `
  <div class="panel"><h2>How to build a PETACWL ETACWL paragraph</h2>
    <p class="lede">Each paragraph has thirteen steps. Make your point and analyse your first quotation (PETACWL), then develop the same point with a second quotation (ETACWL). For unseen poetry, leave out both Cs.</p>
    <h3 style="margin-top:16px">Part 1: PETACWL, first quotation</h3>
    <div class="steps">${"PETACWL".split("").map((s)=>stepRow(s, STARTERS, false)).join("")}</div>
    <h3 style="margin-top:18px">Part 2: ETACWL, second quotation</h3>
    <div class="steps">${"ETACWL".split("").map((s)=>stepRow(s, STARTERS2, true)).join("")}</div>
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="row" style="justify-content:space-between"><h2>Worked example</h2><button class="btn" id="another">Another example</button></div>
    <p class="small">Built from: ${esc(q.g.n)}${q2.g!==q.g ? " and " + esc(q2.g.n) : ""}</p>
    <p class="para">${chain(t, q, true, gname(q.g))}</p>
    <p class="para">${chain(t, q2, false, gname(q.g))}</p>
    <p class="small">The ‘…’ after each Link is where you finish the sentence in your own words.</p>
  </div>`;
  $("#another").onclick = petacwl;
}

// ---------- ESSAY PLANS ----------
function essay(){
  const t = cur.t, gs = cur.scope === "all" ? t.groups : [t.groups[+cur.scope]];
  const plan = (g) => {
    const name = g.n.replace(/^Chapter \d+: /,""); const nmc = g.k === "Theme" ? name.toLowerCase() : t.id === "tt" ? `the characters in ‘${name}’` : name;
    const poet = isPoetry(t) || t.id === "tt" ? g.k : t.author;
    const themes = [...new Set(g.quotes.flatMap((q)=>q.th ? q.th.split(" · ") : []))].slice(0,3);
    const question = t.id === "tt" ? `How does ${g.k} present ideas about ${(themes[0]||"relationships").toLowerCase()} in ‘${name}’?` : isPoetry(t) ? `Compare how poets present ${(themes[0]||"conflict").toLowerCase()} in ‘${name}’ and in one other poem from ‘${t.title}’.` : g.k === "Theme" ? `How does ${t.author} present ideas about ${name.toLowerCase()} in ‘${t.title}’?` : `How does ${t.author} present ${name} in ‘${t.title}’?`;
    const thesis = t.id === "tt" ? `In ‘${name}’, ${g.k} uses a single moment of change to explore ${themes.slice(0,2).join(" and ").toLowerCase()}. ${g.sum} Use this as the spine of your argument and return to it in every paragraph.` : isPoetry(t) ? `In ‘${name}’, ${poet} presents ${themes.slice(0,2).join(" and ").toLowerCase() || "the poem's central ideas"} to make the reader reflect on… whereas in [second poem], [poet] presents… ${g.sum && !/^Compare/.test(g.sum) ? "(Remember: " + g.sum + ")" : ""}` : `${t.author} presents ${name} ${g.sum ? "as follows: " + g.sum.charAt(0).toLowerCase() + g.sum.slice(1) : "in a way that develops across the text."} Use this as the spine of your argument and return to it in every paragraph.`;
    return `<article class="panel essay" style="margin-top:14px">
      <div class="small">${esc(g.k)}</div><h2>${esc(g.n)}</h2>
      <p><b>Exam style question:</b> ${esc(question)}</p>
      <h3>Introduction (3 to 4 sentences)</h3>
      <p>Open with a thesis that answers the question in one sentence, mention context, and preview your three ideas.</p>
      <p class="panel" style="background:var(--paper)"><b>Thesis:</b> ${esc(thesis)}</p>
      ${g.quotes.map((q,ix)=>{
        const q2 = g.quotes[(ix+1) % g.quotes.length];
        const steps = (qq, first) => {
          const a = fieldOf(qq,/Language|Analysis|Layer 1/)||"", f = fieldOf(qq,/Form|Structure|Layer 2|Method/)||"", c = fieldOf(qq,/Context/)||"", w = fieldOf(qq,/intention/i)||"";
          return `${first ? `<div class="step"><span class="L" style="background:${STEP_COL.P}">P</span><div class="body"><b>Point</b><p>${esc(poet)} presents ${esc(nmc)} as… (link to ${esc((qq.th||themes.join(" · ")).split(" · ")[0]?.toLowerCase()||"the question")}).</p></div></div>` : `<p class="small" style="margin:8px 0 0"><b>Now ETACWL: develop the same point with a second quotation</b></p>`}
          <div class="step"><span class="L" style="background:${STEP_COL.E}">E</span><div class="body"><b>Evidence ${first?"1":"2"}</b><p class="q" style="font-size:18px">${esc(qq.q)}</p><p class="small">${esc(qq.src)}</p></div></div>
          <div class="step"><span class="L" style="background:${STEP_COL.T}">T</span><div class="body"><b>Technique</b><p>${esc(f||"Name the method and the word class.")}</p></div></div>
          <div class="step"><span class="L" style="background:${STEP_COL.A}">A</span><div class="body"><b>Analysis</b><p>${esc(a)}</p></div></div>
          ${c?`<div class="step"><span class="L" style="background:${STEP_COL.C}">C</span><div class="body"><b>Context</b><p>${esc(c)}</p></div></div>`:""}
          ${w?`<div class="step"><span class="L" style="background:${STEP_COL.W}">W</span><div class="body"><b>Writer's intention</b><p>${esc(w)}</p></div></div>`:""}
          <div class="step"><span class="L" style="background:${STEP_COL.L}">L</span><div class="body"><b>Link</b><p>${first ? `Therefore, ${esc(nmc)} is presented as…` : `Overall, this shows that ${esc(nmc)} is presented as… which answers the question because…`}</p></div></div>`;
        };
        return `<h3>Paragraph ${ix+1}${isPoetry(t) && ix===2 ? " (bring in your second poem)" : ""}: PETACWL ETACWL</h3>
        <div class="steps">${steps(q, true)}${steps(q2, false)}</div>`; }).join("")}
      <h3>Conclusion (3 sentences)</h3>
      <p>Restate your thesis in fresh words, sum up how the presentation develops across the text, and end with the writer's big message for the ${/Shakespeare/.test(t.kind)?"Jacobean audience":t.id==="aic"?"1945 audience":t.id==="acc"||t.id==="jh"?"Victorian reader":"reader"} and for us today.</p>
    </article>`;
  };
  $("#pane").innerHTML = `<div class="panel"><h2>How to structure a Grade 9 essay</h2>
    <div class="grid2" style="margin-top:12px">
      <div><b>Timing</b><p class="small">Shakespeare and the 19th century novel: about 50 minutes each. Modern text and poetry comparison: about 45 minutes. Spend 5 minutes planning.</p></div>
      <div><b>Shape</b><p class="small">Introduction with a thesis, three PETACWL ETACWL paragraphs, each using two quotations (beginning, middle and end of the text, or extract then whole text), conclusion.</p></div>
      <div><b>Marks</b><p class="small">AO1 response and quotations, AO2 language, form and structure, AO3 context. Shakespeare and modern texts also carry 4 marks for AO4 spelling, punctuation and grammar.</p></div>
    </div></div>${gs.map(plan).join("")}`;
}

// ---------- CONTEXT ----------

  <div class="panel" style="margin-top:14px"><h2>Background notes</h2><div class="tablewrap"><table class="ctx">${t.ctx.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div></div>
  <div class="panel" style="margin-top:14px"><h2>Context linked to each quotation</h2><div class="tablewrap"><table class="ctx">${pool.filter((q)=>fieldOf(q,/Context/)).map((q)=>`<tr><td><span class="q" style="font-size:16px">${esc(q.q)}</span><div class="small">${esc(q.g.n)}</div></td><td>${esc(fieldOf(q,/Context/))}${fieldOf(q,/1945|Victorian|Jacobean/)?`<div class="small" style="margin-top:6px">${esc(fieldOf(q,/1945|Victorian|Jacobean/))}</div>`:""}</td></tr>`).join("")}</table></div></div>`;
}

// ---------- CHRONOLOGY ----------
const LCOL = ["#1B2A4A", "#00796B", "#6A1B9A"];
const chronLabel = (t) => t.id === "acc" ? "stave by stave" : t.id === "tt" ? "story by story" : /play/i.test(t.kind) ? "act by act, scene by scene" : "chapter by chapter";
function chron(){
  const t = cur.t, E = t.chron || [];
  const tech = (x, n) => `<div class="tech"><div class="techh"><span class="pill" style="background:${n===1?"#AD1457":"#B07D1E"}">Technique ${n}</span><b>${esc(x[0])}</b></div>
    ${[1,2,3].map((L)=>`<div class="layer"><span class="lnum" style="background:${LCOL[L-1]}">Layer ${L}</span><p>${esc(x[L])}</p></div>`).join("")}</div>`;
  $("#pane").innerHTML = `<div class="panel"><h2>Key quotations ${chronLabel(t)}</h2>
    <p class="small">The key moments in story order. Each quotation has triple layered analysis of two techniques (layer 1: what it shows, layer 2: the deeper meaning, layer 3: a perceptive or alternative reading linked to the whole text), a Grade 9 context link and the writer's intended effect on the ${/play/i.test(t.kind) ? "audience" : "reader"}.</p>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="chq">Quiz: where does this quotation come from?</button><button class="btn" id="cho">Quiz: what happens next?</button></div></div>

const writerOfT = (t, e) => t.id === "tt" ? ({"The Darkness Out There":"Lively","Chemistry":"Swift","Korea":"McGahern","Odour of Chrysanthemums":"Lawrence","My Polish Teacher's Tie":"Dunmore","A Family Supper":"Ishiguro","Invisible Mass of the Back Row":"Williams"}[e.r.split(":")[0].replace(/’/g,"'")] || "The writer") : (/Conan Doyle/.test(t.author) ? "Conan Doyle" : /de Waal/.test(t.author) ? "De Waal" : t.author.split(" ").slice(-1)[0] || "The writer");

const MCOL = { L: "#AD1457", S: "#00796B", F: "#6A1B9A", Language: "#AD1457", Structure: "#00796B", Form: "#6A1B9A", Sound: "#B07D1E" };
const MNAME = { L: "Language", S: "Structure", F: "Form" };
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const exq = (e, q) => q ? `‘${esc(e)}’` : `<span class="desc">${esc(e)}</span>`;
const loose = (s) => norm(s).replace(/s\b/g, "").replace(/\s+/g, "");
function vocPools(t){
  const gs = cur.scope === "all" ? t.groups : [t.groups[+cur.scope]];
  const v = [], m = [];
  if (t.voc && !(isPoetry(t))) { t.voc.v.forEach((x)=>v.push({ w:x[0], d:x[1], s:x[2], src:t.title })); t.voc.m.forEach((x)=>m.push({ k:x[0], n:x[1], e:x[2], x:x[3], iq:x[4], src:t.title })); }
  gs.forEach((g)=>{ if (g.voc) { g.voc.v.forEach((x)=>v.push({ w:x[0], d:x[1], s:x[2], src:g.n })); g.voc.m.forEach((x)=>m.push({ k:x[0], n:x[1], e:x[2], x:x[3], iq:x[4], src:g.n })); } });
  return { v, m };
}
const VDRILLS = [
  ["vquiz","Vocabulary quiz","Read the meaning and pick the right word."],
  ["vrecall","Vocabulary recall","Read the meaning and type the word from memory."],
  ["vgap","Vocabulary gap fill","Type the missing word into a Grade 9 sentence."],
  ["mquiz","Methods quiz","Read the example and its effect, then name the technique."],
  ["mrecall","Methods recall","Name the effect of each technique out loud, then check."],
  ["mgap","Methods gap fill","Type the missing technique into the analysis sentence."],

function vocab(){
  const t = cur.t, { v, m } = vocPools(t), poetry = isPoetry(t);
  const gs = cur.scope === "all" ? t.groups : [t.groups[+cur.scope]];
  const vTable = (rows) => `<div class="tablewrap"><table class="ctx vt"><tr><th>Word</th><th>Meaning</th><th>Use it in an essay</th></tr>${rows.map((x)=>`<tr><td><b class="vw">${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join("")}</table></div>`;
  const mCards = (rows) => `<div class="mgrid">${["L","S","F"].map((k)=>rows.filter((x)=>x[0]===k).map((x)=>`<div class="mcard" style="--mc:${MCOL[k]}"><span class="mk">${MNAME[k]}</span><h4>${esc(x[1])}</h4><p class="mex">${x[4] ? "" : "<span class=\"small\">Example: </span>"}${exq(x[2], x[4])}</p><p class="small" style="margin:6px 0 0">${esc(x[3])}</p></div>`).join("")).join("")}</div>`;
  const body = poetry
    ? gs.map((g)=> g.voc ? `<div class="panel" style="margin-top:14px"><div class="small">${esc(g.k)}</div><h2>${esc(g.n)}</h2><h3 style="margin-top:10px">Tier 2 vocabulary</h3>${vTable(g.voc.v)}<h3 style="margin-top:14px">Language, structure and form</h3>${mCards(g.voc.m)}</div>` : "").join("")
    : `<div class="panel" style="margin-top:14px"><h2>Grade 9 Tier 2 vocabulary</h2><p class="small">Use these words to sound precise and conceptual. Each sentence shows the word working in an essay.</p>${vTable(t.voc.v)}</div>
       <div class="panel" style="margin-top:14px"><h2>Language, structure and form</h2><p class="small">The methods that matter most in this text, with an example and its effect. Pink is language, green is structure, purple is form.</p>${mCards(t.voc.m)}</div>`;
  $("#pane").innerHTML = `<div class="panel"><h2>Practise</h2><p class="small">${v.length} words and ${m.length} methods${poetry && cur.scope==="all" ? " across every poem" : ""}. Use the Focus menu to practise one ${poetry ? "poem" : "text"} at a time.</p>
    <div class="games" style="margin-top:10px">${VDRILLS.map(([k,n,d])=>`<button class="game" data-k="${k}"><strong>${n}</strong><span class="small">${d}</span></button>`).join("")}</div></div>
    <div id="stagebox"></div>${body}`;
  $("#pane").querySelectorAll(".game").forEach((b)=> b.onclick = () => vocDrill(b.dataset.k));
}
function vocDrill(kind){
  const { v, m } = vocPools(cur.t);
  const items = kind[0] === "v" ? v : m;
  const qs = shuffle(items).slice(0, 10).map((it)=> makeQ(kind, it, items));
  drill($("#stagebox"), VDRILLS.find((x)=>x[0]===kind)[1], qs, () => vocDrill(kind));
}
function makeQ(kind, it, pool){
  const others = (fn) => shuffle([...new Set(pool.map(fn).filter((x)=>x!==fn(it)))]).slice(0,3);
  if (kind === "vquiz") { const opts = shuffle([it.w, ...others((x)=>x.w)]); return { type:"mc", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${esc(it.d)}</p><p class="small">Which word has this meaning?</p>`, options:opts, answer:it.w, reveal:it.s }; }
  if (kind === "vrecall") return { type:"type", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${esc(it.d)}</p><p class="small">Type the word. It starts with ‘${esc(it.w[0])}’ and has ${it.w.replace(/\s/g,"").length} letters.</p>`, answer:it.w, reveal:it.s };
  if (kind === "vgap") { const re = new RegExp("\\b" + reEsc(it.w) + "\\b", "i"); if (!re.test(it.s)) return makeQ("vrecall", it, pool);
    return { type:"type", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${esc(it.s).replace(new RegExp("\\b" + reEsc(esc(it.w)) + "\\b", "i"), '<span class="blank">______</span>')}</p><p class="small">Hint: ${esc(it.d)}</p>`, answer:it.w, reveal:it.s }; }
  if (kind === "mquiz") { const opts = shuffle([it.n, ...others((x)=>x.n)]); return { type:"mc", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${exq(it.e, it.iq)}</p><p>${esc(it.x)}</p><p class="small">Which ${MNAME[it.k].toLowerCase()} technique is this?</p>`, options:opts, answer:it.n, reveal:`${MNAME[it.k]}: ${it.n}` }; }
  if (kind === "mrecall") return { type:"flip", prompt:`<p class="small">${esc(it.src)} · ${MNAME[it.k]}</p><h3>${esc(it.n)}</h3><p class="ex">${exq(it.e, it.iq)}</p><p class="small">Explain the effect out loud, then check.</p>`, answer:it.x };
  return { type:"type", prompt:`<p class="small">${esc(it.src)} · ${MNAME[it.k]}</p><p style="font-size:19px;line-height:1.6">${it.iq ? `In ‘${esc(it.e)}’` : `In this example (${esc(it.e)})`}, the writer uses <span class="blank">______</span>. ${esc(it.x)}</p><p class="small">Hint: it starts with ‘${esc(it.n[0])}’.</p>`, answer:it.n, reveal:`${it.n}: ${it.x}` };
}
function drill(box, title, qs, again){
  let i = 0, score = 0;
  box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  const head = () => `<div class="top"><span><b style="color:var(--ink)">${esc(title)}</b></span><span>Question ${i} of ${qs.length} · Score ${score}</span></div>`;
  const nextBtn = () => `<div class="row" style="margin-top:16px"><button class="btn primary" id="nx">${i>=qs.length?"See score":"Next"}</button></div>`;
  const done = () => { box.innerHTML = `<div class="stage"><h2>Round complete</h2><p class="lede">You scored ${score} out of ${qs.length}.</p><div class="row" style="margin-top:14px"><button class="btn primary" id="again">Play again</button></div></div>`; $("#again").onclick = again; };
  const next = () => {
    if (i >= qs.length) return done(); const q = qs[i++];
    if (q.type === "mc") {
      box.innerHTML = `<div class="stage">${head()}${q.prompt}<div class="opts">${q.options.map((o,ix)=>`<button class="opt" data-i="${ix}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
      box.querySelectorAll(".opt").forEach((b)=> b.onclick = () => { const ok = q.options[+b.dataset.i] === q.answer; if (ok) score++;
        box.querySelectorAll(".opt").forEach((x,ix)=>{ x.disabled = true; if (q.options[ix]===q.answer) x.classList.add("right"); else if (x===b) x.classList.add("wrong"); });
        $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"Not quite. The right answer is highlighted."}</p>${q.reveal?`<p class="small">${esc(q.reveal)}</p>`:""}${nextBtn()}`; $("#nx").onclick = next; });
    } else if (q.type === "type") {
      box.innerHTML = `<div class="stage">${head()}${q.prompt}<div class="row" style="margin-top:12px"><input type="text" id="ans" autocomplete="off" aria-label="Your answer" placeholder="Type your answer"><button class="btn primary" id="chk">Check</button><button class="btn" id="show">Show answer</button></div><div id="fb"></div></div>`;
      const inp = $("#ans"); inp.focus({preventScroll:true});
      const fin = (ok) => { if (ok) score++; $("#chk").disabled = true; $("#show").disabled = true; inp.disabled = true;
        $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"The answer is ‘"+esc(q.answer)+"’."}</p>${q.reveal?`<p class="small">${esc(q.reveal)}</p>`:""}${nextBtn()}`; $("#nx").onclick = next; };
      $("#chk").onclick = () => fin(loose(inp.value) === loose(q.answer));
      $("#show").onclick = () => fin(false);
      inp.onkeydown = (e) => { if (e.key === "Enter" && !$("#chk").disabled) $("#chk").click(); };
    } else {
      box.innerHTML = `<div class="stage">${head()}${q.prompt}<div class="row"><button class="btn hl" id="flip">Check the answer</button></div><div id="fb"></div></div>`;
      $("#flip").onclick = () => { $("#flip").remove(); $("#fb").innerHTML = `<div class="panel" style="background:var(--paper)">${esc(q.answer)}</div><div class="row" style="margin-top:16px"><button class="btn primary" id="k1">I knew it</button><button class="btn" id="k0">Still learning</button></div>`;
        $("#k1").onclick = () => { score++; next(); }; $("#k0").onclick = next; };
    }
  };
  next();
}

  </div>

function uTerms(){
  let i = 0, score = 0; const qs = shuffle(TERMS).slice(0,10);
  const draw = () => {
    if (i >= qs.length) { $("#pane").innerHTML = `<div class="stage"><h2>Round complete</h2><p class="lede">You scored ${score} out of ${qs.length}.</p><button class="btn primary" id="again">Play again</button></div>`; $("#again").onclick = uTerms; return; }
    const [term, def] = qs[i++]; const opts = shuffle([term, ...shuffle(TERMS.filter((x)=>x[0]!==term)).slice(0,3).map((x)=>x[0])]);
    $("#pane").innerHTML = `<div class="stage"><div class="top"><b style="color:var(--ink)">Name the technique</b><span>Question ${i} of ${qs.length} · Score ${score}</span></div><p class="ex">${esc(def)}</p><div class="opts">${opts.map((o,ix)=>`<button class="opt" data-i="${ix}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
    $("#pane").querySelectorAll(".opt").forEach((b)=> b.onclick = () => { const ok = opts[+b.dataset.i] === term; if (ok) score++;
      $("#pane").querySelectorAll(".opt").forEach((x)=>{ x.disabled = true; if (x.textContent === term) x.classList.add("right"); else if (x===b) x.classList.add("wrong"); });
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"The answer is "+esc(term)+"."}</p><button class="btn primary" id="nx">Next</button>`; $("#nx").onclick = draw; });
  };
  draw();
}
