o word command.","She demands that Benedick choose her and Hero over his friend.","Her demand tests whether his love is real or only words."],"t2":["Minor sentence","The shock of the short line changes the mood instantly.","Romance turns to violence in a moment.","The brevity also shows how little power she has: she can only command a man to act for her."],"cx":"Women could not duel or take legal action; their honour depended on men.","wi":"Shakespeare shows a woman’s fury at injustice and the limits placed on her."},{"r":"Act 4 Scene 1","m":"Beatrice rages at her powerlessness.","q":"O God, that I were a man! I would eat his heart in the market-place","t1":["Hyperbole","She would eat Claudio’s heart in public.","The violent image shows the depth of her fury.","Wishing she were a man exposes how gender, not courage, prevents her from acting."],"t2":["Public setting","The ‘market-place’ is the centre of town.","She wants public justice for a public shame.","The image mirrors Claudio’s public humiliation of Hero, demanding equal punishment."],"cx":"Elizabethan women had almost no legal or social power.","wi":"Shakespeare uses Beatrice to criticise gender inequality."}]},{"id":"jc","title":"Julius Caesar","author":"Shakespeare","kind":"Shakespeare play","paper":"Paper 1, Section A","col":"#4E342E","ctx":[["Rome","The Roman Republic feared one man becoming king."],["Elizabeth I","In 1599 the ageing queen had no heir; fear of civil war was high."],["Rhetoric","Persuasive speaking was central to Roman politics and Elizabethan education."],["Omens","Audiences believed in signs and portents."],["Regicide","Killing a ruler was seen as a crime against order."]],"groups":[{"n":"Julius Caesar","k":"Character","sum":"A powerful leader whose ambition and pride lead to his assassination.","quotes":[{"q":"Cowards die many times before their deaths","src":"Caesar, Act 2 Scene 2","f":[["Language","He claims bravery and dismisses fear."],["Form and structure","Confident tone before the assassination."],["Perceptive reading","His pride blinds him to danger."],["Context","Belief in omens."],["Writer's intention","To show hubris."],["Critical and conceptual reading","Caesar’s aphorism presents fearlessness as noble, but it also blinds him to real danger. Conceptually, his contempt for fear becomes hubris, since he ignores every warning on the ides of March. A critical reading sees the line as Caesar performing his own legend, a public image that the conspirators exploit."]],"th":"Pride · Fate · Power"},{"q":"I am constant as the northern star","src":"Caesar, Act 3 Scene 1","f":[["Language","The simile presents him as unchanging and supreme."],["Form and structure","Spoken moments before his death."],["Perceptive reading","His arrogance seals his fate."],["Context","The Great Chain of Being."],["Writer's intention","To show pride before a fall."],["Critical and conceptual reading","Caesar compares himself to the fixed northern star, claiming unchanging constancy. Conceptually, the boast of near divinity seems to justify the conspirators’ fear of tyranny. Dramatic irony makes the line his last great claim before the stabbing, so his supposed immovability is shattered moments later."]],"th":"Pride · Power · Ambition"},{"q":"Et tu, Brute? Then fall, Caesar!","src":"Caesar, Act 3 Scene 1","f":[["Language","Latin phrase shows shock at betrayal."],["Form and structure","His last words."],["Perceptive reading","Betrayal by a friend hurts most."],["Context","Loyalty and friendship."],["Writer's intention","To show tragic betrayal."],["Critical and conceptual reading","Caesar’s shift into Latin marks shock at betrayal by a trusted friend. Conceptually, the wound of disloyalty matters more than the daggers. A critical reading notes that he speaks of himself in the third person even as he dies, suggesting his identity was always a public monument."]],"th":"Betrayal · Friendship · Power"}]},{"n":"Brutus","k":"Character","sum":"An honourable man persuaded to kill his friend for Rome.","quotes":[{"q":"think him as a serpent’s egg","src":"Brutus, Act 2 Scene 1","f":[["Language","Metaphor presents Caesar as a danger to be destroyed early."],["Form and structure","Soliloquy shows his reasoning."],["Perceptive reading","He kills for what Caesar might become."],["Context","Fear of tyranny."],["Writer's intention","To show flawed reasoning."],["Critical and conceptual reading","Brutus imagines Caesar as a serpent’s egg that must be crushed before it hatches. Conceptually, he kills for what Caesar might become, not what he is, revealing the weakness of pre emptive logic. A critical reading sees idealism justifying murder through metaphor rather than evidence."]],"th":"Ambition · Power · Morality"},{"q":"Not that I loved Caesar less, but that I loved Rome more","src":"Brutus, Act 3 Scene 2","f":[["Language","Antithesis balances love for friend and country."],["Form and structure","Prose speech appeals to reason."],["Perceptive reading","He believes he acted nobly."],["Context","Rhetoric in public speeches."],["Writer's intention","To show his idealism."],["Critical and conceptual reading","Brutus balances love for Caesar against love for Rome, presenting murder as patriotism. Conceptually, his rational prose appeals to the head, but crowds are moved by the heart. A critical reading sees the speech as honest but politically naive, which is why Antony defeats him so easily."]],"th":"Honour · Loyalty · Rhetoric"},{"q":"This was the noblest Roman of them all","src":"Antony about Brutus, Act 5 Scene 5","f":[["Language","Superlative praises Brutus."],["Form and structure","Final tribute."],["Perceptive reading","Brutus acted from honour, not envy."],["Context","Roman ideals."],["Writer's intention","To show tragic nobility."],["Critical and conceptual reading","Antony’s final tribute recognises that Brutus acted from principle rather than envy. Conceptually, it confirms Brutus as the tragic hero whose idealism destroyed him. A critical reading notes that the victor writes the history, so even this generous verdict serves Antony’s new authority."]],"th":"Honour · Tragedy · Loyalty"}]},{"n":"Cassius","k":"Character","sum":"A clever, envious conspirator who manipulates Brutus.","quotes":[{"q":"Why, man, he doth bestride the narrow world / Like a Colossus","src":"Cassius, Act 1 Scene 2","f":[["Language","The simile shows Caesar as a giant."],["Form and structure","Used to persuade Brutus."],["Perceptive reading","Shows his envy."],["Context","Fear of tyranny."],["Writer's intention","To show manipulation."],["Critical and conceptual reading","Cassius’s image of Caesar as a Colossus shrinks the other Romans to men walking between his legs. Conceptually, the speech reveals Cassius’s envy as much as Caesar’s power. A critical reading sees political rhetoric shaping perception, a theme that peaks in the funeral speeches."]],"th":"Power · Envy · Rhetoric"},{"q":"The fault, dear Brutus, is not in our stars, / But in ourselves","src":"Cassius, Act 1 Scene 2","f":[["Language","He argues people control their fate."],["Form and structure","Persuasive tone."],["Perceptive reading","Ironic given omens later."],["Context","Fate versus free will."],["Writer's intention","To explore responsibility."],["Critical and conceptual reading","Cassius argues that men, not stars, control their fate. Conceptually, the line places responsibility on human choice, the core of the play’s debate. Ironically, omens and Caesar’s ghost later suggest that fate cannot be escaped, leaving the audience to weigh both views."]],"th":"Fate · Free will · Power"},{"q":"Yond Cassius has a lean and hungry look","src":"Caesar about Cassius, Act 1 Scene 2","f":[["Language","Physical description suggests ambition."],["Form and structure","Caesar’s insight."],["Perceptive reading","Appearance reveals character."],["Context","Physiognomy beliefs."],["Writer's intention","To foreshadow danger."],["Critical and conceptual reading","Caesar’s judgement of Cassius is sharp and accurate, showing political insight. Conceptually, the ‘lean and hungry look’ links physical appetite to ambition and discontent. A critical reading notes the irony that Caesar reads Cassius correctly yet still fails to protect himself."]],"th":"Ambition · Danger · Appearance"}]},{"n":"Mark Antony","k":"Character","sum":"Caesar’s loyal friend whose speech turns the crowd against the conspirators.","quotes":[{"q":"Friends, Romans, countrymen, lend me your ears","src":"Antony, Act 3 Scene 2","f":[["Language","Tricolon addresses everyone."],["Form and structure","Opening of a powerful speech."],["Perceptive reading","He builds connection with the crowd."],["Context","Rhetoric skills."],["Writer's intention","To show persuasive power."],["Critical and conceptual reading","Antony’s opening tricolon flatters the crowd and builds intimacy. Conceptually, it begins one of literature’s most skilful pieces of manipulation. A critical reading sees rhetoric as a weapon more powerful than the conspirators’ daggers."]],"th":"Rhetoric · Power · Loyalty"},{"q":"Brutus is an honourable man","src":"Antony, Act 3 Scene 2","f":[["Language","Repetition becomes sarcastic."],["Form and structure","Builds through the speech."],["Perceptive reading","Irony undermines Brutus."],["Context","Rhetorical techniques."],["Writer's intention","To show manipulation of crowds."],["Critical and conceptual reading","Antony’s repeated praise of Brutus becomes bitter sarcasm. Conceptually, verbal irony allows him to attack while appearing respectful. A critical reading sees the crowd turning as proof that public opinion is shaped by performance rather than truth."]],"th":"Rhetoric · Irony · Power"},{"q":"Cry ‘Havoc,’ and let slip the dogs of war","src":"Antony, Act 3 Scene 1","f":[["Language","Metaphor shows war unleashed."],["Form and structure","Soliloquy reveals revenge."],["Perceptive reading","Chaos will follow the murder."],["Context","Civil war fears."],["Writer's intention","To foreshadow conflict."],["Critical and conceptual reading","Antony’s prophecy of war unleashes chaos after the assassination. Conceptually, the ‘dogs of war’ suggests violence escaping human control once unleashed. A critical reading shows the conspirators’ attempt to save Rome bringing civil war instead."]],"th":"Conflict · Revenge · Chaos"}]},{"n":"Power and ambition","k":"Theme","sum":"Fear of ambition drives the conspiracy and its bloody results.","quotes":[{"q":"Beware the ides of March","src":"Soothsayer, Act 1 Scene 2","f":[["Language","Warning creates tension."],["Form and structure","Repeated omen."],["Perceptive reading","Caesar ignores fate."],["Context","Belief in prophecy."],["Writer's intention","To build dramatic irony."],["Critical and conceptual reading","The soothsayer’s warning introduces fate from the first act. Conceptually, Caesar’s dismissal shows pride blinding power. A critical reading sees the line framing the whole play as a test of whether prophecy or choice decides events."]],"th":"Fate · Power · Warning"},{"q":"as he was ambitious, I slew him","src":"Brutus, Act 3 Scene 2","f":[["Language","Justifies murder through ambition."],["Form and structure","Short, logical clause."],["Perceptive reading","Ambition is the excuse."],["Context","Fear of kingship."],["Writer's intention","To question motives."],["Critical and conceptual reading","Brutus justifies the murder by Caesar’s ambition. Conceptually, ‘ambitious’ becomes the word on which the whole conspiracy rests. Antony later questions it repeatedly, showing how one word can be redefined by rhetoric."]],"th":"Ambition · Power · Honour"},{"q":"O mighty Caesar! dost thou lie so low?","src":"Antony, Act 3 Scene 1","f":[["Language","Contrast between ‘mighty’ and ‘low’."],["Form and structure","Emotional reaction."],["Perceptive reading","Power is fragile."],["Context","Fall of great men."],["Writer's intention","To show power’s fragility."],["Critical and conceptual reading","Antony’s grief over Caesar’s body is both genuine and strategic. Conceptually, the fall from ‘mighty’ to ‘low’ captures the tragic arc of power. A critical reading sees him using grief to position himself as Caesar’s heir."]],"th":"Power · Death · Loyalty"}]},{"n":"Fate and rhetoric","k":"Theme","sum":"Words move crowds, and omens hint at fate.","quotes":[{"q":"There is a tide in the affairs of men","src":"Brutus, Act 4 Scene 3","f":[["Language","Metaphor of the tide shows timing."],["Form and structure","Reflective speech."],["Perceptive reading","Missing opportunity brings ruin."],["Context","Fate versus choice."],["Writer's intention","To show timing in history."],["Critical and conceptual reading","Brutus urges action at the right moment, comparing life to a tide. Conceptually, his metaphor of fortune suggests timing determines success. Ironically, his decision to march to Philippi proves fatal, so his own philosophy betrays him."]],"th":"Fate · Choice · Power"},{"q":"Caesar, thou art reveng’d","src":"Cassius, Act 5 Scene 3","f":[["Language","Admits Caesar’s revenge."],["Form and structure","His dying words."],["Perceptive reading","Fate catches up."],["Context","Ghost of Caesar."],["Writer's intention","To show justice."],["Critical and conceptual reading","Cassius’s dying words acknowledge Caesar’s revenge. Conceptually, the dead Caesar seems more powerful than the living one. A critical reading sees the spirit of Caesar dominating the second half of the play."]],"th":"Fate · Revenge · Guilt"},{"q":"Ambition’s debt is paid","src":"Brutus, Act 3 Scene 1","f":[["Language","Metaphor of debt."],["Form and structure","Spoken after murder."],["Perceptive reading","Treats murder as payment."],["Context","Roman justice."],["Writer's intention","To show justification."],["Critical and conceptual reading","The line suggests Caesar’s ambition has been punished by his death. Conceptually, it states the conspirators’ moral justification. A critical reading questions whether the debt is truly paid, since Rome falls into civil war."]],"th":"Ambition · Justice · Power"}]}],"ctx9":[["The Roman Republic","Rome feared kingship; power was shared by the Senate.","The conspirators’ fear that Caesar will become a king reflects Roman horror of tyranny."],["Elizabeth I’s succession","In 1599 the ageing queen had no heir; civil war was feared.","The chaos after Caesar’s murder would remind Elizabethans of the dangers of an uncertain succession."],["Rhetoric","Persuasive speech was central to Roman politics and Elizabethan education.","Antony’s repetition of ‘Brutus is an honourable man’ shows how rhetoric can manipulate a crowd."],["Omens and fate","Audiences believed in portents and prophecy.","The Soothsayer’s ‘Beware the ides of March’ builds dramatic irony as Caesar ignores fate."],["Regicide and order","Killing a ruler threatened the natural order.","The civil war that follows suggests that even ‘honourable’ regicide brings chaos."],["Stoicism and honour","Romans valued self control and public duty.","Brutus’s belief that he loved ‘Rome more’ presents him as a tragic idealist."]],"voc":{"v":[["conspiracy","a secret plan to do something harmful","The conspiracy against Caesar is driven by fear and envy."],["rhetoric","persuasive speaking","Antony’s rhetoric turns the crowd against the conspirators."],["idealistic","believing in noble principles, sometimes unrealistically","Brutus is idealistic, believing murder can save the Republic."],["manipulative","controlling others for your own advantage","Cassius is manipulative, forging letters to sway Brutus."],["fickle","changing loyalty easily","The fickle crowd cheers Brutus, then riots for Antony."],["tyranny","cruel and absolute rule","The conspirators claim to prevent Caesar’s tyranny."],["omens","signs of future events","Storms and omens warn Caesar of his death."],["honourable","deserving respect for moral principles","Antony repeats ‘honourable’ until it sounds ironic."]],"m":[["L","Verbal irony","Brutus is an honourable man","Repeated praise becomes sarcasm, undermining Brutus.",1],["L","Metaphor","Like a Colossus","Cassius presents Caesar as a towering giant to stir envy.",1],["S","Funeral speeches","Brutus speaks in prose, Antony in verse","The contrast shows Antony’s emotional power over the crowd.",0],["S","Midpoint murder","The assassination happens in Act 3","The second half shows the chaos the murder unleashes.",0],["F","Tragedy","Brutus as tragic hero","His nobility and fatal idealism lead to his downfall.",0],["F","Supernatural","Caesar’s ghost appears to Brutus","The ghost suggests that murder will be avenged.",0]]},"chron":[{"r":"Act 1 Scene 2","m":"A soothsayer calls out to Caesar in the street.","q":"Beware the ides of March","t1":["Imperative","The soothsayer commands Caesar to be cautious.","The warning creates foreboding.","Caesar dismisses him as ‘a dreamer’, revealing the hubris that will kill him."],"t2":["Foreshadowing","The line names the day of Caesar’s death.","The audience waits for the date to arrive.","It introduces the question of fate versus free will that runs through the play."],"cx":"Romans and Elizabethans alike took omens and prophecies seriously.","wi":"Shakespeare builds suspense and suggests that pride blinds the powerful."},{"r":"Act 1 Scene 2","m":"Cassius complains to Brutus about Caesar’s power.","q":"Why, man, he doth bestride the narrow world / Like a Colossus","t1":["Simile","Caesar is like the Colossus, a giant statue straddling a harbour.","Ordinary men are reduced to walking under his legs.","Cassius’s exaggeration reveals his own envy as much as Caesar’s power."],"t2":["Persuasive rhetoric","Cassius uses vivid images to stir Brutus.","His speech is designed to manipulate.","It shows that politics is shaped by persuasion, a theme that peaks in the funeral speeches."],"cx":"The Colossus of Rhodes was one of the wonders of the ancient world.","wi":"Shakespeare shows how language can create political feeling."},{"r":"Act 1 Scene 2","m":"Cassius argues that men are masters of their fates.","q":"The fault, dear Brutus, is not in our stars, / But in ourselves","t1":["Antithesis","‘stars’ (fate) and ‘ourselves’ (free will) are contrasted.","Cassius claims humans control their destiny.","Ironically, omens and Caesar’s ghost later suggest fate cannot be escaped."],"t2":["Direct address","‘dear Brutus’ flatters Brutus.","The intimacy makes the argument personal.","Brutus’s noble pride is the lever Cassius uses to move him."],"cx":"Elizabethans debated predestination and free will.","wi":"Shakespeare explores responsibility and manipulation."},{"r":"Act 2 Scene 1","m":"Brutus decides alone in his orchard that Caesar must die.","q":"think him as a serpent’s egg","t1":["Metaphor","Caesar is a ‘serpent’s egg’ that may hatch.","Brutus kills him for what he might become, not what he is.","The logic is pre emptive and weak, exposing the flaw in Brutus’s idealism."],"t2":["Biblical allusion","The serpent recalls Satan in Eden.","Caesar is cast as a source of future evil.","Brutus needs moral language to justify a political murder."],"cx":"Fears of assassination and tyranny were high after the Gunpowder Plot.","wi":"Shakespeare explores how good men justify violence."},{"r":"Act 3 Scene 1","m":"Caesar is stabbed at the Capitol and sees Brutus among the conspirators.","q":"Et tu, Brute? Then fall, Caesar!","t1":["Code switching into Latin","The Latin phrase stands out from the English verse.","The shift marks a moment of shock and intimacy.","It suggests betrayal by a trusted friend wounds more deeply than any dagger."],"t2":["Third person self reference","Caesar speaks of himself as ‘Caesar’.","Even dying he sees himself as a public legend.","The grandeur is tragic: his pride and his fall arrive in the same breath."],"cx":"Elizabethans saw betrayal of a ruler as one of the gravest sins.","wi":"Shakespeare makes the audience feel the horror of betrayal at the play’s turning point."},{"r":"Act 3 Scene 2","m":"Brutus explains the murder to the Roman crowd.","q":"Not that I loved Caesar less, but that I loved Rome more","t1":["Antithesis","Love for Caesar is weighed against love for Rome.","Brutus presents himself as a selfless patriot.","The balanced logic appeals to reason, but cannot hold a crowd’s emotions."],"t2":["Prose","Brutus speaks in measured prose.","His plain style feels honest and rational.","It contrasts with Antony’s emotional verse, which wins the crowd, showing idealism losing to rhetoric."],"cx":"Romans, and Elizabethan admirers of Rome, prized the Republic above any single ruler.","wi":"Shakespeare contrasts reason and emotion in political persuasion."},{"r":"Act 3 Scene 2","m":"Antony turns the crowd against the conspirators at Caesar’s funeral.","q":"Brutus is an honourable man","t1":["Verbal irony","Antony praises Brutus as ‘honourable’.","Each repetition makes the praise sound more like sarcasm.","Without openly attacking Brutus, he destroys his reputation."],"t2":["Repetition","The phrase returns throughout the speech.","Its meaning shifts each time it is heard.","The crowd’s turn shows the power, and danger, of skilled rhetoric in politics."],"cx":"Elizabethan grammar schools trained boys in classical rhetoric, so audiences appreciated persuasive technique.","wi":"Shakespeare shows how a skilled speaker can manipulate a crowd."},{"r":"Act 5 Scene 5","m":"After Brutus’s suicide at Philippi, Antony praises him.","q":"This was the noblest Roman of them all","t1":["Superlative","Brutus is called ‘the noblest’.","Antony recognises that Brutus acted from principle, not envy.","The praise confirms Brutus as the tragic hero whose idealism led to his fall."],"t2":["Eulogy and past tense","‘was’ places Brutus firmly in the past.","The speech restores dignity to a defeated enemy.","The ending suggests idealism can be noble and destructive at the same time."],"cx":"Romans saw an honourable death as preferable to capture.","wi":"Shakespeare ends the tragedy with respect for Brutus, leaving the audience to weigh his choices."}]},{"id":"acc","title":"A Christmas Carol","author":"Dickens","kind":"19th century novel","paper":"Paper 1, Section B","col":"#8E5A00","ctx":[["Published 1843","Dickens wrote the novella quickly to reach a wide middle class readership at Christmas."],["The Poor Law Amendment Act 1834","Forced the poor into harsh workhouses; Scrooge’s ‘Are there no prisons?’ echoes this attitude."],["Thomas Malthus","His theory that the poor should not be helped because the population would grow too large inspires Scrooge’s ‘surplus population’."],["Child poverty","In 1843 Dickens read a government report on child labour and visited the Field Lane Ragged School, which shocked him."],["Dickens’s childhood","At 12 he worked in a blacking factory while his father was in a debtors’ prison; he never forgot what poverty felt like."],["Christianity","Victorian readers knew that greed (‘covetous’) breaks the Ten Commandments and that redemption is always possible."],["Christmas","Dickens helped shape the Victorian Christmas as a time of family, generosity and charity."]],"groups":[{"n":"Scrooge: selfishness and isolation","k":"Character","sum":"Scrooge begins as a cold, greedy miser cut off from humanity.","quotes":[{"q":"a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner!","src":"Stave 1, the extract","f":[["Layer 1","The asyndetic list of verbs shows Scrooge is extremely greedy."],["Layer 2","The violent present participles suggest he wrings money from people by force, and the relentless list mirrors greed that is never satisfied."],["Layer 3","The final noun ‘sinner’ turns a financial flaw into a moral and spiritual one, suggesting his soul is in danger."],["Context","‘Covetous’ echoes the Tenth Commandment, familiar to a Christian Victorian audience."],["Effect on Victorian readers","Wealthy readers who valued thrift as a virtue are made to see that excessive greed is sinful."],["Dickens's intention","To shock readers into judging greed harshly from the very first page."],["Critical and conceptual reading","The asyndetic list of violent verbs makes greed physical and relentless. Conceptually, Dickens presents avarice as a sin that consumes the whole person. A Marxist reading sees Scrooge as the embodiment of industrial capitalism, valuing accumulation over human life."]],"th":"Greed · Isolation · Redemption"},{"q":"solitary as an oyster","src":"Stave 1, the extract","f":[["Layer 1","The simile shows that Scrooge is alone and closed off."],["Layer 2","An oyster has a hard shell, suggesting he has deliberately shut himself away from warmth and people."],["Layer 3","An oyster can hold a pearl, hinting that something precious, his capacity for love, is hidden inside and can be revealed."],["Context","Victorian values celebrated family and community, especially at Christmas."],["Effect on Victorian readers","Readers may pity as well as dislike him, sensing he could change."],["Dickens's intention","To foreshadow redemption: no one is beyond change."],["Critical and conceptual reading","The simile suggests Scrooge is closed off from the world, but oysters may also hide pearls. Conceptually, the image hints at a hidden goodness that redemption will reveal. A critical reading sees isolation as both a choice and a defence created by childhood neglect."]],"th":"Greed · Isolation · Redemption"},{"q":"He carried his own low temperature always about with him","src":"Stave 1, the extract","f":[["Layer 1","Scrooge is described as cold wherever he goes."],["Layer 2","The metaphor suggests his coldness is emotional, spreading to everyone around him like a winter climate."],["Layer 3","Because he ‘carried’ it, the coldness is something he chooses to hold onto, so he could also put it down."],["Context","Many poor Victorians could not afford heating; Scrooge even limits Bob Cratchit’s fire."],["Effect on Victorian readers","Comfortable readers are reminded that a lack of warmth, literal and emotional, harms others."],["Dickens's intention","To link physical cold with the cruelty of those who withhold help."],["Critical and conceptual reading","Scrooge’s coldness is presented as a climate he carries everywhere. Conceptually, his emotional state affects everyone around him, a social rather than private failing. Pathetic fallacy links his inner coldness with the bleak weather of the novella’s opening."]],"th":"Greed · Isolation · Redemption"},{"q":"warning all human sympathy to keep its distance","src":"Stave 1, the extract","f":[["Layer 1","Scrooge pushes other people and their kindness away."],["Layer 2","Personifying ‘sympathy’ as something he warns off shows he actively rejects compassion, as if it were a threat."],["Layer 3","This could suggest fear: perhaps Scrooge keeps people away to avoid being hurt, which Stave 2 later explores."],["Context","Victorian society was increasingly divided between rich and poor, who rarely mixed."],["Effect on Victorian readers","Readers who avoided the poor in the streets might recognise their own behaviour."],["Dickens's intention","To show that isolation is self imposed and morally wrong."],["Critical and conceptual reading","Scrooge keeps human sympathy at a distance, as if it were an intruder. Conceptually, isolation is deliberate, a rejection of community. A critical reading sees him as a symbol of a society that refuses responsibility for others."]],"th":"Greed · Isolation · Redemption"}]},{"n":"Poverty and social responsibility","k":"Theme","sum":"Dickens attacks the wealthy's indifference to the poor.","quotes":[{"q":"If they would rather die… they had better do it, and decrease the surplus population.","src":"Stave 1, the charity collectors","f":[["Layer 1","Scrooge does not care if the poor die."],["Layer 2","The economic jargon ‘surplus population’ dehumanises the poor, reducing people to unwanted numbers."],["Layer 3","The conditional ‘If’ shows he believes death is a choice for the poor, revealing ignorance as well as cruelty."],["Context","Thomas Malthus argued that helping the poor would cause overpopulation."],["Effect on Victorian readers","Readers who shared these views are confronted with how cruel they sound when spoken aloud."],["Dickens's intention","To discredit Malthusian thinking by giving it to a villain."],["Critical and conceptual reading","Scrooge’s cold economic language treats the poor as surplus stock. Conceptually, Dickens attacks Malthusian ideas and the 1834 Poor Law. The phrase returns in Stave 3 when Scrooge fears for Tiny Tim, showing how cruel ideas are exposed by real human faces."]],"th":"Poverty · Responsibility · Class"},{"q":"Are there no prisons?","src":"Stave 1, the charity collectors","f":[["Layer 1","Scrooge thinks the poor belong in prisons."],["Layer 2","The rhetorical question shows he believes the state has already done enough, so he has no personal duty."],["Layer 3","It reveals his isolation from reality: he speaks about suffering he has never seen."],["Context","The 1834 Poor Law forced the poor into workhouses, which many feared more than prison."],["Effect on Victorian readers","Readers who supported these institutions are made to feel uncomfortable."],["Dickens's intention","To criticise the government and the wealthy for hiding behind harsh institutions."],["Critical and conceptual reading","Scrooge’s rhetorical question points to prisons and workhouses as the answer to poverty. Conceptually, he sees the poor as problems to be contained. A critical reading notes the Ghost repeats these words back to him, forcing him to confront their cruelty."]],"th":"Poverty · Responsibility · Class"},{"q":"This boy is Ignorance. This girl is Want. Beware them both","src":"Stave 3, Ghost of Christmas Present","f":[["Layer 1","Two poor children represent society’s problems."],["Layer 2","The allegorical names show how ignorance and poverty are created by society’s neglect."],["Layer 3","The imperative ‘Beware’ warns that neglected children threaten the future of society itself."],["Context","Dickens had visited a Ragged School and read reports on child labour in 1843."],["Effect on Victorian readers","Readers are forced to look at the children they would rather ignore."],["Dickens's intention","To argue that education and care for poor children are essential."],["Critical and conceptual reading","Ignorance and Want are allegorical children hidden beneath the Ghost’s robe. Conceptually, Dickens presents social neglect as society’s own offspring, threatening its future. A critical reading sees the warning as a call for education reform, especially the Ragged Schools."]],"th":"Poverty · Responsibility · Class"},{"q":"fellow-passengers to the grave","src":"Stave 1, Fred","f":[["Layer 1","Fred says everyone is equal and will die one day."],["Layer 2","The metaphor of a shared journey suggests rich and poor are all connected."],["Layer 3","It directly opposes Scrooge’s isolation, offering community as the true meaning of Christmas."],["Context","Christian belief that all people are equal before God."],["Effect on Victorian readers","Readers are urged to see the poor as equals, not ‘another race of creatures’."],["Dickens's intention","To promote a vision of shared humanity."],["Critical and conceptual reading","Fred’s metaphor presents all humanity on one journey to death. Conceptually, it collapses class divisions, since rich and poor share the same destination. A critical reading sees Fred voicing Dickens’s Christian socialist ideal of equality."]],"th":"Poverty · Responsibility · Class"}]},{"n":"Redemption and transformation","k":"Theme","sum":"The ghosts lead Scrooge to change, offering hope to readers.","quotes":[{"q":"Mankind was my business.","src":"Stave 1, Marley’s Ghost","f":[["Layer 1","Marley realises he should have cared about people, not money."],["Layer 2","He reclaims the word ‘business’, which Scrooge used for money, giving it a moral meaning."],["Layer 3","The short declarative sentence sounds like a confession, full of regret that comes too late."],["Context","Christian teaching emphasised charity and love for one’s neighbour."],["Effect on Victorian readers","Business minded readers are told that their true business is people."],["Dickens's intention","To present social responsibility as everyone’s duty."],["Critical and conceptual reading","Marley redefines business as caring for mankind. Conceptually, he exposes the narrowness of Scrooge’s commercial values. A critical reading sees Dickens challenging capitalism by reframing moral duty as true ‘business’."]],"th":"Redemption · Christmas spirit · Change"},{"q":"I wear the chain I forged in life","src":"Stave 1, Marley’s Ghost","f":[["Layer 1","Marley is punished in death for his greed."],["Layer 2","The chain is a metaphor for the sins he created himself, link by link."],["Layer 3","The verb ‘forged’ suggests deliberate work, warning Scrooge that he is building a chain of his own."],["Context","Victorian readers believed in heaven, hell and divine judgement."],["Effect on Victorian readers","Readers fear the spiritual cost of selfish lives."],["Dickens's intention","To use fear of damnation to encourage generosity."],["Critical and conceptual reading","Marley’s chain is forged from his own sins. Conceptually, the metaphor shows punishment as self made, so Scrooge can still choose differently. A critical reading sees the image as a warning to Victorian readers about the cost of greed."]],"th":"Redemption · Christmas spirit · Change"},{"q":"I am as light as a feather, I am as happy as an angel, I am as merry as a schoolboy.","src":"Stave 5, the transformation","f":[["Layer 1","Scrooge is now joyful and free."],["Layer 2","The anaphora of ‘I am’ and the triplet of similes show a completely new identity."],["Layer 3","‘merry as a schoolboy’ suggests a rebirth that heals the lonely schoolboy of Stave 2."],["Context","Christian ideas of redemption and being born again."],["Effect on Victorian readers","Readers feel the joy that generosity brings."],["Dickens's intention","To show that change makes people happier, not poorer."],["Critical and conceptual reading","Scrooge’s triple similes describe a rebirth into lightness, holiness and youth. Conceptually, redemption restores the innocence he lost in childhood. A critical reading sees the joy as a deliberate contrast to his earlier coldness, proving change is possible."]],"th":"Redemption · Christmas spirit · Change"},{"q":"He became as good a friend, as good a master, and as good a man, as the good old city knew","src":"Stave 5, the ending","f":[["Layer 1","Scrooge becomes a good person."],["Layer 2","The tricolon covers friendship, employment and morality, showing a complete change."],["Layer 3","The repetition of ‘good’ replaces the earlier ‘old sinner’, completing the novella’s cyclical structure."],["Context","Dickens believed employers should care for their workers like a father."],["Effect on Victorian readers","Readers who employed others are given a model to follow."],["Dickens's intention","To show how the wealthy should behave."],["Critical and conceptual reading","The repetition of ‘good’ completes Scrooge’s transformation. Conceptually, his change touches every social role. A critical reading sees Dickens offering wealthy readers a practical model of the responsible employer."]],"th":"Redemption · Christmas spirit · Change"}]}],"ctx9":[["The 1834 Poor Law","It forced the poor into harsh workhouses.","Scrooge’s ‘Are there no prisons?’ voices the attitude behind the 1834 Poor Law, which Dickens wanted his readers to reject."],["Thomas Malthus","He argued that helping the poor would cause overpopulation.","By giving Scrooge the phrase ‘surplus population’, Dickens discredits Malthusian thinking by placing it in a villain’s mouth."],["Child poverty","In 1843 Dickens read a report on child labour and visited a Ragged School.","Ignorance and Want personify the neglected children Dickens saw, warning readers of the danger of ignoring them."],["Dickens’s childhood","At 12 he worked in a blacking factory while his father was in a debtors’ prison.","Dickens’s own experience of poverty gives his sympathy for the Cratchits its urgency."],["Christianity and Christmas","Victorian readers knew greed was a sin and redemption possible.","Scrooge’s rebirth on Christmas morning reflects the Christian idea of being born again."],["The novella’s purpose","Written quickly in 1843 to reach middle class readers at Christmas.","Dickens uses an entertaining ghost story to deliver a ‘sledgehammer’ message about social responsibility."]],"voc":{"v":[["misanthropic","disliking people in general","Scrooge’s misanthropic coldness cuts him off from society."],["avaricious","greedy for wealth","Dickens presents Scrooge as avaricious, valuing money over people."],["redemption","being saved from sin or error","The novella charts Scrooge’s redemption through the spirits."],["philanthropy","generosity to others in need","Scrooge’s final philanthropy shows his transformation."],["didactic","intended to teach a moral lesson","A Christmas Carol is didactic, teaching readers social responsibility."],["destitute","extremely poor","The destitute poor are ignored by men like Scrooge."],["allegorical","using characters to represent ideas","Ignorance and Want are allegorical figures of social neglect."],["benevolence","kindness and generosity","Fezziwig’s benevolence contrasts with Scrooge’s meanness."]],"m":[["L","Listing","a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner","Piled up verbs make Scrooge’s greed overwhelming.",1],["L","Simile","solitary as an oyster","Scrooge is closed off, though there may be a pearl inside.",1],["S","Staves","The chapters are called staves","Like verses of a carol, it suggests harmony and celebration.",0],["S","Cyclical structure","Scrooge rejects the charity men, then helps them","Repeated situations show how completely he has changed.",0],["F","Novella","A short, focused narrative","Its brevity made it affordable and easy to read aloud at Christmas.",0],["F","Ghost story","Marley’s chained ghost","The supernatural form frightens readers into moral reflection.",0]]},"chron":[{"r":"Stave 1","m":"The narrator introduces Scrooge in his counting house.","q":"a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner","t1":["Asyndetic list of verbs","Seven descriptors pile up without pause.","The violent present participles show greed as constant, physical action.","The relentless rhythm overwhelms the reader, mirroring how greed has consumed every part of Scrooge."],"t2":["Religious noun","The list ends on ‘sinner’.","Greed is presented as a moral failing, not just a personality trait.","Calling him a ‘sinner’ rather than a criminal opens the possibility of repentance and redemption."],"cx":"Victorian Christianity taught that charity was a duty, especially at Christmas, yet many wealthy people ignored the poor.","wi":"Dickens makes Scrooge a symbol of selfish capitalism so that his later change can teach readers to be generous."},{"r":"Stave 1","m":"Scrooge refuses to give money to the charity collectors.","q":"If they would rather die… they had better do it, and decrease the surplus population","t1":["Cold, economic diction","‘surplus population’ treats people as excess stock.","Scrooge dehumanises the poor, seeing them as numbers.","The phrase is later thrown back at him by the Ghost of Christmas Present when he fears for Tiny Tim, exposing its cruelty."],"t2":["Conditional sentence","‘If they would rather die’ suggests the poor choose their fate.","Scrooge blames the poor for poverty.","The calm, logical structure makes his heartlessness more shocking."],"cx":"Thomas Malthus argued that population growth would outstrip food, and the 1834 Poor Law forced the poor into harsh workhouses.","wi":"Dickens attacks Malthusian thinking and the Poor Law by putting their language in the mouth of a villain."},{"r":"Stave 1","m":"Marley’s ghost appears bound in chains.","q":"I wear the chain I forged in life","t1":["Metaphor","The chain represents sins built up during life.","Marley is imprisoned by his own greed.","The verb ‘forged’ suggests he made his own punishment link by link, so Scrooge can still choose differently."],"t2":["Symbolism","The chain is made of cash boxes and ledgers.","Money becomes a burden rather than a reward.","It is a vivid, memorable image for readers, making the moral lesson unforgettable."],"cx":"Victorian readers knew prisons and debtors’ prisons; Dickens’s father was imprisoned for debt.","wi":"Dickens frightens readers into reflecting on how they live."},{"r":"Stave 1","m":"Marley’s ghost rebukes Scrooge for valuing trade over people.","q":"Mankind was my business.","t1":["Metaphor of business","Marley, in Stave 1, redefines ‘business’ as caring for humanity.","True work is moral, not financial.","The irony is that Scrooge, obsessed with business, has ignored the only business that matters."],"t2":["Short declarative","The line is blunt and final.","Marley speaks with the authority of experience after death.","Its simplicity gives it the force of a moral at the heart of the novella."],"cx":"Victorian evangelical movements urged the wealthy to see philanthropy as Christian duty.","wi":"Dickens uses Marley as a warning so readers recognise their responsibility before it is too late."},{"r":"Stave 2","m":"The Ghost of Christmas Past shows Scrooge his lonely school days.","q":"A solitary child, neglected by his friends, is left there still.","t1":["Emotive adjectives","‘solitary’ and ‘neglected’ stress the young Scrooge’s loneliness.","Readers begin to pity the boy inside the miser.","The echo of ‘solitary as an oyster’ in Stave 1 suggests his adult coldness grew from childhood abandonment, so greed becomes a symptom rather than his whole identity."],"t2":["Temporal shift","The Ghost carries Scrooge, and the reader, back in time.","The flashback explains rather than excuses his character.","Placing the past before the visions of present and future suggests that understanding where we came from is the first step to changing."],"cx":"Dickens was sent to work in a blacking factory aged twelve while his father was in a debtors’ prison, an experience of neglect he never forgot.","wi":"Dickens wants readers to see that cruelty is often made by circumstance, so society shares responsibility for the children it neglects."},{"r":"Stave 2","m":"Scrooge watches Fezziwig’s Christmas party and defends his old employer.","q":"The happiness he gives, is quite as great as if it cost a fortune.","t1":["Comparative structure","‘as great as’ weighs happiness against a ‘fortune’.","Kindness is presented as a kind of wealth, so Fezziwig is rich in what matters.","Scrooge speaks the words himself, revealing that he once understood generosity and has chosen to forget it."],"t2":["Economic metaphor","Happiness is measured in the language of money.","Dickens uses Scrooge’s own commercial vocabulary to begin converting him.","The line sets Fezziwig, the model employer, against Scrooge’s treatment of Bob Cratchit, inviting readers to judge."],"cx":"Industrial employers often worked staff long hours for low pay, with no holidays and no welfare.","wi":"Dickens presents Fezziwig as a model employer, urging wealthy readers to treat workers with warmth."},{"r":"Stave 2","m":"Belle ends her engagement to the young Scrooge.","q":"Another idol has displaced me","t1":["Religious metaphor","Money has become an ‘idol’, a false god.","Scrooge has replaced love with the worship of wealth.","Idolatry breaks the first commandment, so Dickens presents greed as a spiritual sin as well as a social failing."],"t2":["First person pronoun","Belle names herself as the one replaced.","The loss is intimate and painful rather than abstract.","Her soft, sad tone makes the moment more moving than anger would, showing what greed has cost Scrooge himself."],"cx":"Victorian preachers warned against serving ‘Mammon’, the false god of wealth.","wi":"Dickens shows that greed destroys love, warning readers about what they sacrifice for money."},{"r":"Stave 3","m":"Scrooge watches the Cratchits’ Christmas dinner.","q":"God bless us every one!","t1":["Exclamation","Tiny Tim’s blessing is joyful.","It shows generosity despite poverty.","The inclusive ‘every one’ contrasts with Scrooge’s exclusion of the poor."],"t2":["Religious language","The blessing invokes God.","Christian charity is shown by the poor, not the rich.","It closes the novella too, framing the whole story with Tim’s generosity."],"cx":"Christmas was being reinvented in the 1840s as a family celebration of goodwill.","wi":"Dickens makes the poor family the moral heart of the story."},{"r":"Stave 3","m":"The Ghost of Christmas Present reveals two children under his robe.","q":"This boy is Ignorance. This girl is Want. Beware them both","t1":["Allegory","The children personify ‘Ignorance’ and ‘Want’.","They represent the neglected poor of Victorian society.","As children they suggest society’s problems will grow if ignored, threatening everyone."],"t2":["Imperative","‘Beware them both’ is a direct warning.","It speaks to Scrooge and the reader alike.","The command turns the novella into a call for social reform, especially education."],"cx":"Dickens visited the Ragged Schools for poor children and was horrified by their conditions.","wi":"Dickens warns readers that ignorance and poverty endanger the whole of society."},{"r":"Stave 4","m":"At his own neglected grave, Scrooge clutches the final Ghost’s robe and pleads.","q":"I am not the man I was.","t1":["Declarative sentence","The short statement is a confession of change.","Scrooge separates his past self from his present self.","The plain monosyllables sound sincere, as the elaborate cruelty of Stave 1 falls away to simple truth."],"t2":["Climax","The plea comes at the darkest moment of the novella.","The grave forces Scrooge to face the end his life is heading towards.","Placing the turning point beside a grave makes redemption feel like a rescue from death itself."],"cx":"Victorian readers knew the horror of pauper burials and deaths that no one mourned.","wi":"Dickens uses the fear of death to make readers reflect on how they want to be remembered."},{"r":"Stave 4","m":"Scrooge vows to change his life.","q":"I will honour Christmas in my heart, and try to keep it all the year.","t1":["Modal verb","‘will’ makes the promise firm and future focused.","Scrooge commits himself to action, not just feeling.","The humble ‘try’ makes him human: change is a lifelong effort rather than a single moment."],"t2":["Religious diction","‘honour’ suggests reverence and worship.","Christmas becomes a moral code rather than a date.","‘all the year’ turns the festival into a way of living, linking Christian values to everyday social responsibility."],"cx":"Dickens helped to popularise Christmas in the 1840s as a festival of family, generosity and goodwill.","wi":"Dickens encourages readers to live charitably every day, not just in December."},{"r":"Stave 5","m":"Scrooge wakes on Christmas morning, transformed.","q":"I am as light as a feather, I am as happy as an angel, I am as merry as a schoolboy","t1":["Triple similes","Three similes describe his joy: a feather, an angel, a schoolboy.","He feels weightless, holy and young again.","Each image reverses an earlier one: his chains are gone, his sin is forgiven and his lost childhood is restored."],"t2":["Anaphora","‘I am as’ is repeated three times.","The tumbling rhythm shows breathless excitement.","His speech has become as energetic and generous as his spirit, unlike his clipped replies in Stave 1."],"cx":"Victorian Christianity taught that any sinner could be redeemed through genuine repentance.","wi":"Dickens shows that change is joyful and possible, giving readers hope for themselves and society."},{"r":"Stave 5","m":"Scrooge becomes a generous friend, employer and man.","q":"He became as good a friend, as good a master, and as good a man, as the good old city knew","t1":["Repetition","The adjective ‘good’ is repeated again and again.","Scrooge’s goodness is complete and overflowing.","It answers the list of greedy verbs in Stave 1, completing the novella’s cyclical structure of sin and redemption."],"t2":["Tricolon","‘friend’, ‘master’, ‘man’ cover every role he plays.","His change touches family, work and society.","As a ‘master’ he becomes the employer the poor need, offering readers a practical model of reform."],"cx":"In an age without a welfare state, employers had enormous power over their workers’ lives.","wi":"Dickens offers wealthy readers a hopeful model of social responsibility."}]},{"id":"jh","title":"Jekyll and Hyde","author":"Stevenson","kind":"19th century novella","paper":"Paper 1, Section B","col":"#00695C","ctx":[["Two Edinburghs","Stevenson grew up in Edinburgh’s elegant, respectable New Town, a short walk from the crowded, poor Old Town, where crime was common. A city with two faces gave him the idea of one person with two faces."],["Deacon Brodie","An Edinburgh cabinet maker of the 1700s and town councillor who was a burglar by night. He was hanged in 1788. Stevenson grew up with a cabinet Brodie had made, and later wrote a play about him with his friend W. E. Henley."],["A strict religious childhood","His nanny, Alison Cunningham, known as Cummy, was a devout Calvinist who filled his head with stories of sin, hell and the devil. That fascination with good and evil never left him."],["His own double life","As a student he rebelled against his respectable family, drinking in Old Town taverns and mixing with people his parents would never have welcomed at home."],["Respectability","For a Victorian gentleman, reputation was everything. Drinking, gambling or any hint of scandal could ruin him, so vices were hidden rather than given up."],["Darwin and degeneration","Darwin’s On the Origin of Species (1859) suggested humans had evolved from earlier creatures. Many Victorians feared people could slip backwards into something primitive and violent."]],"groups":[{"n":"Chapter 1: Story of the Door","k":"Chapter","sum":"Utterson, a reserved lawyer, walks through London with his relative Enfield. Enfield points to a shabby door and tells how he saw a man trample a young girl, then pay her family with a cheque signed by a highly respectable name. The two men agree never to speak of it again.","quotes":[{"q":"a man of a rugged countenance that was never lighted by a smile","src":"Our very first description of Utterson.","f":[["Method","Light imagery"],["Analysis","Stevenson opens with a man who keeps himself shut away. ‘Never lighted’ suggests a closed room left in the dark, which suits a story about hidden lives. We’re also told he is somehow lovable, so even the novel’s steady, sensible figure has two sides."],["Context","The ideal Victorian gentleman showed very little emotion in public."],["In short","‘Never lighted’ suggests a closed, dark room. Even sensible Utterson has two sides: cold on the surface, yet somehow lovable."],["Critical and conceptual reading","Utterson’s ‘rugged countenance’ that is ‘never lighted by a smile’ presents a man of severe self control. Conceptually, he embodies Victorian repression, a respectable surface that conceals feeling. A critical reading sees him as a quieter version of Jekyll’s divided self, a man whose restraint hints at desires he never voices."]],"th":""},{"q":"I let my brother go to the devil in his own way","src":"Utterson explains his attitude to friends who go wrong.","f":[["Method","Idiom and biblical allusion"],["Analysis","It sounds generous, but it’s also a neat way of never getting involved. The line comes straight after a reference to Cain, who asked God whether he was his brother’s keeper, so Stevenson hints that this kind of tolerance has a cost."],["Context","Ideas of sin and damnation from Stevenson’s Calvinist upbringing appear on the very first page."],["In short","Sounds tolerant, but it’s really a way of staying out of things. The Cain allusion hints that looking away has a cost."],["Critical and conceptual reading","Utterson’s tolerance sounds generous, but it is really a refusal to intervene. Conceptually, Victorian gentlemen protect reputation by looking away from sin. A critical reading sees this ‘tolerance’ as complicity, the same silence that lets Hyde flourish in respectable London."]],"th":""},{"q":"the marks of prolonged and sordid negligence","src":"Enfield and Utterson pass the door that will turn out to be Jekyll’s back entrance.","f":[["Method","Personification"],["Analysis","The door is described like a person who has let himself go. ‘Sordid’ means morally dirty as well as shabby, so the building already feels guilty. It belongs to a respectable house, which makes it the first image in the book of a fine front hiding a grubby secret."],["Context","Edinburgh’s grand New Town sat beside the decaying Old Town."],["In short","The neglected door is the back of a respectable house: a fine front hiding a grubby secret. ‘Sordid’ = morally dirty."],["Critical and conceptual reading","The neglected door of Jekyll’s laboratory is shabby and decaying. Conceptually, the building is a symbol of the hidden self behind Jekyll’s grand house. A Gothic reading treats architecture as psychology: the back door is where repressed desire enters and leaves."]],"th":""},{"q":"the man trampled calmly over the child’s body","src":"Enfield describes Hyde colliding with a young girl at three in the morning.","f":[["Method","Verb and adverb"],["Analysis","‘Calmly’ is the word that chills. Violence in a rage is frightening, but violence carried out with no feeling at all is worse. A child is the most innocent victim imaginable, so Hyde is defined by cruelty from the moment we meet him."],["Context","Victorians worried about crime on dark city streets and about the safety of poor children."],["In short","‘Calmly’ is the chilling word: violence with no feeling at all. The victim is a child, the most innocent possible."],["Critical and conceptual reading","Hyde’s calm trampling of a child shocks because it lacks emotion. Conceptually, evil appears natural to him rather than a loss of control. A critical reading sees the scene as an attack on innocence, staged in the streets of a city that claimed moral superiority."]],"th":""},{"q":"like some damned Juggernaut","src":"Enfield tries to describe what he saw.","f":[["Method","Simile"],["Analysis","Enfield can’t describe Hyde as a man, so he reaches for an unstoppable crushing force. ‘Damned’ is strong language for a gentleman, and it also means condemned to hell, so the curse doubles as a judgement."],["Context","‘Juggernaut’ came into English through British rule in India and was used for any force that crushes everything in its way."],["In short","Hyde isn’t described as a man but as an unstoppable crushing force. ‘Damned’ is both a swear word and ‘condemned to hell’."],["Critical and conceptual reading","The image of a ‘Juggernaut’ presents Hyde as an unstoppable force crushing whatever lies in its path. Conceptually, it suggests evil is mechanical and impersonal. A postcolonial reading notes the word’s Indian origin, revealing Victorian fears of the ‘exotic’ and uncontrolled."]],"th":""},{"q":"carrying it off, sir, really like Satan","src":"Hyde faces the angry crowd with ‘a kind of black sneering coolness’.","f":[["Method","Simile"],["Analysis","Enfield is a man of the world, yet the only comparison he can find is Satan. It’s the first of many devilish descriptions, and it lifts Hyde from ordinary criminal to something spiritual and evil."],["Context","Stevenson was raised on vivid stories of the devil and damnation."],["In short","First of many devilish comparisons. Hyde moves from ordinary criminal to something spiritually evil."],["Critical and conceptual reading","Enfield’s comparison to Satan gives Hyde a demonic, religious dimension. Conceptually, the novella blends theological evil with scientific explanation. A critical reading sees Victorian society reaching for the language of sin when reason fails."]],"th":""},{"q":"the more it looks like Queer Street, the less I ask","src":"Enfield explains why he never asks questions.","f":[["Method","Idiom"],["Analysis","‘Queer Street’ meant trouble, debt or scandal. Enfield’s rule is a recipe for looking away: the more suspicious something seems, the less he wants to know. Stevenson shows how respectable men protect each other by keeping quiet."],["Context","Reputation mattered more than truth to many Victorian gentlemen."],["In short","‘Queer Street’ = trouble or scandal. Enfield’s rule: the more suspicious it looks, the less he asks. Silence protects reputations."],["Critical and conceptual reading","Enfield’s rule of asking fewer questions as things look worse reveals the gentleman’s code of silence. Conceptually, respectability is preserved by deliberate ignorance. A critical reading sees this willed blindness as the condition that allows Hyde to exist."]],"th":""},{"q":"Let us make a bargain never to refer to this again","src":"The chapter’s closing agreement between Enfield and Utterson.","f":[["Method","Imperative and chapter ending"],["Analysis","The chapter ends with two gentlemen agreeing to forget. It’s polite and civilised, and it lets evil carry on unchecked. The reader is left knowing more than the characters are willing to admit."],["Context","Avoiding scandal was a key part of Victorian respectability."],["In short","The chapter ends in an agreement to forget. Polite and civilised, and it lets evil carry on."],["Critical and conceptual reading","The bargain never to speak of the matter seals the gentlemen’s pact of silence. Conceptually, repression operates socially as well as individually. A critical reading sees the novella exposing how secrecy protects the powerful."]],"th":""}]},{"n":"Chapter 2: Search for Mr Hyde","k":"Chapter","sum":"Utterson rereads Jekyll’s will, which leaves everything to Hyde, and fears blackmail. Dr Lanyon says he fell out with Jekyll over his strange science. Haunted by nightmares, Utterson waits by the door until he finally meets Hyde, and he comes away disgusted.","quotes":[{"q":"If he be Mr. Hyde,’ he had thought, ‘I shall be Mr. Seek.","src":"Utterson decides to watch the door until he sees Hyde.","f":[["Method","Pun"],["Analysis","It’s almost the only joke in the book, and it tells us a lot. Turning the name into hide and seek makes the story a game of detection, and it suggests the name is a clue: Hyde is the part of somebody that hides."],["Context","Detective fiction was becoming hugely popular; Sherlock Holmes first appeared the year after this novella."],["In short","Hide and seek pun: the story becomes a detective game, and Hyde’s name tells us he is the part of someone that hides."],["Critical and conceptual reading","Utterson’s pun turns the investigation into a game of hide and seek. Conceptually, Hyde’s name reveals his role: he is what Jekyll hides. A critical reading notes the playful tone soon darkens as the hidden self proves deadly."]],"th":""},{"q":"a figure to whom power was given","src":"Utterson’s nightmare of a faceless figure moving through the city.","f":[["Method","Dream imagery and passive voice"],["Analysis","In the dream, the figure glides through London and stands over sleepers. The passive ‘was given’ quietly raises a question: who gave him that power? By the end of the book we know the answer is Jekyll."],["Context","Stevenson said the story itself first came to him in a nightmare."],["In short","Passive ‘was given’ asks who gave Hyde his power. The answer, we later learn, is Jekyll."],["Critical and conceptual reading","The phrase ‘a figure to whom power was given’ appears in Utterson’s nightmare. Conceptually, Hyde is imagined as an almost supernatural force with authority over others. A psychoanalytic reading sees the dream revealing Utterson’s own fears and fascination."]],"th":""},{"q":"pale and dwarfish","src":"Utterson finally sees Hyde up close.","f":[["Method","Adjectives"],["Analysis","Hyde is small and pale, almost unfinished, as if he hasn’t grown properly. Jekyll later explains why: his evil side has been less exercised than his good side, so it is smaller. The description is also oddly vague, a sign that Hyde resists being pinned down."],["Context","Many Victorians believed criminals could be recognised by the shape of their bodies."],["In short","Small and pale, almost unfinished. Later we learn why: Jekyll’s evil side has had less use, so it’s smaller."],["Critical and conceptual reading","Hyde’s small, pale body suggests something underdeveloped. Conceptually, he represents a part of Jekyll that has been starved by repression. A Darwinian reading links his size to fears of degeneration."]],"th":""},{"q":"a sort of murderous mixture of timidity and boldness","src":"Utterson describes Hyde’s manner.","f":[["Method","Juxtaposition and alliteration"],["Analysis","Hyde is shy and aggressive at the same time, which makes him impossible to predict. The alliteration of ‘murderous mixture’ makes the phrase stick, and the picture is almost animal: a creature that shrinks away and then strikes."],["Context","Fears of degeneration imagined criminals as more animal than human."],["In short","Shy and aggressive at once, like an animal that shrinks back then strikes. ‘Murderous mixture’ sticks in the mind."],["Critical and conceptual reading","Hyde’s ‘murderous mixture of timidity and boldness’ makes him both predator and fugitive. Conceptually, he embodies contradiction, as all humans do in Jekyll’s theory of duality. A critical reading sees his timidity as fear of exposure, the same fear that rules respectable Victorian gentlemen."]],"th":""},{"q":"Something troglodytic, shall we say?","src":"Utterson struggles to put his disgust into words.","f":[["Method","Adjective and rhetorical question"],["Analysis","A troglodyte is a cave dweller, so Utterson places Hyde right at the start of human history, a throwback. The rhetorical question shows him groping for words, which becomes a pattern: nobody can quite describe Hyde."],["Context","Darwin’s theory led to fears that humans could slip back into a primitive state."],["In short","Troglodyte = cave dweller: Hyde is a primitive throwback. Utterson can’t find the words, and nobody ever can."],["Critical and conceptual reading","‘troglodytic’ links Hyde to prehistoric cave dwellers, placing him lower on the evolutionary ladder. Conceptually, Stevenson taps Victorian fears of atavism, the idea that civilised people could slide back into primitive states. A critical reading notes Utterson’s hesitant ‘shall we say?’, as if respectable language cannot name what Hyde is."]],"th":""},{"q":"if ever I read Satan’s signature upon a face, it is on that of your new friend","src":"Utterson thinks about Jekyll after meeting Hyde.","f":[["Method","Metaphor"],["Analysis","A signature is a mark of ownership, so the devil has signed Hyde’s face as if he belongs to him. It’s a fitting image for a lawyer who spends his days reading signed documents: Utterson reads faces the way he reads contracts."],["Context","Physiognomy, the belief that character shows in the face, was widely accepted."],["In short","The devil has signed Hyde’s face like a document: he belongs to Satan. A lawyer’s way of reading a face."],["Critical and conceptual reading","Utterson believes he can read ‘Satan’s signature’ on Hyde’s face. Conceptually, the line reflects physiognomy, the Victorian belief that morality is written on the body. A critical reading exposes the danger of this thinking, which judged the poor, the foreign and the disabled by appearance."]],"th":""},{"q":"Such unscientific balderdash","src":"Lanyon explains why he fell out with Jekyll.","f":[["Method","Noun and adjective"],["Analysis","‘Balderdash’ is a blunt, slightly comic word, and it shows how firmly Lanyon holds to traditional science. That certainty is exactly what makes his collapse later in the novella so shocking."],["Context","Victorian science was split between careful, traditional methods and experiments that seemed to stray into the supernatural."],["In short","Lanyon dismisses Jekyll as talking nonsense. His certainty makes his later collapse more shocking."],["Critical and conceptual reading","Lanyon dismisses Jekyll’s experiments as unscientific nonsense. Conceptually, he represents rigid materialist science that refuses to explore the unknown. Ironically, his rational certainty is destroyed when he witnesses the transformation, showing reason’s limits."]],"th":""},{"q":"the ghost of some old sin, the cancer of some concealed disgrace","src":"Utterson guesses Jekyll is being blackmailed over something from his youth.","f":[["Method","Metaphor and parallel structure"],["Analysis","A ghost comes back to haunt; a cancer grows unseen and kills. The two balanced images both describe a past that refuses to stay buried, and ‘concealed’ points straight at the theme of secrecy."],["Context","Respectable men with hidden vices were easy targets for blackmail."],["In short","Ghost = the past comes back to haunt. Cancer = it grows unseen and kills. A secret that won’t stay buried."],["Critical and conceptual reading","Utterson suspects Jekyll’s youthful sins have returned like a ghost or a cancer. Conceptually, the past cannot be buried; repressed guilt grows like disease. A critical reading sees Victorian respectability built on hidden histories that threaten to break through."]],"th":""}]},{"n":"Chapter 3: Dr Jekyll Was Quite at Ease","k":"Chapter","sum":"A fortnight later, Jekyll holds one of his dinner parties and Utterson stays behind. When Utterson raises the will, Jekyll goes pale and refuses to discuss Hyde. He insists he can be rid of Hyde whenever he likes, and makes Utterson promise to help Hyde if anything happens to him.","quotes":[{"q":"a large, well-made, smooth-faced man of fifty","src":"Our first proper look at Jekyll.","f":[["Method","Adjectives"],["Analysis","Jekyll is everything Hyde is not: large, well built and smooth. ‘Smooth’ is worth pausing on, though. Like the landlady in Chapter 4, whose face is ‘smoothed by hypocrisy’, smoothness can be a polished surface over something rougher."],["Context","This is the image of the successful, respectable Victorian professional."],["In short","Everything Hyde is not: large, well built, smooth. But ‘smooth’ can be a polished surface over something rougher."],["Critical and conceptual reading","Jekyll is described as large, handsome and respectable. Conceptually, his appearance embodies the Victorian gentleman, which makes his secret more shocking. A critical reading sees him as the respectable face of hypocrisy, the mask that Hyde removes."]],"th":""},{"q":"every mark of capacity and kindness","src":"The description of Jekyll continues.","f":[["Method","Abstract nouns"],["Analysis","Jekyll seems both capable and kind, and Stevenson clearly wants us to like him. That is what makes the truth so disturbing: the most likeable man in the book is the one hiding Hyde."],["Context","Victorians trusted that good manners and a good appearance meant a good man."],["In short","Stevenson makes us like Jekyll, which makes the truth more disturbing: the most likeable man is hiding Hyde."],["Critical and conceptual reading","Jekyll bears ‘every mark of capacity and kindness’. Conceptually, his outward virtue hides inner division, so the novella warns against trusting appearances. A critical reading notes the word ‘mark’, which ironically echoes the marks of evil seen on Hyde."]],"th":""},{"q":"that hide-bound pedant, Lanyon","src":"Jekyll mocks his old friend.","f":[["Method","Insult and possible pun"],["Analysis","Jekyll’s charm slips for a moment. He sneers at Lanyon as narrow and fussy, which shows how proud he is of his own science. There may be a buried pun too: Jekyll is the one who is truly bound to Hyde."],["Context","Scientific rivalry between traditional and experimental thinkers."],["In short","Jekyll’s charm slips into arrogance. Possible pun: it’s Jekyll, not Lanyon, who is bound to Hyde."],["Critical and conceptual reading","Jekyll’s insult reveals professional rivalry with Lanyon. Conceptually, science is divided between cautious materialism and Jekyll’s transcendental ambition. A critical reading sees ego and pride driving Jekyll’s reckless experiments."]],"th":""},{"q":"grew pale to the very lips","src":"Utterson mentions Hyde’s name.","f":[["Method","Physical description"],["Analysis","The mention of Hyde drains the colour from Jekyll’s face. Stevenson shows fear through the body rather than telling us about it, and Jekyll’s calm surface cracks the moment his secret is touched."],["Context","A gentleman was expected to stay composed, whatever he felt."],["In short","Hyde’s name drains Jekyll’s face. Fear shown through the body: his calm surface cracks."],["Critical and conceptual reading","Jekyll’s sudden pallor betrays fear when Hyde is mentioned. Conceptually, the body reveals what words conceal. A critical reading sees repression failing physically, as the hidden self presses against the respectable surface."]],"th":""},{"q":"the moment I choose, I can be rid of Mr. Hyde","src":"Jekyll reassures Utterson that he is in control.","f":[["Method","Dramatic irony"],["Analysis","Jekyll truly believes he is in charge. Readers who know the ending hear the irony at once, and even first time readers may notice how much this sounds like the promise of someone caught in an addiction."],["Context","Victorians worried about addiction to drink and drugs such as laudanum."],["In short","Jekyll thinks he’s in control. It sounds like an addict’s promise, and the irony is huge."],["Critical and conceptual reading","Jekyll’s claim that he can be rid of Hyde ‘the moment I choose’ is tragic hubris. Conceptually, it echoes the language of addiction, the confident belief that a habit can be stopped at will. Readers who know the ending see that Hyde’s power grows with every transformation."]],"th":""},{"q":"this is a private matter, and I beg of you to let it sleep","src":"Jekyll asks Utterson to drop the subject.","f":[["Method","Metaphor"],["Analysis","Jekyll asks for silence, and ‘let it sleep’ suggests something resting rather than dead. Things that sleep can wake, so the request carries a warning inside it."],["Context","A gentleman’s private life was not to be questioned."],["In short","‘Let it sleep’ = resting, not dead. Things that sleep can wake."],["Critical and conceptual reading","Jekyll’s plea to let the matter ‘sleep’ shows how secrecy protects reputation. Conceptually, the gentlemen’s code of silence enables Hyde. A critical reading sees Victorian respectability depending on what is never spoken."]],"th":""}]},{"n":"Chapter 4: The Carew Murder Case","k":"Chapter","sum":"Nearly a year later, a maid at her window sees Hyde beat Sir Danvers Carew MP to death with a heavy cane. Utterson recognises the broken stick as one he gave Jekyll and leads the police to Hyde’s rooms in Soho. The rooms have been ransacked and Hyde has vanished.","quotes":[{"q":"a crime of singular ferocity","src":"The chapter’s opening line.","f":[["Method","Journalistic language"],["Analysis","Stevenson opens like a newspaper report, pulling the story out of private drawing rooms and into the public eye. ‘Singular’ means both unique and extreme, so London has never seen anything like it."],["Context","The Victorian press thrived on sensational crime."],["In short","Opens like a newspaper. ‘Singular’ = unique and extreme. Hyde’s evil is now public."],["Critical and conceptual reading","The ‘singular ferocity’ of the Carew murder shocks London. Conceptually, Hyde’s violence escalates from trampling to murder as Jekyll indulges him. A critical reading sees evil growing stronger the more it is released."]],"th":""},{"q":"an aged beautiful gentleman with white hair","src":"The maid watches Sir Danvers Carew approach Hyde in the moonlight.","f":[["Method","Adjectives and colour"],["Analysis","‘Aged’ and ‘beautiful’ come before we even reach ‘gentleman’, and ‘white hair’ completes the picture of a near saint. We’re seeing him through a maid who is ‘romantically given’, though, so Stevenson leaves room to ask whether he is truly good or just looks it."],["Context","Carew is an MP, a symbol of law and the establishment."],["In short","‘Aged’, ‘beautiful’, ‘white’: a near saintly victim. But it’s a romantic maid’s view."],["Critical and conceptual reading","Carew is an ‘aged beautiful gentleman’, a symbol of respectable civilisation. Conceptually, Hyde’s attack is symbolic, the primitive destroying the cultured. A critical reading notes Carew is an MP, so the crime strikes at the political establishment itself."]],"th":""},{"q":"a great flame of anger","src":"Hyde suddenly explodes at Carew.","f":[["Method","Metaphor"],["Analysis","The anger ignites like fire: sudden, spreading and impossible to reason with. Fire also belongs to the imagery of hell that follows Hyde, and nothing Carew has done justifies it."],["Context","Stevenson’s Calvinist upbringing left him fascinated by sin and hellfire."],["In short","Anger ignites like fire. Hell imagery again, and completely unprovoked."],["Critical and conceptual reading","Hyde’s anger is described as a ‘great flame’. Conceptually, fire suggests uncontrollable passion and hellish destruction. A critical reading sees Hyde as all the rage that Victorian repression forced Jekyll to bury."]],"th":""},{"q":"like a madman","src":"Hyde stamps his foot and waves his cane.","f":[["Method","Simile"],["Analysis","‘Madman’ offers a comforting explanation: perhaps Hyde is simply insane. The novel later takes that comfort away, because Hyde isn’t ill. He is set free."],["Context","Victorians were preoccupied with insanity and asylums."],["In short","‘Madman’ is a comforting label the novel rejects. Hyde isn’t mad. He’s unleashed."],["Critical and conceptual reading","The simile ‘like a madman’ removes Hyde from the realm of reason. Conceptually, Stevenson links evil with irrationality. A critical reading reflects Victorian fears about madness and the asylum, the hidden ‘others’ of respectable society."]],"th":""},{"q":"with ape-like fury","src":"Hyde clubs Carew to the ground.","f":[["Method","Animal imagery"],["Analysis","‘Ape-like’ drags Hyde down the evolutionary ladder, and ‘fury’ goes beyond anger to something wild. Yet he is dressed as a gentleman and carrying a gentleman’s cane, so the ape is inside the gentleman."],["Context","Darwin’s ideas fed fears that civilised people could become savage."],["In short","Primitive and savage, but dressed as a gentleman. The beast is inside respectable men."],["Critical and conceptual reading","‘ape-like fury’ fuses human and animal, recalling Darwin’s theory of evolution. Conceptually, Hyde embodies the fear that civilisation is only a thin layer over primitive instinct. A critical reading sees the novella questioning whether humanity has truly evolved beyond violence."]],"th":""},{"q":"a storm of blows, under which the bones were audibly shattered","src":"Hyde beats Carew to death.","f":[["Method","Metaphor and sound imagery"],["Analysis","A ‘storm’ is a force of nature, not a person who can be reasoned with. ‘Audibly’ puts us at the window beside the maid, hearing bones break."],["Context","Gothic fiction aimed to shock."],["In short","‘Storm’ = an unstoppable force. ‘Audibly’ puts us at the window, hearing the bones break."],["Critical and conceptual reading","The ‘storm of blows’ turns violence into a natural force, while ‘audibly shattered’ makes the reader hear the bones break. Conceptually, Hyde’s brutality is total, released from every civilised restraint. A critical reading sees the excess as a measure of how much Jekyll had repressed."]],"th":""},{"q":"this insensate cruelty","src":"The heavy cane has snapped in two.","f":[["Method","Adjective and symbolism"],["Analysis","‘Insensate’ means both senseless and unfeeling. The cane is a gentleman’s stick, and it is Jekyll’s; broken in half, it becomes a picture of one respectable man split in two."],["Context","A cane was a mark of status."],["In short","Senseless and unfeeling. Jekyll’s gentleman’s cane, snapped in two: one man split in half."],["Critical and conceptual reading","‘insensate’ means without feeling or reason, so Hyde’s cruelty seems mechanical. Conceptually, evil is presented as absence: of conscience, empathy and humanity. A critical reading contrasts this with Jekyll’s endless self justification, the two halves of a divided self."]],"th":""},{"q":"A great chocolate-coloured pall lowered over heaven","src":"Utterson travels by cab towards Soho the next morning.","f":[["Method","Metaphor and pathetic fallacy"],["Analysis","A pall is the cloth laid over a coffin, so the whole city seems dressed for a funeral. The fog blots out ‘heaven’ itself, leaving a London cut off from goodness."],["Context","Coal smoke fogs known as pea soupers were real and choking."],["In short","Pall = coffin cloth: London in mourning. Fog blots out ‘heaven’: a godless city."],["Critical and conceptual reading","The ‘chocolate-coloured pall’ of fog darkens London like a coffin cloth. Conceptually, the setting mirrors the moral darkness spreading through respectable society. A Gothic reading sees the city itself as a character, hiding crime in its murk."]],"th":""},{"q":"like a district of some city in a nightmare","src":"Soho glimpsed through the fog.","f":[["Method","Simile"],["Analysis","Real London turns dreamlike and unstable. ‘Some city’ could be anywhere, so the horror isn’t limited to one place, and Utterson’s nightmares from Chapter 2 seem to have leaked into the streets."],["Context","The novella itself began as one of Stevenson’s nightmares."],["In short","London becomes a nightmare. ‘Some city’ = anywhere. Utterson’s bad dreams have reached the streets."],["Critical and conceptual reading","Soho appears ‘like a district of some city in a nightmare’, unreal and threatening. Conceptually, London is doubled, with respectable squares beside squalid streets, mirroring Jekyll and Hyde. A critical reading exposes Victorian anxieties about poverty and vice on the doorstep of wealth."]],"th":""},{"q":"this mournful reinvasion of darkness","src":"Lamps have been lit in the daytime against the fog.","f":[["Method","Military metaphor"],["Analysis","‘Reinvasion’ makes the weather a war that darkness keeps winning. It mirrors Jekyll, whose better self will be overrun by Hyde again and again."],["Context","Gaslight was a proud symbol of Victorian progress."],["In short","Darkness keeps invading and light is losing, just as Hyde will overrun Jekyll."],["Critical and conceptual reading","Darkness ‘reinvades’ the city, as if light is losing a battle. Conceptually, the phrase suggests evil returning despite civilisation’s efforts to hold it back. The adjective ‘mournful’ gives the scene a funereal tone, foreshadowing deaths to come."]],"th":""},{"q":"She had an evil face, smoothed by hypocrisy: but her manners were excellent.","src":"Hyde’s landlady opens the door in Soho.","f":[["Method","Antithesis"],["Analysis","The sentence turns on ‘but’, setting an evil face against excellent manners. It’s Jekyll and Hyde in miniature, and it suggests hypocrisy runs through every class, not just the rich."],["Context","Soho was linked to poverty and vice."],["In short","Evil face, excellent manners: Jekyll and Hyde in one sentence. Hypocrisy is everywhere."],["Critical and conceptual reading","Hyde’s housekeeper has an ‘evil face, smoothed by hypocrisy’ yet excellent manners. Conceptually, she embodies the novella’s theme: good manners can mask evil. A cr
