pace that matches the couple’s slow, silent walk around the lake."],["Structure","The image comes in the opening stanza, which begins after a storm, suggesting the worst of the couple’s conflict has just passed."],["Context","Owen Sheers is a Welsh poet, and the poem comes from Skirrid Hill (2005), a collection about relationships and landscape."],["Poet's intention","Sheers presents nature as a mirror of the couple’s emotions, using pathetic fallacy to show strain without stating it directly."],["Effect on the reader","The reader senses tension and exhaustion hanging over the couple."]],"th":""},{"q":"silent and apart","src":"Winter Swans, Owen Sheers","f":[["Language","The adjectives ‘silent and apart’ show the couple are emotionally separated, even though they are physically walking side by side."],["Form","The caesura before the phrase creates a pause in the line, mirroring the uncomfortable gap that has opened between them."],["Structure","This comes early in the poem, before the swans appear, so it marks the low point that the poem moves away from."],["Context","The poem reflects the ordinary experience of couples who stop speaking after a disagreement and struggle to make the first move."],["Poet's intention","Sheers presents loss and separation within a relationship as painful but temporary, a distance that can be crossed."],["Effect on the reader","The reader feels the awkwardness and sadness of their silence."]],"th":""},{"q":"like a pair of wings settling after flight.","src":"Winter Swans, Owen Sheers","f":[["Language","The simile compares their joined hands to a swan’s wings, so the couple become like the birds they watched, united and at peace."],["Form","The poem moves from tercets into a final couplet, so the form itself becomes a pair, just as the couple reunite."],["Structure","The final line resolves the poem with reconciliation, and ‘settling’ suggests calm returning after the turbulence of conflict."],["Context","Swans are traditionally seen as symbols of fidelity because they form lasting pairs, which the partner notes in the poem."],["Poet's intention","Sheers presents romantic love as lasting and able to heal itself, often through touch rather than words."],["Effect on the reader","The reader feels relief and contentment as the couple are reunited."]],"th":""}],"pctx":["Sheers (born 1974) writes about relationships repaired after conflict.","Sheers uses swans, which mate for life, to suggest reconciliation."],"voc":{"v":[["reconciliation","restoring a relationship","The swans prompt reconciliation."],["estrangement","distance in a relationship","The couple begin in estrangement."]],"m":[["L","Simile","like a pair of wings settling after flight","Their joined hands become a symbol of peace.",1],["S","Couplets","The poem is written in couplets","Pairs of lines reflect the couple and the pairing of swans.",0],["F","Final single line","The last line stands alone","The separate line suggests calm after conflict.",0]]}},{"n":"Singh Song!","k":"Daljit Nagra","sum":"Compare with: Love’s Philosophy; The Farmer’s Bride; Before You Were Mine","quotes":[{"q":"up di stairs is my newly bride","src":"Singh Song!, Daljit Nagra","f":[["Language","The phonetic spelling of Punjabi English gives the speaker an authentic, lively voice, and ‘newly bride’ shows his delight in his new marriage."],["Form","Short lines, rhyme and a repeated refrain give the poem a song like rhythm, like a celebration of love."],["Structure","The bride is mentioned early, and the poem keeps returning upstairs to her, showing she is the centre of his attention."],["Context","Daljit Nagra was born in London to Punjabi Sikh parents. The poem comes from Look We Have Coming to Dover! (2007)."],["Poet's intention","Nagra presents romantic love as joyful and more important than work, as the speaker neglects the shop for his wife."],["Effect on the reader","The reader is amused by his eagerness to escape upstairs."]],"th":""},{"q":"she effing at my mum","src":"Singh Song!, Daljit Nagra","f":[["Language","The colloquial verb ‘effing’ shows the bride swearing at her mother in law, breaking traditional expectations of a respectful daughter in law."],["Form","Humour, rhyme and a cheerful rhythm make the family conflict feel comic rather than serious or bitter."],["Structure","This comes in a stanza celebrating the bride’s rebellious habits, which contrasts with the speaker’s duties in his father’s shop."],["Context","The poem plays with tensions in many British Asian families between traditional values and the freedoms of modern British life."],["Poet's intention","Nagra presents family relationships as lively and changing, as a new generation challenges the expectations of the old."],["Effect on the reader","The reader finds the bride’s rebellion funny and refreshing."]],"th":""},{"q":"Is priceless baby","src":"Singh Song!, Daljit Nagra","f":[["Language","The adjective ‘priceless’ shows that their love cannot be measured in money, unlike the goods with price tags in the shop below."],["Form","The playful question and answer exchange creates a dialogue between equals, showing a modern, balanced relationship."],["Structure","The poem ends with this tender moment as the couple look out at the moon, slowing the lively pace into quiet romance."],["Context","Nagra celebrates British Asian experience, blending Punjabi English with the long tradition of romantic poetry about the moon."],["Poet's intention","Nagra presents romantic love as more valuable than money, work or duty, the one thing that cannot be sold."],["Effect on the reader","The reader feels warmth and happiness at the couple’s shared joy."]],"th":""}],"pctx":["Nagra (born 1966) is a British poet of Punjabi heritage who uses ‘Punglish’.","Nagra celebrates a young couple’s love and the blending of cultures."],"voc":{"v":[["affectionate","showing love","The speaker’s affectionate tone is playful."],["rebellious","breaking expectations","The bride is rebellious, defying her role."]],"m":[["L","Phonetic dialect","up di stairs is my newly bride","The voice celebrates British Asian identity.",1],["S","Refrain","Repeated customer complaints","The repeated chorus contrasts shop duty with love.",0],["F","Song like structure","Refrains and dialogue","The poem feels like a song of joy.",0]]}},{"n":"Climbing My Grandfather","k":"Andrew Waterhouse","sum":"Compare with: Follower; Eden Rock; Before You Were Mine","quotes":[{"q":"I decide to do it free, without a rope or net.","src":"Climbing My Grandfather, Andrew Waterhouse","f":[["Language","The phrase ‘without a rope or net’ shows the grandson’s complete trust in his grandfather, needing no safety equipment at all."],["Form","One unbroken stanza of free verse mirrors a single, continuous climb from the grandfather’s feet to his head."],["Structure","The poem opens with this decision, immediately setting up the extended metaphor of the grandfather as a mountain."],["Context","Andrew Waterhouse was an environmentalist who loved the outdoors. The poem is from In (2000), which won a Forward Prize."],["Poet's intention","Waterhouse presents family relationships as trusting and adventurous, a journey towards knowing someone better."],["Effect on the reader","The reader feels the excitement of a child setting off on an adventure."]],"th":""},{"q":"the glassy ridge of a scar","src":"Climbing My Grandfather, Andrew Waterhouse","f":[["Language","The metaphor turns the scar into part of the mountain landscape, and ‘glassy’ suggests an old wound healed smooth over many years."],["Form","The present tense makes each discovery feel immediate, as if the grandson is exploring his grandfather right now."],["Structure","This comes in the middle of the climb, as the grandson moves up the arm and learns more about his grandfather’s life."],["Context","Details such as the scar and the ‘earth-stained hand.’ suggest the grandfather lived a life of hard physical work."],["Poet's intention","Waterhouse presents memory and the past as written on the grandfather’s body, a history the child can only imagine."],["Effect on the reader","The reader feels curiosity about the grandfather’s untold history."]],"th":""},{"q":"the slow pulse of his good heart.","src":"Climbing My Grandfather, Andrew Waterhouse","f":[["Language","The adjective ‘good’ celebrates the grandfather’s kindness, while ‘slow’ suggests his age and perhaps that his life is ending."],["Form","The final line slows the poem’s pace into stillness, after the energy and effort of the climb."],["Structure","The poem ends at the summit, the moment of greatest closeness, where the grandson feels the life inside his grandfather."],["Context","Waterhouse died in 2001, a year after the collection was published, which gives the ending added poignancy for readers today."],["Poet's intention","Waterhouse presents family love as deep and tender, reaching its height in a quiet moment of physical closeness."],["Effect on the reader","The reader feels warmth, admiration and a quiet sadness."]],"th":""}],"pctx":["Waterhouse (1958 to 2001) uses an extended metaphor of climbing.","Waterhouse presents the grandfather as a mountain, showing the child’s awe and love."],"voc":{"v":[["reverence","deep respect","The grandson climbs with reverence."],["intimacy","closeness","The poem explores intimacy between generations."]],"m":[["L","Extended metaphor","I decide to do it free, without a rope or net.","Climbing a mountain represents getting to know him.",1],["S","Single stanza","One continuous verse paragraph","The unbroken form mirrors the climb.",0],["F","Free verse","No regular rhyme","Freedom matches the decision to climb ‘free’.",0]]}}],"ctx9":[["Romantic love","Byron, Shelley and Barrett Browning explore passion and longing.","Romantic poets present love as overwhelming, sometimes destructively so."],["Victorian marriage","Women had few rights within marriage.","The Farmer’s Bride exposes how Victorian marriage could trap women."],["Family","Heaney, Armitage, Duffy and Day Lewis explore parents and children.","Family poems show love through small, everyday moments and letting go."],["Loss","Hardy, Causley and Byron explore endings and grief.","Loss poems use nature and memory to show how love lingers after it ends."],["Dramatic monologue","Browning uses a speaker who reveals more than he intends.","Porphyria’s Lover reveals obsession through its own speaker’s voice."],["Comparison","Compare a named poem with one other.","Grade 9 answers compare methods and context, not just ideas."]]},{"id":"pc","title":"Power and Conflict","author":"","kind":"Poetry anthology","paper":"Paper 2, Section B","col":"#37474F","ctx":[["Comparison","Question 26 compares a named poem with one other poem of your choice (30 marks)."],["Romantics","Shelley, Blake and Wordsworth celebrated nature and attacked tyranny."],["War poets","Tennyson, Owen, Hughes and Armitage show changing views of war."],["Identity","Agard, Rumens, Dharker and Garland explore identity and belonging."]],"groups":[{"n":"Ozymandias","k":"Percy Bysshe Shelley","sum":"A traveller describes a ruined statue of an arrogant king, its boast mocked by the empty desert.","quotes":[{"q":"sneer of cold command","src":"Ozymandias, Percy Bysshe Shelley","f":[["Language","The sibilance in ‘sneer’ and the harsh ‘c’ of ‘cold command’ suggest cruelty and contempt."],["Form and structure","Part of a list of facial features carved by the sculptor, framed through a second hand narrative."],["Perceptive reading","The sculptor ‘read’ the king’s passions well, so art outlives power and judges it."],["Context","Shelley was a radical Romantic who opposed tyranny and monarchy (1817)."],["Writer's intention","To show that tyrants are remembered for their cruelty."]],"th":"Power · Pride · Art"},{"q":"Look on my works, ye Mighty, and despair!","src":"Ozymandias, Percy Bysshe Shelley","f":[["Language","The imperative and exclamation show arrogance; ‘Mighty’ addresses other rulers."],["Form and structure","The boast comes just before the volta ‘Nothing beside remains’, so structure mocks it."],["Perceptive reading","Ironically, rulers should despair because their power will also crumble."],["Context","Ramesses II’s statue was being brought to Britain at the time."],["Writer's intention","To ridicule human pride."]],"th":"Power · Pride · Time"},{"q":"The lone and level sands stretch far away.","src":"Ozymandias, Percy Bysshe Shelley","f":[["Language","Alliteration of ‘lone’ and ‘level’ creates an endless, empty landscape."],["Form and structure","The final line leaves us with nature, not the king."],["Perceptive reading","Time and nature are the ultimate powers."],["Context","Romantics believed in the sublime power of nature."],["Writer's intention","To show that human power is temporary."]],"th":"Power of nature · Time · Pride"}],"pctx":["Shelley (1792 to 1822) was a radical Romantic who opposed monarchy; the poem (1818) was inspired by a statue of Ramesses II.","Shelley uses the ruined statue to warn that tyrants’ power is temporary, a dangerous message in an age of censorship."],"voc":{"v":[["transient","lasting only a short time","Shelley shows that political power is transient, worn away by time."],["hubris","excessive pride that invites downfall","The tyrant’s hubris is mocked by the empty desert around his statue."]],"m":[["L","Irony","Look on my works, ye Mighty, and despair!","The boast now stands over nothing, so the ruler’s own words condemn his arrogance.",1],["S","Framed narrative","The story reaches us through a traveller","Layers of retelling show how distant and forgotten Ozymandias has become.",0],["F","Broken sonnet","A sonnet that mixes Petrarchan and Shakespearean rhyme","The irregular rhyme scheme mirrors the shattered statue and the collapse of power.",0]]}},{"n":"London","k":"William Blake","sum":"A walk through London reveals suffering caused by those in power.","quotes":[{"q":"Marks of weakness, marks of woe","src":"London, William Blake","f":[["Language","Repetition of ‘marks’ shows suffering stamped on every face."],["Form and structure","Regular quatrains and ABAB rhyme create a relentless, marching rhythm."],["Perceptive reading","‘marks’ may also be scars left by the powerful."],["Context","Blake wrote in 1794 amid poverty and revolution in France."],["Writer's intention","To expose the misery of ordinary Londoners."]],"th":"Power · Suffering · Society"},{"q":"mind-forg’d manacles","src":"London, William Blake","f":[["Language","The metaphor suggests people are chained mentally as well as physically."],["Form and structure","Placed at the end of stanza 2, it sums up the poem’s anger."],["Perceptive reading","The chains may be self imposed, urging people to free their minds."],["Context","Blake was a radical critic of Church and state."],["Writer's intention","To encourage readers to question authority."]],"th":"Power · Control · Oppression"},{"q":"blights with plagues the Marriage hearse","src":"London, William Blake","f":[["Language","The oxymoron ‘Marriage hearse’ links life’s beginnings with death."],["Form and structure","The poem ends at ‘midnight’, its darkest point."],["Perceptive reading","Suffering passes from generation to generation."],["Context","Poverty forced young women into prostitution."],["Writer's intention","To condemn a society that destroys lives."]],"th":"Power · Corruption · Society"}],"pctx":["Blake (1757 to 1827) was a radical poet and engraver; ‘London’ (1794) appeared in Songs of Experience during the French Revolution.","Blake’s ‘mind-forg’d manacles’ suggest that the people’s oppression is both imposed and self accepted."],"voc":{"v":[["oppression","cruel and unjust control","Blake exposes the oppression of London’s poor by church, monarchy and wealth."],["institutional","relating to powerful organisations","The chimney sweep and soldier suffer at the hands of institutional power."]],"m":[["L","Metaphor","mind-forg’d manacles","People are imprisoned by their own minds, accepting the oppression around them.",1],["S","Repetition","Marks of weakness, marks of woe","Relentless repetition makes suffering inescapable on every face.",1],["F","Regular quatrains","Four stanzas in ABAB rhyme and steady metre","The rigid form mirrors the control that the city’s powers exert.",0]]}},{"n":"The Prelude (extract)","k":"William Wordsworth","sum":"A boy rows across a lake at night and is terrified by a huge mountain, changing how he sees nature.","quotes":[{"q":"an act of stealth / And troubled pleasure","src":"The Prelude (extract), William Wordsworth","f":[["Language","The oxymoron ‘troubled pleasure’ shows guilt mixed with excitement."],["Form and structure","Blank verse creates a natural, reflective voice."],["Perceptive reading","Taking the boat hints at sin, as if nature will punish him."],["Context","An autobiographical Romantic poem about childhood."],["Writer's intention","To show how nature teaches moral lessons."]],"th":"Power of nature · Guilt · Childhood"},{"q":"a huge peak, black and huge","src":"The Prelude (extract), William Wordsworth","f":[["Language","Repetition of ‘huge’ shows the boy struggling to describe the mountain."],["Form and structure","The volta turns from confidence to fear."],["Perceptive reading","The mountain becomes a living, threatening presence."],["Context","Romantics believed nature was sublime: beautiful and terrifying."],["Writer's intention","To show human insignificance before nature."]],"th":"Power of nature · Fear · Identity"},{"q":"a darkness, call it solitude / Or blank desertion","src":"The Prelude (extract), William Wordsworth","f":[["Language","‘darkness’ and ‘blank desertion’ show emptiness and confusion."],["Form and structure","Enjambment and caesura show his thoughts stumbling."],["Perceptive reading","His view of the world is permanently changed."],["Context","Wordsworth wrote about growing up in the Lake District."],["Writer's intention","To show nature’s lasting effect on the mind."]],"th":"Power of nature · Memory · Identity"}],"pctx":["Wordsworth (1770 to 1850) grew up in the Lake District; ‘The Prelude’ is an autobiographical poem about the growth of his mind.","The mountain teaches the boy humility, reflecting the Romantic belief in nature as a moral teacher."],"voc":{"v":[["sublime","awe inspiring beauty mixed with terror","The mountain is sublime, both magnificent and frightening."],["humility","a modest view of your own importance","Nature teaches the boy humility after his confident start."]],"m":[["L","Personification","a huge peak, black and huge","The repeated ‘huge’ makes the mountain seem to grow and threaten him.",1],["S","Volta","From ‘troubled pleasure’ to fear","The shift in mood mirrors his changing view of nature’s power.",0],["F","Blank verse","Unrhymed iambic pentameter","Natural rhythm suits a reflective autobiographical poem.",0]]}},{"n":"My Last Duchess","k":"Robert Browning","sum":"A Duke shows a visitor a portrait of his late wife, revealing his jealousy and that he had her killed.","quotes":[{"q":"Looking as if she were alive","src":"My Last Duchess, Robert Browning","f":[["Language","The subjunctive ‘as if’ hints she is dead."],["Form and structure","A dramatic monologue lets the Duke reveal himself."],["Perceptive reading","He prefers her as a painting he can control."],["Context","Based on Alfonso II, Duke of Ferrara (1500s)."],["Writer's intention","To expose male control over women."]],"th":"Power · Control · Gender"},{"q":"I gave commands; / Then all smiles stopped together.","src":"My Last Duchess, Robert Browning","f":[["Language","The euphemism hides murder in calm language."],["Form and structure","Caesura and enjambment create a chilling pause."],["Perceptive reading","His calm tone makes him more frightening."],["Context","Victorian wives had few legal rights."],["Writer's intention","To show the cruelty of absolute power."]],"th":"Power · Pride · Control"},{"q":"My gift of a nine-hundred-years-old name","src":"My Last Duchess, Robert Browning","f":[["Language","He values his ancient name above love."],["Form and structure","Rhyming couplets hidden by enjambment suggest control behind a casual manner."],["Perceptive reading","His pride is fragile, threatened by a smile."],["Context","Aristocrats valued lineage and status."],["Writer's intention","To criticise arrogance and status."]],"th":"Power · Pride · Status"}],"pctx":["Browning (1812 to 1889) based the poem (1842) on Alfonso II, Duke of Ferrara, whose young wife died suspiciously.","The Duke’s control over the portrait mirrors Victorian men’s legal control over their wives."],"voc":{"v":[["controlling","wanting to dominate others","The Duke is controlling, unable to bear his wife’s freedom."],["jealousy","resentment of others’ attention","Jealousy over the Duchess’s smiles drives the Duke to murder."]],"m":[["L","Euphemism","I gave commands; / Then all smiles stopped together.","A chilling murder is hidden behind calm, polite language.",1],["S","Enjambment within couplets","Rhyming couplets with lines that run on","Order is imposed on the surface, but his speech spills beyond control.",0],["F","Dramatic monologue","The Duke speaks to the Count’s envoy","He reveals more than he intends, exposing his cruelty.",0]]}},{"n":"The Charge of the Light Brigade","k":"Alfred, Lord Tennyson","sum":"A tribute to soldiers who charged to their deaths because of a mistaken order.","quotes":[{"q":"Into the valley of Death","src":"The Charge of the Light Brigade, Alfred, Lord Tennyson","f":[["Language","The metaphor links the valley to the biblical ‘valley of the shadow of death’."],["Form and structure","The repeated phrase and dactylic rhythm imitate galloping horses."],["Perceptive reading","The men ride bravely into certain death."],["Context","Written in 1854 after the Battle of Balaclava, Crimean War."],["Writer's intention","To honour the soldiers’ courage."]],"th":"Conflict · Duty · Death"},{"q":"Someone had blunder’d","src":"The Charge of the Light Brigade, Alfred, Lord Tennyson","f":[["Language","‘blunder’d’ admits a terrible mistake by commanders."],["Form and structure","This short line stands out amid the praise."],["Perceptive reading","Tennyson quietly criticises leaders while honouring soldiers."],["Context","Tennyson was Poet Laureate, writing from newspaper reports."],["Writer's intention","To question military leadership."]],"th":"Conflict · Duty · Power"},{"q":"Honour the Light Brigade","src":"The Charge of the Light Brigade, Alfred, Lord Tennyson","f":[["Language","The imperative commands readers to respect the soldiers."],["Form and structure","The final stanza turns the poem into a memorial."],["Perceptive reading","It may also turn tragedy into propaganda."],["Context","Victorian patriotism celebrated heroic sacrifice."],["Writer's intention","To create a lasting tribute."]],"th":"Conflict · Memory · Patriotism"}],"pctx":["Tennyson (1809 to 1892) was Poet Laureate; he wrote the poem in 1854 after reading of the Battle of Balaclava.","Tennyson honours the soldiers while quietly criticising the leaders who ‘blunder’d’."],"voc":{"v":[["valour","great courage in danger","Tennyson honours the soldiers’ valour despite the disaster."],["futile","pointless","The charge was futile, caused by a military blunder."]],"m":[["L","Metaphor","Into the valley of Death","The battlefield becomes a biblical valley of death, glorifying the soldiers’ sacrifice.",1],["S","Repetition and refrain","Honour the Light Brigade","The repeated lines build like a hymn of praise.",1],["F","Dactylic dimeter","A galloping rhythm","The rhythm mimics horses charging into battle.",0]]}},{"n":"Exposure","k":"Wilfred Owen","sum":"Soldiers in First World War trenches are slowly killed by the freezing weather while waiting for an attack.","quotes":[{"q":"Our brains ache, in the merciless iced east winds that knive us","src":"Exposure, Wilfred Owen","f":[["Language","Personification makes the wind an attacker; sibilance hisses like the wind."],["Form and structure","Long lines and half rhyme create unease."],["Perceptive reading","Nature is the real enemy, not the Germans."],["Context","Owen served on the Western Front in winter 1917."],["Writer's intention","To show the futility of war."]],"th":"Power of nature · Conflict · Suffering"},{"q":"But nothing happens.","src":"Exposure, Wilfred Owen","f":[["Language","The flat statement shows boredom and futility."],["Form and structure","The refrain ends stanzas, creating a cyclical structure."],["Perceptive reading","Waiting itself becomes a form of torture."],["Context","Trench warfare involved long periods of inactivity."],["Writer's intention","To challenge heroic images of war."]],"th":"Conflict · Futility · Suffering"},{"q":"All their eyes are ice","src":"Exposure, Wilfred Owen","f":[["Language","The metaphor shows soldiers frozen to death."],["Form and structure","This appears near the end, the poem’s darkest moment."],["Perceptive reading","Their humanity is lost; they become objects."],["Context","Owen was killed a week before the Armistice in 1918."],["Writer's intention","To shock readers with war’s reality."]],"th":"Conflict · Death · Nature"}],"pctx":["Owen (1893 to 1918) served on the Western Front and was killed a week before the Armistice.","Owen presents nature, not the enemy, as the killer, exposing the futility of trench warfare."],"voc":{"v":[["futility","pointlessness","Owen shows the futility of waiting in freezing trenches."],["desolation","emptiness and misery","The landscape is one of desolation."]],"m":[["L","Personification","Our brains ache, in the merciless iced east winds that knive us","The weather becomes the true enemy, attacking the soldiers.",1],["S","Refrain","But nothing happens.","The repeated line shows endless waiting and hopelessness.",1],["F","Pararhyme","Half rhymes at the ends of lines","Uneasy sounds mirror the soldiers’ discomfort and a world out of joint.",0]]}},{"n":"Storm on the Island","k":"Seamus Heaney","sum":"An island community prepares for a storm but is terrified by its power.","quotes":[{"q":"We are prepared","src":"Storm on the Island, Seamus Heaney","f":[["Language","The confident opening shows community and self reliance."],["Form and structure","Blank verse in one solid block mirrors the squat houses."],["Perceptive reading","The confidence is soon undermined."],["Context","Heaney grew up in rural Northern Ireland."],["Writer's intention","To show the limits of human preparation."]],"th":"Power of nature · Community · Fear"},{"q":"spits like a tame cat / Turned savage","src":"Storm on the Island, Seamus Heaney","f":[["Language","The simile shows something familiar becoming violent."],["Form and structure","Enjambment creates a sudden turn."],["Perceptive reading","It may symbolise conflict erupting in Northern Ireland."],["Context","Published in 1966, before the Troubles."],["Writer's intention","To show nature’s hidden violence."]],"th":"Power of nature · Conflict · Fear"},{"q":"a huge nothing that we fear","src":"Storm on the Island, Seamus Heaney","f":[["Language","The paradox shows fear of something invisible."],["Form and structure","The poem ends on fear, undermining the opening."],["Perceptive reading","‘Storm on’ may pun on Stormont, hinting at political tension."],["Context","Northern Ireland’s parliament was at Stormont."],["Writer's intention","To show fear of unseen forces."]],"th":"Power of nature · Fear · Conflict"}],"pctx":["Heaney (1939 to 2013) grew up in rural Northern Ireland; the poem was published in 1966.","The title’s pun on Stormont hints at the political storm brewing in Northern Ireland."],"voc":{"v":[["isolated","cut off from others","The islanders are isolated against the storm."],["vulnerable","exposed to harm","Their confidence gives way to feeling vulnerable."]],"m":[["L","Simile","spits like a tame cat / Turned savage","Something familiar turns hostile, showing nature’s unpredictable power.",1],["S","Shift from confidence to fear","We are prepared … a huge nothing that we fear","The poem moves from certainty to fear of an invisible force.",0],["F","Blank verse","Unrhymed iambic pentameter","The conversational voice reflects a community talking together.",0]]}},{"n":"Bayonet Charge","k":"Ted Hughes","sum":"A soldier charges across a field in the First World War, his patriotism replaced by terror.","quotes":[{"q":"Suddenly he awoke and was running","src":"Bayonet Charge, Ted Hughes","f":[["Language","The adverb ‘Suddenly’ throws the reader into the action."],["Form and structure","Opening in medias res creates confusion."],["Perceptive reading","He ‘awoke’ from patriotic illusions."],["Context","Hughes’s father fought at Gallipoli."],["Writer's intention","To show the shock of real combat."]],"th":"Conflict · Fear · Reality of war"},{"q":"King, honour, human dignity, etcetera / Dropped like luxuries","src":"Bayonet Charge, Ted Hughes","f":[["Language","‘etcetera’ dismisses patriotic ideals as meaningless."],["Form and structure","The list collapses under enjambment."],["Perceptive reading","Survival instinct replaces patriotism."],["Context","Published in 1957, questioning war propaganda."],["Writer's intention","To show patriotism as a lie in battle."]],"th":"Conflict · Patriotism · Identity"},{"q":"yellow hare that rolled like a flame","src":"Bayonet Charge, Ted Hughes","f":[["Language","The image of a burning animal shows innocent suffering."],["Form and structure","The middle stanza freezes time."],["Perceptive reading","The hare reflects the soldier’s own terror."],["Context","War affects nature as well as people."],["Writer's intention","To show war’s destruction of innocence."]],"th":"Conflict · Suffering · Nature"}],"pctx":["Hughes (1930 to 1998) was influenced by his father’s experiences at Gallipoli; published 1957.","Hughes strips away patriotic ideals to show a soldier reduced to animal instinct."],"voc":{"v":[["disorientation","confusion about where you are","The soldier’s disorientation is shown as he runs without understanding why."],["patriotism","love and loyalty to your country","Patriotic ideals disappear in the terror of battle."]],"m":[["L","Simile","yellow hare that rolled like a flame","The suffering hare shows the destruction of innocent nature.",1],["S","In medias res","Suddenly he awoke and was running","Starting in the middle of action plunges the reader into chaos.",1],["F","Free verse with enjambment","Irregular lines that run on","The broken form mirrors the soldier’s panic.",0]]}},{"n":"Remains","k":"Simon Armitage","sum":"A soldier recalls shooting a looter and cannot escape the memory.","quotes":[{"q":"probably armed, possibly not","src":"Remains, Simon Armitage","f":[["Language","The adverbs show uncertainty and guilt."],["Form and structure","Casual spoken language makes it feel like an interview."],["Perceptive reading","The soldier cannot know if the killing was justified."],["Context","Based on interviews with soldiers with PTSD (The Not Dead, 2008)."],["Writer's intention","To show the moral grey areas of war."]],"th":"Guilt · Conflict · Memory"},{"q":"his bloody life in my bloody hands","src":"Remains, Simon Armitage","f":[["Language","‘bloody’ is a swear word and literal blood."],["Form and structure","The final line echoes Lady Macbeth’s guilt."],["Perceptive reading","He takes full responsibility for the death."],["Context","Modern conflicts in Iraq."],["Writer's intention","To show the lasting psychological impact of war."]],"th":"Guilt · Memory · Conflict"},{"q":"he’s here in my head when I close my eyes","src":"Remains, Simon Armitage","f":[["Language","The present tense shows the memory is still with him."],["Form and structure","The shift from ‘we’ to ‘I’ shows personal guilt."],["Perceptive reading","The war has followed him home."],["Context","PTSD causes flashbacks and nightmares."],["Writer's intention","To show conflict never truly ends."]],"th":"Memory · Trauma · Guilt"}],"pctx":["Armitage (born 1963) based the poem on interviews with soldiers for ‘The Not Dead’ (2008).","Armitage shows that post traumatic stress keeps conflict alive long after soldiers return home."],"voc":{"v":[["trauma","deep emotional shock","The soldier’s trauma replays the killing again and again."],["culpability","responsibility for wrongdoing","He cannot escape his sense of culpability."]],"m":[["L","Colloquial language","probably armed, possibly not","The casual tone makes the uncertainty of the killing more disturbing.",1],["S","Shift from past to present","he’s here in my head when I close my eyes","The move to present tense shows the memory still haunts him.",1],["F","Dramatic monologue","Based on a soldier’s testimony","The real voice gives the poem authenticity.",0]]}},{"n":"Poppies","k":"Jane Weir","sum":"A mother describes her son leaving home to join the army and her grief afterwards.","quotes":[{"q":"I pinned one onto your lapel","src":"Poppies, Jane Weir","f":[["Language","The poppy symbolises remembrance and foreshadows loss."],["Form and structure","Free verse and long sentences sound like spoken memory."],["Perceptive reading","The pin may hint at pain and danger."],["Context","Written in 2009 for a collection about conflict."],["Writer's intention","To show war’s effect on families."]],"th":"Loss · Memory · Conflict"},{"q":"my stomach busy / making tucks, darts, pleats","src":"Poppies, Jane Weir","f":[["Language","Sewing imagery shows anxiety hidden in domestic routine."],["Form and structure","The list conveys nervous movement."],["Perceptive reading","Weir was a textile designer, so the imagery reflects her life."],["Context","Mothers’ experiences of war are often unseen."],["Writer's intention","To present war from the home front."]],"th":"Loss · Motherhood · Fear"},{"q":"hoping to hear / your playground voice catching on the wind","src":"Poppies, Jane Weir","f":[["Language","‘playground voice’ shows she still sees him as a child."],["Form and structure","The poem ends without resolution."],["Perceptive reading","She may be grieving a death or simply his absence."],["Context","Remembrance traditions honour the dead."],["Writer's intention","To show the pain of loss."]],"th":"Loss · Memory · Grief"}],"pctx":["Weir (born 1963) is a poet and textile designer; the poem was commissioned in 2009 about modern conflict.","Weir presents war through a mother’s grief, revealing the hidden cost of conflict at home."],"voc":{"v":[["grief","deep sorrow after loss","The mother’s grief is quiet and domestic."],["apprehension","anxious fear about the future","Her apprehension as her son leaves is shown through small actions."]],"m":[["L","Semantic field of sewing","making tucks, darts, pleats","Domestic imagery shows the mother trying to hold her emotions together.",1],["S","Enjambment","Long, flowing lines across stanzas","The run on lines mirror memories spilling into one another.",0],["F","Free verse","No regular rhyme or metre","The loose form reflects grief that cannot be controlled.",0]]}},{"n":"War Photographer","k":"Carol Ann Duffy","sum":"A photographer develops his pictures of war at home, reflecting on how little the public cares.","quotes":[{"q":"spools of suffering set out in ordered rows","src":"War Photographer, Carol Ann Duffy","f":[["Language","Sibilance and alliteration create a calm, careful tone."],["Form and structure","Regular stanzas reflect his control."],["Perceptive reading","Rows recall war graves."],["Context","Duffy was inspired by photographers Don McCullin and Philip Jones Griffiths."],["Writer's intention","To show the photographer’s burden."]],"th":"Conflict · Memory · Suffering"},{"q":"All flesh is grass","src":"War Photographer, Carol Ann Duffy","f":[["Language","The biblical quotation shows life is short."],["Form and structure","It links his work to religious ritual."],["Perceptive reading","Death is universal and unavoidable."],["Context","Published in 1985."],["Writer's intention","To show the fragility of life."]],"th":"Conflict · Death · Religion"},{"q":"The reader’s eyeballs prick / with tears between the bath and pre-lunch beers","src":"War Photographer, Carol Ann Duffy","f":[["Language","‘prick’ suggests brief, shallow emotion."],["Form and structure","Rhyming couplet makes the indifference sound casual."],["Perceptive reading","Readers care only briefly before returning to comfort."],["Context","Sunday newspapers printed war photographs."],["Writer's intention","To criticise public indifference."]],"th":"Conflict · Indifference · Power"}],"pctx":["Duffy (born 1955), former Poet Laureate, was inspired by war photographers Don McCullin and Philip Jones Griffiths.","Duffy criticises a public whose ‘eyeballs prick’ only briefly before returning to comfort."],"voc":{"v":[["detachment","emotional distance","The photographer struggles to keep his detachment."],["indifference","lack of concern","Duffy criticises the public’s indifference to suffering."]],"m":[["L","Sibilance","spools of suffering set out in ordered rows","Soft sounds contrast with the horror, and ‘ordered rows’ recalls graves.",1],["S","Regular stanzas","Four six line stanzas","The neat structure mirrors the ordered rows of photographs.",0],["F","Third person narration","The photographer is described from outside","Distance mirrors his professional detachment.",0]]}},{"n":"Tissue","k":"Imtiaz Dharker","sum":"Thin paper, from maps to receipts, becomes a symbol of the fragility of power and human life.","quotes":[{"q":"Paper that lets the light / shine through","src":"Tissue, Imtiaz Dharker","f":[["Language","Light symbolises hope and truth."],["Form and structure","Free verse and enjambment flow like thin paper."],["Perceptive reading","Paper’s fragility shows human structures can change."],["Context","Dharker grew up in Glasgow and writes about identity."],["Writer's intention","To show power is fragile."]],"th":"Power · Identity · Fragility"},{"q":"fine slips from grocery shops","src":"Tissue, Imtiaz Dharker","f":[["Language","Receipts show how money controls lives."],["Form and structure","Everyday objects build an extended metaphor."],["Perceptive reading","Even small things can record lives."],["Context","Modern consumer society."],["Writer's intention","To question materialism."]],"th":"Power · Society · Identity"},{"q":"turned into your skin","src":"Tissue, Imtiaz Dharker","f":[["Language","The final line links paper to human life."],["Form and structure","The single line ending stands alone."],["Perceptive reading","Humans are as fragile as tissue."],["Context","Dharker values humanity over power."],["Writer's intention","To show the value of human life."]],"th":"Identity · Fragility · Power"}],"pctx":["Dharker (born 1954 in Pakistan) grew up in Glasgow and writes about identity and borders.","Dharker suggests that human structures of power are as fragile as paper."],"voc":{"v":[["fragility","being easily broken","Tissue paper symbolises the fragility of human life and power."],["impermanence","not lasting forever","Dharker suggests that borders and buildings are impermanent."]],"m":[["L","Extended metaphor","Paper that lets the light / shine through","Paper represents life as delicate yet open to light.",1],["S","Final isolated line","turned into your skin","The single line turns paper into the human body, a moving final image.",1],["F","Unrhymed quatrains","Loose four line stanzas","The light form mirrors the thinness of paper.",0]]}},{"n":"The Émigrée","k":"Carol Rumens","sum":"A speaker remembers the city she left as a child, which she still loves despite its conflict.","quotes":[{"q":"sunlight-clear","src":"The Émigrée, Carol Rumens","f":[["Language","Light imagery shows her positive memory of the city."],["Form and structure","The refrain of ‘sunlight’ ends each stanza."],["Perceptive reading","Her memory may be idealised by childhood."],["Context","Rumens writes about exile and displacement."],["Writer's intention","To show memory’s power."]],"th":"Identity · Memory · Place"},{"q":"My city takes me dancing","src":"The Émigrée, Carol Rumens","f":[["Language","Personification makes the city a loving companion."],["Form and structure","The poem moves from past to present."],["Perceptive reading","The city lives inside her."],["Context","Many people are forced from their homelands."],["Writer's intention","To show attachment to place."]],"th":"Identity · Belonging · Place"},{"q":"They accuse me of being dark in their free city","src":"The Émigrée, Carol Rumens","f":[["Language","‘They’ suggests a hostile new society."],["Form and structure","The final stanza shows threat."],["Perceptive reading","She is an outsider in her new home."],["Context","Refugees often face hostility."],["Writer's intention","To show the pain of displacement."]],"th":"Identity · Conflict · Belonging"}],"pctx":["Rumens (born 1944) writes about exile and displacement.","The speaker’s ‘sunlight-clear’ memories show that home can survive in the mind despite conflict."],"voc":{"v":[["nostalgia","longing for the past","The speaker’s nostalgia for her city stays bright."],["exile","being forced to live away from home","She lives in exile in a ‘free city’ that rejects her."]],"m":[["L","Personification","My city takes me dancing","The city becomes a lover or companion, showing emotional attachment.",1],["S","Repeated ending image","The word ‘sunlight’ ends each stanza","Repetition keeps the hopeful memory alive.",0],["F","Free verse","Irregular stanzas","The loose form reflects memory and uncertainty.",0]]}},{"n":"Kamikaze","k":"Beatrice Garland","sum":"A Japanese pilot turns back from his suicide mission and is rejected by his family.","quotes":[{"q":"a samurai sword","src":"Kamikaze, Beatrice Garland","f":[["Language","The sword symbolises honour and tradition."],["Form and structure","Third person narration creates distance."],["Perceptive reading","He is weighed down by expectations."],["Context","Kamikaze pilots in the Second World War."],["Writer's intention","To show the pressure of duty."]],"th":"Conflict · Duty · Identity"},{"q":"flashing silver as their bellies / swivelled towards the sun","src":"Kamikaze, Beatrice Garland","f":[["Language","Natural imagery shows the beauty of life."],["Form and structure","Enjambment mirrors fish moving."],["Perceptive reading","Nature reminds him of life’s value."],["Context","Japanese culture valued honour."],["Writer's intention","To show life is worth more than duty."]],"th":"Nature · Identity · Conflict"},{"q":"he must have wondered / which had been the better way to die","src":"Kamikaze, Beatrice Garland","f":[["Language","The ending is ambiguous."],["Form and structure","The final line reflects on his choice."],["Perceptive reading","Living as an outcast was a kind of death."],["Context","Families shunned those who returned."],["Writer's intention","To show the cost of choosing life."]],"th":"Conflict · Identity · Guilt"}],"pctx":["Garland (born 1950) writes about Japanese kamikaze pilots of the Second World War.","Garland shows the pilot’s choice of life brought social death, questioning ideas of honour."],"voc":{"v":[["dishonour","loss of respect","The pilot’s return brings dishonour on his family."],["ostracised","excluded from a group","His family ostracise him after he turns back."]],"m":[["L","Natural imagery","flashing silver as their bellies / swivelled towards the sun","The beauty of the fish reminds him of life, so he turns back.",1],["S","Shift in narrative voice","The daughter’s account moves to direct speech","Layers of storytelling distance us from the pilot.",0],["F","Regular sestets","Six line stanzas","The controlled form contrasts with his rebellion.",0]]}},{"n":"Checking Out Me History","k":"John Agard","sum":"A speaker attacks the British history he was taught and celebrates Black and Caribbean figures.","quotes":[{"q":"Dem tell me","src":"Checking Out Me History, John Agard","f":[["Language","Repetition shows control by those in power."],["Form and structure","Nation language rejects Standard English."],["Perceptive reading","‘Dem’ suggests authorities controlling education."],["Context","Agard was born in Guyana."],["Writer's intention","To challenge Eurocentric education."]],"th":"Identity · Power · Culture"},{"q":"Bandage up me eye with me own history","src":"Checking Out Me History, John Agard","f":[["Language","The metaphor shows history being hidden."],["Form and structure","Contrasting sections switch between British and Caribbean figures."],["Perceptive reading","Ignorance is imposed deliberately."],["Context","Colonial education ignored Black history."],["Writer's intention","To expose bias in history."]],"th":"Identity · Power · Culture"},{"q":"I carving out me identity","src":"Checking Out Me History, John Agard","f":[["Language","‘carving’ suggests effort and permanence."],["Form and structure","The poem ends with self determination."],["Perceptive reading","He creates his own identity."],["Context","Black history movements reclaimed identity."],["Writer's intention","To celebrate resistance."]],"th":"Identity · Culture · Resistance"}],"pctx":["Agard (born 1949) moved from Guyana to Britain in 1977 and challenges colonial education.","Agard uses nation language to reclaim the Black history that colonial schooling erased."],"voc":{"v":[["defiance","open resistance","The speaker’s defiance challenges the history he was taught."],["eurocentric","focused on Europe and white history","Agard attacks a eurocentric curriculum."]],"m":[["L","Metaphor","Bandage up me eye with me own history","Education has blinded him to his own heritage.",1],["S","Contrasting stanzas","British and Caribbean figures alternate","Different layouts separate the two histories.",0],["F","Caribbean dialect","Dem tell me","The phonetic voice rejects standard English and asserts identity.",1]]}}],"ctx9":[["Romantic poets","Shelley, Blake and Wordsworth celebrated nature and attacked tyranny.","The Romantics present nature as more powerful than any human ruler."],["War poetry","From Tennyson’s patriotism to Owen’s horror and Armitage’s trauma.","The cluster charts a shift from glorifying war to exposing its psychological cost."],["Identity and empire","Agard, Rumens, Dharker and Garland explore culture and belonging.","Poets such as Agard challenge the version of history imposed by empire."],["Power of nature","Nature overwhelms human power in several poems.","Heaney’s storm and Shelley’s desert both reduce human power to nothing."],["Memory","Many poems explore how conflict lingers.","Remains and Poppies show that conflict continues in memory long after it ends."],["Comparison","Question 26 compares a named poem with one other.","Grade 9 answers compare methods and context, not just ideas."]]},{"id":"wl","title":"Worlds and Lives","author":"","kind":"Poetry anthology","paper":"Paper 2, Section B","col":"#0D47A1","ctx":[["Comparison","Compare a named poem with one other poem of your choice (30 marks)."],["Identity and belonging","Migration, names, accents and heritage."],["Nature","From Romantic faith to environmental damage."],["Power and injustice","Monarchy, colonialism, racism and inequality."]],"groups":[{"n":"Lines Written in Early Spring","k":"William Wordsworth","sum":"A Romantic poet who saw nature as holy and morally good. Published in Lyrical Ballads (1798) as the French Revolution turned to violence and the Industrial Revolution spread.","quotes":[{"q":"To her fair works did Nature link / The human soul that through me ran","src":"Lines Written in Early Spring, William Wordsworth","f":[["Language","Personifying ‘Nature’ as a female creator with ‘fair works’ makes her nurturing and beautiful, while ‘link’ suggests humans are naturally bound to her."],["Form and structure","The enjambment runs across the line just as the ‘soul… ran’ through him, so the form enacts the connection between human and natural worlds."],["Perceptive reading","Perceptively, ‘through me ran’ suggests the soul is not owned but shared; Wordsworth feels part of something larger, which makes human selfishness seem unnatural."],["Context","Romantics rejected industrial, rational society and believed nature revealed God; Wordsworth wrote while Britain feared revolution and war with France."],["Writer's intention","Wordsworth wants readers to feel their spiritual bond with nature, so that cruelty to one another feels like a betrayal of it."]],"th":"Nature and humanity · Identity and belonging · Faith"},{"q":"every flower / Enjoys the air it breathes","src":"Lines Written in Early Spring, William Wordsworth","f":[["Language","The verb ‘Enjoys’ personifies the flower with feelings, suggesting even the smallest part of nature experiences happiness."],["Form and structure","Placed within the regular quatrains and steady rhyme, the image feels calm and certain, a statement of ‘faith’ rather than fact."],["Perceptive reading","It may also imply criticism: if flowers can enjoy simply breathing, why are humans, with so much more, unable to live in joy and peace?"],["Context","Romantic pantheism saw God present throughout nature; Wordsworth calls it ‘my faith’, a personal religion rooted in the natural world."],["Writer's intention","He encourages readers to slow down and notice nature’s joy, presenting it as a moral model for human life."]],"th":"Nature · Faith · Happiness and contentment"},{"q":"Have I not reason to lament / What man has made of man?","src":"Lines Written in Early Spring, William Wordsworth","f":[["Language","The verb ‘lament’ conveys grief, and the repetition of ‘man’ shows humans as both the cause and the victim of suffering."],["Form and structure","The refrain returns from stanza 1, but now as a rhetorical question, so the cyclical structure turns sadness into an accusation."],["Perceptive reading","The question is left unanswered, implying humanity still has a choice: if man has ‘made’ this world, man can remake it."],["Context","In the 1790s, poverty, the slave trade and the violence of the French Revolution showed human cruelty on a vast scale."],["Writer's intention","Wordsworth wants readers to question society and recognise their responsibility for the suffering humans cause one another."]],"th":"Power and injustice · Human cruelty · Nature versus humanity"}],"pctx":["A Romantic poet who saw nature as holy and morally good. Published in Lyrical Ballads (1798) as the French Revolution turned to violence and the Industrial Revolution spread.","Writing as revolution turned violent and industry spread, Wordsworth contrasts nature’s joy with ‘What man has made of man’, urging readers to reconnect with nature’s moral harmony."],"voc":{"v":[["harmony","peaceful agreement","Wordsworth presents nature living in perfect harmony."],["lament","to express grief or sorrow","The speaker laments the cruelty humans inflict on each other."]],"m":[["L","Personification","every flower / Enjoys the air it breathes","Nature is shown as joyful and alive.",1],["S","Refrain","What man has made of man","The returning line turns sadness into an accusation.",1],["F","Regular quatrains","Steady rhyme and metre","The calm form reflects his faith in nature’s order.",0]]}},{"n":"England in 1819","k":"Percy Bysshe Shelley","sum":"A radical Romantic who opposed monarchy and the Church. Written after the Peterloo Massacre (1819); too dangerous to publish until 1839.","quotes":[{"q":"leech-like to their fainting country cling","src":"England in 1819, Percy Bysshe Shelley","f":[["Language","The simile ‘leech-like’ presents the royal princes as parasites draining the nation’s lifeblood; ‘fainting’ personifies England as weak and dying."],["Form and structure","The inverted word order delays the verb ‘cling’ to the end of the line, mimicking how they hang on to power and privilege."],["Perceptive reading","A leech eventually drops off when full, perhaps hinting that their parasitic rule cannot last forever."],["Context","The Prince Regent and his brothers were famous for extravagance and debt while ordinary people starved after the Napoleonic Wars."],["Writer's intention","Shelley wants readers to feel disgust at the ruling class and see them as harmful rather than noble."]],"th":"Power and injustice · Inequality · Class"},{"q":"Rulers who neither see, nor feel, nor know","src":"England in 1819, Percy Bysshe Shelley","f":[["Language","The verbs of perception show rulers who are blind, numb and ignorant of their people’s suffering."],["Form and structure","Polysyndeton with ‘neither… nor… nor’ piles up their failures, and the regular iambic rhythm gives the line the force of a verdict."],["Perceptive reading","Perceptively, rulers who cannot ‘feel’ are presented as less than human, reversing the idea that kings are chosen by God."],["Context","George III was old, blind and mentally ill; the government had just used soldiers against a peaceful crowd at Peterloo."],["Writer's intention","Shelley exposes a government detached from its people to provoke anger and a desire for reform."]],"th":"Power · Injustice · Protest"},{"q":"a glorious Phantom may / Burst, to illumine our tempestuous day","src":"England in 1819, Percy Bysshe Shelley","f":[["Language","‘glorious Phantom’ suggests a powerful spirit of freedom or revolution, and ‘illumine’ brings light after the poem’s darkness."],["Form and structure","The sonnet is one long sentence that builds to this final couplet; the turn from corruption to hope works like a volta."],["Perceptive reading","The modal verb ‘may’ makes the hope uncertain: change is possible, but only if people act to bring it about."],["Context","Shelley supported revolutionary ideals of liberty and believed poets could inspire political change."],["Writer's intention","He wants to leave readers with hope, inspiring them to believe a fairer society can rise from the ‘graves’ of the old one."]],"th":"Hope and resistance · Power · Change"}],"pctx":["A radical Romantic who opposed monarchy and the Church. Written after the Peterloo Massacre (1819); too dangerous to publish until 1839.","Written after the Peterloo Massacre, Shelley’s sonnet was too dangerous to publish until 1839, showing how fiercely those in power silenced criticism."],"voc":{"v":[["corruption","dishonest use of power","Shelley exposes the corruption of the monarchy and Church."],["tyranny","cruel and absolute rule","The sonnet attacks the tyranny of rulers after Peterloo."]],"m":[["L","Simile","leech-like to their fainting country cling","The princes are parasites draining the nation’s lifeblood.",1],["S","Final couplet as a turn","a glorious Phantom may / Burst","The poem turns from corruption to hope of revolution.",1],["F","Sonnet","One long sentence in fourteen lines","A love form is used for political anger, building to the final hope.",0]]}},{"n":"Shall earth no more inspire thee","k":"Emily Brontë","sum":"Brontë lived in Haworth on the Yorkshire moors, which she loved. She wrote in the Romantic tradition, often about nature and the imagination.","quotes":[{"q":"Thou lonely dreamer","src":"Shall earth no more inspire thee, Emily Brontë","f":[["Language","Nature addresses the listener tenderly with the archaic ‘Thou’; ‘lonely dreamer’ suggests someone who has withdrawn into their imagination."],["Form and structure","The poem is a dramatic monologue spoken by Nature, so the reader hears nature’s voice directly, which is unusual and intimate."],["Perceptive reading","‘Dreamer’ may be Brontë herself, whose rich imaginary worlds sometimes cut her off from real life."],["Context","Brontë and her siblings created the imaginary world of Gondal; she was shy and happiest on the moors."],["Writer's intention","Brontë presents nature as a caring presence that notices loneliness and offers belonging."]],"th":"Nature · Belonging · Isolation"},{"q":"fond idolatry","src":"Shall earth no more inspire thee, Emily Brontë","f":[["Language","‘idolatry’ means worshipping something other than God, so nature admits the dreamer once loved it almost religiously; ‘fond’ softens it with affection."],["Form and structure","Nature speaks of the past to remind the listener of a lost bond, creating a nostalgic, persuasive tone."],["Perceptive reading","The word is bold for a clergyman’s daughter: it suggests nature, not the Church, may be the true source of spiritual fulfilment."],["Context","Brontë’s father was a clergyman; Victorian society expected devotion to God rather than nature."],["Writer's intention","She challenges conventional faith by presenting the natural world as worthy of devotion."]],"th":"Nature · Faith · Identity"},{"q":"Yet few would ask a heaven / More like this earth than thine","src":"Shall earth no more inspire thee, Emily Brontë","f":[["Language","Comparing ‘heaven’ and ‘earth’ suggests the listener’s idea of paradise is simply the natural world."],["Form and structure","The regular abab quatrains and gentle rhythm make nature’s argument sound calm and persuasive, like a lullaby."],["Perceptive reading","Perceptively, it suggests heaven is not elsewhere but here; belonging comes from the land we love."],["Context","Romantic writers often found the divine in landscape; the Yorkshire moors were central to Brontë’s identity."],["Writer's intention","Brontë encourages readers to find comfort and meaning in the natural world around them."]],"th":"Nature · Place and belonging · Faith"}],"pctx":["Brontë lived in Haworth on the Yorkshire moors, which she loved. She wrote in the Romantic tradition, often about nature and the imagination.","Brontë, who drew comfort from the Yorkshire moors, gives Nature a voice to suggest that belonging can be found in the land rather than in society."],"voc":{"v":[["solace","comfort in sadness","Nature offers the lonely dreamer solace."],["idolatry","worship of something other than God","Nature recalls the dreamer’s ‘fond idolatry’ of the earth."]],"m":[["L","Direct address","Thou lonely dreamer","Nature speaks tenderly, like a lover pleading for return.",1],["S","Persuasive questions","Nature appeals to the dreamer","The questions build a gentle argument for return.",0],["F","Dramatic monologue by Nature","abab quatrains","Giving nature a voice makes its plea intimate and calm, like a lullaby.",0]]}},{"n":"In a London Drawingroom","k":"George Eliot","sum":"George Eliot was the pen name of Mary Ann Evans, a Victorian novelist who used a male name to be taken seriously. London was crowded and choked with coal smoke.","quotes":[{"q":"The sky is cloudy, yellowed by the smoke","src":"In a London Drawingroom, George Eliot","f":[["Language","‘yellowed’ suggests the sky is stained and sickly, polluted by industry rather than naturally beautiful."],["Form and structure","The poem opens in the present tense with a flat statement, establishing a dull, unchanging scene."],["Perceptive reading","Even the sky, a traditional symbol of freedom and heaven, has been spoiled, suggesting there is no escape."],["Context","Victorian London burned huge amounts of coal, producing smog that darkened the city."],["Writer's intention","Eliot wants readers to see how industrial progress has damaged both the environment and quality of life."]],"th":"Place · Industry and pollution · Loss of nature"},{"q":"Like solid fog","src":"In a London Drawingroom, George Eliot","f":[["Language","The simile describes the houses as ‘solid fog’, an oxymoron that makes them oppressive and suffocating."],["Form and structure","Written in blank verse, unrhymed and unbroken by stanzas, the form feels as monotonous as the city it describes."],["Perceptive reading","Fog usually hides things; here the buildings themselves block the view, suggesting a city that shuts out imagination."],["Context","Rapid urban growth created long rows of identical terraced housing."],["Writer's intention","Eliot presents the city as a place that crushes individuality and beauty."]],"th":"Place · Monotony · Identity"},{"q":"Where men are punished at the slightest cost","src":"In a London Drawingroom, George Eliot","f":[["Language","‘punished’ presents city life as a prison sentence, and ‘slightest cost’ suggests suffering inflicted cheaply."],["Form and structure","The poem ends on this image of a prison, so the structure moves from a grey view to a grim conclusion about human life."],["Perceptive reading","It may criticise capitalism: people are kept alive as cheaply as possible, valued only as workers."],["Context","Victorian workers endured long hours and poverty; prisons and workhouses were designed to be harsh."],["Writer's intention","Eliot wants readers to recognise the joyless, imprisoning nature of modern industrial life."]],"th":"Power and inequality · Place · Loss of joy"}],"pctx":["George Eliot was the pen name of Mary Ann Evans, a Victorian novelist who used a male name to be taken seriously. London was crowded and choked with coal smoke.","Writing as Mary Ann Evans under a male pen name, Eliot presents the industrial city as a grey prison, perhaps reflecting the confinement she felt in Victorian society."],"voc":{"v":[["monotony","dull sameness","Eliot presents the city’s monotony as stifling."],["oppressive","heavy and suffocating","The smoke creates an oppressive atmosphere."]],"m":[["L","Imagery of colour","The sky is cloudy, yellowed by the smoke","‘yellowed’ makes the sky look stained and sickly.",1],["S","No stanza breaks","One block of lines","The unbroken shape mirrors the endless, unchanging city.",0],["F","Blank verse","Unrhymed iambic pentameter","The monotonous form matches the dull city.",0]]}},{"n":"On an Afternoon Train from Purley to Victoria, 1955","k":"James Berry","sum":"Berry came to Britain from Jamaica in 1948 as part of the Windrush generation, invited to help rebuild post war Britain but often met with ignorance and racism.","quotes":[{"q":"So sincere she was beautiful","src":"On an Afternoon Train from Purley to Victoria, 1955, James Berry","f":[["Language","The adjective ‘sincere’ shows the woman means well, and the speaker generously finds her ‘beautiful’ because of it."],["Form and structure","The short, plain sentence stands out, reflecting the speaker’s warmth before her ignorance is revealed."],["Perceptive reading","The line is double edged: her sincerity makes her prejudice harder to challenge, because she does not realise it."],["Context","Many white Britons in the 1950s knew little about the Caribbean or the Commonwealth citizens arriving."],["Writer's intention","Berry shows that prejudice can be quiet and well meaning, not only hostile."]],"th":"Identity · Prejudice · Kindness"},{"q":"father’s big banana field","src":"On an Afternoon Train from Purley to Victoria, 1955, James Berry","f":[["Language","The image of home is warm and specific, connecting the speaker’s identity to family, land and heritage."],["Form and structure","The speaker’s memories contrast with the grey English setting, creating a structural shift between two worlds."],["Perceptive reading","It may play with the woman’s stereotypes, giving her the exotic picture she expects while keeping his deeper self private."],["Context","Windrush migrants carried strong memories of Caribbean homes and families."],["Writer's intention","Berry celebrates the richness of Caribbean identity against British ignorance."]],"th":"Home · Heritage · Identity"},{"q":"Ireland is near Lapland","src":"On an Afternoon Train from Purley to Victoria, 1955, James Berry","f":[["Language","The speaker’s response mirrors the woman’s confusion about geography, using humour to expose her ignorance."],["Form and structure","Dialogue is presented without speech marks, blending voices and keeping the tone light and conversational."],["Perceptive reading","His gentle irony is a form of quiet resistance, allowing him to keep his dignity without confrontation."],["Context","Windrush migrants often faced being treated as foreign or exotic despite being British citizens."],["Writer's intention","Berry uses humour to reveal prejudice and invite readers to laugh at ignorance rather than accept it."]],"th":"Identity · Prejudice · Belonging"}],"pctx":["Berry came to Britain from Jamaica in 1948 as part of the Windrush generation, invited to help rebuild post war Britain but often met with ignorance and racism.","As a Windrush migrant invited to rebuild Britain, Berry exposes the quiet ignorance that made Caribbean citizens feel like outsiders."],"voc":{"v":[["ignorance","lack of knowledge","The woman’s ignorance about Jamaica is gently exposed."],["sincerity","honesty and genuine feeling","Her sincerity makes the speaker generous towards her."]],"m":[["L","Humour and irony","Ireland is near Lapland","The speaker mirrors her confusion to expose ignorance lightly.",1],["S","A single encounter","A conversation on one train journey","One meeting captures the experience of the Windrush generation.",0],["F","Dialogue without speech marks","Voices blend in the lines","The conversational form keeps the tone warm and natural.",0]]}},{"n":"Name Journeys","k":"Raman Mundair","sum":"Mundair was born in India and moved to Manchester as a child. The poem draws on Hindu stories of Rama and Sita and explores how migration changed her name and identity.","quotes":[{"q":"spiritual sari-sisters entwined / in an infinite silk","src":"Name Journeys, Raman Mundair","f":[["Language","The sibilance creates a soft, flowing sound, and ‘entwined’ suggests an unbreakable bond between women across generations."],["Form and structure","The enjambment flows across the line like silk, so the form enacts the continuity of heritage."],["Perceptive reading","‘infinite’ suggests her identity is connected to something timeless and sacred, beyond the reach of migration."],["Context","Saris and the story of Sita connect her to Indian, Hindu culture and female ancestors."],["Writer's intention","Mundair celebrates the beauty and strength of her cultural heritage."]],"th":"Heritage · Identity · Family"},{"q":"infertile English soil","src":"Name Journeys, Raman Mundair","f":[["Language","‘infertile’ suggests England offered no nourishment for her identity to grow."],["Form and structure","The metaphor continues the imagery of plants and roots, structurally contrasting India’s richness with England’s barrenness."],["Perceptive reading","It may also criticise British society for failing to value the cultures that migrants brought with them."],["Context","Many South Asian families who came to Britain in the 1960s and 70s faced racism and pressure to assimilate."],["Writer's intention","Mundair shows the pain of being uprooted into a culture that does not nurture you."]],"th":"Migration · Belonging · Place"},{"q":"a stumble / that filled English mouths","src":"Name Journeys, Raman Mundair","f":[["Language","Her name becomes ‘a stumble’, an awkward obstacle in English speech, showing how her identity was mispronounced and diminished."],["Form and structure","The enjambment creates a pause, so the line itself stumbles, enacting the experience."],["Perceptive reading","The name ‘filled’ English mouths, which may suggest it is too rich and large for English to contain."],["Context","Children of migrants often had names anglicised or mispronounced in school."],["Writer's intention","Mundair wants readers to recognise how names carry identity and history."]],"th":"Identity · Language · Belonging"}],"pctx":["Mundair was born in India and moved to Manchester as a child. The poem draws on Hindu stories of Rama and Sita and explores how migration changed her name and identity.","Mundair shows how migration to England reshaped her name and identity, while her Hindu heritage remains a source of strength."],"voc":{"v":[["heritage","traditions passed through generations","Mundair connects her name to her Indian heritage."],["diminished","made smaller or less important","In England her name is diminished to ‘a stumble’."]],"m":[["L","Sibilance","spiritual sari-sisters entwined / in an infinite silk","Soft sounds create the flowing bond between generations of women.",1],["S","Journey structure","From India to England","The poem traces her name’s journey across places and time.",0],["F","Enjambment","a stumble / that filled English mouths","The line itself stumbles, enacting the mispronunciation.",1]]}},{"n":"pot","k":"shamshad khan","sum":"khan is a British poet of Pakistani heritage. The speaker addresses a pot taken from its home and displayed in a British museum, linking it to her own sense of displacement.","quotes":[{"q":"you shouldn’t really be moved","src":"pot, shamshad khan","f":[["Language","The speaker addresses the pot directly with ‘you’, giving it human feelings; ‘shouldn’t’ suggests moving it was wrong."],["Form and structure","Lower case letters and loose layout make the poem feel fragile and intimate, like the pot itself."],["Perceptive reading","‘moved’ has a double meaning: physically removed and emotionally affected, linking the object to people uprooted by migration."],["Context","Many museum objects were taken from colonised countries during the British Empire."],["Writer's intention","khan invites readers to question who owns cultural objects and their histories."]],"th":"Displacement · Power and colonialism · Belonging"},{"q":"you’re not really one of us","src":"pot, shamshad khan","f":[["Language","The pronouns ‘you’ and ‘us’ show exclusion, as if the pot, and the speaker, no longer belong anywhere."],["Form and structure","This line shifts the poem from the pot’s story to the speaker’s own experience of rejection."],["Perceptive reading","It suggests diaspora communities can be rejected by both their new home and their family’s original culture."],["Context","British Asians often describe feeling caught between two cultures."],["Writer's intention","khan reveals the painful sense of not fully belonging in either world."]],"th":"Identity · Belonging · Diaspora"},{"q":"more asian than the asians","src":"pot, shamshad khan","f":[["Language","The repetition of ‘asian’ mocks the idea of measuring how authentic someone’s identity is."],["Form and structure","Lower case ‘asian’ removes the formal capital, perhaps questioning fixed labels."],["Perceptive reading","Perceptively, being ‘more asian’ in England may reflect clinging to heritage because of displacement."],["Context","Migrant families often preserve traditions strongly when far from home."],["Writer's intention","khan challenges simple ideas of identity and belonging."]],"th":"Identity · Culture · Diaspora"}],"pctx":["khan is a British poet of Pakistani heritage. The speaker addresses a pot taken from its home and displayed in a British museum, linking it to her own sense of displacement.","By addressing a museum object taken from its home, khan links colonial plunder to the displacement felt by diaspora communities."],"voc":{"v":[["displacement","being moved from home","The pot’s displacement mirrors the speaker’s."],["authenticity","being genuine","The poem mocks attempts to measure authenticity."]],"m":[["L","Direct address","you shouldn’t really be moved","Speaking to the pot gives it feelings and shows sympathy.",1],["S","Shift to the speaker","you’re not really one of us","The pot’s story becomes the speaker’s experience of rejection.",1],["F","Lower case and loose layout","pot","The fragile form mirrors a delicate object and identity.",1]]}},{"n":"A Wider View","k":"Seni Seneviratne","sum":"Seneviratne was born in Leeds to a Sri Lankan father and English mother. The poem imagines an ancestor who worked in a Leeds flax mill during the Industrial Revolution.","quotes":[{"q":"eyes dry with dust / from twelve hours combing flax","src":"A Wider View, Seni Seneviratne","f":[["Language","The physical detail ‘dry with dust’ shows the harsh conditions, and ‘twelve hours’ emphasises exhausting labour."],["Form and structure","The enjambment stretches the line, mimicking the long working day."],["Perceptive reading","Dry eyes may also suggest he had no time to cry or dream, his emotions worn away by work."],["Context","Victorian mill workers worked long shifts in dusty, dangerous conditions, often from childhood."],["Writer's intention","Seneviratne honours the forgotten workers whose labour built industrial Britain."]],"th":"Work and class · Heritage · Place"},{"q":"he craved the comfort of a wider view","src":"A Wider View, Seni Seneviratne","f":[["Language","‘craved’ shows intense longing, and ‘wider view’ suggests escape from the narrow, cramped life of the mill."],["Form and structure","The poem’s title is echoed here, making this desire the emotional centre of the poem."],["Perceptive reading","The ‘wider view’ may be literal, the sky above the mill, or a wish for freedom and opportunity denied to his class."],["Context","Leeds grew rich from flax and wool mills, while many workers lived in cramped back to back houses where cholera spread."],["Writer's intention","She shows that working people also had dreams and imagination."]],"th":"Freedom · Class · Identity"},{"q":"the curve of past and future generations / arcs between us","src":"A Wider View, Seni Seneviratne","f":[["Language","The ‘curve’ and ‘arcs’ suggest a bridge or rainbow connecting the speaker with her ancestor."],["Form and structure","The poem moves between past and present, and the final image unites them, giving a sense of closure."],["Perceptive reading","‘arcs between us’ suggests heritage is not lost but alive, shaping who she is today."],["Context","Interest in family history has grown, helping people reconnect with working class ancestors."],["Writer's intention","Seneviratne wants readers to value the connection between generations."]],"th":"Heritage · Family · Time"}],"pctx":["Seneviratne was born in Leeds to a Sri Lankan father and English mother. The poem imagines an ancestor who worked in a Leeds flax mill during the Industrial Revolution.","Seneviratne gives a voice to the forgotten workers of industrial Leeds, connecting her own identity to the labour of past generations."],"voc":{"v":[["exploitation","unfair use of people’s labour","The flax mill shows the exploitation of workers."],["legacy","something handed down","The speaker inherits her ancestor’s legacy."]],"m":[["L","Sensory imagery","eyes dry with dust / from twelve hours combing flax","Physical detail shows exhausting labour.",1],["S","Past and present","the curve of past and future generations / arcs between us","The ending unites ancestor and speaker.",1],["F","Free verse","Irregular lines with enjambment","Long lines mimic the long working day.",0]]}},{"n":"Homing","k":"Liz Berry","sum":"Liz Berry is from the Black Country in the West Midlands. Elocution lessons once pressured people to hide regional accents, which were seen as lower class.","quotes":[{"q":"you kept your accent / in a box","src":"Homing, Liz Berry","f":[["Language","The metaphor presents the accent as something hidden away, suggesting shame or suppression."],["Form and structure","The enjambment separates ‘accent’ from ‘in a box’, mirroring how the voice was separated from the person."],["Perceptive reading","A box also keeps things safe, suggesting the accent was preserved, waiting to be rediscovered."],["Context","In the mid twentieth century, regional accents were often seen as a barrier to social progress."],["Writer's intention","Berry shows how class prejudice made people hide part of their identity."]],"th":"Identity · Class · Language"},{"q":"vowels ferrous as nails","src":"Homing, Liz Berry","f":[["Language","‘ferrous’ means containing iron, so the vowels are strong and tough, like the metal industries of the Black Country."],["Form and structure","The simile connects language to place, grounding the accent in industrial heritage."],["Perceptive reading","Nails hold things together, suggesting the accent binds family and community."],["Context","The Black Country was famous for coal, iron and nail making during the Industrial Revolution."],["Writer's intention","Berry celebrates regional accents as part of a proud working class heritage."]],"th":"Heritage · Place · Identity"},{"q":"forge your voice / in my mouth","src":"Homing, Liz Berry","f":[["Language","The verb ‘forge’ suggests making something strong in a furnace, presenting the speaker as reclaiming her parent’s voice."],["Form and structure","The poem ends with this act of reclamation, moving from suppression to celebration."],["Perceptive reading","It suggests identity is passed down through generations and can be reshaped and kept alive."],["Context","Blacksmithing and metalwork were central to the Black Country’s history."],["Writer's intention","Berry encourages readers to embrace, not hide, their roots."]],"th":"Family · Identity · Heritage"}],"pctx":["Liz Berry is from the Black Country in the West Midlands. Elocution lessons once pressured people to hide regional accents, which were seen as lower class.","Berry celebrates the Black Country accent that class prejudice once forced people to hide, reclaiming it as a proud inheritance."],"voc":{"v":[["suppression","holding something back","The parent’s accent suffers suppression."],["reclamation","taking something back","The ending is an act of reclamation."]],"m":[["L","Metaphor","you kept your accent / in a box","The accent is hidden away, suggesting shame.",1],["S","Movement to reclamation","forge your voice / in my mouth","The poem moves from hiding to celebrating the accent.",1],["F","Direct address","Spoken to a parent","The intimate form shows love and pride in heritage.",0]]}},{"n":"A Century Later","k":"Imtiaz Dharker","sum":"Dharker was born in Pakistan and grew up in Glasgow. The poem alludes to Malala Yousafzai, shot by the Taliban in 2012 for going to school, and to Owen’s First World War poetry.","quotes":[{"q":"the school-bell is a call to battle","src":"A Century Later, Imtiaz Dharker","f":[["Language","The metaphor turns an everyday school bell into a call to war, showing education as a dangerous struggle."],["Form and structure","It echoes Wilfred Owen’s ‘Anthem for Doomed Youth’, linking the girl to soldiers of the First World War."],["Perceptive reading","It suggests the battle for education is as important as any war fought with weapons."],["Context","Published a century after the First World War began; girls’ education was banned by the Taliban in parts of Pakistan."],["Writer's intention","Dharker presents going to school as an act of bravery."]],"th":"Power and conflict · Education · Courage"},{"q":"cheek still rounded from being fifteen","src":"A Century Later, Imtiaz Dharker","f":[["Language","‘rounded’ suggests youth and innocence, emphasising how young the victim is."],["Form and structure","The physical detail slows the poem down, creating a moment of vulnerability before violence."],["Perceptive reading","It contrasts with the soldiers of 1914, suggesting children are now the ones on the front line."],["Context","Malala was fifteen when she was shot on her school bus."],["Writer's intention","Dharker shocks readers with the youth of those targeted."]],"th":"Childhood · Violence · Injustice"},{"q":"You cannot kill a book / or the buzzing in it","src":"A Century Later, Imtiaz Dharker","f":[["Language","The direct address and modal ‘cannot’ make a defiant statement; ‘buzzing’ suggests ideas are alive and energetic."],["Form and structure","The poem ends on this assertion, turning from violence to triumph."],["Perceptive reading","The image develops into ‘a swarm’, suggesting education spreads and cannot be stopped."],["Context","Malala survived and became a global campaigner, winning the Nobel Peace Prize in 2014."],["Writer's intention","Dharker celebrates the power of education to defeat oppression."]],"th":"Hope and resistance · Education · Power"}],"pctx":["Dharker was born in Pakistan and grew up in Glasgow. The poem alludes to Malala Yousafzai, shot b
