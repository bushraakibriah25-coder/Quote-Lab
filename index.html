<style>
/* Layout: a revision desk. Sticky top bar, text shelf on home, tabbed workspace per text. Highlighter yellow marks what to learn. */
:root{
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#16202E; --muted:#5A6577; --line:#DCE2EA;
  --hl:#FFE14D; --hl-ink:#3A3000; --good:#1E7F4F; --bad:#B3261E; --chip:#EDF1F6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --quote:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#10151D; --card:#18202B; --ink:#E9EEF5; --muted:#A3AEBE; --line:#2A3443; --hl:#F2CF2E; --hl-ink:#231C00; --good:#5CC98F; --bad:#FF8A80; --chip:#222C3A; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#10151D; --card:#18202B; --ink:#E9EEF5; --muted:#A3AEBE; --line:#2A3443; --hl:#F2CF2E; --hl-ink:#231C00; --good:#5CC98F; --bad:#FF8A80; --chip:#222C3A; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--paper)}
header.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand mark{background:var(--hl);color:var(--hl-ink);padding:0 .2em;border-radius:3px}
.crumb{opacity:.8;font-size:15px}
.spacer{flex:1}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
main{padding-block:24px 64px}
.timeline{list-style:none;padding:0;margin:16px 0 0;position:relative}
.timeline::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:3px;background:var(--line)}
.tl{position:relative;padding-left:48px;margin-bottom:14px}
.tldot{position:absolute;left:0;top:14px;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.ref{display:inline-block;background:var(--c);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px}
.tech{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
.techh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.layer{display:flex;gap:10px;align-items:flex-start;margin-top:8px}.layer p{margin:0}
.lnum{flex:none;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;margin-top:2px}
.cbox{border-left:5px solid var(--mc);background:var(--paper);border-radius:10px;padding:10px 12px}.cbox p{margin:6px 0 0}
@media (max-width:520px){.tl{padding-left:40px}.tldot{width:30px;height:30px;font-size:14px}.timeline::before{left:14px}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--mc);border-radius:12px;padding:12px 14px}
.mcard h4{margin:6px 0 4px;font-size:18px}
.mk{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--mc);border-radius:999px;padding:2px 10px}
.vt th{text-align:left;font-size:13px;color:var(--muted);padding:8px}
.vw{color:var(--c);font-size:17px}
.sechead{margin:30px 0 0;font-size:22px}.sechead .small{font-weight:400}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
.book{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;border-top:6px solid var(--c);min-width:0}
.book:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.book:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.book .kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.book .t{font-family:var(--display);font-size:21px;font-weight:700}
.meter{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--c);width:0}
.small{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 18px;border-bottom:2px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;border-radius:8px 8px 0 0;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--c)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text]{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.btn{font:inherit;font-weight:700;cursor:pointer;padding:10px 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.q{font-family:var(--quote);font-weight:600;font-size:21px;line-height:1.35}
.q::before{content:"‘"}.q::after{content:"’"}
.desc{font-family:var(--body);font-weight:500}
.ex{font-family:var(--quote);font-weight:600;font-size:20px;line-height:1.4}
.mex{font-family:var(--quote);font-weight:600;font-size:16px;line-height:1.35;margin:6px 0 0}
.src{font-size:13px;color:var(--muted);margin-top:4px}
.fields{display:grid;gap:10px;margin-top:12px}
.field b{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c2,var(--muted));margin-bottom:2px}
.field p{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:13px}
.group-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.group-h .k{font-size:13px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.game{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.game:hover{border-color:var(--c)}
.game strong{font-family:var(--display);font-size:18px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:16px}
.stage .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.feedback{margin-top:14px;font-weight:700}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--hl);color:transparent}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:44px}
.tile{all:unset;cursor:pointer;padding:7px 11px;border-radius:7px;background:var(--chip);font-family:var(--quote);font-size:18px;font-weight:500}
.tile.used{opacity:.25;pointer-events:none}
.built{min-height:56px;border:2px dashed var(--line);border-radius:10px;padding:10px;font-family:var(--quote);font-size:19px}
.card3d{perspective:1200px}
.flip{position:relative;min-height:300px}
.face{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.steps{display:grid;gap:10px;margin-top:12px}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.step .L{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:20px}
.step .body p{margin:2px 0 0}
.para{line-height:1.8}
.para span{padding:1px 0}
.essay h3{margin-top:18px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;color:#fff;margin-right:6px}
mark.k{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:3px}
.empty{color:var(--muted)}
table.ctx{width:100%;border-collapse:collapse}
table.ctx td{border-top:1px solid var(--line);padding:10px 8px;vertical-align:top}
table.ctx td:first-child{font-weight:700;width:30%}
.tablewrap{overflow-x:auto}
@media (max-width:520px){ .q{font-size:19px} .stage{padding:16px} table.ctx td:first-child{width:40%} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .book:hover{transform:none} }
</style>

<script>
const DATA = [{"id":"macbeth","title":"Macbeth","author":"Shakespeare","kind":"Shakespeare play","paper":"Paper 1, Section A","col":"#8E1B1B","ctx":[["Divine Right of Kings","Kings were chosen by God, so regicide was a sin against God."],["Great Chain of Being","God's order; breaking it brings chaos to nature and society."],["King James I","Shakespeare's patron, said to descend from Banquo; wrote ‘Daemonologie’ (1597)."],["Gunpowder Plot 1605","A failed Catholic plot to kill James; fear of treason was high."],["Gender","Women were expected to be obedient, gentle and maternal."]],"groups":[{"n":"Macbeth","k":"Character","sum":"A brave soldier whose ambition, fed by the Witches and his wife, turns him into a murderous tyrant.","quotes":[{"q":"Stars, hide your fires! / Let not light see my black and deep desires","src":"Macbeth, aside, Act 1 Scene 4","f":[["Language","The imperative ‘hide’ shows Macbeth trying to command the heavens; ‘black’ connotes sin and evil."],["Form and structure","The rhyming couplet ‘fires’ and ‘desires’ seals his decision, and the aside lets the audience share his secret."],["Perceptive reading","Asking the light not to see suggests he already feels guilt; he is hiding from God and his own conscience."],["Context","Under the Divine Right of Kings, plotting against a king was a sin against God."],["Writer's intention","Shakespeare shows ambition corrupting a loyal man, warning his Jacobean audience against treason."]],"th":"Ambition · Light and darkness · Appearance and reality"},{"q":"O, full of scorpions is my mind, dear wife!","src":"Macbeth to Lady Macbeth, Act 3 Scene 2","f":[["Language","The metaphor of ‘scorpions’ suggests his thoughts are poisonous, stinging and tormenting him."],["Form and structure","The exclamation conveys anguish, while ‘dear wife’ shows affection that will soon disappear."],["Perceptive reading","Scorpions sting themselves when trapped, suggesting Macbeth’s guilt and paranoia will destroy him."],["Context","Jacobeans believed sin brought mental torment as a form of divine punishment."],["Writer's intention","Shakespeare shows that killing a king brings no peace, only suffering."]],"th":"Guilt · Mental torment · Ambition"},{"q":"a tale / Told by an idiot, full of sound and fury, / Signifying nothing.","src":"Macbeth, soliloquy, Act 5 Scene 5","f":[["Language","Life becomes ‘a tale / Told by an idiot’, meaningless and chaotic; ‘sound and fury’ suggests noise without purpose."],["Form and structure","The short final line ‘Signifying nothing’ falls flat, enacting the emptiness he feels."],["Perceptive reading","After hearing of his wife’s death he feels nothing, showing how ambition has destroyed his humanity."],["Context","Christians believed life had divine purpose; Macbeth’s nihilism shows how far he has fallen from God."],["Writer's intention","Shakespeare presents the hollow reward of tyranny."]],"th":"Ambition · Guilt · Fate and free will"}]},{"n":"Lady Macbeth","k":"Character","sum":"Macbeth’s ambitious, manipulative wife who drives the murder of Duncan but is destroyed by guilt.","quotes":[{"q":"unsex me here","src":"Lady Macbeth, Act 1 Scene 5","f":[["Language","The imperative shows she sees femininity as weakness that would stop her committing murder."],["Form and structure","It comes in a soliloquy calling on ‘spirits’, linking her to witchcraft."],["Perceptive reading","Needing spirits to change her suggests she is not naturally cruel, foreshadowing her breakdown."],["Context","Women were expected to be gentle and obedient; King James feared witchcraft."],["Writer's intention","Shakespeare presents her ambition as unnatural and dangerous."]],"th":"Gender · Ambition · The supernatural"},{"q":"When you durst do it, then you were a man","src":"Lady Macbeth to Macbeth, Act 1 Scene 7","f":[["Language","She defines manhood through daring and violence, questioning his masculinity."],["Form and structure","Her persuasive rhetoric dominates the dialogue, reversing gender roles."],["Perceptive reading","It reveals her skill at manipulation, finding Macbeth’s greatest weakness: his pride."],["Context","Masculinity was linked to courage on the battlefield."],["Writer's intention","Shakespeare shows how manipulation drives the tragedy."]],"th":"Masculinity · Power · Manipulation"},{"q":"Out, damned spot! out, I say!","src":"Lady Macbeth, sleepwalking, Act 5 Scene 1","f":[["Language","The exclamatory imperatives show desperation; the ‘spot’ symbolises the guilt she cannot remove."],["Form and structure","She now speaks in fragmented prose instead of verse, showing her mind breaking down."],["Perceptive reading","Her commands no longer work, a reversal of the powerful woman of Act 1."],["Context","Sleepwalking was linked to a troubled conscience or the supernatural."],["Writer's intention","Shakespeare shows that guilt destroys those who defy God’s order."]],"th":"Guilt · Blood · Downfall"}]},{"n":"Banquo","k":"Character","sum":"Macbeth’s fellow soldier who also hears the Witches but resists temptation; murdered on Macbeth’s orders.","quotes":[{"q":"The instruments of darkness tell us truths","src":"Banquo to Macbeth, Act 1 Scene 3","f":[["Language","‘instruments of darkness’ presents the Witches as tools of the devil."],["Form and structure","Banquo’s caution contrasts with Macbeth’s excitement, making him a foil."],["Perceptive reading","He recognises that half truths can lead people ‘to our harm’, showing wisdom Macbeth lacks."],["Context","James I, said to be descended from Banquo, wrote ‘Daemonologie’ about the danger of witches."],["Writer's intention","Shakespeare flatters the king by making Banquo noble."]],"th":"The supernatural · Temptation · Loyalty"},{"q":"Thou play’dst most foully for’t","src":"Banquo, soliloquy, Act 3 Scene 1","f":[["Language","‘foully’ echoes ‘Fair is foul’, linking Macbeth’s actions to the Witches’ evil."],["Form and structure","In soliloquy, Banquo reveals suspicion he keeps hidden in public."],["Perceptive reading","His silence may show self interest, as he hopes the prophecy for his sons will come true."],["Context","Jacobean audiences valued loyalty to the rightful king."],["Writer's intention","Shakespeare builds tension, as Banquo becomes a threat to Macbeth."]],"th":"Suspicion · Appearance and reality · Fate"},{"q":"Fly, good Fleance, fly, fly, fly!","src":"Banquo, Act 3 Scene 3","f":[["Language","The repeated imperative ‘fly’ shows urgency and his love for his son."],["Form and structure","His dying words protect Fleance, ensuring the prophecy about his heirs survives."],["Perceptive reading","Banquo dies thinking of his son’s future, contrasting with Macbeth’s childless isolation."],["Context","King James claimed descent from Fleance."],["Writer's intention","Shakespeare honours the king’s ancestry."]],"th":"Family · Kingship · Fate"}]},{"n":"The Witches","k":"Character","sum":"Three supernatural figures who prophesy Macbeth’s rise and tempt him towards evil.","quotes":[{"q":"Fair is foul, and foul is fair","src":"The Witches, Act 1 Scene 1","f":[["Language","The paradox and chiasmus show a world where good and evil are reversed."],["Form and structure","Spoken in trochaic tetrameter, the chant sounds unnatural, unlike the iambic rhythm of humans."],["Perceptive reading","It sets up the theme of deceptive appearances that runs throughout the play."],["Context","Witchcraft was a crime; James I personally oversaw witch trials."],["Writer's intention","Shakespeare creates an atmosphere of chaos and evil from the first scene."]],"th":"The supernatural · Appearance and reality · Order"},{"q":"All hail, Macbeth! that shalt be king hereafter!","src":"Third Witch, Act 1 Scene 3","f":[["Language","‘All hail’ is a royal greeting, flattering Macbeth and planting the idea of kingship."],["Form and structure","The third prophecy builds a climax after Glamis and Cawdor."],["Perceptive reading","The Witches never tell Macbeth to kill; the choice to murder is his own."],["Context","Audiences debated fate and free will."],["Writer's intention","Shakespeare leaves the audience questioning responsibility."]],"th":"Fate and free will · Ambition · The supernatural"},{"q":"Double, double, toil and trouble","src":"The Witches, Act 4 Scene 1","f":[["Language","Repetition and rhyme create a spell like incantation."],["Form and structure","The rhythmic chant contrasts with the speech of other characters, marking the Witches as other."],["Perceptive reading","‘Double’ suggests their prophecies have double meanings, which will trick Macbeth."],["Context","Jacobean audiences believed spells could cause real harm."],["Writer's intention","Shakespeare heightens fear and foreshadows Macbeth’s downfall."]],"th":"The supernatural · Deception · Chaos"}]},{"n":"Duncan","k":"Character","sum":"The good, trusting king of Scotland, murdered by Macbeth in his sleep.","quotes":[{"q":"There’s no art / To find the mind’s construction in the face","src":"Duncan, Act 1 Scene 4","f":[["Language","Duncan admits you cannot judge someone’s thoughts by their face."],["Form and structure","Dramatic irony: he says this about the traitor Cawdor just as Macbeth enters."],["Perceptive reading","It shows his trusting nature is a weakness that Macbeth exploits."],["Context","Kings were God’s representatives, yet still vulnerable to betrayal."],["Writer's intention","Shakespeare builds tension and sympathy for Duncan."]],"th":"Appearance and reality · Kingship · Trust"},{"q":"O valiant cousin! worthy gentleman!","src":"Duncan about Macbeth, Act 1 Scene 2","f":[["Language","The adjectives ‘valiant’ and ‘worthy’ show Duncan’s admiration for Macbeth."],["Form and structure","The exclamations show his gratitude and generosity as king."],["Perceptive reading","This praise makes Macbeth’s later betrayal more shocking."],["Context","Loyalty to the king was a sacred duty."],["Writer's intention","Shakespeare establishes Macbeth as a hero before his fall."]],"th":"Kingship · Loyalty · Tragedy"},{"q":"This castle hath a pleasant seat","src":"Duncan, Act 1 Scene 6","f":[["Language","‘pleasant’ shows Duncan sees the castle as welcoming and safe."],["Form and structure","Dramatic irony: the audience knows it is the place of his murder."],["Perceptive reading","It shows how evil hides behind a calm surface."],["Context","Hospitality was a sacred duty; killing a guest doubled the crime."],["Writer's intention","Shakespeare heightens the horror of the betrayal."]],"th":"Appearance and reality · Kingship · Betrayal"}]},{"n":"Macduff","k":"Character","sum":"The Thane of Fife who discovers Duncan’s body, loses his family and finally kills Macbeth.","quotes":[{"q":"O horror, horror, horror!","src":"Macduff, Act 2 Scene 3","f":[["Language","The repetition of ‘horror’ shows his shock at Duncan’s murder."],["Form and structure","The exclamation and broken line show language failing him."],["Perceptive reading","He reacts as a loyal subject should, contrasting with Macbeth’s fake grief."],["Context","Regicide was seen as the worst possible crime."],["Writer's intention","Shakespeare shows the true reaction to violating God’s order."]],"th":"Kingship · Loyalty · Order"},{"q":"All my pretty ones? / Did you say all?","src":"Macduff, Act 4 Scene 3","f":[["Language","‘pretty ones’ shows tenderness for his murdered children."],["Form and structure","The repeated questions show disbelief and shock."],["Perceptive reading","His grief reveals the human cost of Macbeth’s tyranny."],["Context","Family loyalty was central to society."],["Writer's intention","Shakespeare creates sympathy and motivates Macduff’s revenge."]],"th":"Family · Violence · Tyranny"},{"q":"But I must also feel it as a man","src":"Macduff to Malcolm, Act 4 Scene 3","f":[["Language","Macduff suggests true manhood includes feeling grief."],["Form and structure","This challenges the idea of masculinity as violence alone."],["Perceptive reading","It contrasts with Lady Macbeth’s idea that men must be ruthless."],["Context","Men were expected to be strong and unemotional."],["Writer's intention","Shakespeare offers a better model of masculinity."]],"th":"Masculinity · Grief · Revenge"}]},{"n":"Malcolm","k":"Character","sum":"Duncan’s son and heir, who flees after the murder and returns to restore order as king.","quotes":[{"q":"Angels are bright still, though the brightest fell","src":"Malcolm to Macduff, Act 4 Scene 3","f":[["Language","The ‘brightest’ angel is Lucifer, suggesting goodness still exists even though some fall."],["Form and structure","The antithesis between ‘bright’ and ‘fell’ captures the play’s moral contrasts."],["Perceptive reading","It links Macbeth’s fall to Satan’s rebellion against God."],["Context","Christian belief in the fall of Lucifer as a warning against pride."],["Writer's intention","Shakespeare presents Macbeth’s ambition as a sin of pride."]],"th":"Good and evil · Kingship · Religion"},{"q":"Macbeth / Is ripe for shaking","src":"Malcolm, Act 4 Scene 3","f":[["Language","The metaphor of ripe fruit suggests Macbeth is ready to fall."],["Form and structure","The natural image suggests order will be restored naturally."],["Perceptive reading","It shows Malcolm’s growing confidence as a leader."],["Context","The Great Chain of Being meant usurpers must eventually fall."],["Writer's intention","Shakespeare reassures the audience that tyranny cannot last."]],"th":"Kingship · Order · Nature"},{"q":"this dead butcher, and his fiend-like queen","src":"Malcolm, Act 5 Scene 9","f":[["Language","‘butcher’ reduces Macbeth to a killer; ‘fiend-like’ links Lady Macbeth to demons."],["Form and structure","These final judgements close the play."],["Perceptive reading","The labels may be too simple, as the audience has seen their guilt and suffering."],["Context","Order is restored when the rightful king takes the throne."],["Writer's intention","Shakespeare reaffirms the Divine Right of Kings."]],"th":"Kingship · Good and evil · Order"}]},{"n":"Ambition","k":"Theme","sum":"Ambition drives the tragedy, turning a hero into a tyrant.","quotes":[{"q":"I have no spur / To prick the sides of my intent, but only / Vaulting ambition, which o’erleaps itself","src":"Macbeth, Act 1 Scene 7","f":[["Language","The metaphor compares ambition to a horse rider who jumps too high and falls."],["Form and structure","In soliloquy, Macbeth reasons against the murder, showing his inner conflict."],["Perceptive reading","He recognises his ambition will destroy him, yet still acts on it."],["Context","Pride and overreaching were seen as sins."],["Writer's intention","Shakespeare warns that unchecked ambition leads to ruin."]],"th":"Ambition · Free will · Downfall"},{"q":"thou wouldst be great; / Art not without ambition","src":"Lady Macbeth, Act 1 Scene 5","f":[["Language","She recognises Macbeth’s ambition but fears he lacks ruthlessness."],["Form and structure","The double negative ‘not without’ shows careful judgement."],["Perceptive reading","It suggests ambition was already in Macbeth before the Witches spoke."],["Context","Ambition was dangerous if it challenged God’s order."],["Writer's intention","Shakespeare explores where ambition comes from."]],"th":"Ambition · Gender · Free will"},{"q":"I am in blood / Step’t in so far","src":"Macbeth, Act 3 Scene 4","f":[["Language","The metaphor of wading in a river of blood shows how deep he is in crime."],["Form and structure","His language shows resignation rather than horror."],["Perceptive reading","He feels unable to turn back, trapped by his own choices."],["Context","Sin was believed to lead to more sin."],["Writer's intention","Shakespeare shows the momentum of evil."]],"th":"Ambition · Guilt · Violence"}]},{"n":"Guilt","k":"Theme","sum":"Guilt torments both Macbeths, shown through blood, sleeplessness and madness.","quotes":[{"q":"Will all great Neptune’s ocean wash this blood / Clean from my hand?","src":"Macbeth, Act 2 Scene 2","f":[["Language","Hyperbole suggests even an ocean cannot clean his guilt."],["Form and structure","The rhetorical question shows panic straight after the murder."],["Perceptive reading","It contrasts with Lady Macbeth’s ‘A little water clears us of this deed’."],["Context","Sin was believed to stain the soul."],["Writer's intention","Shakespeare shows immediate, overwhelming guilt."]],"th":"Guilt · Blood · Conscience"},{"q":"Macbeth does murder sleep","src":"Macbeth, Act 2 Scene 2","f":[["Language","Sleep is personified as a victim, showing Macbeth has destroyed his own peace."],["Form and structure","It foreshadows the sleeplessness and sleepwalking to come."],["Perceptive reading","He kills an innocent man in his sleep, so he loses sleep himself."],["Context","Sleep symbolised innocence and a clear conscience."],["Writer's intention","Shakespeare shows guilt’s psychological punishment."]],"th":"Guilt · Order · Nature"},{"q":"all the perfumes of Arabia will not sweeten this little hand","src":"Lady Macbeth, Act 5 Scene 1","f":[["Language","Hyperbole shows she can never remove the guilt."],["Form and structure","It echoes Macbeth’s ‘Neptune’s ocean’ line, showing they have swapped places."],["Perceptive reading","‘little hand’ shows vulnerability, a sign of her lost power."],["Context","Arabia was famous for expensive perfumes."],["Writer's intention","Shakespeare shows guilt’s lasting effect."]],"th":"Guilt · Gender · Downfall"}]},{"n":"Kingship and Order","k":"Theme","sum":"Good kings bring order; regicide and tyranny bring chaos to nature and society.","quotes":[{"q":"his virtues / Will plead like angels, trumpet-tongued","src":"Macbeth about Duncan, Act 1 Scene 7","f":[["Language","The simile presents Duncan’s goodness as heavenly and powerful."],["Form and structure","Religious imagery shows the murder as a sin."],["Perceptive reading","Macbeth knows Duncan is good, making his choice more damning."],["Context","Divine Right of Kings."],["Writer's intention","Shakespeare stresses the sacredness of kingship."]],"th":"Kingship · Religion · Guilt"},{"q":"the king-becoming graces","src":"Malcolm, Act 4 Scene 3","f":[["Language","Malcolm lists qualities a true king should have, like justice and mercy."],["Form and structure","The list contrasts with Macbeth’s tyranny."],["Perceptive reading","It presents kingship as moral responsibility, not just power."],["Context","James I wrote about ideal kingship."],["Writer's intention","Shakespeare presents the model of a good king."]],"th":"Kingship · Good and evil · Order"},{"q":"unnatural deeds / Do breed unnatural troubles","src":"Doctor, Act 5 Scene 1","f":[["Language","Repetition of ‘unnatural’ shows evil acts create chaos."],["Form and structure","The verb ‘breed’ suggests evil multiplies."],["Perceptive reading","It explains Lady Macbeth’s madness as a result of sin."],["Context","The Great Chain of Being."],["Writer's intention","Shakespeare shows how disorder spreads."]],"th":"Order · Guilt · Nature"}]},{"n":"The Supernatural","k":"Theme","sum":"Witches, visions and ghosts blur reality and test Macbeth’s free will.","quotes":[{"q":"Is this a dagger which I see before me","src":"Macbeth, Act 2 Scene 1","f":[["Language","The question shows his confusion between reality and imagination."],["Form and structure","The soliloquy reveals his disturbed mind before the murder."],["Perceptive reading","The dagger may be supernatural or a product of guilt."],["Context","Visions were believed to come from God or the devil."],["Writer's intention","Shakespeare creates tension and uncertainty."]],"th":"The supernatural · Guilt · Ambition"},{"q":"Thou canst not say I did it: never shake / Thy gory locks at me.","src":"Macbeth to Banquo’s ghost, Act 3 Scene 4","f":[["Language","‘gory locks’ creates a horrifying image of Banquo’s ghost."],["Form and structure","The public setting of the banquet exposes his guilt."],["Perceptive reading","His denial shows desperate self deception."],["Context","Ghosts were believed to return to seek justice."],["Writer's intention","Shakespeare shows guilt revealing itself."]],"th":"The supernatural · Guilt · Appearance and reality"},{"q":"So foul and fair a day I have not seen","src":"Macbeth, Act 1 Scene 3","f":[["Language","His first words echo the Witches’ ‘Fair is foul’."],["Form and structure","This links him to them before they meet."],["Perceptive reading","It suggests he is already connected to evil."],["Context","Witches were believed to influence the vulnerable."],["Writer's intention","Shakespeare foreshadows his corruption."]],"th":"The supernatural · Fate · Ambition"}]},{"n":"Appearance and Reality","k":"Theme","sum":"Characters hide evil behind innocent faces; nothing is what it seems.","quotes":[{"q":"look like the innocent flower, / But be the serpent under’t","src":"Lady Macbeth, Act 1 Scene 5","f":[["Language","The flower represents innocence; the serpent represents hidden evil."],["Form and structure","The imperatives show her control."],["Perceptive reading","The serpent recalls Satan in Eden, making her a tempter."],["Context","A medal made after the Gunpowder Plot showed a serpent hidden among flowers."],["Writer's intention","Shakespeare links deception to treason."]],"th":"Appearance and reality · Deception · Religion"},{"q":"False face must hide what the false heart doth know","src":"Macbeth, Act 1 Scene 7","f":[["Language","The repetition of ‘false’ shows Macbeth accepting deception."],["Form and structure","The rhyming couplet ends the scene with decisive resolution."],["Perceptive reading","It shows his transformation into a deceiver."],["Context","Deception and treason were feared after the Gunpowder Plot."],["Writer's intention","Shakespeare shows moral corruption."]],"th":"Appearance and reality · Ambition · Deception"},{"q":"There’s daggers in men’s smiles","src":"Donalbain, Act 2 Scene 3","f":[["Language","The metaphor shows friendly faces hiding murderous intent."],["Form and structure","It explains why Duncan’s sons flee."],["Perceptive reading","It shows trust has been destroyed in Scotland."],["Context","Court politics were dangerous."],["Writer's intention","Shakespeare shows the chaos after regicide."]],"th":"Appearance and reality · Kingship · Trust"}]},{"n":"Masculinity and Violence","k":"Theme","sum":"The play questions whether being a man means being violent.","quotes":[{"q":"unseam’d him from the nave to the chaps","src":"The Captain about Macbeth, Act 1 Scene 2","f":[["Language","The brutal image shows Macbeth’s violence in battle."],["Form and structure","It is reported speech, showing Macbeth is praised for killing."],["Perceptive reading","It suggests his capacity for violence that will later turn against the king."],["Context","Violence in war was honourable."],["Writer's intention","Shakespeare shows the thin line between heroism and murder."]],"th":"Violence · Masculinity · Loyalty"},{"q":"Bellona’s bridegroom","src":"Ross about Macbeth, Act 1 Scene 2","f":[["Language","Bellona was the Roman goddess of war, so Macbeth is married to war."],["Form and structure","The mythological allusion elevates his status."],["Perceptive reading","It suggests war is his natural partner, hinting at violence."],["Context","Classical references were familiar to educated audiences."],["Writer's intention","Shakespeare presents Macbeth as a great warrior."]],"th":"Masculinity · Violence · Heroism"},{"q":"Are you a man?","src":"Lady Macbeth to Macbeth, Act 3 Scene 4","f":[["Language","The rhetorical question challenges Macbeth’s masculinity."],["Form and structure","It echoes her earlier manipulation."],["Perceptive reading","Her power is weakening as Macbeth no longer needs her."],["Context","Men were expected to be fearless."],["Writer's intention","Shakespeare questions gender roles."]],"th":"Masculinity · Gender · Power"}]}],"ctx9":[["The Divine Right of Kings","Jacobeans believed monarchs were chosen by God, so regicide was a sin against God as well as a crime.","By murdering Duncan, Macbeth commits not only treason but sacrilege, and a Jacobean audience would expect divine punishment to follow."],["The Great Chain of Being","God’s fixed order placed the king at the top; disturbing it threw nature into chaos.","Shakespeare’s unnatural darkness and wild horses after the murder reflect a world thrown out of order when the chain is broken."],["King James I","Shakespeare’s patron, said to descend from Banquo, wrote ‘Daemonologie’ (1597) and survived the Gunpowder Plot (1605).","Shakespeare flatters James by making Banquo noble and by showing treason against a rightful king punished."],["Witchcraft","Witches were feared and persecuted; James oversaw witch trials in Scotland.","To a Jacobean audience the Witches were a genuine spiritual threat, so Macbeth’s eagerness to hear them marks him as already corrupted."],["Gender expectations","Women were expected to be obedient, gentle and maternal; men were defined by courage and violence.","Lady Macbeth’s plea to be ‘unsex[ed]’ would horrify an audience who saw femininity as God given, while her taunts expose how dangerously masculinity was tied to violence."],["Tragedy","A tragic hero of high status falls through a fatal flaw, creating pity and fear (catharsis).","Macbeth’s ‘vaulting ambition’ is his hamartia, and his fall invites the audience to fear the same desire in themselves."]],"voc":{"v":[["hubristic","showing excessive pride that leads to a downfall","Macbeth’s hubristic belief that ‘none of woman born’ can harm him blinds him to his fate."],["regicide","the killing of a king","Duncan’s regicide is presented as a crime against God as well as the state."],["usurper","someone who takes power illegally","As a usurper, Macbeth can never feel secure on the throne."],["equivocation","using deliberately ambiguous language to mislead","The Witches’ equivocation tempts Macbeth while hiding the truth."],["emasculate","to make a man feel weak or less of a man","Lady Macbeth tries to emasculate her husband when his courage fails."],["insatiable","impossible to satisfy","Macbeth’s ambition becomes insatiable, so each murder demands another."],["tyrannical","ruling with cruelty and absolute power","Scotland suffers under Macbeth’s tyrannical rule."],["remorse","deep regret for a wrong you have done","Lady Macbeth’s sleepwalking reveals the remorse she once dismissed."]],"m":[["L","Imagery of blood","Will all great Neptune’s ocean wash this blood / Clean from my hand?","Blood becomes a symbol of guilt that cannot be washed away.",1],["L","Antithesis","Fair is foul, and foul is fair","Opposites are reversed, showing a world where appearance and reality cannot be trusted.",1],["S","Soliloquy","Is this a dagger which I see before me","The audience hears Macbeth’s private thoughts, creating intimacy with a murderer.",1],["S","Dramatic irony","This castle hath a pleasant seat","The audience knows Duncan will be murdered there, which builds tension.",1],["F","Tragedy","Macbeth’s fall from ‘valiant cousin’ to ‘dead butcher’","A tragic hero is destroyed by his fatal flaw, ambition, which warns the audience.",0],["F","Trochaic tetrameter","Double, double, toil and trouble","The Witches’ chanting rhythm differs from blank verse and marks them as unnatural.",1]]},"chron":[{"r":"Act 1 Scene 1","m":"The Witches meet in thunder and plan to meet Macbeth.","q":"Fair is foul, and foul is fair","t1":["Chiasmus","The mirrored structure reverses ‘fair’ and ‘foul’, so good and evil swap places.","The inversion warns that in this play appearances will lie and moral values will be turned upside down.","Macbeth’s first line, ‘So foul and fair a day’, unknowingly echoes it, suggesting he is already bound to the Witches before they meet."],"t2":["Trochaic tetrameter","The stressed first syllables create a chanting, spell like rhythm unlike the iambic verse of humans.","The unnatural metre marks the Witches as outside God’s order, speaking a language of disruption.","The incantation works like a curse placed on the whole play, so every later act of ‘foul’ seeming ‘fair’ feels fated."],"cx":"James I wrote ‘Daemonologie’ (1597) and believed witches plotted against him, so a Jacobean audience would see the Witches as a real spiritual threat.","wi":"Shakespeare opens with chaos to unsettle the audience and establish the central theme that evil disguises itself as good."},{"r":"Act 1 Scene 3","m":"Macbeth and Banquo meet the Witches on the heath.","q":"So foul and fair a day I have not seen","t1":["Antithesis","‘foul’ and ‘fair’ describe the weather of the battle day, mixing victory with storm.","The contradiction hints at the moral confusion about to enter Macbeth’s mind.","It suggests Macbeth already thinks in the Witches’ language, so the line can be read as evidence that evil was already within him."],"t2":["Echo and dramatic irony","His first words repeat the Witches’ chant without his knowledge.","The audience recognises the echo and senses a hidden connection between Macbeth and evil.","Shakespeare blurs fate and free will: is Macbeth controlled by the Witches or simply revealing his own nature?"],"cx":"Jacobeans believed the devil could tempt people only if they were already open to sin.","wi":"Shakespeare uses dramatic irony to make the audience fear for Macbeth from his very first line."},{"r":"Act 1 Scene 4","m":"Duncan names Malcolm as heir; Macbeth reveals his ambition in an aside.","q":"Stars, hide your fires! / Let not light see my black and deep desires","t1":["Imperative and apostrophe","Macbeth commands the stars to ‘hide’, addressing nature directly.","He wants to blot out heaven’s light so God cannot see his sin.","Ordering the cosmos shows his hubris: he already imagines power over the natural order he will later break."],"t2":["Light and dark imagery","‘light’ and ‘black’ contrast goodness with evil desire.","Darkness becomes a symbol of secrecy and sin throughout the play.","The rhyming couplet ‘fires’ and ‘desires’ links heavenly light with burning ambition, so desire itself seems hellish."],"cx":"The Great Chain of Being placed the king beneath God; plotting against Duncan meant rebelling against heaven itself.","wi":"Shakespeare lets the audience see ambition forming in secret, building tension through the aside."},{"r":"Act 1 Scene 5","m":"Lady Macbeth reads the letter and calls on spirits to fill her with cruelty.","q":"unsex me here","t1":["Imperative","The command shows Lady Macbeth taking control and demanding change.","She asks to be stripped of femininity, which she links with weakness and pity.","Calling on ‘spirits’ echoes the Witches, so she willingly invites possession, a horrifying idea to a Jacobean audience."],"t2":["Verb coinage","‘unsex’ is a striking invented verb.","It suggests gender can be undone, challenging the belief that roles are God given.","Her later madness suggests nature cannot be undone, so the coinage foreshadows her collapse."],"cx":"Women were expected to be gentle, obedient and maternal; a woman who rejected this was seen as unnatural, even witchlike.","wi":"Shakespeare presents ambition as a force that corrupts natural roles, warning the audience against disturbing God’s order."},{"r":"Act 1 Scene 7","m":"Macbeth weighs up the murder and decides against it, until his wife persuades him.","q":"I have no spur / To prick the sides of my intent, but only / Vaulting ambition, which o’erleaps itself","t1":["Extended metaphor of horse riding","Macbeth imagines his intention as a horse that needs a ‘spur’.","Ambition is a rider leaping too high and falling, an image of self destruction.","He predicts his own downfall clearly, so his choice to continue becomes tragic rather than ignorant."],"t2":["Enjambment","The lines run on, carrying the thought forward without pause.","The movement mirrors ambition rushing past reason.","The sentence collapses mid thought when Lady Macbeth enters, as if the leap ends in a fall."],"cx":"Aristotle’s idea of tragedy shows a noble hero destroyed by a fatal flaw (hamartia).","wi":"Shakespeare shows that Macbeth knows the murder is wrong, so the audience judges his choice morally."},{"r":"Act 2 Scene 1","m":"Before killing Duncan, Macbeth sees a floating dagger.","q":"Is this a dagger which I see before me","t1":["Rhetorical question","Macbeth questions his own senses.","His uncertainty shows a mind fracturing under guilt before the crime.","The question asks whether evil comes from outside (the supernatural) or within (his imagination)."],"t2":["Soliloquy","Alone on stage, he speaks his thoughts aloud.","The audience becomes complicit, sharing the murderer’s mind.","Shakespeare creates sympathy and horror together, a hallmark of tragedy."],"cx":"Jacobeans believed hallucinations could be sent by demons to lure sinners.","wi":"Shakespeare builds suspense and invites the audience to question the reliability of perception."},{"r":"Act 2 Scene 2","m":"After the murder, Macbeth stares at his bloody hands.","q":"Will all great Neptune’s ocean wash this blood / Clean from my hand?","t1":["Hyperbole","An entire ocean cannot clean his hands.","The exaggeration shows guilt that is limitless.","Blood becomes a symbol of sin that cannot be washed away, echoing Pilate washing his hands of Christ."],"t2":["Classical allusion","‘Neptune’ is the Roman god of the sea.","Calling on a pagan god suggests he has lost access to Christian forgiveness.","Ironically, Lady Macbeth later repeats this obsession, so guilt passes from husband to wife."],"cx":"Regicide was a sin against God; a Jacobean audience would expect divine punishment.","wi":"Shakespeare shows guilt as a psychological punishment that begins at once."},{"r":"Act 2 Scene 3","m":"Duncan’s body is discovered; his sons fear for their lives.","q":"There’s daggers in men’s smiles","t1":["Metaphor","Smiles hide ‘daggers’, so friendliness conceals murder.","Donalbain recognises that the court is now full of deception.","The line links to Duncan’s earlier misjudgement of faces, so trust has become dangerous."],"t2":["Juxtaposition","‘daggers’ and ‘smiles’ place violence beside warmth.","The contrast captures the play’s theme of appearance versus reality.","It foreshadows Macbeth’s tyranny, where loyalty and murder look the same."],"cx":"After the Gunpowder Plot (1605), Jacobeans feared hidden traitors at court.","wi":"Shakespeare warns the audience that treachery often hides behind loyalty."},{"r":"Act 3 Scene 2","m":"Macbeth, now king, is tormented by fear of Banquo.","q":"O, full of scorpions is my mind, dear wife!","t1":["Metaphor","His mind is filled with ‘scorpions’.","Scorpions suggest poisonous, stinging thoughts that he cannot escape.","Ironically, the affectionate ‘dear wife’ contrasts with the venom, showing how crime has poisoned their marriage."],"t2":["Exclamation","The exclamation shows agony.","Kingship has brought torment, not satisfaction.","The power he gained by murder has become a prison of paranoia."],"cx":"Jacobeans believed usurpers could never rest because God’s order had been broken.","wi":"Shakespeare shows that ill gotten power brings suffering, not peace."},{"r":"Act 3 Scene 4","m":"After seeing Banquo’s ghost at the banquet, Macbeth decides to continue killing.","q":"I am in blood / Step’t in so far","t1":["Metaphor","Macbeth imagines wading through a river of blood.","Going back would be as hard as going on, so he sees no escape.","The image suggests moral numbness: murder has become a habit."],"t2":["Enjambment","The line breaks after ‘blood’, leaving him suspended in it.","The pause mirrors his feeling of being stuck.","Structurally this marks the midpoint of the play, where Macbeth commits to tyranny."],"cx":"The Great Chain of Being suggested one sin would lead to chaos.","wi":"Shakespeare shows how sin multiplies, warning the audience about the momentum of evil."},{"r":"Act 4 Scene 1","m":"The Witches brew a potion and show Macbeth apparitions.","q":"Double, double, toil and trouble","t1":["Repetition","‘Double’ is repeated, like a chant.","It suggests trouble multiplying, just as Macbeth’s crimes do.","The doubling echoes the double meanings of their prophecies."],"t2":["Alliteration and trochaic metre","‘toil and trouble’ creates a heavy rhythm.","The chant sounds like a spell, making the scene ritualistic.","Its rhythm hypnotises, mirroring how Macbeth is lured deeper."],"cx":"James I believed witches could raise storms and harm kings, so this would terrify a Jacobean audience.","wi":"Shakespeare uses spectacle to show evil drawing Macbeth to destruction."},{"r":"Act 4 Scene 3","m":"Macduff learns that his wife and children have been murdered.","q":"All my pretty ones? / Did you say all?","t1":["Rhetorical questions","Macduff repeats questions in disbelief.","His shock shows grief too great to accept.","The repetition of ‘all’ stresses the scale of Macbeth’s cruelty."],"t2":["Tender diction","‘pretty ones’ is affectionate, childlike language.","It reveals Macduff’s love and contrasts with Macbeth’s violence.","Macduff’s grief shows true masculinity includes feeling, opposing Lady Macbeth’s view of manhood."],"cx":"Tyrants were believed to destroy families and communities, breaking the natural order.","wi":"Shakespeare uses Macduff’s grief to make the audience feel the human cost of tyranny."},{"r":"Act 5 Scene 1","m":"Lady Macbeth sleepwalks, trying to wash invisible blood from her hands.","q":"Out, damned spot! out, I say!","t1":["Imperative and exclamation","She commands the spot to leave.","Her orders have lost their power, a reversal of her earlier control.","The scene echoes Macbeth’s ‘Neptune’ line, showing that guilt has passed to her."],"t2":["Prose","She speaks in broken prose rather than verse.","The loss of verse shows her mind has collapsed.","The fall from controlled poetry to fragments mirrors her fall from power."],"cx":"Jacobeans believed that sin disturbed sleep, and that madness could be divine punishment.","wi":"Shakespeare shows that guilt destroys the mind, reminding the audience that sin cannot be escaped."},{"r":"Act 5 Scene 5","m":"Hearing of his wife’s death, Macbeth reflects on the meaninglessness of life.","q":"a tale / Told by an idiot, full of sound and fury, / Signifying nothing","t1":["Metaphor","Life is a ‘tale’ told by an ‘idiot’.","Life seems meaningless and chaotic to him.","His nihilism is the logical end of rejecting God’s order."],"t2":["Theatrical metaphor","The imagery of performance makes life seem like a play.","It reminds the audience that they are watching a performance.","Shakespeare uses metatheatre to ask whether life has meaning without morality."],"cx":"Christian belief taught that life had divine purpose; denying this was despair, a sin.","wi":"Shakespeare shows the emptiness that ambition leaves behind."},{"r":"Act 5 Scene 8","m":"Macbeth is killed; Malcolm becomes king.","q":"this dead butcher, and his fiend-like queen","t1":["Dehumanising metaphor","Macbeth is reduced to a ‘butcher’.","He is remembered as a killer, not a king.","It contrasts with ‘valiant cousin’ in Act 1, showing the full arc of his fall."],"t2":["Compound adjective","‘fiend-like’ links Lady Macbeth to devils.","She is remembered as demonic.","Malcolm’s verdict restores order but simplifies their tragedy."],"cx":"The restoration of a rightful king affirms the Divine Right of Kings.","wi":"Shakespeare restores order to reassure the audience that evil is punished."}]},{"id":"rj","title":"Romeo and Juliet","author":"Shakespeare","kind":"Shakespeare play","paper":"Paper 1, Section A","col":"#B71C1C","ctx":[["Patriarchy","Fathers controlled daughters’ marriages; disobedience was shocking."],["Fate","Elizabethans believed the stars shaped human lives."],["Honour and feuds","Family honour mattered; insults demanded revenge."],["Courtly love","Romeo’s early love for Rosaline copies the clichés of Petrarchan poetry."],["Religion","Suicide was a mortal sin; the Friar represents the Church."]],"groups":[{"n":"Romeo","k":"Character","sum":"An impulsive, passionate young man whose love swings to violence.","quotes":[{"q":"O brawling love! O loving hate!","src":"Romeo, Act 1 Scene 1","f":[["Language","The oxymorons show confusion and the clash of love and violence."],["Form and structure","Exclamatory Petrarchan clichés show his love for Rosaline is performed rather than felt."],["Perceptive reading","The paradox foreshadows how love and hate become tangled in the play."],["Context","Courtly love poetry was full of such contradictions."],["Writer's intention","To show Romeo’s immaturity before he meets Juliet."]],"th":"Love · Conflict · Youth"},{"q":"Did my heart love till now? forswear it, sight!","src":"Romeo, Act 1 Scene 5","f":[["Language","The rhetorical question shows instant, overwhelming attraction."],["Form and structure","He switches into rhyming couplets, as if love creates poetry."],["Perceptive reading","His fickleness, forgetting Rosaline at once, questions how deep his love is."],["Context","Elizabethan audiences valued constancy in love."],["Writer's intention","To present love as sudden and dangerous."]],"th":"Love · Youth · Impulsiveness"},{"q":"O, I am fortune’s fool!","src":"Romeo, Act 3 Scene 1","f":[["Language","‘fool’ shows he feels mocked and controlled by fate."],["Form and structure","The exclamation comes straight after killing Tybalt, a turning point."],["Perceptive reading","He blames fortune rather than taking responsibility."],["Context","Elizabethans believed in fate and the stars."],["Writer's intention","To show the play turning towards tragedy."]],"th":"Fate · Conflict · Responsibility"}]},{"n":"Juliet","k":"Character","sum":"A young girl who grows into a determined woman willing to defy her family.","quotes":[{"q":"My only love sprung from my only hate!","src":"Juliet, Act 1 Scene 5","f":[["Language","The antithesis of ‘love’ and ‘hate’ shows the impossible situation."],["Form and structure","The rhyming couplet makes the realisation sound like a prophecy."],["Perceptive reading","Her love is defined from the start by the feud."],["Context","Family loyalty was expected above personal desire."],["Writer's intention","To show love trapped by conflict."]],"th":"Love · Conflict · Fate"},{"q":"Deny thy father and refuse thy name","src":"Juliet, Act 2 Scene 2","f":[["Language","The imperatives show her urging Romeo to reject his family."],["Form and structure","Spoken in soliloquy, she reveals private thoughts."],["Perceptive reading","She questions whether names and identity matter at all."],["Context","Rejecting one’s father challenged patriarchy."],["Writer's intention","To show love challenging family loyalty."]],"th":"Love · Identity · Family"},{"q":"My bounty is as boundless as the sea","src":"Juliet, Act 2 Scene 2","f":[["Language","The simile presents her love as limitless and natural."],["Form and structure","Alliteration of ‘bounty’ and ‘boundless’ creates a confident rhythm."],["Perceptive reading","Her mature language contrasts with Romeo’s clichés."],["Context","Young girls were expected to be modest."],["Writer's intention","To present Juliet as strong and sincere."]],"th":"Love · Gender · Maturity"}]},{"n":"Lord Capulet","k":"Character","sum":"Juliet’s father, kind at first but violently controlling when disobeyed.","quotes":[{"q":"My child is yet a stranger in the world","src":"Capulet to Paris, Act 1 Scene 2","f":[["Language","He presents Juliet as young and innocent."],["Form and structure","His gentle tone contrasts with his later rage."],["Perceptive reading","His protectiveness may be about control rather than care."],["Context","Fathers arranged daughters’ marriages."],["Writer's intention","To set up the change in Capulet."]],"th":"Family · Patriarchy · Youth"},{"q":"Hang thee young baggage, disobedient wretch!","src":"Capulet to Juliet, Act 3 Scene 5","f":[["Language","The insults ‘baggage’ and ‘wretch’ reduce Juliet to an object."],["Form and structure","Short exclamations show uncontrolled anger."],["Perceptive reading","He sees her as property to dispose of."],["Context","Daughters who disobeyed could be disowned."],["Writer's intention","To show the cruelty of patriarchy."]],"th":"Patriarchy · Conflict · Family"},{"q":"Death lies on her like an untimely frost","src":"Capulet, Act 4 Scene 5","f":[["Language","The simile presents Juliet as a flower killed by frost."],["Form and structure","Dramatic irony: the audience knows she is drugged."],["Perceptive reading","His grief shows love, too late to save her."],["Context","Early death was common, but untimely loss was tragic."],["Writer's intention","To build tragic irony."]],"th":"Death · Family · Fate"}]},{"n":"Mercutio and Tybalt","k":"Character","sum":"Mercutio’s wit and Tybalt’s hatred drive the violence of Act 3.","quotes":[{"q":"What, drawn, and talk of peace? I hate the word / As I hate hell, all Montagues, and thee","src":"Tybalt, Act 1 Scene 1","f":[["Language","Repetition of ‘hate’ shows Tybalt’s obsessive anger."],["Form and structure","The list builds to a personal threat."],["Perceptive reading","Linking peace with ‘hell’ shows how twisted his values are."],["Context","Honour culture encouraged violence."],["Writer's intention","To present the feud as irrational."]],"th":"Conflict · Hate · Honour"},{"q":"O calm, dishonourable, vile submission!","src":"Mercutio, Act 3 Scene 1","f":[["Language","The list of adjectives shows his disgust at Romeo’s peace."],["Form and structure","His outburst triggers the fatal fight."],["Perceptive reading","Mercutio values masculine honour over peace."],["Context","Young men proved masculinity through fighting."],["Writer's intention","To show toxic masculinity."]],"th":"Conflict · Masculinity · Honour"},{"q":"A plague o’ both your houses!","src":"Mercutio, Act 3 Scene 1","f":[["Language","The curse blames both families for his death."],["Form and structure","Repeated three times, it sounds like a prophecy."],["Perceptive reading","It foreshadows the deaths that destroy both houses."],["Context","Plague was a real fear in Elizabethan London."],["Writer's intention","To show the feud destroys the innocent."]],"th":"Conflict · Fate · Family"}]},{"n":"Love","k":"Theme","sum":"Love in the play is passionate, sudden and destructive.","quotes":[{"q":"A pair of star-cross’d lovers take their life","src":"Prologue","f":[["Language","‘star-cross’d’ suggests fate is against them."],["Form and structure","The sonnet form of the Prologue tells the ending first."],["Perceptive reading","‘take their life’ means both born and suicide."],["Context","Belief in astrology and fate."],["Writer's intention","To create tragic inevitability."]],"th":"Love · Fate · Death"},{"q":"These violent delights have violent ends","src":"Friar Lawrence, Act 2 Scene 6","f":[["Language","Repetition of ‘violent’ links passion with destruction."],["Form and structure","A warning just before the wedding."],["Perceptive reading","Love that burns fast will burn out."],["Context","The Friar represents religious moderation."],["Writer's intention","To warn against impulsive love."]],"th":"Love · Fate · Conflict"},{"q":"Thus with a kiss I die.","src":"Romeo, Act 5 Scene 3","f":[["Language","The kiss, a symbol of love, becomes a symbol of death."],["Form and structure","His final words echo their first meeting."],["Perceptive reading","Love and death are fully united."],["Context","Suicide was a sin; their deaths would shock."],["Writer's intention","To complete the tragedy."]],"th":"Love · Death · Fate"}]},{"n":"Fate and conflict","k":"Theme","sum":"The lovers are caught between fate and the families’ feud.","quotes":[{"q":"Two households, both alike in dignity","src":"Prologue","f":[["Language","‘alike’ shows both families are equally to blame."],["Form and structure","The opening line frames the whole play."],["Perceptive reading","‘dignity’ is ironic given their violence."],["Context","Feuds between noble families."],["Writer's intention","To show the conflict is pointless."]],"th":"Conflict · Family · Fate"},{"q":"Then I defy you, stars!","src":"Romeo, Act 5 Scene 1","f":[["Language","The imperative shows Romeo challenging fate."],["Form and structure","Comes when he hears of Juliet’s ‘death’."],["Perceptive reading","In trying to defy fate, he fulfils it."],["Context","The stars were believed to control destiny."],["Writer's intention","To deepen dramatic irony."]],"th":"Fate · Love · Death"},{"q":"O, I am fortune’s fool!","src":"Romeo, Act 3 Scene 1","f":[["Language","He feels like a puppet of fortune."],["Form and structure","Marks the play’s turning point."],["Perceptive reading","It may also show he avoids responsibility."],["Context","Fate versus free will."],["Writer's intention","To show tragedy taking hold."]],"th":"Fate · Conflict · Responsibility"}]}],"ctx9":[["Patriarchy","Fathers controlled their daughters’ marriages; disobedience could mean being disowned.","Capulet’s rage when Juliet refuses Paris reveals how Elizabethan daughters were treated as property to be exchanged."],["Fate and astrology","Elizabethans believed the stars shaped human destiny.","By calling the lovers ‘star-cross’d’, Shakespeare makes the audience watch a tragedy they know is already written in the heavens."],["Honour and masculinity","Young men defended family honour through violence and duels.","Mercutio’s disgust at Romeo’s ‘calm, dishonourable, vile submission’ shows how a toxic code of masculine honour fuels the deaths."],["Courtly love","Petrarchan poetry idealised unattainable women in clichéd paradoxes.","Romeo’s oxymorons about Rosaline parody courtly love, making his sincere sonnet with Juliet feel genuinely different."],["Religion","Marriage was a sacrament and suicide a mortal sin.","The lovers’ suicides would shock a Christian audience, yet Shakespeare invites sympathy rather than condemnation."],["Verona and feuds","Italian city states were associated with passion and violence; civil brawls threatened order.","The Prince’s threat of death for civil brawls shows how private feuds endanger the whole state."]],"voc":{"v":[["impetuous","acting quickly without thinking","Romeo’s impetuous love leads to secret marriage within a day."],["patriarchal","controlled by men, especially fathers","Capulet’s patriarchal authority treats Juliet as property."],["volatile","liable to change suddenly and violently","The feud creates a volatile Verona where violence erupts at any moment."],["defiance","open resistance to authority","Juliet’s defiance of her father marks her growth into independence."],["fatalistic","believing events are decided by fate","The Prologue’s fatalistic tone tells us the lovers are doomed."],["transient","lasting only a short time","Shakespeare presents passionate love as intense but transient."],["vengeful","wanting to harm someone in return for a wrong","Tybalt’s vengeful nature drives the tragedy forward."],["oxymoronic","combining contradictory ideas","Romeo’s oxymoronic language reveals his confused emotions."]],"m":[["L","Oxymoron","O brawling love! O loving hate!","Contradictions reveal the confusion between love and conflict.",1],["L","Light imagery","My bounty is as boundless as the sea","Expansive imagery shows love as limitless and pure.",1],["S","Prologue","A pair of star-cross’d lovers take their life","Revealing the ending creates dramatic irony and a sense of inevitability.",1],["S","Fast pace","The action spans just a few days","The rushed timescale mirrors the haste and impulsiveness of youth.",0],["F","Sonnet","The lovers’ first conversation forms a shared sonnet","Their shared poetry shows they are perfectly matched.",0],["F","Verse and prose","The Nurse and servants often speak in prose","Shifts between verse and prose signal status and emotion.",0]]},"chron":[{"r":"Prologue","m":"The Chorus tells the audience the lovers will die.","q":"A pair of star-cross’d lovers take their life","t1":["Compound adjective","‘star-cross’d’ means doomed by the stars.","The lovers are presented as victims of fate.","The phrase invites the audience to question whether fate or human choice causes tragedy."],"t2":["Sonnet form","The Prologue is a sonnet.","Using a love poem form for a death announcement links love and death.","The tight structure suggests the story is already fixed, like the lines of the poem."],"cx":"Elizabethans believed the stars influenced human lives.","wi":"Shakespeare creates dramatic irony so every hopeful moment feels tragic."},{"r":"Act 1 Scene 1","m":"Romeo mopes about Rosaline after the street brawl.","q":"O brawling love! O loving hate!","t1":["Oxymoron","‘brawling love’ and ‘loving hate’ join opposites.","Romeo’s confusion shows love as painful.","The phrases foreshadow how love and hate will be entangled in the feud."],"t2":["Petrarchan cliché","Romeo copies the conventions of courtly love poetry.","His language seems performed, not felt.","It contrasts with the genuine shared sonnet with Juliet later."],"cx":"Courtly love poetry was fashionable and full of such contradictions.","wi":"Shakespeare shows Romeo’s immaturity before he meets Juliet."},{"r":"Act 1 Scene 5","m":"At the Capulet feast, Romeo sees Juliet for the first time.","q":"Did my heart love till now? forswear it, sight!","t1":["Rhetorical question","Romeo asks whether he has ever truly loved before.","Rosaline is forgotten in a single moment.","His sudden change raises doubts about the depth of his feeling, yet the play will prove this love real and fatal."],"t2":["Imperative to the senses","He commands his ‘sight’ to deny his past love.","Love is presented as instant and visual.","Shakespeare hints that love born from sight can be rash, foreshadowing the haste that destroys the lovers."],"cx":"Elizabethans prized constancy in love, so Romeo’s quick change of heart would seem comic and immature.","wi":"Shakespeare presents love as sudden, overwhelming and dangerous."},{"r":"Act 1 Scene 5","m":"Juliet learns from the Nurse that Romeo is a Montague.","q":"My only love sprung from my only hate!","t1":["Antithesis","‘love’ and ‘hate’ are balanced against each other.","Juliet instantly grasps the impossibility of her situation.","The repeated ‘only’ suggests her love will be as absolute as the feud, so neither can coexist with the other."],"t2":["Rhyming couplet and exclamation","Her realisation is shaped into an exclamatory rhyme.","The neat form sounds like a prophecy.","Her first love is defined by the feud from the moment it begins."],"cx":"Family loyalty and obedience to fathers were expected above personal desire.","wi":"Shakespeare traps the lovers between love and family to create tragic tension."},{"r":"Act 2 Scene 2","m":"In the orchard, Juliet wishes Romeo were not a Montague.","q":"Deny thy father and refuse thy name","t1":["Imperatives","Juliet commands Romeo to reject his family.","She challenges the patriarchal idea that identity comes from the father.","Her boldness shows a girl becoming a woman who questions the rules of her society."],"t2":["Motif of names","Names represent family loyalty and inherited hatred.","Juliet suggests love should exist beyond labels.","Ironically, names will destroy them, so her wish is both idealistic and tragic."],"cx":"Fathers had legal power over children, and defying them was shocking and sinful.","wi":"Shakespeare questions inherited hatred and the authority of fathers."},{"r":"Act 2 Scene 6","m":"Friar Laurence warns Romeo just before the secret marriage.","q":"These violent delights have violent ends","t1":["Repetition","‘violent’ describes both the joy and its ending.","Intense pleasure is linked to intense destruction.","The Friar’s warning becomes a summary of the whole tragedy."],"t2":["Foreshadowing","The line predicts disaster at the moment of greatest happiness.","It creates dramatic irony for the audience.","Placed at the end of Act 2, the marriage becomes the hinge between comedy and tragedy."],"cx":"The Friar represents the Church’s teaching on moderation and self control.","wi":"Shakespeare uses the Friar to warn the audience against reckless passion."},{"r":"Act 3 Scene 1","m":"Mercutio is fatally wounded by Tybalt under Romeo’s arm.","q":"A plague o’ both your houses!","t1":["Curse","Mercutio’s dying words curse both the Montagues and the Capulets.","Belonging to neither family, he exposes the feud as pointless, killing the innocent bystander.","The curse is fulfilled when both houses lose their children, so it works like a prophecy that shapes the rest of the play."],"t2":["Repetition","He repeats the curse as he dies.","Each repetition sharpens the blame on both families equally.","The witty joker’s last words turn bitter, marking the moment the comedy of Acts 1 and 2 collapses into tragedy."],"cx":"Plague outbreaks regularly closed London’s theatres, so ‘plague’ carried real terror for an Elizabethan audience.","wi":"Shakespeare uses Mercutio’s death to make the audience feel that the feud destroys everyone it touches."},{"r":"Act 3 Scene 1","m":"Romeo kills Tybalt in revenge and realises he is now banished.","q":"O, I am fortune’s fool!","t1":["Metaphor","Romeo casts himself as the ‘fool’ of fortune, a jester mocked by fate.","The image suggests he feels powerless, a plaything of forces beyond him.","Yet he chose to fight, so the metaphor reveals his habit of blaming fate rather than accepting responsibility."],"t2":["Exclamation at the turning point","The anguished exclamation comes straight after the killing.","It marks the structural centre of the play, where hope gives way to disaster.","His impulsiveness, the same quality that made his love so intense, has now sealed his fate."],"cx":"Elizabethans pictured Fortune as a goddess spinning a wheel that raised and dropped people at random.","wi":"Shakespeare invites the audience to judge whether fate or rash choices cause the tragedy."},{"r":"Act 3 Scene 5","m":"Capulet explodes when Juliet refuses to marry Paris.","q":"Hang thee young baggage, disobedient wretch!","t1":["Dehumanising insults","‘baggage’ and ‘wretch’ reduce Juliet to worthless property.","The father who called her ‘a stranger in the world’ in Act 1 now treats her as an object to be disposed of.","His rage shows that a daughter’s value depended entirely on obedience."],"t2":["Imperative","‘Hang thee’ is a violent command.","It shows how quickly paternal love turns into threat.","The command isolates Juliet, pushing her towards the Friar’s dangerous plan."],"cx":"Fathers had legal authority to choose husbands; a disobedient daughter could be disowned and left destitute.","wi":"Shakespeare exposes the cruelty of patriarchal control and makes the audience sympathise with Juliet’s defiance."},{"r":"Act 4 Scene 5","m":"The Capulets find Juliet seemingly dead on her wedding morning.","q":"Death lies on her like an untimely frost","t1":["Simile","Death settles on her ‘like an untimely frost’ on a flower.","Juliet becomes a bloom killed before it could open, stressing her youth.","Natural imagery suggests her death is a violation of the natural order caused by human hatred."],"t2":["Personification","Death ‘lies’ on her, as a lover would.","Death is imagined as Juliet’s bridegroom, replacing Paris.","The dark image foreshadows the final scene where love and death truly unite."],"cx":"With high child mortality, Elizabethan audiences knew the grief of losing young people.","wi":"Shakespeare lets the audience grieve with the Capulets while knowing, through dramatic irony, that worse is to come."},{"r":"Act 5 Scene 1","m":"In Mantua, Romeo hears that Juliet is dead.","q":"Then I defy you, stars!","t1":["Apostrophe","Romeo addresses the stars directly.","He tries to challenge the fate announced in the Prologue.","Ironically, his defiance is the very act that fulfils the prophecy of ‘star-cross’d lovers’."],"t2":["Exclamatory monosyllables","The short, forceful words show instant decision.","His haste mirrors the speed of his love in Act 1.","Impulsiveness, his fatal flaw, drives him to the tomb without waiting for news from the Friar."],"cx":"Elizabethans believed defying fate was both futile and proud.","wi":"Shakespeare uses dramatic irony so the audience longs for Romeo to wait, intensifying the tragedy."},{"r":"Act 5 Scene 3","m":"Romeo drinks the poison beside Juliet in the Capulet tomb.","q":"Thus with a kiss I die.","t1":["Monosyllables","The line is made of simple, calm words.","Death is presented as peaceful, almost tender.","The quiet contrasts with the noisy violence of the feud, suggesting love finds peace only in death."],"t2":["Symbolism of the kiss","The kiss symbolises love and union.","It echoes their first kiss in Act 1, bringing the play full circle.","Love and death become one act, the final fulfilment of ‘violent delights have violent ends’."],"cx":"Suicide was a mortal sin for Elizabethans, so the lovers’ deaths would shock and trouble the audience.","wi":"Shakespeare makes the audience feel the waste caused by hatred, leading to the families’ reconciliation."}]},{"id":"tem","title":"The Tempest","author":"Shakespeare","kind":"Shakespeare play","paper":"Paper 1, Section A","col":"#0277BD","ctx":[["Colonialism","Europeans were exploring and colonising the Americas; reports of a shipwreck in Bermuda (1609) inspired the play."],["Divine Right","Usurping a ruler, like Antonio did, broke God’s order."],["Magic","James I feared witchcraft; Prospero’s ‘white’ magic is learned, Sycorax’s is evil."],["Last play","Often read as Shakespeare’s farewell to the theatre."],["Masques","Courtly entertainments with music and spectacle."]],"groups":[{"n":"Prospero","k":"Character","sum":"The exiled Duke of Milan, a powerful magician who controls the island and chooses forgiveness.","quotes":[{"q":"Me, poor man, my library / Was dukedom large enough","src":"Prospero, Act 1 Scene 2","f":[["Language","He admits he neglected his duties for books."],["Form and structure","Told to Miranda in a long exposition."],["Perceptive reading","His love of learning caused his downfall."],["Context","Rulers had a duty to govern."],["Writer's intention","To show Prospero’s flaws."]],"th":"Power · Knowledge · Responsibility"},{"q":"The rarer action is / In virtue than in vengeance","src":"Prospero, Act 5 Scene 1","f":[["Language","He chooses forgiveness over revenge."],["Form and structure","A turning point in the final act."],["Perceptive reading","True power is shown in mercy."],["Context","Christian teaching on forgiveness."],["Writer's intention","To show the value of mercy."]],"th":"Forgiveness · Power · Morality"},{"q":"I’ll break my staff, / Bury it certain fathoms in the earth","src":"Prospero, Act 5 Scene 1","f":[["Language","He gives up his magic power."],["Form and structure","Often read as Shakespeare’s farewell to theatre."],["Perceptive reading","Giving up power shows wisdom."],["Context","Fear of magic in Jacobean England."],["Writer's intention","To show the renunciation of control."]],"th":"Power · Magic · Change"}]},{"n":"Caliban","k":"Character","sum":"The island’s original inhabitant, enslaved by Prospero.","quotes":[{"q":"This island’s mine, by Sycorax my mother","src":"Caliban, Act 1 Scene 2","f":[["Language","He claims the island by inheritance."],["Form and structure","His speech is in verse, showing eloquence."],["Perceptive reading","He challenges Prospero’s right to rule."],["Context","European colonisers took land from natives."],["Writer's intention","To question colonial rights."]],"th":"Colonialism · Power · Identity"},{"q":"You taught me language, and my profit on’t / Is, I know how to curse","src":"Caliban, Act 1 Scene 2","f":[["Language","He turns language, a gift, into a weapon."],["Form and structure","Bitter, defiant tone."],["Perceptive reading","Colonisers’ culture is used to resist them."],["Context","Colonisers imposed their language."],["Writer's intention","To give voice to the colonised."]],"th":"Colonialism · Language · Power"},{"q":"The isle is full of noises, / Sounds, and sweet airs, that give delight, and hurt not","src":"Caliban, Act 3 Scene 2","f":[["Language","Beautiful imagery shows his love for the island."],["Form and structure","Lyrical verse contrasts with his curses."],["Perceptive reading","He is more sensitive than others assume."],["Context","Europeans saw natives as savages."],["Writer's intention","To humanise Caliban."]],"th":"Nature · Identity · Colonialism"}]},{"n":"Ariel","k":"Character","sum":"A spirit who serves Prospero in return for freedom.","quotes":[{"q":"All hail, great master! grave sir, hail!","src":"Ariel, Act 1 Scene 2","f":[["Language","Formal greeting shows obedience."],["Form and structure","Contrasts with Caliban’s curses."],["Perceptive reading","Obedience is a strategy to gain freedom."],["Context","Servants owed loyalty to masters."],["Writer's intention","To show different responses to power."]],"th":"Power · Freedom · Service"},{"q":"Full fathom five thy father lies","src":"Ariel’s song, Act 1 Scene 2","f":[["Language","Alliteration creates a hypnotic song."],["Form and structure","Music is part of Ariel’s magic."],["Perceptive reading","The lie deceives Ferdinand into grief."],["Context","Masques used songs and music."],["Writer's intention","To show the power of illusion."]],"th":"Magic · Deception · Nature"},{"q":"Do you love me, master? no?","src":"Ariel, Act 4 Scene 1","f":[["Language","The question shows a desire for affection."],["Form and structure","A tender moment amid commands."],["Perceptive reading","Their relationship may be more than servitude."],["Context","Master and servant relationships."],["Writer's intention","To add emotional depth."]],"th":"Power · Freedom · Love"}]},{"n":"Miranda","k":"Character","sum":"Prospero’s innocent daughter who falls in love with Ferdinand.","quotes":[{"q":"O, I have suffered / With those that I saw suffer","src":"Miranda, Act 1 Scene 2","f":[["Language","She shows compassion for the shipwrecked."],["Form and structure","Her first speech establishes her kindness."],["Perceptive reading","She contrasts with her father’s control."],["Context","Women were expected to be gentle."],["Writer's intention","To present innocence and empathy."]],"th":"Compassion · Gender · Innocence"},{"q":"I am your wife, if you will marry me","src":"Miranda, Act 3 Scene 1","f":[["Language","She boldly proposes to Ferdinand."],["Form and structure","Short, direct sentences show honesty."],["Perceptive reading","She takes control of her own future."],["Context","Women were not expected to propose."],["Writer's intention","To present Miranda as bolder than expected."]],"th":"Love · Gender · Freedom"},{"q":"O brave new world, / That has such people in’t!","src":"Miranda, Act 5 Scene 1","f":[["Language","Exclamation shows wonder and innocence."],["Form and structure","Dramatic irony: the people include villains."],["Perceptive reading","Her naivety contrasts with the audience’s knowledge."],["Context","European excitement about the ‘New World’."],["Writer's intention","To question innocence and discovery."]],"th":"Innocence · Colonialism · Change"}]},{"n":"Power and colonialism","k":"Theme","sum":"The play explores who has the right to rule land and people.","quotes":[{"q":"Abhorred slave","src":"Prospero (some editions give it to Miranda), Act 1 Scene 2","f":[["Language","Harsh insult dehumanises Caliban."],["Form and structure","Spoken in anger."],["Perceptive reading","Shows colonial attitudes towards natives."],["Context","Slavery and colonisation."],["Writer's intention","To expose cruelty of colonisers."]],"th":"Colonialism · Power · Prejudice"},{"q":"this thing of darkness I / Acknowledge mine","src":"Prospero about Caliban, Act 5 Scene 1","f":[["Language","‘thing’ dehumanises, yet ‘mine’ accepts responsibility."],["Form and structure","Enjambment emphasises ‘Acknowledge’."],["Perceptive reading","He may recognise his own darkness."],["Context","Colonisers’ responsibility."],["Writer's intention","To show complex ownership."]],"th":"Power · Responsibility · Colonialism"},{"q":"Hell is empty, / And all the devils are here","src":"Ariel reporting Ferdinand, Act 1 Scene 2","f":[["Language","Hyperbole shows terror in the storm."],["Form and structure","Early in the play, sets up chaos."],["Perceptive reading","The real devils may be the humans."],["Context","Fear of the supernatural."],["Writer's intention","To show human evil."]],"th":"Power · Evil · Magic"}]},{"n":"Forgiveness and illusion","k":"Theme","sum":"Magic and theatre blur reality; the play ends in forgiveness.","quotes":[{"q":"We are such stuff / As dreams are made on","src":"Prospero, Act 4 Scene 1","f":[["Language","Life is compared to a dream."],["Form and structure","Comes after the masque ends."],["Perceptive reading","Life, like theatre, is temporary."],["Context","Shakespeare’s late reflections on life."],["Writer's intention","To reflect on mortality."]],"th":"Illusion · Mortality · Theatre"},{"q":"Our revels now are ended","src":"Prospero, Act 4 Scene 1","f":[["Language","‘revels’ means entertainment; it ends."],["Form and structure","Abrupt end to the masque."],["Perceptive reading","May be Shakespeare’s farewell to theatre."],["Context","Masques performed at court."],["Writer's intention","To show endings and transience."]],"th":"Theatre · Illusion · Change"},{"q":"As you from crimes would pardon’d be, / Let your indulgence set me free.","src":"Prospero, Epilogue","f":[["Language","He asks the audience for forgiveness."],["Form and structure","The epilogue breaks the fourth wall."],["Perceptive reading","The audience has power over him."],["Context","Christian ideas of mutual forgiveness."],["Writer's intention","To end with mercy."]],"th":"Forgiveness · Freedom · Theatre"}]}],"ctx9":[["Colonialism","Europeans were colonising the Americas; reports of a 1609 shipwreck in Bermuda inspired the play.","Caliban’s claim that ‘This island’s mine’ voices the dispossession of native peoples, inviting t
