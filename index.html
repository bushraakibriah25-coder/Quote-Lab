ntion","To satirise society."],["Critical and conceptual reading","The famous opening sounds like universal wisdom but is really gossip, since it is women who need rich husbands. Conceptually, irony exposes the economic truth beneath romantic convention. A critical reading sees Austen’s narrator using wit to criticise a society she cannot openly attack."]],"th":"Marriage · Money · Irony"},{"q":"Happiness in marriage is entirely a matter of chance.","src":"Charlotte, Chapter 6","f":[["Language","Cynical view."],["Form and structure","Foreshadows her marriage."],["Perceptive reading","Practicality over romance."],["Context","Women’s options."],["Writer's intention","To present realism."],["Critical and conceptual reading","Charlotte presents marital happiness as pure chance. Conceptually, her cynicism contrasts with Elizabeth’s belief in mutual respect. A critical reading notes that the novel tests both views, rewarding Elizabeth while showing Charlotte’s realism has its own logic."]],"th":"Marriage · Love · Gender"},{"q":"I am not romantic, you know","src":"Charlotte, Chapter 22","f":[["Language","Honest admission."],["Form and structure","Contrasts Elizabeth."],["Perceptive reading","Security matters."],["Context","Economic need."],["Writer's intention","To show different choices."],["Critical and conceptual reading","Charlotte’s frank admission reveals the limited choices facing women without money. Conceptually, marriage becomes a home rather than a romance. A feminist reading sees her honesty as a quiet critique of a society that gave women no other route to security."]],"th":"Marriage · Money · Gender"}]}],"ctx9":[["Marriage and money","Women needed marriage for financial security.","Charlotte’s acceptance of Mr Collins shows marriage as an economic necessity for women."],["Entailment","Longbourn passes to Mr Collins, not the Bennet daughters.","The entail explains Mrs Bennet’s desperation to marry off her daughters."],["Class","Landed gentry and aristocracy guarded their status.","Lady Catherine’s fury at the ‘polluted’ shades of Pemberley satirises aristocratic snobbery."],["Regency manners","Reputation and propriety mattered greatly.","Lydia’s elopement threatens the whole family’s reputation, not just her own."],["Irony","Austen used free indirect speech and irony to satirise society.","The famous opening line ironically reveals that it is women who need wealthy husbands."],["Austen’s life","She never married and depended on her family.","Austen’s own situation gives her portrayal of women’s limited options its sharpness."]],"voc":{"v":[["prejudice","an opinion formed without knowledge","Elizabeth’s prejudice against Darcy blinds her to his worth."],["propriety","correct social behaviour","Lydia’s elopement breaks every rule of propriety."],["mercenary","motivated by money","Charlotte’s marriage seems mercenary but is practical."],["entailment","a legal rule passing property to male heirs","The entailment leaves the Bennet sisters without security."],["pompous","self important","Mr Collins is pompous and ridiculous."],["vulgarity","lack of good manners","Mrs Bennet’s vulgarity embarrasses Elizabeth."],["condescension","behaving as if superior","Lady Catherine’s condescension reveals class arrogance."],["epiphany","a sudden realisation","Elizabeth’s epiphany comes after reading Darcy’s letter."]],"m":[["L","Irony","It is a truth universally acknowledged","The opening mocks society’s obsession with marriage.",1],["L","Free indirect discourse","Till this moment I never knew myself.","Austen moves inside Elizabeth’s thoughts while keeping ironic distance.",1],["S","Two proposals","Darcy proposes twice","The contrast shows how both characters have changed.",0],["S","Letter","Darcy’s letter after the first proposal","The letter turns the plot and Elizabeth’s judgement.",0],["F","Novel of manners","Balls, visits and dinners","Social rituals expose character and class.",0],["F","Romantic comedy","Misunderstanding leads to happy marriage","Comedy allows Austen to criticise society gently.",0]]},"chron":[{"r":"Chapter 1","m":"The narrator opens with a famous observation as Mrs Bennet hears of Bingley.","q":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife","t1":["Irony","The grand claim of a ‘truth universally acknowledged’ is really gossip.","In practice it is women who need rich husbands, not the reverse.","Austen’s narrator mocks a society that dresses economic need up as universal truth."],"t2":["Hyperbole and formal register","The lofty, philosophical tone exaggerates the claim.","The style sounds like a moral essay.","The gap between grand style and trivial subject sets up the novel’s comic satire."],"cx":"Under the law of entail and coverture, women had few ways to secure money except through marriage.","wi":"Austen opens with satire so readers question society’s obsession with marriage and money."},{"r":"Chapter 3","m":"At the Meryton ball, Darcy refuses to dance with Elizabeth within her hearing.","q":"She is tolerable, but not handsome enough to tempt me","t1":["Understatement","‘tolerable’ is cold, faint praise.","Darcy dismisses Elizabeth as barely acceptable.","The insult creates Elizabeth’s prejudice and wounds her pride, giving the title its double meaning."],"t2":["Overheard speech","Elizabeth hears the remark by chance.","First impressions are formed on partial information.","The novel’s original title, ‘First Impressions’, shows how this moment shapes the plot."],"cx":"Upper class men had great social power; being chosen as a dance partner mattered for a woman’s prospects.","wi":"Austen shows how pride and hasty judgement shape relationships."},{"r":"Chapter 22","m":"Charlotte Lucas explains why she has accepted Mr Collins.","q":"I am not romantic, you know; I never was. I ask only a comfortable home","t1":["Plain declaratives","Charlotte states her choice calmly.","She chooses security over love.","Her honesty exposes the harsh economics facing women without fortune."],"t2":["Contrast with Elizabeth","Charlotte accepts the proposal Elizabeth rejected.","The parallel invites comparison.","Austen neither fully condemns nor praises Charlotte, making readers think about women’s limited choices."],"cx":"At twenty seven, unmarried and without money, Charlotte risked becoming a burden on her family.","wi":"Austen exposes how marriage was often a financial necessity for women."},{"r":"Chapter 34","m":"Darcy proposes to Elizabeth at Hunsford.","q":"In vain I have struggled. It will not do.","t1":["Short sentences","The abrupt sentences burst out of Darcy.","His feelings overpower his pride.","The language of ‘struggle’ shows he sees loving Elizabeth as a defeat, revealing his arrogance even as he proposes."],"t2":["Inversion","‘In vain I have struggled’ places the struggle first.","His resistance is emphasised.","The proposal is insulting because it stresses her inferiority."],"cx":"Marrying beneath one’s class was seen as degrading.","wi":"Austen shows pride corrupting even love."},{"r":"Chapter 34","m":"Elizabeth angrily rejects Darcy’s proposal.","q":"you were the last man in the world whom I could ever be prevailed on to marry","t1":["Hyperbole","‘the last man in the world’ is an absolute rejection.","Elizabeth’s anger is total.","The extreme language becomes ironic, since she will later marry him, showing how prejudice blinds her."],"t2":["Formal diction","‘prevailed on’ is polite yet cutting.","She maintains decorum while delivering an insult.","Her controlled fury shows a woman claiming the right to refuse, rare in her society."],"cx":"Refusing a wealthy man was almost unthinkable for a woman with little fortune.","wi":"Austen presents Elizabeth as a heroine who values respect over money."},{"r":"Chapter 36","m":"After reading Darcy’s letter, Elizabeth realises she misjudged him and Wickham.","q":"Till this moment I never knew myself.","t1":["Epiphany","The line marks sudden self knowledge.","Elizabeth recognises her own prejudice.","It is the turning point of the novel, where the heroine changes before the hero does."],"t2":["Free indirect discourse","Austen moves inside Elizabeth’s thoughts.","Readers experience her shame directly.","The technique blends narrator and character, letting Austen judge Elizabeth gently while sympathising."],"cx":"Georgian ideals praised reason and self examination.","wi":"Austen shows that wisdom comes from recognising one’s own faults."},{"r":"Chapter 56","m":"Lady Catherine confronts Elizabeth about a rumoured engagement to Darcy.","q":"Are the shades of Pemberley to be thus polluted?","t1":["Rhetorical question","Lady Catherine asks in outrage.","She sees Elizabeth as a threat to her family’s status.","Her grand language makes her snobbery ridiculous."],"t2":["Metaphor of pollution","‘polluted’ presents Elizabeth as dirt.","Class mixing is seen as contamination.","Austen mocks the aristocracy’s fear of social change."],"cx":"The landed gentry guarded their estates and bloodlines.","wi":"Austen satirises aristocratic arrogance."},{"r":"Chapter 56","m":"Lady Catherine leaves in fury after Elizabeth refuses to promise anything.","q":"Obstinate, headstrong girl!","t1":["Exclamation","Lady Catherine’s insult is furious.","She cannot control Elizabeth.","The ‘insult’ is praise to readers: Elizabeth’s independence is her virtue."],"t2":["Adjectives","‘Obstinate, headstrong’ condemn Elizabeth’s will.","Women were expected to be obedient.","The visit ironically gives Darcy hope, bringing the lovers together."],"cx":"Young women were expected to defer to their social superiors.","wi":"Austen celebrates female independence."}]},{"id":"fr","title":"Frankenstein","author":"Mary Shelley","kind":"19th century novel","paper":"Paper 1, Section B","col":"#1B5E20","ctx":[["Science","Galvanism experiments used electricity on dead bodies."],["Romanticism","Nature is sublime and healing; ambition defies it."],["Gothic","Horror, isolation and monstrous creations."],["Prometheus","The Titan punished for stealing fire from the gods."],["Mary Shelley","Written aged 18 in 1816; published 1818."]],"groups":[{"n":"Victor Frankenstein","k":"Character","sum":"A scientist whose ambition creates life and destroys everyone he loves.","quotes":[{"q":"the beauty of the dream vanished, and breathless horror and disgust filled my heart","src":"Victor, Chapter 5","f":[["Language","Contrast of ‘beauty’ and ‘horror’."],["Form and structure","Turning point at creation."],["Perceptive reading","His ambition turns to revulsion."],["Context","Galvanism experiments."],["Writer's intention","To warn against ambition."],["Critical and conceptual reading","Victor’s dream of beautiful creation turns instantly to disgust. Conceptually, his rejection of the creature is based on appearance, the first of many such judgements. A psychoanalytic reading sees a parent abandoning a newborn, the original wound behind the creature’s violence."]],"th":"Ambition · Science · Horror"},{"q":"Learn from me, if not by my precepts, at least by my example, how dangerous is the acquirement of knowledge","src":"Victor to Walton, Chapter 4","f":[["Language","Imperative warns Walton."],["Form and structure","Frame narrative."],["Perceptive reading","Knowledge can destroy."],["Context","Enlightenment science."],["Writer's intention","To warn readers."],["Critical and conceptual reading","Victor’s warning to Walton turns his story into a cautionary tale. Conceptually, knowledge pursued without ethics is presented as dangerous. A critical reading links this to Romantic anxieties about Enlightenment science and industrial progress."]],"th":"Knowledge · Ambition · Danger"},{"q":"A new species would bless me as its creator","src":"Victor, Chapter 4","f":[["Language","He imagines being worshipped."],["Form and structure","Shows hubris."],["Perceptive reading","Playing God."],["Context","Religious concerns."],["Writer's intention","To show arrogance."],["Critical and conceptual reading","Victor imagines himself as a god worshipped by a new species. Conceptually, his ambition is hubris, the desire to replace God and women in creation. A feminist reading sees male science trying to bypass female reproduction."]],"th":"Ambition · Religion · Power"}]},{"n":"The Creature","k":"Character","sum":"Victor’s creation, gentle at first, made monstrous by rejection.","quotes":[{"q":"I ought to be thy Adam, but I am rather the fallen angel","src":"The Creature, Chapter 10","f":[["Language","Biblical allusion to Paradise Lost."],["Form and structure","Eloquent speech."],["Perceptive reading","He feels rejected by his creator."],["Context","Christian creation stories."],["Writer's intention","To create sympathy."],["Critical and conceptual reading","The creature compares himself to Adam and Satan from ‘Paradise Lost’. Conceptually, Victor is cast as a failed God who abandoned his creation. A critical reading sees the creature as the more sympathetic and articulate figure."]],"th":"Religion · Rejection · Identity"},{"q":"I am malicious because I am miserable","src":"The Creature, Chapter 17","f":[["Language","Cause and effect shows nurture."],["Form and structure","Short, balanced sentence."],["Perceptive reading","Society creates monsters."],["Context","Nature versus nurture."],["Writer's intention","To question who is monstrous."],["Critical and conceptual reading","The creature explicitly links cause and effect: misery has made him malicious. Conceptually, Shelley argues that society creates its own monsters through rejection. A Rousseauian reading sees natural goodness corrupted by cruelty, so responsibility lies with Victor and the villagers as much as the creature."]],"th":"Isolation · Nurture · Revenge"},{"q":"I shall be with you on your wedding-night","src":"The Creature, Chapter 20","f":[["Language","A chilling threat."],["Form and structure","Foreshadows Elizabeth’s death."],["Perceptive reading","Revenge targets love."],["Context","Gothic suspense."],["Writer's intention","To build tension."],["Critical and conceptual reading","The creature’s chilling promise foreshadows Elizabeth’s murder. Conceptually, revenge targets Victor’s domestic happiness, the life the creature was denied. A critical reading notes Victor’s selfish misreading, assuming he is the target, which shows his inability to imagine others’ suffering."]],"th":"Revenge · Love · Fear"}]},{"n":"Robert Walton","k":"Character","sum":"An ambitious explorer whose letters frame the novel.","quotes":[{"q":"One man’s life or death were but a small price to pay","src":"Walton, Letter 4","f":[["Language","He devalues life for discovery."],["Form and structure","Echoes Victor."],["Perceptive reading","Ambition blinds him."],["Context","Exploration age."],["Writer's intention","To parallel Victor."],["Critical and conceptual reading","Walton values discovery above a human life, mirroring Victor’s reckless ambition. Conceptually, the frame narrator is a warning double who meets Victor at the moment he could still turn back. A critical reading sees his final decision to sail home as the lesson the novel hopes readers will learn."]],"th":"Ambition · Knowledge · Danger"},{"q":"I have no friend, Margaret","src":"Walton, Letter 2","f":[["Language","Direct address shows loneliness."],["Form and structure","Letters frame the story."],["Perceptive reading","Isolation links all narrators."],["Context","Epistolary form."],["Writer's intention","To show isolation."],["Critical and conceptual reading","Walton’s longing for a friend reveals a loneliness shared by Victor and the creature. Conceptually, isolation is the novel’s central disease, and companionship its missing cure. A critical reading links this to Romantic ideals of sympathy as the basis of moral life."]],"th":"Isolation · Friendship · Ambition"},{"q":"You seek for knowledge and wisdom, as I once did","src":"Victor to Walton, Letter 4","f":[["Language","Victor sees himself in Walton."],["Form and structure","Frame narrative."],["Perceptive reading","A warning passed on."],["Context","Romantic ideas."],["Writer's intention","To show cycles of ambition."],["Critical and conceptual reading","Victor sees his younger self in Walton, so his story becomes a warning. Conceptually, the pursuit of knowledge is presented as seductive and dangerous. A critical reading notes the novel’s layered structure turns readers into the next listeners who must heed the lesson."]],"th":"Knowledge · Ambition · Warning"}]},{"n":"Elizabeth","k":"Character","sum":"Victor’s adopted sister and bride, a victim of his ambition.","quotes":[{"q":"a pretty present for my Victor","src":"Victor’s mother, Chapter 1","f":[["Language","Elizabeth is presented as a gift."],["Form and structure","Possessive language."],["Perceptive reading","Women treated as objects."],["Context","Gender roles."],["Writer's intention","To criticise women’s passivity."],["Critical and conceptual reading","Elizabeth is introduced as a ‘pretty present’ given to Victor as a child. Conceptually, she is treated as property rather than a person. A feminist reading critiques her lack of voice and agency, which makes her the passive victim of male conflict."]],"th":"Gender · Family · Love"},{"q":"She was there, lifeless and inanimate, thrown across the bed","src":"Victor, Chapter 23","f":[["Language","Brutal image of death."],["Form and structure","Climax of revenge."],["Perceptive reading","Victor’s ambition kills her."],["Context","Gothic horror."],["Writer's intention","To show consequences."],["Critical and conceptual reading","Elizabeth’s lifeless body reverses Victor’s act of creation, turning ambition into death. Conceptually, ‘inanimate’ echoes the matter Victor once animated. A feminist reading sees women in the novel suffering for male ambition, from Justine to the destroyed female creature."]],"th":"Death · Revenge · Love"},{"q":"the beautiful and adored companion of all my occupations and my pleasures","src":"Victor, Chapter 1","f":[["Language","Idealised description."],["Form and structure","Possessive tone."],["Perceptive reading","Elizabeth lacks her own voice."],["Context","Ideal Victorian woman."],["Writer's intention","To show passive women."],["Critical and conceptual reading","Victor idealises Elizabeth as a beautiful companion to his pleasures. Conceptually, she exists in his narrative to serve his happiness. A feminist reading notes that, unlike the creature, she is never given a voice to tell her own story."]],"th":"Gender · Love · Family"}]},{"n":"Isolation","k":"Theme","sum":"Rejection and loneliness turn characters to despair and violence.","quotes":[{"q":"I was benevolent and good; misery made me a fiend","src":"The Creature, Chapter 10","f":[["Language","Contrast shows transformation."],["Form and structure","Balanced sentence."],["Perceptive reading","Society creates evil."],["Context","Rousseau’s ideas of nature."],["Writer's intention","To argue for compassion."],["Critical and conceptual reading","The creature’s balanced statement charts his fall from goodness to violence. Conceptually, nurture, not nature, makes the ‘fiend’. A critical reading sees this line as the moral centre of the novel, placing blame on a society that rejects difference."]],"th":"Isolation · Nurture · Morality"},{"q":"Satan had his companions, fellow devils","src":"The Creature, Chapter 15","f":[["Language","Even Satan was less alone."],["Form and structure","Biblical allusion."],["Perceptive reading","His isolation is absolute."],["Context","Paradise Lost."],["Writer's intention","To create sympathy."],["Critical and conceptual reading","The creature envies Satan, who at least had fellow devils for company. Conceptually, isolation is presented as worse than damnation. A critical reading sees Shelley’s allusions to ‘Paradise Lost’ deepening sympathy for the outcast."]],"th":"Isolation · Religion · Rejection"},{"q":"When I looked around I saw and heard of none like me","src":"The Creature, Chapter 13","f":[["Language","He realises he is unique and alone."],["Form and structure","Reflective tone."],["Perceptive reading","Identity crisis."],["Context","Enlightenment ideas."],["Writer's intention","To show loneliness."],["Critical and conceptual reading","The creature’s realisation that there is ‘none like me’ is devastating. Conceptually, knowledge brings pain, as education reveals what he lacks. A critical reading sees isolation as the true source of his violence."]],"th":"Isolation · Identity · Rejection"}]},{"n":"Science and creation","k":"Theme","sum":"Unchecked science creates horror.","quotes":[{"q":"dull yellow eye of the creature open","src":"Victor, Chapter 5","f":[["Language","Colour imagery creates horror."],["Form and structure","Moment of creation."],["Perceptive reading","Life without beauty."],["Context","Galvanism."],["Writer's intention","To create horror."],["Critical and conceptual reading","The ‘dull yellow eye’ opening marks the moment of creation as horror rather than triumph. Conceptually, the beauty Victor imagined is replaced by the sickly colour of disease. A Gothic reading links the scene to the sublime: wonder and terror combined."]],"th":"Science · Horror · Creation"},{"q":"his yellow skin scarcely covered the work of muscles and arteries","src":"Victor, Chapter 5","f":[["Language","Grotesque detail."],["Form and structure","Gothic description."],["Perceptive reading","Creation is unnatural."],["Context","Anatomy studies."],["Writer's intention","To show science’s dark side."],["Critical and conceptual reading","The creature’s yellow skin barely covers ‘muscles and arteries’, exposing the body’s machinery. Conceptually, Victor’s attempt to perfect life produces something grotesque. A critical reading sees science stripping life of its mystery and dignity."]],"th":"Science · Horror · Nature"},{"q":"Learn from me","src":"Victor, Chapter 4","f":[["Language","Imperative warning."],["Form and structure","Narrative frame."],["Perceptive reading","Knowledge’s danger."],["Context","Enlightenment."],["Writer's intention","To warn readers."],["Critical and conceptual reading","Victor’s repeated warning closes the theme of dangerous knowledge. Conceptually, it is the novel’s moral, aimed at Walton and at readers. A critical reading links it to the age of galvanism, when science seemed to promise power over life itself."]],"th":"Science · Ambition · Danger"}]}],"ctx9":[["Galvanism","Scientists experimented with electricity on dead bodies.","Victor’s ‘spark of being’ reflects real experiments that made reanimation seem possible."],["Romanticism","Nature was seen as sublime and healing.","Victor finds peace in the Alps, suggesting nature’s power to restore what ambition destroys."],["Prometheus","The Titan punished for giving fire to humanity.","The subtitle presents Victor as a modern Prometheus, punished for overreaching."],["Paradise Lost","Milton’s epic about Satan’s rebellion.","The creature’s comparison to ‘the fallen angel’ shows him rejected by his creator."],["Nature versus nurture","Rousseau argued humans are born good and corrupted by society.","The creature’s claim that ‘misery made me a fiend’ argues that society creates monsters."],["Mary Shelley","Wrote the novel at 18; her mother died soon after her birth.","Shelley’s own losses may shape the novel’s focus on absent parents and abandoned creations."]],"voc":{"v":[["hubris","excessive pride","Victor’s hubris leads him to play God."],["abhorrent","inspiring disgust","Victor finds his creation abhorrent."],["isolation","being alone and cut off","Isolation turns the Creature to violence."],["monstrous","very ugly or wicked","The novel asks who is truly monstrous."],["benevolent","kind","The Creature begins benevolent but is rejected."],["transgressive","going beyond accepted limits","Victor’s science is transgressive."],["sublime","awe inspiring beauty or terror","The sublime Alps contrast with Victor’s guilt."],["culpability","responsibility for wrongdoing","Victor never fully accepts his culpability."]],"m":[["L","Biblical allusion","I ought to be thy Adam, but I am rather the fallen angel","The Creature compares himself to Satan, casting Victor as a failed God.",1],["L","Emotive contrast","I was benevolent and good; misery made me a fiend","Society, not nature, creates monsters.",1],["S","Frame narrative","Walton’s letters frame Victor’s and the Creature’s stories","Layers of narration make truth uncertain.",0],["S","Parallel characters","Walton mirrors Victor","Walton’s choice to turn back shows a lesson learned.",0],["F","Gothic","Night time creation and graveyards","Gothic horror explores the dangers of ambition.",0],["F","Epistolary","Letters to Margaret","The letter form creates intimacy and a sense of truth.",0]]},"chron":[{"r":"Letter 4","m":"Walton, trapped in Arctic ice, writes to his sister about his ambition.","q":"One man’s life or death were but a small price to pay","t1":["Hyperbolic understatement","A human life is called ‘a small price’.","Walton values discovery above life.","His recklessness mirrors Victor’s, so the frame narrator is a warning double before Victor even appears."],"t2":["Economic metaphor","‘price’ and ‘pay’ turn life into a transaction.","Knowledge is something to be bought at any cost.","The novel will reveal the true price, paid by William, Justine, Clerval and Elizabeth."],"cx":"Polar exploration fascinated readers in 1818, as expeditions searched for the Northwest Passage.","wi":"Shelley opens with an ambitious explorer so readers see Victor’s story as a lesson Walton must learn."},{"r":"Chapter 4","m":"Victor, narrating his story, warns Walton about the pursuit of knowledge.","q":"Learn from me, if not by my precepts, at least by my example, how dangerous is the acquirement of knowledge","t1":["Imperative","‘Learn from me’ addresses Walton and the reader.","Victor casts himself as a cautionary tale.","The novel becomes didactic, warning against science that ignores ethics."],"t2":["Retrospective narration","Victor tells the story after the disasters.","His hindsight creates foreboding.","Readers know the outcome is tragic before it unfolds, building dramatic tension."],"cx":"The Romantic movement questioned the Enlightenment’s faith in unlimited scientific progress.","wi":"Shelley warns readers about the dangers of ambition without responsibility."},{"r":"Chapter 5","m":"Victor brings the creature to life and immediately recoils.","q":"the beauty of the dream vanished, and breathless horror and disgust filled my heart","t1":["Contrast","‘beauty of the dream’ is set against ‘horror and disgust’.","Victor’s fantasy collapses into revulsion.","His rejection is based on appearance, the first of many judgements that will turn the creature to violence."],"t2":["Emotive language","‘breathless horror’ shows physical shock.","Victor is overwhelmed.","His failure to care for his creation mirrors a parent abandoning a child."],"cx":"Galvanism experiments used electricity to make dead animals twitch, fuelling ideas about reanimation.","wi":"Shelley shows the moral failure of a creator who abandons responsibility."},{"r":"Chapter 10","m":"The creature confronts Victor on the glacier at Montanvert.","q":"I ought to be thy Adam, but I am rather the fallen angel","t1":["Biblical allusion","The creature compares himself to Adam and Satan from ‘Paradise Lost’.","He should have been loved like God’s first creation but was cast out.","Victor is cast as a failed God, so the novel questions humans playing creator."],"t2":["Archaic pronoun","‘thy’ creates formal, biblical language.","The creature speaks eloquently.","His articulate voice challenges the idea that he is a monster."],"cx":"Milton’s ‘Paradise Lost’ was central to Romantic thought about rebellion and creation.","wi":"Shelley makes readers question who the real monster is."},{"r":"Chapter 13","m":"Hidden in the hovel, the creature realises how alone he is in the world.","q":"When I looked around I saw and heard of none like me","t1":["Verbs of perception","‘looked’, ‘saw’ and ‘heard’ show him searching for others.","He longs for companionship and recognition.","His education through the De Laceys teaches him what he lacks, so knowledge brings pain rather than joy, echoing Victor."],"t2":["First person nested narrative","The creature tells his own story at the centre of the novel.","Readers hear his voice directly, without Victor’s prejudice.","Placing his narrative at the heart of the book gives the ‘monster’ the moral centre, challenging our first impression of him."],"cx":"Romantic writers such as Rousseau valued feeling, sympathy and the natural goodness of the outcast.","wi":"Shelley builds sympathy for the rejected so readers question who deserves the label ‘monster’."},{"r":"Chapter 17","m":"The creature demands that Victor make him a female companion.","q":"I am malicious because I am miserable","t1":["Cause and effect structure","‘because’ links malice directly to misery.","Rejection, not nature, has created his violence.","The line is the novel’s central argument that society makes its own monsters."],"t2":["Alliteration","‘malicious’ and ‘miserable’ are bound by the repeated ‘m’.","The sound ties cause and effect together.","The memorable phrasing makes his argument as persuasive as a legal plea, testing Victor’s, and our, sense of justice."],"cx":"Rousseau argued that humans are born good but corrupted by society.","wi":"Shelley suggests that cruelty breeds cruelty, urging compassion for outsiders."},{"r":"Chapter 20","m":"After Victor destroys the half finished female, the creature threatens him.","q":"I shall be with you on your wedding-night","t1":["Ominous modal verb","‘shall’ makes the threat certain.","The creature will strike at Victor’s happiness.","Victor assumes he is the target, so his selfishness blinds him to the danger to Elizabeth, a tragic irony."],"t2":["Foreshadowing","The line predicts the novel’s darkest moment.","Suspense builds as the wedding approaches.","The wedding night, a symbol of new life, will become a scene of death, reversing creation."],"cx":"Gothic novels thrived on revenge, doubles and the violation of domestic safety.","wi":"Shelley builds Gothic dread and shows the consequences of Victor’s broken promise."},{"r":"Chapter 23","m":"Victor finds Elizabeth murdered on their wedding night.","q":"She was there, lifeless and inanimate, thrown across the bed","t1":["Adjectives of death","‘lifeless and inanimate’ repeat the idea of death.","Elizabeth is reduced to an object.","‘inanimate’ echoes the lifeless matter Victor once animated, so his ambition to create life is reversed into destruction."],"t2":["Passive verb","‘thrown’ shows violence done to her.","She is powerless, as women in the novel often are.","Justine, Elizabeth and the female creature all suffer for men’s ambition, revealing Shelley’s critique of male power."],"cx":"Women in 1818 had little legal or social power; Shelley’s own mother, Mary Wollstonecraft, argued for women’s rights.","wi":"Shelley shows that the cost of male ambition falls on innocent women."}]},{"id":"sf","title":"The Sign of Four","author":"Arthur Conan Doyle","kind":"19th century novel","paper":"Paper 1, Section B","col":"#263238","ctx":[["Empire","Britain ruled India; the Indian Mutiny of 1857 shaped the plot."],["Victorian London","Fog, crime and poverty filled the city."],["Detective fiction","Holmes uses logic and deduction."],["Drugs","Cocaine was legal and used medically."],["Prejudice","Racist attitudes to colonised peoples were common."]],"groups":[{"n":"Sherlock Holmes","k":"Character","sum":"A brilliant detective who craves mental stimulation.","quotes":[{"q":"My mind rebels at stagnation","src":"Holmes, Chapter 1","f":[["Language","Personification of his mind."],["Form and structure","Opening chapter."],["Perceptive reading","He needs puzzles to live."],["Context","Victorian intellectual ideals."],["Writer's intention","To show his genius."],["Critical and conceptual reading","Holmes’s mind ‘rebels’ as if it were a separate restless creature. Conceptually, his genius is close to addiction, needing constant stimulation to avoid collapse. A critical reading links his boredom to the decadent ennui of the 1890s, where intellect without purpose turns to self destruction."]],"th":"Intellect · Boredom · Crime"},{"q":"when you have eliminated the impossible, whatever remains, however improbable, must be the truth","src":"Holmes, Chapter 6","f":[["Language","Logical reasoning."],["Form and structure","Famous principle."],["Perceptive reading","Deduction over emotion."],["Context","Scientific method."],["Writer's intention","To celebrate logic."],["Critical and conceptual reading","Holmes’s maxim presents deduction as an unbreakable law. Conceptually, it reassures Victorian readers that reason can master chaos. A critical reading notes that the logic rests on Holmes’s confidence about what is ‘impossible’, so certainty may be as much performance as science."]],"th":"Deduction · Truth · Intellect"},{"q":"For me, there still remains the cocaine-bottle.","src":"Holmes, Chapter 12","f":[["Language","Final line shows emptiness."],["Form and structure","Ending reveals darkness."],["Perceptive reading","Genius has a cost."],["Context","Drug use in Victorian era."],["Writer's intention","To show his flaws."],["Critical and conceptual reading","The novella ends with Holmes reaching for cocaine while Watson finds love. Conceptually, reason alone leaves Holmes empty. A critical reading sees the final image as a melancholy comment on the cost of a life ruled by intellect rather than feeling."]],"th":"Addiction · Isolation · Intellect"}]},{"n":"Watson and Mary","k":"Character","sum":"Holmes’s companion and the woman he falls in love with.","quotes":[{"q":"What a very attractive woman!","src":"Watson, Chapter 2","f":[["Language","Exclamation shows attraction."],["Form and structure","Contrast with Holmes."],["Perceptive reading","Emotion versus logic."],["Context","Romance in detective fiction."],["Writer's intention","To show Watson’s warmth."],["Critical and conceptual reading","Watson’s exclamation reveals instant attraction, breaking his narrative composure. Conceptually, emotion disrupts the scientific detective story. A critical reading sees Watson as the reader’s emotional guide, balancing Holmes’s coldness."]],"th":"Love · Emotion · Gender"},{"q":"Miss Morstan entered the room with a firm step and an outward composure of manner","src":"Watson, Chapter 2","f":[["Language","Mary is composed and strong."],["Form and structure","First impression."],["Perceptive reading","Victorian ideal woman."],["Context","Gender roles."],["Writer's intention","To present Mary positively."],["Critical and conceptual reading","Mary’s ‘firm step’ and ‘outward composure’ suggest a capable, self controlled woman. Conceptually, ‘outward’ hints at anxiety beneath the surface. A feminist reading notes she is admired for restraint, a Victorian ideal of femininity."]],"th":"Gender · Character · Love"},{"q":"Thank God!","src":"Watson, Chapter 11","f":[["Language","Relief that the treasure is lost."],["Form and structure","Love over wealth."],["Perceptive reading","He can now propose."],["Context","Class and wealth."],["Writer's intention","To show love above money."],["Critical and conceptual reading","Watson’s relief that the treasure is lost reveals his love for Mary. Conceptually, wealth would have been a barrier between them. A Marxist reading sees love triumphing over money, an ironic contrast with the greed driving the plot."]],"th":"Love · Money · Class"}]},{"n":"Jonathan Small","k":"Character","sum":"A one-legged convict seeking the Agra treasure.","quotes":[{"q":"The sign of the four","src":"Note left at the crime scene, Chapter 6","f":[["Language","The pact’s name."],["Form and structure","Title significance."],["Perceptive reading","Loyalty among criminals."],["Context","Empire and crime."],["Writer's intention","To show bonds."],["Critical and conceptual reading","The sign of the four symbolises a pact built on theft and murder. Conceptually, imperial greed binds the conspirators. A postcolonial reading sees the crime as imported from the Empire, guilt following wealth home."]],"th":"Loyalty · Crime · Empire"},{"q":"Jonathan, with his wooden leg, is utterly unable to reach the lofty room","src":"Holmes, Chapter 6","f":[["Language","Physical detail marks Small as damaged by his past."],["Form and structure","Holmes deduces from clues."],["Perceptive reading","His body bears the cost of empire."],["Context","Colonial wars left men injured."],["Writer's intention","To link crime to empire."],["Critical and conceptual reading","Small’s wooden leg is a clue that lets Holmes track him, reducing a man to a physical feature. Conceptually, the body becomes evidence in a world where science reads people like texts. A critical reading notes the leg was lost in India, so Small’s disability is itself a wound of empire."]],"th":"Identity · Crime · Empire"},{"q":"the Indian Mutiny","src":"Narrator, background","f":[["Language","Historical event."],["Form and structure","Backstory."],["Perceptive reading","Empire’s violence."],["Context","1857 rebellion."],["Writer's intention","To link crime and empire."],["Critical and conceptual reading","The Indian Rebellion of 1857 lies behind the London crime. Conceptually, colonial violence is the hidden origin of the treasure and the murder. A postcolonial reading questions the British label ‘Mutiny’, which framed an anti colonial uprising as mere disobedience."]],"th":"Empire · Violence · Crime"}]},{"n":"Tonga and empire","k":"Theme","sum":"Doyle’s portrayal reflects Victorian imperial prejudice.","quotes":[{"q":"savage, distorted creature","src":"Holmes and Watson about Tonga","f":[["Language","Dehumanising language."],["Form and structure","Climax chase."],["Perceptive reading","Imperial racism."],["Context","Colonial attitudes."],["Writer's intention","To expose prejudice, read critically."],["Critical and conceptual reading","Tonga is described as ‘savage, distorted’, stripped of humanity. Conceptually, the novella reproduces the imperial habit of presenting colonised peoples as monstrous. A postcolonial reading condemns this othering while noting it reveals the fears of the coloniser more than the truth about Tonga."]],"th":"Empire · Prejudice · Identity"},{"q":"naturally hideous","src":"Holmes reading a gazetteer, Chapter 8","f":[["Language","Racist description."],["Form and structure","From a reference book."],["Perceptive reading","Victorian pseudoscience."],["Context","Scientific racism."],["Writer's intention","To show imperial attitudes."],["Critical and conceptual reading","Holmes calls Tonga ‘naturally hideous’, presenting ugliness as innate. Conceptually, the phrase reflects the pseudo scientific racism of Victorian anthropology. A critical reading exposes the limits of Holmes’s ‘objective’ science, which absorbs the prejudices of its time."]],"th":"Empire · Prejudice · Science"},{"q":"a little black man","src":"Small, Chapter 12","f":[["Language","Diminutive language."],["Form and structure","Colonial voice."],["Perceptive reading","Prejudice in narrative."],["Context","Empire."],["Writer's intention","To show attitudes."],["Critical and conceptual reading","Tonga is reduced to ‘a little black man’ and never speaks for himself. Conceptually, the colonised subject is silenced, known only through others’ descriptions. A postcolonial reading reads this silence as a key feature of imperial storytelling."]],"th":"Empire · Prejudice · Identity"}]},{"n":"London","k":"Setting","sum":"A foggy, dangerous city full of crime.","quotes":[{"q":"dense drizzly fog lay low upon the great city","src":"Watson, Chapter 3","f":[["Language","Pathetic fallacy."],["Form and structure","Gothic atmosphere."],["Perceptive reading","Fog hides crime."],["Context","Victorian London fog."],["Writer's intention","To create mystery."],["Critical and conceptual reading","Fog lies ‘low upon the great city’, hiding streets and faces. Conceptually, London mirrors the moral murk of a capital enriched by empire. A critical reading sees the city as a place where crime and wealth are equally hidden."]],"th":"Setting · Mystery · Crime"},{"q":"Mud-coloured clouds drooped sadly over the muddy streets","src":"Watson, Chapter 3","f":[["Language","Personified clouds."],["Form and structure","Gloomy description."],["Perceptive reading","City reflects mood."],["Context","Industrial pollution."],["Writer's intention","To create gloom."],["Critical and conceptual reading","‘Mud-coloured clouds drooped sadly’ over the streets, giving the sky human gloom. Conceptually, pathetic fallacy reflects the melancholy of the characters and the decay of the city. A critical reading sees the dirty, sinking imagery hinting at corruption beneath imperial grandeur."]],"th":"Setting · Mood · Crime"},{"q":"monster tentacles","src":"Watson, Chapter 3","f":[["Language","Metaphor of the city."],["Form and structure","Gothic imagery."],["Perceptive reading","London as a beast."],["Context","Urban growth."],["Writer's intention","To show danger."],["Critical and conceptual reading","Fog stretches out ‘monster tentacles’, making London itself a predator. Conceptually, the Gothic city threatens those who move through it. A critical reading links the image to fears of the unknown lurking in urban darkness and in the colonial ‘elsewhere’."]],"th":"Setting · Danger · Crime"}],"pctx":["Blake (1757 to 1827) was a radical poet and engraver; ‘London’ (1794) appeared in Songs of Experience during the French Revolution.","Blake’s ‘mind-forg’d manacles’ suggest that the people’s oppression is both imposed and self accepted."]},{"n":"Crime and deduction","k":"Theme","sum":"The novel celebrates logic while exposing greed.","quotes":[{"q":"Detection is, or ought to be, an exact science","src":"Holmes, Chapter 1","f":[["Language","Scientific language."],["Form and structure","Holmes’s philosophy."],["Perceptive reading","Logic defines him."],["Context","Scientific progress."],["Writer's intention","To present detection as science."],["Critical and conceptual reading","Holmes claims detection ‘is, or ought to be, an exact science’. Conceptually, the qualification ‘ought to be’ admits that human crime resists perfect logic. A critical reading sees the novella balancing Victorian faith in reason with its limits."]],"th":"Deduction · Science · Crime"},{"q":"You really are an automaton","src":"Watson to Holmes, Chapter 2","f":[["Language","Metaphor of a machine."],["Form and structure","Watson’s criticism."],["Perceptive reading","Holmes lacks emotion."],["Context","Industrial age."],["Writer's intention","To show his coldness."],["Critical and conceptual reading","Watson half jokingly calls Holmes ‘an automaton’, a calculating machine. Conceptually, pure reason is presented as inhuman. A critical reading sees the novella questioning whether intellect without feeling is admirable or tragic."]],"th":"Emotion · Intellect · Identity"},{"q":"the Agra treasure","src":"Throughout","f":[["Language","Symbol of greed."],["Form and structure","Drives the plot."],["Perceptive reading","Wealth corrupts."],["Context","Imperial plunder."],["Writer's intention","To criticise greed."],["Critical and conceptual reading","The Agra treasure drives greed, betrayal and murder across continents. Conceptually, wealth taken from India corrupts everyone who touches it. A postcolonial reading sees the stolen riches as a symbol of empire’s plunder, which ends scattered in the Thames."]],"th":"Greed · Empire · Crime"}]}],"ctx9":[["The British Empire","Britain ruled India; the 1857 Indian Mutiny shaped British fears.","The Agra treasure, stolen during the Mutiny, links London’s crime to imperial greed."],["Victorian London","A foggy, overcrowded city of crime and poverty.","Doyle’s ‘mud-coloured clouds’ create a city where crime thrives in obscurity."],["Detective fiction","A popular genre celebrating logic.","Holmes’s deduction reflects Victorian faith in science and reason."],["Drugs","Cocaine was legal and used medically.","Holmes’s cocaine habit shows the darker side of genius and boredom."],["Racism and empire","Victorian pseudoscience promoted racist ideas.","Tonga’s dehumanising description reflects imperial racism that modern readers must read critically."],["Women","Women were expected to be gentle and dependent.","Mary Morstan is presented as an ideal Victorian woman, contrasting with the violence around her."]],"voc":{"v":[["deduction","reaching a conclusion through reasoning","Holmes uses deduction to solve the crime."],["imperialism","a country extending power over others","The novel reflects Victorian imperialism through the Agra treasure."],["xenophobic","fearful of foreigners","The description of Tonga is xenophobic."],["stagnation","inactivity","Holmes hates stagnation, turning to cocaine."],["avarice","extreme greed","Avarice drives the theft of the treasure."],["rational","based on logic","Holmes is rational, while Watson is emotional."],["exotic","from a distant country","The East is presented as exotic and dangerous."],["corruption","dishonest behaviour","The treasure brings corruption to all who seek it."]],"m":[["L","Pathetic fallacy","dense drizzly fog lay low upon the great city","The fog creates mystery and moral murk.",1],["L","Dehumanising language","savage, distorted creature","Racist imagery reflects imperial attitudes.",1],["S","Small’s confession","The backstory is told at the end","Delayed explanation reveals the past crime.",0],["S","Chase sequence","The boat chase on the Thames","Action creates excitement before the resolution.",0],["F","Detective fiction","Crime, clues and solution","The genre reassures readers that order can be restored.",0],["F","First person narrator","Watson narrates","We see Holmes’s genius through an admiring friend.",0]]},"chron":[{"r":"Chapter 1: The Science of Deduction","m":"Bored between cases, Holmes justifies his cocaine use to Watson.","q":"My mind… rebels at stagnation","t1":["Personification","His ‘mind rebels’ as if it were a separate, restless being.","Holmes needs constant stimulation.","The violent verb suggests his genius is close to addiction, explaining his drug use."],"t2":["Abstract noun","‘stagnation’ suggests still, rotting water.","Ordinary life feels decaying to him.","Holmes’s restlessness mirrors a Victorian culture obsessed with progress."],"cx":"Cocaine was legal in the 1880s and some doctors praised it as a stimulant.","wi":"Conan Doyle presents Holmes as a flawed genius, fascinating readers."},{"r":"Chapter 1: The Science of Deduction","m":"Holmes explains his method.","q":"Detection is, or ought to be, an exact science","t1":["Scientific metaphor","Detection is compared to science.","Holmes values logic and evidence.","The novella celebrates Victorian faith in reason to solve problems."],"t2":["Self correction","‘or ought to be’ qualifies the claim.","Holmes admits the ideal is not always achieved.","It suggests the messy human world resists perfect logic."],"cx":"The Victorian period saw rapid advances in forensic science.","wi":"Conan Doyle presents reason as the answer to crime and disorder."},{"r":"Chapter 2: The Statement of the Case","m":"Mary Morstan arrives at Baker Street to ask for help.","q":"Miss Morstan entered the room with a firm step and an outward composure of manner","t1":["Adjectives of strength","‘firm’ and ‘composure’ suggest a calm, capable woman.","Mary is not the hysterical heroine of sensation fiction.","‘outward’ hints that she hides anxiety beneath her control, inviting Watson’s sympathy."],"t2":["Watson’s first person perspective","Watson describes her admiringly.","The romance plot begins through his eyes.","His emotional response contrasts with Holmes’s cold reasoning, setting up the novella’s tension between heart and head."],"cx":"Victorian ideals of womanhood valued modesty, composure and self control.","wi":"Conan Doyle blends a romance with the mystery to appeal to a wide readership."},{"r":"Chapter 3: In Quest of a Solution","m":"Holmes, Watson and Mary drive through London to a mysterious meeting.","q":"dense drizzly fog lay low upon the great city","t1":["Pathetic fallacy","The fog creates an atmosphere of mystery.","London becomes hidden, confusing and dangerous.","The fog also suggests the moral murk of a capital built on imperial wealth, like the stolen Agra treasure."],"t2":["Alliteration","‘dense drizzly’ creates a heavy, slow sound.","The line feels oppressive.","The ‘great city’ is diminished beneath the fog, hinting that its greatness hides darkness."],"cx":"London’s coal smoke fogs were notorious, and the city was the heart of the British Empire.","wi":"Conan Doyle creates a Gothic atmosphere that turns London itself into a source of mystery."},{"r":"Chapter 6: Sherlock Holmes Gives a Demonstration","m":"Holmes explains how to reason about the locked room at Pondicherry Lodge.","q":"when you have eliminated the impossible, whatever remains, however improbable, must be the truth","t1":["Aphorism","The maxim is phrased like a scientific law.","Holmes’s method seems absolute and reliable.","It reassures readers that even baffling crimes can be solved by reason."],"t2":["Antithesis","‘impossible’ is distinguished from ‘improbable’.","The subtle distinction shows Holmes’s precise mind.","It invites readers to think like a detective, part of the genre’s pleasure."],"cx":"The late Victorian era trusted science and logic to explain the world.","wi":"Conan Doyle celebrates rational deduction as a source of order."},{"r":"Chapter 10: The End of the Islander","m":"During the Thames chase, Tonga appears at the stern of the boat.","q":"savage, distorted creature","t1":["Dehumanising adjectives","‘savage’ and ‘distorted’ deny Tonga’s humanity.","He is presented as monstrous and primitive.","The description reflects imperial racism that justified colonial rule."],"t2":["Noun ‘creature’","Tonga is called a ‘creature’ rather than a man.","He is ‘othered’ completely.","Modern readers see the prejudice of Watson’s narration, which the novella never questions."],"cx":"Victorian imperialism portrayed colonised peoples as savage to justify empire.","wi":"Conan Doyle reflects the imperial attitudes of his readers, which modern readers can challenge."},{"r":"Chapter 12: The Strange Story of Jonathan Small","m":"Small confesses the history of the Agra treasure and the pact of the four.","q":"The sign of the four","t1":["Symbolism","The sign represents an oath between four men.","Loyalty binds them together.","The pact is built on theft and murder, exposing the greed at the heart of empire."],"t2":["Title echo","The phrase gives the novel its title.","It links the London crime to its roots in India.","The crime is literally imported from the Empire, suggesting imperial wealth carries guilt home."],"cx":"The Indian Rebellion of 1857 shaped British fears and attitudes towards India.","wi":"Conan Doyle links crime to empire, suggesting the colonial past haunts Britain."},{"r":"Chapter 12: The Strange Story of Jonathan Small","m":"Watson is engaged to Mary; Holmes reflects on what is left for him.","q":"For me, there still remains the cocaine-bottle.","t1":["Final line","The novella ends on Holmes’s drug.","His loneliness is exposed at the moment of Watson’s happiness.","The genius who solves every mystery cannot solve his own emptiness."],"t2":["Contrast","Watson gains love while Holmes is left with a bottle.","Emotion and reason are set against each other.","The ending suggests reason alone cannot bring fulfilment."],"cx":"Cocaine was legal and fashionable in the 1880s, but its dangers were becoming known.","wi":"Conan Doyle ends on a melancholy note that makes Holmes more complex and human."}]},{"id":"aic","title":"An Inspector Calls","author":"Priestley","kind":"Modern play","paper":"Paper 2, Section A","col":"#A1263A","ctx":[["1912 setting","Edwardian Britain: rigid class system, no welfare state, women could not vote."],["1945 audience","Two world wars, shared wartime sacrifice and the Labour landslide of July 1945."],["Priestley's socialism","He co-founded the Common Wealth Party and broadcast about a fairer Britain."],["The welfare state","The NHS and welfare state were about to put ‘one body’ into practice."],["Titanic, 1912","Birling calls it ‘unsinkable’; the audience knows it sank."]],"groups":[{"n":"Inspector Goole","k":"Character","sum":"","quotes":[{"q":"an impression of massiveness, solidity and purposefulness","src":"Stage direction, Act 1","f":[["Language","The abstract nouns ‘massiveness’ and ‘solidity’ make the Inspector seem physically and morally weighty, while ‘purposefulness’ shows he has come with a clear aim."],["Form","Priestley uses the stage direction to tell the actor and director how the Inspector should dominate the stage before he even speaks."],["Structure","He arrives just after Birling’s speech about a man looking after himself, so his entrance seems to answer and challenge that selfish view."],["Context","The play is set in 1912 but was written in 1945, when Priestley wanted Britain to build a fairer society after the Second World War."],["Writer's intention","Priestley presents the Inspector as a powerful moral force who will expose the Birlings and teach the message of social responsibility."],["Effect on a 1945 audience","After six years of war, a 1945 audience would see the Inspector as the voice of a new, fairer Britain arriving to challenge the complacent rich of 1912."],["Critical and conceptual reading","Priestley’s stage direction gives the Inspector ‘massiveness, solidity and purposefulness’, abstract qualities more than physical ones. Conceptually, he is less a policeman than a moral force, perhaps Priestley’s conscience on stage. A critical reading notes his name, Goole, sounds like ghoul, hinting that he is a supernatural judge rather than a real officer."]],"th":"Social responsibility · Power · Appearance and reality"},{"q":"responsibilities as well as privileges.","src":"The Inspector to Mr Birling","f":[["Language","The balanced contrast between ‘responsibilities’ and ‘privileges’ reminds Birling that wealth and status bring duties to others, not just benefits."],["Form","The Inspector speaks calmly and directly, refusing to be impressed by Birling’s position as a former Lord Mayor and magistrate."],["Structure","The line comes as Birling tries to use his status to control the interrogation, showing that the Inspector cannot be intimidated."],["Context","In 1912 the wealthy had huge power and little duty to help the poor; by 1945, many voters wanted a welfare state."],["Writer's intention","Priestley presents social responsibility as the duty of the powerful, criticising capitalists who enjoy privilege without care for others."],["Effect on a 1945 audience","Voters who had just elected a Labour government in 1945 would see this as the principle behind the welfare state: wealth must serve the whole community."],["Critical and conceptual reading","The Inspector’s correction of Birling, ‘responsibilities as well as privileges’, states the play’s socialist thesis. Conceptually, wealth brings duty to others, not just freedom. A Marxist reading sees Priestley attacking a capitalist class that took the benefits of power while denying its obligations."]],"th":"Social responsibility · Class · Capitalism and socialism"},{"q":"It’s better to ask for the earth than to take it.","src":"The Inspector to Mr Birling, Act 1","f":[["Language","The Inspector turns Birling’s own phrase ‘asking for the earth’ against him, suggesting that the rich, not the poor, are the real takers."],["Form","The short, proverb like sentence sounds like a moral lesson, showing the Inspector’s role as a teacher."],["Structure","It comes in Act 1, as Birling explains why he sacked Eva for asking for higher wages, setting up the first moral challenge."],["Context","Eva led a strike for a pay rise of a few shillings; strikes over low pay were common in the years before the First World War."],["Writer's intention","Priestley presents class inequality through the Inspector, defending workers who ask for fair treatment."],["Effect on a 1945 audience","A 1945 audience, many of them workers who had sacrificed in the war, would cheer this rebuke of employers who ‘take’ while condemning the poor for ‘asking’."],["Critical and conceptual reading","The Inspector’s aphorism contrasts asking with taking, generosity with greed. Conceptually, the line exposes how the powerful take what they want while the poor are punished for asking. A critical reading links it to Eva’s request for higher wages, the ‘crime’ that began her downfall."]],"th":"Class · Capitalism and socialism · Social responsibility"}]},{"n":"Arthur Birling","k":"Character","sum":"","quotes":[{"q":"unsinkable, absolutely unsinkable","src":"Mr Birling on the Titanic, Act 1","f":[["Language","The repetition and the adverb ‘absolutely’ show Birling’s arrogant certainty, which the audience knows is completely wrong."],["Form","Dramatic irony: the 1945 audience knew the Titanic sank in April 1912, so Birling is made to look foolish."],["Structure","This comes in his opening speech, so Priestley undermines Birling’s judgement before the Inspector arrives."],["Context","Birling also claims there will be no war, yet the First World War began in 1914 and the Second in 1939."],["Writer's intention","Priestley presents capitalist confidence as blind and dangerous, encouraging the audience to reject Birling’s views."],["Effect on a 1945 audience","In 1945 the audience knows the Titanic sank and two world wars followed, so Birling’s confidence is ridiculous and his capitalist views are discredited."],["Critical and conceptual reading","Birling’s repeated ‘unsinkable’ is pure dramatic irony for a 1945 audience who know the Titanic sank. Conceptually, his certainty discredits every later opinion he offers about war, business and society. A critical reading sees Priestley undermining capitalist confidence through the audience’s hindsight."]],"th":"Capitalism and socialism · Age and generations · Power"},{"q":"community and all that nonsense","src":"Mr Birling, Act 1","f":[["Language","The dismissive noun ‘nonsense’ shows his contempt for the idea that people should look after one another."],["Form","His long, self satisfied speeches to Gerald and Eric show him lecturing the younger generation."],["Structure","His selfish views are interrupted by the doorbell as the Inspector arrives, as if the play itself rejects them."],["Context","Priestley was a socialist who helped found the Common Wealth Party in 1942 and campaigned for a fairer Britain."],["Writer's intention","Priestley presents Birling as a mouthpiece for selfish capitalism, the opposite of social responsibility."],["Effect on a 1945 audience","After the shared sacrifice of the Blitz and rationing, a 1945 audience valued community, so Birling’s sneer would make him seem selfish and out of touch."],["Critical and conceptual reading","Birling dismisses ‘community and all that nonsense’ moments before the Inspector arrives. Conceptually, the structure stages a debate between individualism and collectivism, and the doorbell answers him. A Marxist reading sees Birling voicing the selfish ideology Priestley wanted post war Britain to reject."]],"th":"Social responsibility · Capitalism and socialism · Age and generations"},{"q":"I’d give thousands","src":"Mr Birling to the Inspector, Act 3","f":[["Language","The offer of ‘thousands’ shows Birling believes money can solve any problem, even a death."],["Form","His broken, desperate speech contrasts with his confident tone in Act 1, showing he is losing control."],["Structure","This comes after Eric’s confession in Act 3, when Birling’s main fear is a public scandal."],["Context","Eva was sacked for asking for a few extra shillings a week, so his offer now highlights his hypocrisy."],["Writer's intention","Priestley presents class and money as Birling’s only values, showing he has learned nothing about responsibility."],["Effect on a 1945 audience","A 1945 audience rebuilding a fairer society would be disgusted that he tries to buy his way out of guilt instead of accepting responsibility."],["Critical and conceptual reading","Birling’s offer of ‘thousands’ shows he believes money can erase guilt. Conceptually, he treats moral responsibility as a transaction. A critical reading sees capitalism reducing even a death to a matter of cost, which is exactly what the Inspector refuses."]],"th":"Guilt and blame · Class · Morality and hypocrisy"}]},{"n":"Sybil Birling","k":"Character","sum":"","quotes":[{"q":"a rather cold woman and her husband’s social superior","src":"Stage direction, Act 1","f":[["Language","The adjective ‘cold’ suggests she lacks warmth and compassion, while ‘social superior’ shows she comes from a higher class than her husband."],["Form","Priestley uses the stage direction to establish her character before she speaks, guiding the actor’s performance."],["Structure","This description at the start prepares the audience for her lack of sympathy when she is questioned in Act 2."],["Context","In Edwardian society, class was rigid, and upper class women often looked down on those who made money through trade."],["Writer's intention","Priestley presents Mrs Birling as a symbol of upper class snobbery and the coldness of the privileged."],["Effect on a 1945 audience","Many in 1945 had seen class barriers weaken during the war, so Sybil’s coldness and snobbery would mark her as a symbol of an unfair old order."],["Critical and conceptual reading","Sybil is introduced as cold and socially superior to her husband. Conceptually, she represents the snobbery of inherited status, looking down even on new money. A critical reading sees class prejudice within the family itself, foreshadowing her contempt for Eva."]],"th":"Class · Social responsibility · Gender"},{"q":"Girls of that class","src":"Mrs Birling about Eva, Act 2","f":[["Language","The noun ‘class’ shows she judges Eva by her social position rather than as an individual."],["Form","Her short, dismissive phrases show her refusal to engage with the Inspector’s questions."],["Structure","This comes during her interrogation in Act 2, when she still believes she did nothing wrong."],["Context","Mrs Birling chairs the Brumley Women’s Charity Organisation, yet she refused to help Eva when she asked for help."],["Writer's intention","Priestley presents class prejudice through Mrs Birling, exposing the hypocrisy of upper class charity."],["Effect on a 1945 audience","After working class people had fought and worked for the nation, a 1945 audience would be angered by her contempt for ‘Girls of that class’."],["Critical and conceptual reading","Mrs Birling’s ‘Girls of that class’ erases Eva’s individuality into a category. Conceptually, prejudice works by generalisation, the opposite of the Inspector’s insistence on one named girl. A Marxist reading sees class contempt disguised as charity."]],"th":"Class · Gender · Social responsibility"},{"q":"she had only herself to blame","src":"Mrs Birling, Act 2","f":[["Language","The pronoun ‘herself’ shifts all responsibility onto Eva, showing Mrs Birling’s refusal to accept guilt."],["Form","Dramatic irony: she blames the father of the child without realising it is her own son, Eric."],["Structure","Her insistence on blaming the father sets a trap she falls into at the end of Act 2, when Eric’s guilt is revealed."],["Context","Unmarried mothers in 1912 faced shame and poverty, with little support from society."],["Writer's intention","Priestley presents Mrs Birling as someone who avoids responsibility, showing how the powerful blame the powerless."],["Effect on a 1945 audience","A 1945 audience, believing in shared responsibility, would see her blaming the victim as the attitude Britain needed to leave behind."],["Critical and conceptual reading","Mrs Birling insists Eva ‘had only herself to blame’, the classic Edwardian verdict on the ‘undeserving poor’. Conceptually, blaming the victim protects the powerful from responsibility. Dramatic irony turns the line against her, as the father she condemns is her own son, Eric."]],"th":"Guilt and blame · Morality and hypocrisy · Class · Gender"}]},{"n":"Sheila Birling","k":"Character","sum":"","quotes":[{"q":"very pleased with life and rather excited","src":"Stage direction, Act 1","f":[["Language","The adjectives show Sheila is happy and carefree at the start, enjoying her engagement and comfortable life."],["Form","The stage direction presents her as young and naive, establishing a starting point for her character’s change."],["Structure","Her happiness at the opening contrasts with her guilt and maturity by the end, showing her development."],["Context","Young women of Sheila’s class in 1912 were expected to marry well and had little independence."],["Writer's intention","Priestley presents Sheila as a character who will change most, showing hope for the younger generation."],["Effect on a 1945 audience","Women in 1945 had worked in factories and served in the war, so they would recognise how far Sheila must grow from this sheltered, carefree girl."],["Critical and conceptual reading","Sheila is introduced as ‘very pleased with life and rather excited’, a picture of privileged innocence. Conceptually, her youthful naivety makes her later transformation more striking. A feminist reading sees her moving from a decorative daughter to the play’s moral voice."]],"th":"Gender · Age and generations · Change"},{"q":"these girls aren’t cheap labour","src":"Sheila to her father, Act 1","f":[["Language","The phrase ‘cheap labour’ shows Sheila rejecting her father’s view of workers as tools for profit, as she insists they are people."],["Form","Her direct contradiction of her father shows her beginning to challenge his authority."],["Structure","This comes early in Act 1, showing that Sheila is quick to sympathise with Eva even before her own part is revealed."],["Context","Women workers in 1912 were paid less than men and had few rights at work."],["Writer's intention","Priestley presents social responsibility through Sheila, who begins to see workers as human beings."],["Effect on a 1945 audience","A 1945 audience would see Sheila as the hopeful voice of the young, who rejected the idea that workers are simply ‘labour’ to be exploited."],["Critical and conceptual reading","Sheila’s correction of her father recognises workers as people, not ‘cheap labour’. Conceptually, it marks the younger generation’s moral awakening. A Marxist reading sees her rejecting the language that turns human beings into economic units."]],"th":"Class · Social responsibility · Age and generations · Capitalism and socialism"},{"q":"it frightens me the way you talk","src":"Sheila to her parents, Act 3","f":[["Language","The verb ‘frightens’ shows that Sheila is now disturbed by her parents’ refusal to change."],["Form","Her lines in Act 3 echo the Inspector’s views, as if she has become his voice within the family."],["Structure","This comes near the end, when her parents try to pretend nothing has happened, showing the gap between generations."],["Context","Priestley believed the young people of 1945 could build a better society after two world wars."],["Writer's intention","Priestley presents generations as divided, with the young open to change and the old stuck in their ways."],["Effect on a 1945 audience","For a 1945 audience, Sheila’s fear of her parents’ attitude echoes the determination that the selfishness of the past must never return."],["Critical and conceptual reading","Sheila is frightened by her parents’ refusal to change. Conceptually, the generational divide becomes complete at the play’s end. A critical reading sees Priestley placing hope in the young, who are capable of learning from the past."]],"th":"Age and generations · Change · Social responsibility"}]},{"n":"Eric Birling","k":"Character","sum":"","quotes":[{"q":"half shy, half assertive","src":"Stage direction, Act 1","f":[["Language","The contrasting adjectives ‘shy’ and ‘assertive’ show that Eric is awkward and uncomfortable, unsure of his place in the family."],["Form","The stage direction hints to the audience that Eric is hiding something from the very start."],["Structure","His nervous behaviour in Act 1 prepares for the revelation of his drinking and his treatment of Eva in Act 3."],["Context","Young men of Eric’s class in 1912 were expected to follow their fathers into business, whatever their own wishes."],["Writer's intention","Priestley presents Eric as a troubled young man, showing the damage done by a cold, uncaring family."],["Effect on a 1945 audience","A 1945 audience would sense that something is wrong in this respectable family, preparing them for the hidden truths behind its comfortable surface."],["Critical and conceptual reading","Eric is ‘half shy, half assertive’, suggesting an unsettled, divided character. Conceptually, his awkwardness hints at secrets and drinking that will later be revealed. A critical reading sees him as a product of a family that offers privilege without guidance."]],"th":"Appearance and reality · Age and generations · Guilt and blame"},{"q":"Why shouldn’t they try for higher wages?","src":"Eric to his father, Act 1","f":[["Language","The rhetorical question challenges his father’s treatment of workers, showing Eric’s sympathy for Eva and the strikers."],["Form","His interruption of his father’s story shows a young man beginning to question authority."],["Structure","This comes early, as Birling explains sacking Eva, showing the first sign of conflict between father and son."],["Context","Trade unions and strikes were growing in the years before the First World War, as workers fought for fairer pay."],["Writer's intention","Priestley presents class conflict through Eric, using the younger generation to challenge capitalist views."],["Effect on a 1945 audience","Post war audiences who supported workers’ rights and trade unions would agree with Eric’s simple, fair question and side against his father."],["Critical and conceptual reading","Eric’s question challenges his father’s economics. Conceptually, he instinctively sympathises with workers, unlike Birling. A Marxist reading sees the son rejecting the capitalist logic of the father."]],"th":"Class · Capitalism and socialism · Age and generations · Social responsibility"},{"q":"you’re not the kind of father a chap could go to when he’s in trouble","src":"Eric to Mr Birling, Act 3","f":[["Language","The colloquial noun ‘chap’ and the phrase ‘in trouble’ show Eric’s frustration that he could never turn to his father for help."],["Form","This bitter accusation is one of the most emotional moments in the play, as Eric openly turns on his father."],["Structure","It comes in Act 3, after his confession, when the family begins to fall apart."],["Context","Edwardian fathers were often distant figures who expected obedience rather than offering emotional support."],["Writer's intention","Priestley presents a breakdown between generations, showing that Birling’s selfishness has harmed his own family."],["Effect on a 1945 audience","A 1945 audience would see that Birling’s selfish values have failed even his own family, making his views on responsibility seem empty."],["Critical and conceptual reading","Eric’s accusation exposes Birling’s failure as a father. Conceptually, private and public responsibility are linked: a man who neglects workers also neglects his son. A critical reading sees the family’s moral breakdown mirroring society’s."]],"th":"Age and generations · Social responsibility · Guilt and blame"}]},{"n":"Gerald Croft","k":"Character","sum":"","quotes":[{"q":"the easy well-bred young man-about-town","src":"Stage direction, Act 1","f":[["Language","The adjective ‘well-bred’ suggests Gerald’s upper class upbringing, and ‘man-about-town’ hints at a confident social life outside the home."],["Form","Priestley uses the stage direction to present Gerald as charming and socially polished."],["Structure","This first impression prepares for the revelation of his affair with Eva, then called Daisy Renton, in Act 2."],["Context","Gerald is the son of Sir George and Lady Croft, so his engagement to Sheila raises the Birlings’ social status."],["Writer's intention","Priestley presents Gerald as a symbol of the upper class, outwardly respectable but hiding secrets."],["Effect on a 1945 audience","A 1945 audience, suspicious of privilege, might admire Gerald’s charm at first but would come to see him as a product of the class that needed to change."],["Critical and conceptual reading","Gerald is presented as an ‘easy, well-bred young man-about-town’, polished and confident. Conceptually, his charm conceals privilege and moral evasion. A critical reading sees him as the upper class gentleman whose manners hide exploitation."]],"th":"Class · Appearance and reality · Gender"},{"q":"All right. I knew her. Let’s leave it at that.","src":"Gerald to Sheila, Act 1","f":[["Language","The short, clipped sentences show Gerald trying to end the conversation and avoid further questions."],["Form","His curt tone contrasts with his usual easy charm, showing he is under pressure."],["Structure","This admission comes just before the end of Act 1, building suspense for Act 2."],["Context","Upper class men in 1912 often kept mistresses, and such affairs were hidden to protect reputations."],["Writer's intention","Priestley presents Gerald as someone who hides the truth to protect himself, linking to the theme of responsibility."],["Effect on a 1945 audience","A 1945 audience would see Gerald as a man who expects his class to protect his secrets, which the Inspector is about to expose."],["Critical and conceptual reading","Gerald’s clipped admission tries to close the subject quickly. Conceptually, it reveals the upper class instinct to protect reputation through silence. A feminist reading sees him minimising an affair in which he held all the power over a vulnerable young woman."]],"th":"Appearance and reality · Guilt and blame · Gender"},{"q":"Everything’s all right now, Sheila.","src":"Gerald to Sheila, Act 3","f":[["Language","The adjective phrase ‘all right’ shows Gerald’s relief that the Inspector may not have been real, as if nothing has changed."],["Form","He offers Sheila the ring again, showing he wants to return to the way things were."],["Structure","This comes just before the final phone call, so his relief is immediately undercut."],["Context","Priestley wanted his 1945 audience to reject the old attitudes that had led to inequality and war."],["Writer's intention","Priestley presents Gerald as part of the older way of thinking, unwilling to accept responsibility."],["Effect on a 1945 audience","In 1945, an audience determined that society must change would be frustrated that Gerald returns to the old attitudes as soon as he feels safe."],["Critical and conceptual reading","Gerald’s reassurance after the phone call shows he has learned nothing. Conceptually, he wants to return to the comfortable world before the Inspector. A critical reading sees him aligning with the older generation’s denial."]],"th":"Change · Guilt and blame · Gender · Social responsibility"}]},{"n":"Eva Smith","k":"Character","sum":"","quotes":[{"q":"Burnt her inside out, of course.","src":"The Inspector, Act 1","f":[["Language","The brutal image of being ‘Burnt’ from the inside shows the horror of Eva’s suicide by swallowing disinfectant."],["Form","The Inspector’s blunt, graphic language deliberately shocks the comfortable family, shattering the cheerful mood of the engagement party."],["Structure","This detail comes at the start of the investigation, so the horror of her death hangs over the whole play."],["Context","Many working class women in 1912 lived in poverty with no welfare state to support them."],["Writer's intention","Priestley presents Eva as a victim of the selfishness of the rich, making her death impossible to ignore."],["Effect on a 1945 audience","A 1945 audience who had seen wartime suffering would be horrified, and would recognise Eva’s death as the cost of a society without a safety net."],["Critical and conceptual reading","The Inspector’s brutal description of Eva’s death forces the family, and audience, to confront physical suffering. Conceptually, the graphic image makes abstract responsibility concrete. A critical reading sees Priestley shocking the comfortable into empathy."]],"th":"Social responsibility · Class · Guilt and blame"},{"q":"as if she was an animal, a thing","src":"The Inspector to Eric, Act 3","f":[["Language","The nouns ‘animal’ and ‘thing’ show how Eric dehumanised Eva, using her without respect."],["Form","The Inspector’s anger shows his role as a voice for those who cannot speak for themselves."],["Structure","This comes in Act 3, after Eric’s confession, as the Inspector sums up how each member of the family used her."],["Context","Working class women in 1912 had little protection and were often exploited by wealthier men."],["Writer's intention","Priestley presents gender and class inequality through Eva, showing how she was treated as worthless."],["Effect on a 1945 audience","After a war fought against regimes that treated people as less than human, a 1945 audience would be disgusted that Eva was treated as ‘a thing’."],["Critical and conceptual reading","Sheila’s simile, ‘as if she was an animal, a thing’, recognises how the family dehumanised Eva. Conceptually, the line exposes the logic of class contempt. A critical reading sees Sheila voicing the play’s moral awakening."]],"th":"Class · Gender · Social responsibility"},{"q":"elaborate fine feelings","src":"Mrs Birling about Eva, Act 2","f":[["Language","The sarcastic adjectives ‘elaborate’ and ‘fine’ show Mrs Birling mocking Eva for having pride and principles."],["Form","Her dismissive, sarcastic tone in front of the Inspector reveals her snobbery and complete lack of compassion."],["Structure","This comes during her interrogation, as she explains why she refused Eva help."],["Context","Upper class people often believed the poor could not have the same feelings or morals as themselves."],["Writer's intention","Priestley presents Eva as a person of dignity, exposing the prejudice of the wealthy."],["Effect on a 1945 audience","A 1945 audience would admire Eva’s dignity and see Mrs Birling’s sarcasm as the arrogant snobbery that the post war world rejected."],["Critical and conceptual reading","The Inspector dismisses ‘elaborate fine feelings’ that arrive too late. Conceptually, sentiment without action is worthless. A critical reading sees Priestley demanding practical change, such as the welfare state, rather than private guilt that changes nothing for the Eva Smiths of the world."]],"th":"Class · Gender · Morality and hypocrisy"}]},{"n":"Social Responsibility","k":"Theme","sum":"","quotes":[{"q":"We are members of one body.","src":"The Inspector’s final speech, Act 3","f":[["Language","The metaphor of ‘one body’ suggests that society is connected, so harming one person harms everyone, like an injury to a single body."],["Form","The Inspector’s final speech works like a sermon delivered to the audience as well as the family."],["Structure","It comes as his final speech just before he leaves, so it is the climax of the play’s message."],["Context","The phrase echoes the Bible, which describes Christians as members of one body; Priestley turns it into a call for social justice."],["Writer's intention","Priestley presents social responsibility as a moral duty, urging his aud
