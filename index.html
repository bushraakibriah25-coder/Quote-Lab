he partner notes in the poem."],["Poet's intention","Sheers presents romantic love as lasting and able to heal itself, often through touch rather than words."],["Effect on the reader","The reader feels relief and contentment as the couple are reunited."],["Critical and conceptual reading","The simile of hands ‘like a pair of wings settling after flight’ shows peace restored. Conceptually, reconciliation feels natural, like birds landing. A critical reading sees the separate final line enacting calm after a storm."]],"th":""}],"pctx":["Sheers (born 1974) writes about relationships repaired after conflict.","Sheers uses swans, which mate for life, to suggest reconciliation."],"voc":{"v":[["reconciliation","restoring a relationship","The swans prompt reconciliation."],["estrangement","distance in a relationship","The couple begin in estrangement."]],"m":[["L","Simile","like a pair of wings settling after flight","Their joined hands become a symbol of peace.",1],["S","Couplets","The poem is written in couplets","Pairs of lines reflect the couple and the pairing of swans.",0],["F","Final single line","The last line stands alone","The separate line suggests calm after conflict.",0]]}},{"n":"Singh Song!","k":"Daljit Nagra","sum":"Compare with: Love’s Philosophy; The Farmer’s Bride; Before You Were Mine","quotes":[{"q":"up di stairs is my newly bride","src":"Singh Song!, Daljit Nagra","f":[["Language","The phonetic spelling of Punjabi English gives the speaker an authentic, lively voice, and ‘newly bride’ shows his delight in his new marriage."],["Form","Short lines, rhyme and a repeated refrain give the poem a song like rhythm, like a celebration of love."],["Structure","The bride is mentioned early, and the poem keeps returning upstairs to her, showing she is the centre of his attention."],["Context","Daljit Nagra was born in London to Punjabi Sikh parents. The poem comes from Look We Have Coming to Dover! (2007)."],["Poet's intention","Nagra presents romantic love as joyful and more important than work, as the speaker neglects the shop for his wife."],["Effect on the reader","The reader is amused by his eagerness to escape upstairs."],["Critical and conceptual reading","The phonetic ‘newly bride’ celebrates a British Asian voice. Conceptually, Nagra’s dialect challenges the idea that poetry must be written in standard English. A postcolonial reading sees language itself as an act of identity and humour."]],"th":""},{"q":"she effing at my mum","src":"Singh Song!, Daljit Nagra","f":[["Language","The colloquial verb ‘effing’ shows the bride swearing at her mother in law, breaking traditional expectations of a respectful daughter in law."],["Form","Humour, rhyme and a cheerful rhythm make the family conflict feel comic rather than serious or bitter."],["Structure","This comes in a stanza celebrating the bride’s rebellious habits, which contrasts with the speaker’s duties in his father’s shop."],["Context","The poem plays with tensions in many British Asian families between traditional values and the freedoms of modern British life."],["Poet's intention","Nagra presents family relationships as lively and changing, as a new generation challenges the expectations of the old."],["Effect on the reader","The reader finds the bride’s rebellion funny and refreshing."],["Critical and conceptual reading","The bride’s rudeness to her mother in law is comic rebellion. Conceptually, she rejects the traditional role of the obedient daughter in law. A critical reading sees playful subversion of cultural expectations within a loving marriage."]],"th":""},{"q":"Is priceless baby","src":"Singh Song!, Daljit Nagra","f":[["Language","The adjective ‘priceless’ shows that their love cannot be measured in money, unlike the goods with price tags in the shop below."],["Form","The playful question and answer exchange creates a dialogue between equals, showing a modern, balanced relationship."],["Structure","The poem ends with this tender moment as the couple look out at the moon, slowing the lively pace into quiet romance."],["Context","Nagra celebrates British Asian experience, blending Punjabi English with the long tradition of romantic poetry about the moon."],["Poet's intention","Nagra presents romantic love as more valuable than money, work or duty, the one thing that cannot be sold."],["Effect on the reader","The reader feels warmth and happiness at the couple’s shared joy."],["Critical and conceptual reading","‘Is priceless baby’ declares love beyond money, a joke from a shopkeeper. Conceptually, romance triumphs over commerce. A critical reading celebrates ordinary, everyday love in a poem that refuses grand romantic conventions."]],"th":""}],"pctx":["Nagra (born 1966) is a British poet of Punjabi heritage who uses ‘Punglish’.","Nagra celebrates a young couple’s love and the blending of cultures."],"voc":{"v":[["affectionate","showing love","The speaker’s affectionate tone is playful."],["rebellious","breaking expectations","The bride is rebellious, defying her role."]],"m":[["L","Phonetic dialect","up di stairs is my newly bride","The voice celebrates British Asian identity.",1],["S","Refrain","Repeated customer complaints","The repeated chorus contrasts shop duty with love.",0],["F","Song like structure","Refrains and dialogue","The poem feels like a song of joy.",0]]}},{"n":"Climbing My Grandfather","k":"Andrew Waterhouse","sum":"Compare with: Follower; Eden Rock; Before You Were Mine","quotes":[{"q":"I decide to do it free, without a rope or net.","src":"Climbing My Grandfather, Andrew Waterhouse","f":[["Language","The phrase ‘without a rope or net’ shows the grandson’s complete trust in his grandfather, needing no safety equipment at all."],["Form","One unbroken stanza of free verse mirrors a single, continuous climb from the grandfather’s feet to his head."],["Structure","The poem opens with this decision, immediately setting up the extended metaphor of the grandfather as a mountain."],["Context","Andrew Waterhouse was an environmentalist who loved the outdoors. The poem is from In (2000), which won a Forward Prize."],["Poet's intention","Waterhouse presents family relationships as trusting and adventurous, a journey towards knowing someone better."],["Effect on the reader","The reader feels the excitement of a child setting off on an adventure."],["Critical and conceptual reading","The grandson climbs ‘without a rope or net’, trusting completely. Conceptually, climbing becomes an extended metaphor for coming to know someone through touch and memory. A critical reading sees love as a risk taken freely."]],"th":""},{"q":"the glassy ridge of a scar","src":"Climbing My Grandfather, Andrew Waterhouse","f":[["Language","The metaphor turns the scar into part of the mountain landscape, and ‘glassy’ suggests an old wound healed smooth over many years."],["Form","The present tense makes each discovery feel immediate, as if the grandson is exploring his grandfather right now."],["Structure","This comes in the middle of the climb, as the grandson moves up the arm and learns more about his grandfather’s life."],["Context","Details such as the scar and the ‘earth-stained hand.’ suggest the grandfather lived a life of hard physical work."],["Poet's intention","Waterhouse presents memory and the past as written on the grandfather’s body, a history the child can only imagine."],["Effect on the reader","The reader feels curiosity about the grandfather’s untold history."],["Critical and conceptual reading","The ‘glassy ridge of a scar’ marks the grandfather’s history on his body. Conceptually, flaws and injuries are part of who we love. A critical reading sees intimacy in noticing the marks that time and work have left."]],"th":""},{"q":"the slow pulse of his good heart.","src":"Climbing My Grandfather, Andrew Waterhouse","f":[["Language","The adjective ‘good’ celebrates the grandfather’s kindness, while ‘slow’ suggests his age and perhaps that his life is ending."],["Form","The final line slows the poem’s pace into stillness, after the energy and effort of the climb."],["Structure","The poem ends at the summit, the moment of greatest closeness, where the grandson feels the life inside his grandfather."],["Context","Waterhouse died in 2001, a year after the collection was published, which gives the ending added poignancy for readers today."],["Poet's intention","Waterhouse presents family love as deep and tender, reaching its height in a quiet moment of physical closeness."],["Effect on the reader","The reader feels warmth, admiration and a quiet sadness."],["Critical and conceptual reading","‘the slow pulse of his good heart’ ends the climb at the summit. Conceptually, the heart is the destination, both physically and emotionally. A critical reading sees love as the reward of patient, attentive closeness."]],"th":""}],"pctx":["Waterhouse (1958 to 2001) uses an extended metaphor of climbing.","Waterhouse presents the grandfather as a mountain, showing the child’s awe and love."],"voc":{"v":[["reverence","deep respect","The grandson climbs with reverence."],["intimacy","closeness","The poem explores intimacy between generations."]],"m":[["L","Extended metaphor","I decide to do it free, without a rope or net.","Climbing a mountain represents getting to know him.",1],["S","Single stanza","One continuous verse paragraph","The unbroken form mirrors the climb.",0],["F","Free verse","No regular rhyme","Freedom matches the decision to climb ‘free’.",0]]}}],"ctx9":[["Romantic love","Byron, Shelley and Barrett Browning explore passion and longing.","Romantic poets present love as overwhelming, sometimes destructively so."],["Victorian marriage","Women had few rights within marriage.","The Farmer’s Bride exposes how Victorian marriage could trap women."],["Family","Heaney, Armitage, Duffy and Day Lewis explore parents and children.","Family poems show love through small, everyday moments and letting go."],["Loss","Hardy, Causley and Byron explore endings and grief.","Loss poems use nature and memory to show how love lingers after it ends."],["Dramatic monologue","Browning uses a speaker who reveals more than he intends.","Porphyria’s Lover reveals obsession through its own speaker’s voice."],["Comparison","Compare a named poem with one other.","Grade 9 answers compare methods and context, not just ideas."]]},{"id":"pc","title":"Power and Conflict","author":"","kind":"Poetry anthology","paper":"Paper 2, Section B","col":"#37474F","ctx":[["Comparison","Question 26 compares a named poem with one other poem of your choice (30 marks)."],["Romantics","Shelley, Blake and Wordsworth celebrated nature and attacked tyranny."],["War poets","Tennyson, Owen, Hughes and Armitage show changing views of war."],["Identity","Agard, Rumens, Dharker and Garland explore identity and belonging."]],"groups":[{"n":"Ozymandias","k":"Percy Bysshe Shelley","sum":"A traveller describes a ruined statue of an arrogant king, its boast mocked by the empty desert.","quotes":[{"q":"sneer of cold command","src":"Ozymandias, Percy Bysshe Shelley","f":[["Language","The sibilance in ‘sneer’ and the harsh ‘c’ of ‘cold command’ suggest cruelty and contempt."],["Form and structure","Part of a list of facial features carved by the sculptor, framed through a second hand narrative."],["Perceptive reading","The sculptor ‘read’ the king’s passions well, so art outlives power and judges it."],["Context","Shelley was a radical Romantic who opposed tyranny and monarchy (1817)."],["Writer's intention","To show that tyrants are remembered for their cruelty."],["Critical and conceptual reading","The ‘sneer of cold command’ shows the sculptor capturing the tyrant’s contempt. Conceptually, art outlives power and exposes it. A critical reading sees Shelley, a radical Romantic, attacking all tyrants, including the monarchs of his own day."]],"th":"Power · Pride · Art"},{"q":"Look on my works, ye Mighty, and despair!","src":"Ozymandias, Percy Bysshe Shelley","f":[["Language","The imperative and exclamation show arrogance; ‘Mighty’ addresses other rulers."],["Form and structure","The boast comes just before the volta ‘Nothing beside remains’, so structure mocks it."],["Perceptive reading","Ironically, rulers should despair because their power will also crumble."],["Context","Ramesses II’s statue was being brought to Britain at the time."],["Writer's intention","To ridicule human pride."],["Critical and conceptual reading","Ozymandias’s boast now stands over empty sand, turning pride into irony. Conceptually, time destroys every empire. A critical reading sees the inscription mocking its author, so power’s own words become its epitaph."]],"th":"Power · Pride · Time"},{"q":"The lone and level sands stretch far away.","src":"Ozymandias, Percy Bysshe Shelley","f":[["Language","Alliteration of ‘lone’ and ‘level’ creates an endless, empty landscape."],["Form and structure","The final line leaves us with nature, not the king."],["Perceptive reading","Time and nature are the ultimate powers."],["Context","Romantics believed in the sublime power of nature."],["Writer's intention","To show that human power is temporary."],["Critical and conceptual reading","‘The lone and level sands stretch far away’ ends with nature’s indifference. Conceptually, the vast desert dwarfs human ambition. A critical reading sees the alliteration slowing the line into an image of endless time."]],"th":"Power of nature · Time · Pride"}],"pctx":["Shelley (1792 to 1822) was a radical Romantic who opposed monarchy; the poem (1818) was inspired by a statue of Ramesses II.","Shelley uses the ruined statue to warn that tyrants’ power is temporary, a dangerous message in an age of censorship."],"voc":{"v":[["transient","lasting only a short time","Shelley shows that political power is transient, worn away by time."],["hubris","excessive pride that invites downfall","The tyrant’s hubris is mocked by the empty desert around his statue."]],"m":[["L","Irony","Look on my works, ye Mighty, and despair!","The boast now stands over nothing, so the ruler’s own words condemn his arrogance.",1],["S","Framed narrative","The story reaches us through a traveller","Layers of retelling show how distant and forgotten Ozymandias has become.",0],["F","Broken sonnet","A sonnet that mixes Petrarchan and Shakespearean rhyme","The irregular rhyme scheme mirrors the shattered statue and the collapse of power.",0]]}},{"n":"London","k":"William Blake","sum":"A walk through London reveals suffering caused by those in power.","quotes":[{"q":"Marks of weakness, marks of woe","src":"London, William Blake","f":[["Language","Repetition of ‘marks’ shows suffering stamped on every face."],["Form and structure","Regular quatrains and ABAB rhyme create a relentless, marching rhythm."],["Perceptive reading","‘marks’ may also be scars left by the powerful."],["Context","Blake wrote in 1794 amid poverty and revolution in France."],["Writer's intention","To expose the misery of ordinary Londoners."],["Critical and conceptual reading","Blake’s repeated ‘marks’ shows suffering stamped on every face in London. Conceptually, oppression is universal and visible to anyone who looks. A Marxist reading sees Blake exposing the human cost of industrial capitalism and corrupt institutions."]],"th":"Power · Suffering · Society"},{"q":"mind-forg’d manacles","src":"London, William Blake","f":[["Language","The metaphor suggests people are chained mentally as well as physically."],["Form and structure","Placed at the end of stanza 2, it sums up the poem’s anger."],["Perceptive reading","The chains may be self imposed, urging people to free their minds."],["Context","Blake was a radical critic of Church and state."],["Writer's intention","To encourage readers to question authority."],["Critical and conceptual reading","‘mind-forg’d manacles’ suggests people imprison themselves by accepting oppression. Conceptually, the chains are psychological as well as political. A critical reading sees Blake calling for a revolution of thought."]],"th":"Power · Control · Oppression"},{"q":"blights with plagues the Marriage hearse","src":"London, William Blake","f":[["Language","The oxymoron ‘Marriage hearse’ links life’s beginnings with death."],["Form and structure","The poem ends at ‘midnight’, its darkest point."],["Perceptive reading","Suffering passes from generation to generation."],["Context","Poverty forced young women into prostitution."],["Writer's intention","To condemn a society that destroys lives."],["Critical and conceptual reading","The oxymoron ‘Marriage hearse’ fuses love and death. Conceptually, disease and prostitution poison even the most sacred institutions. A critical reading sees Blake presenting society as spreading death rather than life."]],"th":"Power · Corruption · Society"}],"pctx":["Blake (1757 to 1827) was a radical poet and engraver; ‘London’ (1794) appeared in Songs of Experience during the French Revolution.","Blake’s ‘mind-forg’d manacles’ suggest that the people’s oppression is both imposed and self accepted."],"voc":{"v":[["oppression","cruel and unjust control","Blake exposes the oppression of London’s poor by church, monarchy and wealth."],["institutional","relating to powerful organisations","The chimney sweep and soldier suffer at the hands of institutional power."]],"m":[["L","Metaphor","mind-forg’d manacles","People are imprisoned by their own minds, accepting the oppression around them.",1],["S","Repetition","Marks of weakness, marks of woe","Relentless repetition makes suffering inescapable on every face.",1],["F","Regular quatrains","Four stanzas in ABAB rhyme and steady metre","The rigid form mirrors the control that the city’s powers exert.",0]]}},{"n":"The Prelude (extract)","k":"William Wordsworth","sum":"A boy rows across a lake at night and is terrified by a huge mountain, changing how he sees nature.","quotes":[{"q":"an act of stealth / And troubled pleasure","src":"The Prelude (extract), William Wordsworth","f":[["Language","The oxymoron ‘troubled pleasure’ shows guilt mixed with excitement."],["Form and structure","Blank verse creates a natural, reflective voice."],["Perceptive reading","Taking the boat hints at sin, as if nature will punish him."],["Context","An autobiographical Romantic poem about childhood."],["Writer's intention","To show how nature teaches moral lessons."],["Critical and conceptual reading","‘an act of stealth / And troubled pleasure’ shows the boy’s guilty thrill in taking the boat. Conceptually, the theft foreshadows nature’s punishment. A critical reading sees a moral education beginning in childhood mischief."]],"th":"Power of nature · Guilt · Childhood"},{"q":"a huge peak, black and huge","src":"The Prelude (extract), William Wordsworth","f":[["Language","Repetition of ‘huge’ shows the boy struggling to describe the mountain."],["Form and structure","The volta turns from confidence to fear."],["Perceptive reading","The mountain becomes a living, threatening presence."],["Context","Romantics believed nature was sublime: beautiful and terrifying."],["Writer's intention","To show human insignificance before nature."],["Critical and conceptual reading","The repeated ‘huge’ makes the peak seem to grow and pursue him. Conceptually, nature’s sublime power humbles human confidence. A critical reading sees Wordsworth’s Romantic belief that nature teaches moral lessons."]],"th":"Power of nature · Fear · Identity"},{"q":"a darkness, call it solitude / Or blank desertion","src":"The Prelude (extract), William Wordsworth","f":[["Language","‘darkness’ and ‘blank desertion’ show emptiness and confusion."],["Form and structure","Enjambment and caesura show his thoughts stumbling."],["Perceptive reading","His view of the world is permanently changed."],["Context","Wordsworth wrote about growing up in the Lake District."],["Writer's intention","To show nature’s lasting effect on the mind."],["Critical and conceptual reading","The ‘darkness’ and ‘blank desertion’ show the lasting effect on the boy’s mind. Conceptually, the experience unsettles his sense of self. A critical reading sees the sublime leaving a psychological scar."]],"th":"Power of nature · Memory · Identity"}],"pctx":["Wordsworth (1770 to 1850) grew up in the Lake District; ‘The Prelude’ is an autobiographical poem about the growth of his mind.","The mountain teaches the boy humility, reflecting the Romantic belief in nature as a moral teacher."],"voc":{"v":[["sublime","awe inspiring beauty mixed with terror","The mountain is sublime, both magnificent and frightening."],["humility","a modest view of your own importance","Nature teaches the boy humility after his confident start."]],"m":[["L","Personification","a huge peak, black and huge","The repeated ‘huge’ makes the mountain seem to grow and threaten him.",1],["S","Volta","From ‘troubled pleasure’ to fear","The shift in mood mirrors his changing view of nature’s power.",0],["F","Blank verse","Unrhymed iambic pentameter","Natural rhythm suits a reflective autobiographical poem.",0]]}},{"n":"My Last Duchess","k":"Robert Browning","sum":"A Duke shows a visitor a portrait of his late wife, revealing his jealousy and that he had her killed.","quotes":[{"q":"Looking as if she were alive","src":"My Last Duchess, Robert Browning","f":[["Language","The subjunctive ‘as if’ hints she is dead."],["Form and structure","A dramatic monologue lets the Duke reveal himself."],["Perceptive reading","He prefers her as a painting he can control."],["Context","Based on Alfonso II, Duke of Ferrara (1500s)."],["Writer's intention","To expose male control over women."],["Critical and conceptual reading","‘Looking as if she were alive’ hints chillingly that the Duchess is dead. Conceptually, art lets the Duke control her image completely. A feminist reading sees a woman reduced to a possession behind a curtain."]],"th":"Power · Control · Gender"},{"q":"I gave commands; / Then all smiles stopped together.","src":"My Last Duchess, Robert Browning","f":[["Language","The euphemism hides murder in calm language."],["Form and structure","Caesura and enjambment create a chilling pause."],["Perceptive reading","His calm tone makes him more frightening."],["Context","Victorian wives had few legal rights."],["Writer's intention","To show the cruelty of absolute power."],["Critical and conceptual reading","‘Then all smiles stopped together’ euphemistically confesses murder. Conceptually, the Duke’s calm language hides violence. A critical reading sees the dramatic monologue revealing more than he intends."]],"th":"Power · Pride · Control"},{"q":"My gift of a nine-hundred-years-old name","src":"My Last Duchess, Robert Browning","f":[["Language","He values his ancient name above love."],["Form and structure","Rhyming couplets hidden by enjambment suggest control behind a casual manner."],["Perceptive reading","His pride is fragile, threatened by a smile."],["Context","Aristocrats valued lineage and status."],["Writer's intention","To criticise arrogance and status."],["Critical and conceptual reading","The Duke’s ‘nine-hundred-years-old name’ shows pride in lineage. Conceptually, he sees his name as a gift the Duchess failed to value enough. A critical reading exposes aristocratic arrogance and the treatment of wives as possessions."]],"th":"Power · Pride · Status"}],"pctx":["Browning (1812 to 1889) based the poem (1842) on Alfonso II, Duke of Ferrara, whose young wife died suspiciously.","The Duke’s control over the portrait mirrors Victorian men’s legal control over their wives."],"voc":{"v":[["controlling","wanting to dominate others","The Duke is controlling, unable to bear his wife’s freedom."],["jealousy","resentment of others’ attention","Jealousy over the Duchess’s smiles drives the Duke to murder."]],"m":[["L","Euphemism","I gave commands; / Then all smiles stopped together.","A chilling murder is hidden behind calm, polite language.",1],["S","Enjambment within couplets","Rhyming couplets with lines that run on","Order is imposed on the surface, but his speech spills beyond control.",0],["F","Dramatic monologue","The Duke speaks to the Count’s envoy","He reveals more than he intends, exposing his cruelty.",0]]}},{"n":"The Charge of the Light Brigade","k":"Alfred, Lord Tennyson","sum":"A tribute to soldiers who charged to their deaths because of a mistaken order.","quotes":[{"q":"Into the valley of Death","src":"The Charge of the Light Brigade, Alfred, Lord Tennyson","f":[["Language","The metaphor links the valley to the biblical ‘valley of the shadow of death’."],["Form and structure","The repeated phrase and dactylic rhythm imitate galloping horses."],["Perceptive reading","The men ride bravely into certain death."],["Context","Written in 1854 after the Battle of Balaclava, Crimean War."],["Writer's intention","To honour the soldiers’ courage."],["Critical and conceptual reading","‘Into the valley of Death’ turns the battlefield into a biblical valley. Conceptually, the soldiers’ sacrifice is glorified as heroic martyrdom. A critical reading notes Tennyson, as Poet Laureate, honoured the men while admitting the charge was a blunder."]],"th":"Conflict · Duty · Death"},{"q":"Someone had blunder’d","src":"The Charge of the Light Brigade, Alfred, Lord Tennyson","f":[["Language","‘blunder’d’ admits a terrible mistake by commanders."],["Form and structure","This short line stands out amid the praise."],["Perceptive reading","Tennyson quietly criticises leaders while honouring soldiers."],["Context","Tennyson was Poet Laureate, writing from newspaper reports."],["Writer's intention","To question military leadership."],["Critical and conceptual reading","‘Someone had blunder’d’ quietly blames the commanders. Conceptually, Tennyson balances patriotism with criticism of leadership. A critical reading sees duty and obedience leading soldiers to needless death."]],"th":"Conflict · Duty · Power"},{"q":"Honour the Light Brigade","src":"The Charge of the Light Brigade, Alfred, Lord Tennyson","f":[["Language","The imperative commands readers to respect the soldiers."],["Form and structure","The final stanza turns the poem into a memorial."],["Perceptive reading","It may also turn tragedy into propaganda."],["Context","Victorian patriotism celebrated heroic sacrifice."],["Writer's intention","To create a lasting tribute."],["Critical and conceptual reading","The imperative ‘Honour the Light Brigade’ commands remembrance. Conceptually, the poem works as a public memorial. A critical reading contrasts this patriotic tone with the bitter realism of later war poets such as Owen."]],"th":"Conflict · Memory · Patriotism"}],"pctx":["Tennyson (1809 to 1892) was Poet Laureate; he wrote the poem in 1854 after reading of the Battle of Balaclava.","Tennyson honours the soldiers while quietly criticising the leaders who ‘blunder’d’."],"voc":{"v":[["valour","great courage in danger","Tennyson honours the soldiers’ valour despite the disaster."],["futile","pointless","The charge was futile, caused by a military blunder."]],"m":[["L","Metaphor","Into the valley of Death","The battlefield becomes a biblical valley of death, glorifying the soldiers’ sacrifice.",1],["S","Repetition and refrain","Honour the Light Brigade","The repeated lines build like a hymn of praise.",1],["F","Dactylic dimeter","A galloping rhythm","The rhythm mimics horses charging into battle.",0]]}},{"n":"Exposure","k":"Wilfred Owen","sum":"Soldiers in First World War trenches are slowly killed by the freezing weather while waiting for an attack.","quotes":[{"q":"Our brains ache, in the merciless iced east winds that knive us","src":"Exposure, Wilfred Owen","f":[["Language","Personification makes the wind an attacker; sibilance hisses like the wind."],["Form and structure","Long lines and half rhyme create unease."],["Perceptive reading","Nature is the real enemy, not the Germans."],["Context","Owen served on the Western Front in winter 1917."],["Writer's intention","To show the futility of war."],["Critical and conceptual reading","Owen personifies the ‘merciless iced east winds’ as an enemy that ‘knive[s]’ the soldiers. Conceptually, nature, not the Germans, is the true killer in the trenches. A critical reading sees Owen exposing the futility of war."]],"th":"Power of nature · Conflict · Suffering"},{"q":"But nothing happens.","src":"Exposure, Wilfred Owen","f":[["Language","The flat statement shows boredom and futility."],["Form and structure","The refrain ends stanzas, creating a cyclical structure."],["Perceptive reading","Waiting itself becomes a form of torture."],["Context","Trench warfare involved long periods of inactivity."],["Writer's intention","To challenge heroic images of war."],["Critical and conceptual reading","The refrain ‘But nothing happens.’ captures endless, pointless waiting in the trenches. Conceptually, war is boredom and suffering rather than glory. A critical reading contrasts Owen’s realism with Tennyson’s heroic charge."]],"th":"Conflict · Futility · Suffering"},{"q":"All their eyes are ice","src":"Exposure, Wilfred Owen","f":[["Language","The metaphor shows soldiers frozen to death."],["Form and structure","This appears near the end, the poem’s darkest moment."],["Perceptive reading","Their humanity is lost; they become objects."],["Context","Owen was killed a week before the Armistice in 1918."],["Writer's intention","To shock readers with war’s reality."],["Critical and conceptual reading","‘All their eyes are ice’ ends with frozen corpses. Conceptually, death strips soldiers of humanity and individuality. A critical reading sees Owen forcing readers to confront the reality of war that patriotic poetry hides."]],"th":"Conflict · Death · Nature"}],"pctx":["Owen (1893 to 1918) served on the Western Front and was killed a week before the Armistice.","Owen presents nature, not the enemy, as the killer, exposing the futility of trench warfare."],"voc":{"v":[["futility","pointlessness","Owen shows the futility of waiting in freezing trenches."],["desolation","emptiness and misery","The landscape is one of desolation."]],"m":[["L","Personification","Our brains ache, in the merciless iced east winds that knive us","The weather becomes the true enemy, attacking the soldiers.",1],["S","Refrain","But nothing happens.","The repeated line shows endless waiting and hopelessness.",1],["F","Pararhyme","Half rhymes at the ends of lines","Uneasy sounds mirror the soldiers’ discomfort and a world out of joint.",0]]}},{"n":"Storm on the Island","k":"Seamus Heaney","sum":"An island community prepares for a storm but is terrified by its power.","quotes":[{"q":"We are prepared","src":"Storm on the Island, Seamus Heaney","f":[["Language","The confident opening shows community and self reliance."],["Form and structure","Blank verse in one solid block mirrors the squat houses."],["Perceptive reading","The confidence is soon undermined."],["Context","Heaney grew up in rural Northern Ireland."],["Writer's intention","To show the limits of human preparation."],["Critical and conceptual reading","‘We are prepared’ opens with communal confidence against the storm. Conceptually, humans believe they can control nature. A critical reading sees the poem dismantling this certainty, and some read the storm as a metaphor for the Troubles in Northern Ireland."]],"th":"Power of nature · Community · Fear"},{"q":"spits like a tame cat / Turned savage","src":"Storm on the Island, Seamus Heaney","f":[["Language","The simile shows something familiar becoming violent."],["Form and structure","Enjambment creates a sudden turn."],["Perceptive reading","It may symbolise conflict erupting in Northern Ireland."],["Context","Published in 1966, before the Troubles."],["Writer's intention","To show nature’s hidden violence."],["Critical and conceptual reading","The simile of a ‘tame cat / Turned savage’ shows something familiar becoming hostile. Conceptually, nature’s power is unpredictable, overturning the islanders’ confidence. A critical reading sees the poem as being about fear of the familiar, whether weather or political violence close to home."]],"th":"Power of nature · Conflict · Fear"},{"q":"a huge nothing that we fear","src":"Storm on the Island, Seamus Heaney","f":[["Language","The paradox shows fear of something invisible."],["Form and structure","The poem ends on fear, undermining the opening."],["Perceptive reading","‘Storm on’ may pun on Stormont, hinting at political tension."],["Context","Northern Ireland’s parliament was at Stormont."],["Writer's intention","To show fear of unseen forces."],["Critical and conceptual reading","‘a huge nothing that we fear’ ends on invisible terror. Conceptually, fear has no clear object, which makes it more powerful. Some critics link this to political anxiety, noting the poem was published in 1966, at the start of the Troubles in Northern Ireland."]],"th":"Power of nature · Fear · Conflict"}],"pctx":["Heaney (1939 to 2013) grew up in rural Northern Ireland; the poem was published in 1966.","The title’s pun on Stormont hints at the political storm brewing in Northern Ireland."],"voc":{"v":[["isolated","cut off from others","The islanders are isolated against the storm."],["vulnerable","exposed to harm","Their confidence gives way to feeling vulnerable."]],"m":[["L","Simile","spits like a tame cat / Turned savage","Something familiar turns hostile, showing nature’s unpredictable power.",1],["S","Shift from confidence to fear","We are prepared … a huge nothing that we fear","The poem moves from certainty to fear of an invisible force.",0],["F","Blank verse","Unrhymed iambic pentameter","The conversational voice reflects a community talking together.",0]]}},{"n":"Bayonet Charge","k":"Ted Hughes","sum":"A soldier charges across a field in the First World War, his patriotism replaced by terror.","quotes":[{"q":"Suddenly he awoke and was running","src":"Bayonet Charge, Ted Hughes","f":[["Language","The adverb ‘Suddenly’ throws the reader into the action."],["Form and structure","Opening in medias res creates confusion."],["Perceptive reading","He ‘awoke’ from patriotic illusions."],["Context","Hughes’s father fought at Gallipoli."],["Writer's intention","To show the shock of real combat."],["Critical and conceptual reading","‘Suddenly he awoke and was running’ starts in the middle of action. Conceptually, the soldier is thrown into chaos without understanding. A critical reading sees war as disorientation rather than heroism."]],"th":"Conflict · Fear · Reality of war"},{"q":"King, honour, human dignity, etcetera / Dropped like luxuries","src":"Bayonet Charge, Ted Hughes","f":[["Language","‘etcetera’ dismisses patriotic ideals as meaningless."],["Form and structure","The list collapses under enjambment."],["Perceptive reading","Survival instinct replaces patriotism."],["Context","Published in 1957, questioning war propaganda."],["Writer's intention","To show patriotism as a lie in battle."],["Critical and conceptual reading","‘King, honour, human dignity, etcetera’ shows patriotic ideals dropping away. Conceptually, ‘etcetera’ dismisses abstract values in the face of terror. A critical reading sees Hughes exposing the emptiness of war propaganda."]],"th":"Conflict · Patriotism · Identity"},{"q":"yellow hare that rolled like a flame","src":"Bayonet Charge, Ted Hughes","f":[["Language","The image of a burning animal shows innocent suffering."],["Form and structure","The middle stanza freezes time."],["Perceptive reading","The hare reflects the soldier’s own terror."],["Context","War affects nature as well as people."],["Writer's intention","To show war’s destruction of innocence."],["Critical and conceptual reading","The ‘yellow hare’ rolling ‘like a flame’ shows innocent nature destroyed by war. Conceptually, the animal’s suffering mirrors the soldier’s own terror. A critical reading sees the hare jolting him into self preservation, the instinct that replaces patriotic ideals."]],"th":"Conflict · Suffering · Nature"}],"pctx":["Hughes (1930 to 1998) was influenced by his father’s experiences at Gallipoli; published 1957.","Hughes strips away patriotic ideals to show a soldier reduced to animal instinct."],"voc":{"v":[["disorientation","confusion about where you are","The soldier’s disorientation is shown as he runs without understanding why."],["patriotism","love and loyalty to your country","Patriotic ideals disappear in the terror of battle."]],"m":[["L","Simile","yellow hare that rolled like a flame","The suffering hare shows the destruction of innocent nature.",1],["S","In medias res","Suddenly he awoke and was running","Starting in the middle of action plunges the reader into chaos.",1],["F","Free verse with enjambment","Irregular lines that run on","The broken form mirrors the soldier’s panic.",0]]}},{"n":"Remains","k":"Simon Armitage","sum":"A soldier recalls shooting a looter and cannot escape the memory.","quotes":[{"q":"probably armed, possibly not","src":"Remains, Simon Armitage","f":[["Language","The adverbs show uncertainty and guilt."],["Form and structure","Casual spoken language makes it feel like an interview."],["Perceptive reading","The soldier cannot know if the killing was justified."],["Context","Based on interviews with soldiers with PTSD (The Not Dead, 2008)."],["Writer's intention","To show the moral grey areas of war."],["Critical and conceptual reading","‘probably armed, possibly not’ shows the uncertainty behind the killing. Conceptually, the soldier cannot be sure the man was a threat. A critical reading sees moral doubt as the root of lasting trauma."]],"th":"Guilt · Conflict · Memory"},{"q":"his bloody life in my bloody hands","src":"Remains, Simon Armitage","f":[["Language","‘bloody’ is a swear word and literal blood."],["Form and structure","The final line echoes Lady Macbeth’s guilt."],["Perceptive reading","He takes full responsibility for the death."],["Context","Modern conflicts in Iraq."],["Writer's intention","To show the lasting psychological impact of war."],["Critical and conceptual reading","‘his bloody life in my bloody hands’ fuses literal blood with angry swearing. Conceptually, guilt stains the soldier like Macbeth’s hands, a stain no washing can remove. A critical reading links the image to post traumatic stress, showing the psychological wounds that outlast physical combat."]],"th":"Guilt · Memory · Conflict"},{"q":"he’s here in my head when I close my eyes","src":"Remains, Simon Armitage","f":[["Language","The present tense shows the memory is still with him."],["Form and structure","The shift from ‘we’ to ‘I’ shows personal guilt."],["Perceptive reading","The war has followed him home."],["Context","PTSD causes flashbacks and nightmares."],["Writer's intention","To show conflict never truly ends."],["Critical and conceptual reading","The shift into present tense, ‘he’s here in my head’, shows trauma that refuses to stay in the past. Conceptually, the dead man lives on in the soldier’s memory. A critical reading sees Armitage giving voice to veterans whose suffering continues long after they return home."]],"th":"Memory · Trauma · Guilt"}],"pctx":["Armitage (born 1963) based the poem on interviews with soldiers for ‘The Not Dead’ (2008).","Armitage shows that post traumatic stress keeps conflict alive long after soldiers return home."],"voc":{"v":[["trauma","deep emotional shock","The soldier’s trauma replays the killing again and again."],["culpability","responsibility for wrongdoing","He cannot escape his sense of culpability."]],"m":[["L","Colloquial language","probably armed, possibly not","The casual tone makes the uncertainty of the killing more disturbing.",1],["S","Shift from past to present","he’s here in my head when I close my eyes","The move to present tense shows the memory still haunts him.",1],["F","Dramatic monologue","Based on a soldier’s testimony","The real voice gives the poem authenticity.",0]]}},{"n":"Poppies","k":"Jane Weir","sum":"A mother describes her son leaving home to join the army and her grief afterwards.","quotes":[{"q":"I pinned one onto your lapel","src":"Poppies, Jane Weir","f":[["Language","The poppy symbolises remembrance and foreshadows loss."],["Form and structure","Free verse and long sentences sound like spoken memory."],["Perceptive reading","The pin may hint at pain and danger."],["Context","Written in 2009 for a collection about conflict."],["Writer's intention","To show war’s effect on families."],["Critical and conceptual reading","Pinning the poppy onto her son’s lapel is an act of love and remembrance. Conceptually, a domestic gesture is shadowed by war. A critical reading notes the ambiguity: is the son leaving for war, or already dead?"]],"th":"Loss · Memory · Conflict"},{"q":"my stomach busy / making tucks, darts, pleats","src":"Poppies, Jane Weir","f":[["Language","Sewing imagery shows anxiety hidden in domestic routine."],["Form and structure","The list conveys nervous movement."],["Perceptive reading","Weir was a textile designer, so the imagery reflects her life."],["Context","Mothers’ experiences of war are often unseen."],["Writer's intention","To present war from the home front."],["Critical and conceptual reading","The sewing imagery ‘tucks, darts, pleats’ shows grief folded into domestic tasks. Conceptually, the mother’s body holds emotion she cannot express. A feminist reading sees the private, often unseen grief of women left at home."]],"th":"Loss · Motherhood · Fear"},{"q":"hoping to hear / your playground voice catching on the wind","src":"Poppies, Jane Weir","f":[["Language","‘playground voice’ shows she still sees him as a child."],["Form and structure","The poem ends without resolution."],["Perceptive reading","She may be grieving a death or simply his absence."],["Context","Remembrance traditions honour the dead."],["Writer's intention","To show the pain of loss."],["Critical and conceptual reading","The mother hopes to hear his ‘playground voice’ on the wind. Conceptually, loss reaches back to his innocent childhood. A critical reading sees grief that never ends, as memory replaces presence."]],"th":"Loss · Memory · Grief"}],"pctx":["Weir (born 1963) is a poet and textile designer; the poem was commissioned in 2009 about modern conflict.","Weir presents war through a mother’s grief, revealing the hidden cost of conflict at home."],"voc":{"v":[["grief","deep sorrow after loss","The mother’s grief is quiet and domestic."],["apprehension","anxious fear about the future","Her apprehension as her son leaves is shown through small actions."]],"m":[["L","Semantic field of sewing","making tucks, darts, pleats","Domestic imagery shows the mother trying to hold her emotions together.",1],["S","Enjambment","Long, flowing lines across stanzas","The run on lines mirror memories spilling into one another.",0],["F","Free verse","No regular rhyme or metre","The loose form reflects grief that cannot be controlled.",0]]}},{"n":"War Photographer","k":"Carol Ann Duffy","sum":"A photographer develops his pictures of war at home, reflecting on how little the public cares.","quotes":[{"q":"spools of suffering set out in ordered rows","src":"War Photographer, Carol Ann Duffy","f":[["Language","Sibilance and alliteration create a calm, careful tone."],["Form and structure","Regular stanzas reflect his control."],["Perceptive reading","Rows recall war graves."],["Context","Duffy was inspired by photographers Don McCullin and Philip Jones Griffiths."],["Writer's intention","To show the photographer’s burden."],["Critical and conceptual reading","The alliterative ‘spools of suffering’ set in ‘ordered rows’ contrasts order with horror. Conceptually, the photographer tries to control chaos through his work. A critical reading sees the rows of film recalling rows of graves, as the darkroom becomes a church."]],"th":"Conflict · Memory · Suffering"},{"q":"All flesh is grass","src":"War Photographer, Carol Ann Duffy","f":[["Language","The biblical quotation shows life is short."],["Form and structure","It links his work to religious ritual."],["Perceptive reading","Death is universal and unavoidable."],["Context","Published in 1985."],["Writer's intention","To show the fragility of life."],["Critical and conceptual reading","The biblical ‘All flesh is grass’ reminds readers of human mortality. Conceptually, the photographer’s work becomes a kind of prayer. A critical reading sees religious language giving dignity to victims."]],"th":"Conflict · Death · Religion"},{"q":"The reader’s eyeballs prick / with tears between the bath and pre-lunch beers","src":"War Photographer, Carol Ann Duffy","f":[["Language","‘prick’ suggests brief, shallow emotion."],["Form and structure","Rhyming couplet makes the indifference sound casual."],["Perceptive reading","Readers care only briefly before returning to comfort."],["Context","Sunday newspapers printed war photographs."],["Writer's intention","To criticise public indifference."],["Critical and conceptual reading","The reader’s eyes ‘prick / with tears between the bath and pre-lunch beers’, showing brief, shallow sympathy. Conceptually, comfortable readers soon forget. A critical reading condemns public indifference."]],"th":"Conflict · Indifference · Power"}],"pctx":["Duffy (born 1955), former Poet Laureate, was inspired by war photographers Don McCullin and Philip Jones Griffiths.","Duffy criticises a public whose ‘eyeballs prick’ only briefly before returning to comfort."],"voc":{"v":[["detachment","emotional distance","The photographer struggles to keep his detachment."],["indifference","lack of concern","Duffy criticises the public’s indifference to suffering."]],"m":[["L","Sibilance","spools of suffering set out in ordered rows","Soft sounds contrast with the horror, and ‘ordered rows’ recalls graves.",1],["S","Regular stanzas","Four six line stanzas","The neat structure mirrors the ordered rows of photographs.",0],["F","Third person narration","The photographer is described from outside","Distance mirrors his professional detachment.",0]]}},{"n":"Tissue","k":"Imtiaz Dharker","sum":"Thin paper, from maps to receipts, becomes a symbol of the fragility of power and human life.","quotes":[{"q":"Paper that lets the light / shine through","src":"Tissue, Imtiaz Dharker","f":[["Language","Light symbolises hope and truth."],["Form and structure","Free verse and enjambment flow like thin paper."],["Perceptive reading","Paper’s fragility shows human structures can change."],["Context","Dharker grew up in Glasgow and writes about identity."],["Writer's intention","To show power is fragile."],["Critical and conceptual reading","The image of tissue that ‘lets the light / shine through’ presents fragility as openness. Conceptually, human life is delicate yet luminous. A critical reading contrasts paper with the rigid structures of power, borders and buildings, suggesting what is fragile may be more human and more lasting."]],"th":"Power · Identity · Fragility"},{"q":"fine slips from grocery shops","src":"Tissue, Imtiaz Dharker","f":[["Language","Receipts show how money controls lives."],["Form and structure","Everyday objects build an extended metaphor."],["Perceptive reading","Even small things can record lives."],["Context","Modern consumer society."],["Writer's intention","To question materialism."],["Critical and conceptual reading","The ‘fine slips from grocery shops’ show ordinary paper recording daily lives. Conceptually, everyday documents hold more truth than grand monuments. A critical reading sees Dharker valuing small human histories over official records of power."]],"th":"Power · Society · Identity"},{"q":"turned into your skin","src":"Tissue, Imtiaz Dharker","f":[["Language","The final line links paper to human life."],["Form and structure","The single line ending stands alone."],["Perceptive reading","Humans are as fragile as tissue."],["Context","Dharker values humanity over power."],["Writer's intention","To show the value of human life."],["Critical and conceptual reading","‘turned into your skin’ links paper with the human body in the isolated final line. Conceptually, people are as fragile and translucent as tissue. A critical reading sees humanity itself as the true architecture worth building."]],"th":"Identity · Fragility · Power"}],"pctx":["Dharker (born 1954 in Pakistan) grew up in Glasgow and writes about identity and borders.","Dharker suggests that human structures of power are as fragile as paper."],"voc":{"v":[["fragility","being easily broken","Tissue paper symbolises the fragility of human life and power."],["impermanence","not lasting forever","Dharker suggests that borders and buildings are impermanent."]],"m":[["L","Extended metaphor","Paper that lets the light / shine through","Paper represents life as delicate yet open to light.",1],["S","Final isolated line","turned into your skin","The single line turns paper into the human body, a moving final image.",1],["F","Unrhymed quatrains","Loose four line stanzas","The light form mirrors the thinness of paper.",0]]}},{"n":"The Émigrée","k":"Carol Rumens","sum":"A speaker remembers the city she left as a child, which she still loves despite its conflict.","quotes":[{"q":"sunlight-clear","src":"The Émigrée, Carol Rumens","f":[["Language","Light imagery shows her positive memory of the city."],["Form and structure","The refrain of ‘sunlight’ ends each stanza."],["Perceptive reading","Her memory may be idealised by childhood."],["Context","Rumens writes about exile and displacement."],["Writer's intention","To show memory’s power."],["Critical and conceptual reading","‘sunlight-clear’ shows the speaker’s bright memory of her city. Conceptually, nostalgia preserves an idealised past. A critical reading questions whether memory distorts reality, since the city is now ruled by tyranny."]],"th":"Identity · Memory · Place"},{"q":"My city takes me dancing","src":"The Émigrée, Carol Rumens","f":[["Language","Personification makes the city a loving companion."],["Form and structure","The poem moves from past to present."],["Perceptive reading","The city lives inside her."],["Context","Many people are forced from their homelands."],["Writer's intention","To show attachment to place."],["Critical and conceptual reading","The speaker’s city ‘takes me dancing’, personified as a lover. Conceptually, home becomes an intimate companion rather than a place. A critical reading sees exile intensifying attachment, since what is lost becomes idealised."]],"th":"Identity · Belonging · Place"},{"q":"They accuse me of being dark in their free city","src":"The Émigrée, Carol Rumens","f":[["Language","‘They’ suggests a hostile new society."],["Form and structure","The final stanza shows threat."],["Perceptive reading","She is an outsider in her new home."],["Context","Refugees often face hostility."],["Writer's intention","To show the pain of displacement."],["Critical and conceptual reading","‘They accuse me of being dark in their free city’ reveals suspicion in her new home. Conceptually, exile brings hostility as well as safety. A critical reading exposes the hypocrisy of ‘free’ societies that distrust refugees."]],"th":"Identity · Conflict · Belonging"}],"pctx":["Rumens (born 1944) writes about exile and displacement.","The speaker’s ‘sunlight-clear’ memories show that home can survive in the mind despite conflict."],"voc":{"v":[["nostalgia","longing for the past","The speaker’s nostalgia for her city stays bright."],["exile","being forced to live away from home","She lives in exile in a ‘free city’ that rejects her."]],"m":[["L","Personification","My city takes me dancing","The city becomes a lover or companion, showing emotional attachment.",1],["S","Repeated ending image","The word ‘sunlight’ ends each stanza","Repetition keeps the hopeful memory alive.",0],["F","Free verse","Irregular stanzas","The loose form reflects memory and uncertainty.",0]]}},{"n":"Kamikaze","k":"Beatrice Garland","sum":"A Japanese pilot turns back from his suicide mission and is rejected by his family.","quotes":[{"q":"a samurai sword","src":"Kamikaze, Beatrice Garland","f":[["Language","The sword symbolises honour and tradition."],["Form and structure","Third person narration creates distance."],["Perceptive reading","He is weighed down by expectations."],["Context","Kamikaze pilots in the Second World War."],["Writer's intention","To show the pressure of duty."],["Critical and conceptual reading","The ‘samurai sword’ symbolises the pilot’s duty and inherited honour. Conceptually, tradition demands self sacrifice. A critical reading sees the weight of cultural expectation pressing on an individual’s choice to live."]],"th":"Conflict · Duty · Identity"},{"q":"flashing silver as their bellies / swivelled towards the sun","src":"Kamikaze, Beatrice Garland","f":[["Language","Natural imagery shows the beauty of life."],["Form and structure","Enjambment mirrors fish moving."],["Perceptive reading","Nature reminds him of life’s value."],["Context","Japanese culture valued honour."],["Writer's intention","To show life is worth more than duty."],["Critical and conceptual reading","The fish ‘flashing silver’ beneath the plane draw the pilot back to life and memory. Conceptually, nature’s beauty overrides nationalist duty. A critical reading sees love of life defeating ideology, at a terrible social cost."]],"th":"Nature · Identity · Conflict"},{"q":"he must have wondered / which had been the better way to die","src":"Kamikaze, Beatrice Garland","f":[["Language","The ending is ambiguous."],["Form and structure","The final line reflects on his choice."],["Perceptive reading","Living as an outcast was a kind of death."],["Context","Families shunned those who returned."],["Writer's intention","To show the cost of choosing life."],["Critical and conceptual reading","The daughter’s speculation about ‘the better way to die’ compares physical death with social death. Conceptually, ostracism is presented as a slow killing. A critical reading sees shame as a cruel punishment imposed by family and nation."]],"th":"Conflict · Identity · Guilt"}],"pctx":["Garland (born 1950) writes about Japanese kamikaze pilots of the Second World War.","Garland shows the pilot’s choice of life brought social death, questioning ideas of honour."],"voc":{"v":[["dishonour","loss of respect","The pilot’s return brings dishonour on his family."],["ostracised","excluded from a group","His family ostracise him after he turns back."]],"m":[["L","Natural imagery","flashing silver as their bellies / swivelled towards the sun","The beauty of the fish reminds him of life, so he turns back.",1],["S","Shift in narrative voice","The daughter’s account moves to direct speech","Layers of storytelling distance us from the pilot.",0],["F","Regular sestets","Six line stanzas","The controlled form contrasts with his rebellion.",0]]}},{"n":"Checking Out Me History","k":"John Agard","sum":"A speaker attacks the British history he was taught and celebrates Black and Caribbean figures.","quotes":[{"q":"Dem tell me","src":"Checking Out Me History, John Agard","f":[["Language","Repetition shows control by those in power."],["Form and structure","Nation language rejects Standard English."],["Perceptive reading","‘Dem’ suggests authorities controlling education."],["Context","Agard was born in Guyana."],["Writer's intention","To challenge Eurocentric education."],["Critical and conceptual reading","Agard’s repeated ‘Dem tell me’ blames those who controlled his education. Conceptually, history is presented as something imposed rather than discovered. A postcolonial reading sees the refrain exposing a eurocentric curriculum that erased Caribbean and Black heroes."]],"th":"Identity · Power · Culture"},{"q":"Bandage up me eye with me own history","src":"Checking Out Me History, John Agard","f":[["Language","The metaphor shows history being hidden."],["Form and structure","Contrasting sections switch between British and Caribbean figures."],["Perceptive reading","Ignorance is imposed deliberately."],["Context","Colonial education ignored Black history."],["Writer's intention","To expose bias in history."],["Critical and conceptual reading","The metaphor ‘Bandage up me eye with me own history’ suggests education has blinded him to his heritage. Conceptually, colonial schooling wounds identity while claiming to heal it. A postcolonial reading sees the bandage as both injury and concealment."]],"th":"Identity · Power · Culture"},{"q":"I carving out me identity","src":"Checking Out Me History, John Agard","f":[["Language","‘carving’ suggests effort and permanence."],["Form and structure","The poem ends with self determination."],["Perceptive reading","He creates his own identity."],["Context","Black history movements reclaimed identity."],["Writer's intention","To celebrate resistance."],["Critical and conceptual reading","‘I carving out me identity’ ends with active self creation. Conceptually, identity is made, not given, by reclaiming lost histories. A postcolonial reading celebrates resistance through language, as Caribbean dialect becomes a declaration of independence."]],"th":"Identity · Culture · Resistance"}],"pctx":["Agard (born 1949) moved from Guyana to Britain in 1977 and challenges colonial education.","Agard uses nation language to reclaim the Black history that colonial schooling erased."],"voc":{"v":[["defiance","open resistance","The speaker’s defiance challenges the history he was taught."],["eurocentric","focused on Europe and white history","Agard attacks a eurocentric curriculum."]],"m":[["L","Metaphor","Bandage up me eye with me own history","Education has blinded him to his own heritage.",1],["S","Contrasting stanzas","British and Caribbean figures alternate","Different layouts separate the two histories.",0],["F","Caribbean dialect","Dem tell me","The phonetic voice rejects standard English and asserts identity.",1]]}}],"ctx9":[["Romantic poets","Shelley, Blake and Wordsworth celebrated nature and attacked tyranny.","The Romantics present nature as more powerful than any human ruler."],["War poetry","From Tennyson’s patriotism to Owen’s horror and Armitage’s trauma.","The cluster charts a shift from glorifying war to exposing its psychological cost."],["Identity and empire","Agard, Rumens, Dharker and Garland explore culture and belonging.","Poets such as Agard challenge the version of history imposed by empire."],["Power of nature","Nature overwhelms human power in several poems.","Heaney’s storm and Shelley’s desert both reduce human power to nothing."],["Memory","Many poems explore how conflict lingers.","Remains and Poppies show that conflict continues in memory long after it ends."],["Comparison","Question 26 compares a named poem with one other.","Grade 9 answers compare methods and context, not just ideas."]]},{"id":"wl","title":"Worlds and Lives","author":"","kind":"Poetry anthology","paper":"Paper 2, Section B","col":"#0D47A1","ctx":[["Comparison","Compare a named poem with one other poem of your choice (30 marks)."],["Identity and belonging","Migration, names, accents and heritage."],["Nature","From Romantic faith to environmental damage."],["Power and injustice","Monarchy, colonialism, racism and inequality."]],"groups":[{"n":"Lines Written in Early Spring","k":"William Wordsworth","sum":"A Romantic poet who saw nature as holy and morally good. Published in Lyrical Ballads (1798) as the French Revolution turned to violence and the Industrial Revolution spread.","quotes":[{"q":"To her fair works did Nature link / The human soul that through me ran","src":"Lines Written in Early Spring, William Wordsworth","f":[["Language","Personifying ‘Nature’ as a female creator with ‘fair works’ makes her nurturing and beautiful, while ‘link’ suggests humans are naturally bound to her."],["Form and structure","The enjambment runs across the line just as the ‘soul… ran’ through him, so the form enacts the connection between human and natural worlds."],["Perceptive reading","Perceptively, ‘through me ran’ suggests the soul is not owned but shared; Wordsworth feels part of something larger, which makes human selfishness seem unnatural."],["Context","Romantics rejected industrial, rational society and believed nature revealed God; Wordsworth wrote while Britain feared revolution and war with France."],["Writer's intention","Wordsworth wants readers to feel their spiritual bond with nature, so that cruelty to one another feels like a betrayal of it."],["Critical and conceptual reading","Wordsworth personifies Nature as a creator who links ‘the human soul’ to her works. Conceptually, humans are naturally bound to the natural world. A Romantic reading sees nature as a moral teacher, and an ecocritical reading sees the poem anticipating modern environmental thought."]],"th":"Nature and humanity · Identity and belonging · Faith"},{"q":"every flower / Enjoys the air it breathes","src":"Lines Written in Early Spring, William Wordsworth","f":[["Language","The verb ‘Enjoys’ personifies the flower with feelings, suggesting even the smallest part of nature experiences happiness."],["Form and structure","Placed within the regular quatrains and steady rhyme, the image feels calm and certain, a statement of ‘faith’ rather than fact."],["Perceptive reading","It may also imply criticism: if flowers can enjoy simply breathing, why are humans, with so much more, unable to live in joy and peace?"],["Context","Romantic pantheism saw God present throughout nature; Wordsworth calls it ‘my faith’, a personal religion rooted in the natural world."],["Writer's intention","He encourages readers to slow down and notice nature’s joy, presenting it as a moral model for human life."],["Critical and conceptual reading","The flower that ‘Enjoys the air it breathes’ is presented as a belief rather than a fact. Conceptually, Wordsworth chooses faith in nature’s joy. A critical reading notes his hesitant ‘tis my faith’, showing hope rather than certainty."]],"th":"Nature · Faith · Happiness and contentment"},{"q":"Have I not reason to lament / What man has made of man?","src":"Lines Written in Early Spring, William Wordsworth","f":[["Language","The verb ‘lament’ conveys grief, and the repetition of ‘man’ shows humans as both the cause and the victim of suffering."],["Form and structure","The refrain returns from stanza 1, but now as a rhetorical question, so the cyclical structure turns sadness into an accusation."],["Perceptive reading","The question is left unanswered, implying humanity still has a choice: if man has ‘made’ this world, man can remake it."],["Context","In the 1790s, poverty, the slave trade and the violence of the French Revolution showed human cruelty on a vast scale."],["Writer's intention","Wordsworth wants readers to question society and recognise their responsibility for the suffering humans cause one another."],["Critical and conceptual reading","The refrain ‘What man has made of man’ turns sorrow into accusation. Conceptually, human cruelty contrasts with nature’s harmony. A historicist reading links the lament to the violence of the French Revolution and industrial exploitation."]],"th":"Power and injustice · Human cruelty · Nature versus humanity"}],"pctx":["A Romantic poet who saw nature as holy and morally good. Published in Lyrical Ballads (1798) as the French Revolution turned to violence and the Industrial Revolution spread.","Writing as revolution turned violent and industry spread, Wordsworth contrasts nature’s joy with ‘What man has made of man’, urging readers to reconnect with nature’s moral harmony."],"voc":{"v":[["harmony","peaceful agreement","Wordsworth presents nature living in perfect harmony."],["lament","to express grief or sorrow","The speaker laments the cruelty humans inflict on each other."]],"m":[["L","Personification","every flower / Enjoys the air it breathes","Nature is shown as joyful and alive.",1],["S","Refrain","What man has made of man","The returning line turns sadness into an accusation.",1],["F","Regular quatrains","Steady rhyme and metre","The calm form reflects his faith in nature’s order.",0]]}},{"n":"England in 1819","k":"Percy Bysshe Shelley","sum":"A radical Romantic who opposed monarchy and the Church. Written after the Peterloo Massacre (1819); too dangerous to publish until 1839.","quotes":[{"q":"leech-like to their fainting country cling","src":"England in 1819, Percy Bysshe Shelley","f":[["Language","The simile ‘leech-like’ presents the royal princes as parasites draining the nation’s lifeblood; ‘fainting’ personifies England as weak and dying."],["Form and structure","The inverted word order delays the verb ‘cling’ to the end of the line, mimicking how they hang on to power and privilege."],["Perceptive reading","A leech eventually drops off when full, perhaps hinting that their parasitic rule cannot last forever."],["Context","The Prince Regent and his brothers were famous for extravagance and debt while ordinary people starved after the Napoleonic Wars."],["Writer's intention","Shelley wants readers to feel disgust at the ruling class and see them as harmful rather than noble."],["Critical and conceptual reading","Shelley’s simile ‘leech-like’ presents the royal princes as parasites draining England. Conceptually, monarchy is exposed as exploitation. A historicist reading links the anger to the Peterloo Massacre of 1819."]],"th":"Power and injustice · Inequality · Class"},{"q":"Rulers who neither see, nor feel, nor know","src":"England in 1819, Percy Bysshe Shelley","f":[["Language","The verbs of perception show rulers who are blind, numb and ignorant of their people’s suffering."],["Form and structure","Polysyndeton with ‘neither… nor… nor’ piles up their failures, and the regular iambic rhythm gives the line the force of a verdict."],["Perceptive reading","Perceptively, rulers who cannot ‘feel’ are presented as less than human, reversing the idea that kings are chosen by God."],["Context","George III was old, blind and mentally ill; the government had just used soldiers against a peaceful crowd at Peterloo."],["Writer's intention","Shelley exposes a government detached from its people to provoke anger and a desire for reform."],["Critical and conceptual reading","‘Rulers who neither see, nor feel, nor know’ uses polysyndeton to pile up their failures. Conceptually, power is blind and numb to suffering. A critical reading sees Shelley’s radical rejection of hereditary rule."]],"th":"Power · Injustice · Protest"},{"q":"a glorious Phantom may / Burst, to illumine our tempestuous day","src":"England in 1819, Percy Bysshe Shelley","f":[["Language","‘glorious Phantom’ suggests a powerful spirit of freedom or revolution, and ‘illumine’ brings light after the poem’s darkness."],["Form and structure","The sonnet is one long sentence that builds to this final couplet; the turn from corruption to hope works like a volta."],["Perceptive reading","The modal verb ‘may’ makes the hope uncertain: change is possible, but only if people act to bring it about."],["Context","Shelley supported revolutionary ideals of liberty and believed poets could inspire political change."],["Writer's intention","He wants to leave readers with hope, inspiring them to believe a fairer society can rise from the ‘graves’ of the old one."],["Critical and conceptual reading","The ‘glorious Phantom’ that may ‘Burst’ suggests revolution or liberty. Conceptually, hope emerges from corruption in the final couplet. A critical reading sees the sonnet’s volta turning despair into prophecy."]],"th":"Hope and resistance · Power · Change"}],"pctx":["A radical Romantic who opposed monarchy and the Church. Written after the Peterloo Massacre (1819); too dangerous to publish until 1839.","Written after the Peterloo Massacre, Shelley’s sonnet was too dangerous to publish until 1839, showing how fiercely those in power silenced criticism."],"voc":{"v":[["corruption","dishonest use of power","Shelley exposes the corruption of the monarchy and Church."],["tyranny","cruel and absolute rule","The sonnet attacks the tyranny of rulers after Peterloo."]],"m":[["L","Simile","leech-like to their fainting country cling","The princes are parasites draining the nation’s lifeblood.",1],["S","Final couplet as a turn","a glorious Phantom may / Burst","The poem turns from corruption to hope of revolution.",1],["F","Sonnet","One long sentence in fourteen lines","A love form is used for political anger, building to the final hope.",0]]}},{"n":"Shall earth no more inspire thee","k":"Emily Brontë","sum":"Brontë lived in Haworth on the Yorkshire moors, which she loved. She wrote in the Romantic tradition, often about nature and the imagination.","quotes":[{"q":"Thou lonely dreamer","src":"Shall earth no more inspire thee, Emily Brontë","f":[["Language","Nature addresses the listener tenderly with the archaic ‘Thou’; ‘lonely dreamer’ suggests someone who has withdrawn into their imagination."],["Form and structure","The poem is a dramatic monologue spoken by Nature, so the reader hears nature’s voice directly, which is unusual and intimate."],["Perceptive reading","‘Dreamer’ may be Brontë herself, whose rich imaginary worlds sometimes cut her off from real life."],["Context","Brontë and her siblings created the imaginary world of Gondal; she was shy and happiest on the moors."],["Writer's intention","Brontë presents nature as a caring presence that notices loneliness and offers belonging."],["Critical and conceptual reading","Nature addresses the ‘lonely dreamer’ with tender archaic language. Conceptually, Brontë gives nature its own voice, pleading for the human to return. A critical reading sees the imagination drawn between inner worlds and the natural earth."]],"th":"Nature · Belonging · Isolation"},{"q":"fond idolatry","src":"Shall earth no more inspire thee, Emily Brontë","f":[["Language","‘idolatry’ means worshipping something other than God, so nature admits the dreamer once loved it almost religiously; ‘fond’ softens it with affection."],["Form and structure","Nature speaks of the past to remind the listener of a lost bond, creating a nostalgic, persuasive tone."],["Perceptive reading","The word is bold for a clergyman’s daughter: it suggests nature, not the Church, may be the true source of spiritual fulfilment."],["Context","Brontë’s father was a clergyman; Victorian society expected devotion to God rather than nature."],["Writer's intention","She challenges conventional faith by presenting the natural world as worthy of devotion."],["Critical and conceptual reading","‘fond idolatry’ admits that the dreamer once worshipped nature almost religiously. Conceptually, Brontë blurs nature and faith. A critical reading notes the near blasphemy of preferring earth to heaven."]],"th":"Nature · Faith · Identity"},{"q":"Yet few would ask a heaven / More like this earth than thine","src":"Shall earth no more inspire thee, Emily Brontë","f":[["Language","Comparing ‘heaven’ and ‘earth’ suggests the listener’s idea of paradise is simply the natural world."],["Form and structure","The regular abab quatrains and gentle rhythm make nature’s argument sound calm and persuasive, like a lullaby."],["Perceptive reading","Perceptively, it suggests heaven is not elsewhere but here; belonging comes from the land we love."],["Context","Romantic writers often found the divine in landscape; the Yorkshire moors were central to Brontë’s identity."],["Writer's intention","Brontë encourages readers to find comfort and meaning in the natural world around them."],["Critical and conceptual reading","Nature claims few would ask for a heaven ‘More like this earth’. Conceptually, Brontë suggests paradise is found in the natural world. A Romantic reading celebrates the Yorkshire moors she loved, almost preferring earth to heaven."]],"th":"Nature · Place and belonging · Faith"}],"pctx":["Brontë lived in Haworth on the Yorkshire moors, which she loved. She wrote in the Romantic tradition, often about nature and the imagination.","Brontë, who drew comfort from the Yorkshire moors, gives Nature a voice to suggest that belonging can be found in the land rather than in society."],"voc":{"v":[["solace","comfort in sadness","Nature offers the lonely dreamer solace."],["idolatry","worship of something other than God","Nature recalls the dreamer’s ‘fond idolatry’ of the earth."]],"m":[["L","Direct address","Thou lonely dreamer","Nature speaks tenderly, like a lover pleading for return.",1],["S","Persuasive questions","Nature appeals to the dreamer","The questions build a gentle argument for return.",0],["F","Dramatic monologue by Nature","abab quatrains","Giving nature a voice makes its plea intimate and calm, like a lullaby.",0]]}},{"n":"In a London Drawingroom","k":"George Eliot","sum":"George Eliot was the pen name of Mary Ann Evans, a Victorian novelist who used a male name to be taken seriously. London was crowded and choked with coal smoke.","quotes":[{"q":"The sky is cloudy, yellowed by the smoke","src":"In a London Drawingroom, George Eliot","f":[["Language","‘yellowed’ suggests the sky is stained and sickly, polluted by industry rather than naturally beautiful."],["Form and structure","The poem opens in the present tense with a flat statement, establishing a dull, unchanging scene."],["Perceptive reading","Even the sky, a traditional symbol of freedom and heaven, has been spoiled, suggesting there is no escape."],["Context","Victorian London burned huge amounts of coal, producing smog that darkened the city."],["Writer's intention","Eliot wants readers to see how industrial progress has damaged both the environment and quality of life."],["Critical and conceptual reading","Eliot’s ‘yellowed’ sky shows the city stained by industry. Conceptually, pollution makes beauty impossible. A critical reading sees the poem as an early protest against the ugliness of industrial London."]],"th":"Place · Industry and pollution · Loss of nature"},{"q":"Like solid fog","src":"In a London Drawingroom, George Eliot","f":[["Language","The simile describes the houses as ‘solid fog’, an oxymoron that makes them oppressive and suffocating."],["Form and structure","Written in blank verse, unrhymed and unbroken by stanzas, the form feels as monotonous as the city it describes."],["Perceptive reading","Fog usually hides things; here the buildings themselves block the view, suggesting a city that shuts out imagination."],["Context","Rapid urban growth created long rows of identical terraced housing."],["Writer's intention","Eliot presents the city as a place that crushes individuality and beauty."],["Critical and conceptual reading","The simile ‘Like solid fog’ makes buildings oppressive and suffocating. Conceptually, the city crushes the spirit. A critical reading links the monotony of the blank verse to the monotony of urban life."]],"th":"Place · Monotony · Identity"},{"q":"Where men are punished at the slightest cost","src":"In a London Drawingroom, George Eliot","f":[["Language","‘punished’ presents city life as a prison sentence, and ‘slightest cost’ suggests suffering inflicted cheaply."],["Form and structure","The poem ends on this image of a prison, so the structure moves from a grey view to a grim conclusion about human life."],["Perceptive reading","It may criticise capitalism: people are kept alive as cheaply as possible, valued only as workers."],["Context","Victorian workers endured long hours and poverty; prisons and workhouses were designed to be harsh."],["Writer's intention","Eliot wants readers to recognise the joyless, imprisoning nature of modern industrial life."],["Critical and conceptual reading","The final image of men ‘punished at the slightest cost’ presents city life as a prison. Conceptually, industrial society punishes cheaply. A critical reading sees a social critique hidden in a description of a view."]],"th":"Power and inequality · Place · Loss of joy"}],"pctx":["George Eliot was the pen name of Mary Ann Evans, a Victorian novelist who used a male name to be taken seriously. London was crowded and choked with coal smoke.","Writing as Mary Ann Evans under a male pen name, Eliot presents the industrial city as a grey prison, perhaps reflecting the confinement she felt in Victorian society."],"voc":{"v":[["monotony","dull sameness","Eliot presents the city’s monotony as stifling."],["oppressive","heavy and suffocating","The smoke creates an oppressive atmosphere."]],"m":[["L","Imagery of colour","The sky is cloudy, yellowed by the smoke","‘yellowed’ makes the sky look stained and sickly.",1],["S","No stanza breaks","One block of lines","The unbroken shape mirrors the endless, unchanging city.",0],["F","Blank verse","Unrhymed iambic pentameter","The monotonous form matches the dull city.",0]]}},{"n":"On an Afternoon Train from Purley to Victoria, 1955","k":"James Berry","sum":"Berry came to Britain from Jamaica in 1948 as part of the Windrush generation, invited to help rebuild post war Britain but often met with ignorance and racism.","quotes":[{"q":"So sincere she was beautiful","src":"On an Afternoon Train from Purley to Victoria, 1955, James Berry","f":[["Language","The adjective ‘sincere’ shows the woman means well, and the speaker generously finds her ‘beautiful’ because of it."],["Form and structure","The short, plain sentence stands out, reflecting the speaker’s warmth before her ignorance is revealed."],["Perceptive reading","The line is double edged: her sincerity makes her prejudice harder to challenge, because she does not realise it."],["Context","Many white Britons in the 1950s knew little about the Caribbean or the Commonwealth citizens arriving."],["Writer's intention","Berry shows that prejudice can be quiet and well meaning, not only hostile."],["Critical and conceptual reading","Berry’s speaker finds the woman ‘So sincere she was beautiful’, generously crediting her good intentions. Conceptually, kindness and ignorance can coexist. A postcolonial reading sees the speaker’s warmth exposing the gap between British curiosity and real knowledge of the Caribbean."]],"th":"Identity · Prejudice · Kindness"},{"q":"father’s big banana field","src":"On an Afternoon Train from Purley to Victoria, 1955, James Berry","f":[["Language","The image of home is warm and specific, connecting the speaker’s identity to family, land and heritage."],["Form and structure","The speaker’s memories contrast with the grey English setting, creating a structural shift between two worlds."],["Perceptive reading","It may play with the woman’s stereotypes, giving her the exotic picture she expects while keeping his deeper self private."],["Context","Windrush migrants carried strong memories of Caribbean homes and families."],["Writer's intention","Berry celebrates the richness of Caribbean identity against British ignorance."],["Critical and conceptual reading","The ‘father’s big banana field’ brings home vividly into the grey English carriage. Conceptually, memory keeps heritage alive. A postcolonial reading sees land and family rooting identity against an English world that cannot place him."]],"th":"Home · Heritage · Identity"},{"q":"Ireland is near Lapland","src":"On an Afternoon Train from Purley to Victoria, 1955, James Berry","f":[["Language","The speaker’s response mirrors the woman’s confusion about geography, using humour to expose her ignorance."],["Form and structure","Dialogue is presented without speech marks, blending voices and keeping the tone light and conversational."],["Perceptive reading","His gentle irony is a form of quiet resistance, allowing him to keep his dignity without confrontation."],["Context","Windrush migrants often faced being treated as foreign or exotic despite being British citizens."],["Writer's intention","Berry uses humour to reveal prejudice and invite readers to laugh at ignorance rather than accept it."],["Critical and conceptual reading","The speaker’s playful ‘Ireland is near Lapland
