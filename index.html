angs."},{"r":"June","m":"Miquita praises her friend in gang terms.","q":"She’s a good girl, innit. And she knows when to keep her mouth shut, not like Chanelle","t1":["Irony","‘good girl’ means silent rather than kind.","Goodness is redefined as obedience.","The code of silence protects criminals and punishes those who speak."],"t2":["Comparison","Chanelle is the warning example.","Speaking out is dangerous.","Harri’s detective work breaks this code, putting him at risk."],"cx":"Fear of being seen as a ‘snitch’ often stopped witnesses giving evidence to police.","wi":"Kelman exposes the code of silence that allows violence to continue."},{"r":"July","m":"X-Fire asserts control as the danger closes in.","q":"I say when it’s over","t1":["Declarative","X-Fire claims total authority.","He controls who suffers and when.","The menace foreshadows Harri’s fate."],"t2":["Monosyllables","The short words sound final and cold.","Authority is absolute.","As the novel approaches its end, the line feels like a sentence passed."],"cx":"Gangs relied on fear and strict hierarchy to keep control.","wi":"Kelman builds dread before the tragic ending."}]},{"id":"leon","title":"My Name is Leon","author":"Kit de Waal","kind":"Modern novel","paper":"Paper 2, Section A","col":"#4527A0","ctx":[["Published 2016","Set in Birmingham in 1980 and 1981."],["The care system","Black and mixed race children waited far longer to be adopted than white babies."],["1981 riots","Riots in Handsworth and elsewhere protested against police racism."],["Royal wedding 1981","Charles and Diana’s wedding contrasts with the poverty Leon lives in."],["De Waal","Kit de Waal worked for years in family law and fostering."]],"groups":[{"n":"Leon","k":"Character","sum":"A nine year old mixed race boy separated from his baby brother Jake.","quotes":[{"q":"Big. Brother… My. Name. Is. Leon","src":"Leon, Chapter 2","f":[["Language","The single word sentences sound like a vow, stressing each part of his identity."],["Form and structure","Echoing the title, the line makes being a brother the foundation of who Leon is."],["Perceptive reading","His identity is built on caring for Jake, so losing Jake threatens to erase him."],["Context","Children in care often lose contact with siblings and family history."],["Writer's intention","To show Leon’s fierce love for Jake from the start."]],"th":"Identity · Family · Love"},{"q":"I could be him, Mum […] You could come back for me and, sometimes, I could be him","src":"Leon","f":[["Language","The repeated modal ‘could’ shows desperate longing."],["Form and structure","The fantasy reveals his inner thoughts through childlike logic."],["Perceptive reading","He believes he must become someone else to be loved, revealing how deeply rejection has wounded him."],["Context","White babies were adopted far more readily than mixed race boys."],["Writer's intention","To expose the racial injustice of the care system through a child’s eyes."]],"th":"Identity · Family · Race"},{"q":"Leon likes the sound of Tufty’s voice and the feel of Tufty’s hands on his shoulder. He likes the way Tufty looks worried","src":"Narrator, Chapter 31","f":[["Language","The repetition of ‘likes’ and the sensory detail show comfort and safety."],["Form and structure","Tufty becomes a father figure as the novel moves towards hope."],["Perceptive reading","Being worried about is proof of being cared for, something Leon has rarely felt from men."],["Context","Birmingham’s Black community offered belonging the care system could not."],["Writer's intention","To show that family can be found outside blood ties."]],"th":"Belonging · Family · Masculinity"}]},{"n":"Carol","k":"Character","sum":"Leon’s mother, overwhelmed by depression and poverty.","quotes":[{"q":"If you hadn’t been sneaking around he would have come in and spent two minutes with his only son","src":"Carol","f":[["Language","The accusation ‘sneaking’ shifts blame onto a child."],["Form and structure","Through Leon’s memory the reader sees how often he is blamed."],["Perceptive reading","Carol’s pain at being abandoned is passed on to Leon, showing how neglect repeats."],["Context","Single mothers struggled with little support."],["Writer's intention","To show how adult failures wound children."]],"th":"Family · Neglect · Blame"},{"q":"I can’t look after you properly, you know that, don’t you?","src":"Carol, Chapter 41","f":[["Language","The tag question seeks reassurance and forgiveness."],["Form and structure","Late in the novel her honesty marks a quieter, more sympathetic Carol."],["Perceptive reading","Admitting failure is her one act of care, so the reader pities rather than condemns her."],["Context","Support for mental illness was limited in the early 1980s."],["Writer's intention","To make readers understand Carol rather than simply blame her."]],"th":"Family · Neglect · Love"},{"q":"She gives a little curtsy like he’s a king and she’s a servant. She turns and is gone","src":"Narrator","f":[["Language","The simile of king and servant reveals Carol’s performance and self mockery."],["Form and structure","The abrupt short sentence ‘She turns and is gone’ mirrors her repeated disappearances."],["Perceptive reading","Leon experiences abandonment again and again; the ending of each visit is always sudden."],["Context","Royal imagery links to the 1981 wedding."],["Writer's intention","To show how unreliable parenting leaves a child unsettled."]],"th":"Family · Neglect · Loss"}]},{"n":"Maureen","k":"Character","sum":"Leon’s warm, plain speaking foster carer.","quotes":[{"q":"Jake’s got a chance, you mean. You’ve split them up and in my books that’s a sin and I won’t change my mind on that","src":"Maureen, Chapter 12","f":[["Language","The noun ‘sin’ gives her outrage moral weight."],["Form and structure","She challenges social workers directly, voicing what Leon cannot."],["Perceptive reading","She exposes the hypocrisy of a system that calls separation a ‘chance’."],["Context","Racial bias in adoption was well documented."],["Writer's intention","To criticise the care system through a trusted voice."]],"th":"Injustice · Family · Race"},{"q":"You’re frightening him, Carol. Pull yourself together","src":"Maureen","f":[["Language","The imperative ‘Pull yourself together’ is firm but protective."],["Form and structure","Her confrontation with Carol shows her placing Leon first."],["Perceptive reading","Maureen offers the stability Carol cannot."],["Context","Foster carers had to manage difficult contact visits."],["Writer's intention","To show what good care looks like."]],"th":"Care · Family · Protection"},{"q":"And my job never ends because I look after you even when you’re not here","src":"Maureen","f":[["Language","The phrase ‘never ends’ turns a job into unconditional love."],["Form and structure","Her reassurance comforts Leon at a low point."],["Perceptive reading","She redefines family as constant care rather than blood."],["Context","Foster care could offer real security."],["Writer's intention","To show that love can be chosen."]],"th":"Love · Care · Family"}]},{"n":"Tufty","k":"Character","sum":"A Black allotment holder and activist who becomes Leon’s mentor.","quotes":[{"q":"These are babies [...] Fragile. Babies need looking after. Come","src":"Tufty","f":[["Language","The metaphor of plants as ‘babies’ shows tenderness."],["Form and structure","Gardening mirrors Leon’s care for Jake, creating a parallel."],["Perceptive reading","Tufty teaches Leon that nurture makes things grow, offering him a way to heal."],["Context","Allotments were shared community spaces."],["Writer's intention","To show nurture as a form of strength."]],"th":"Care · Growth · Masculinity"},{"q":"We have dignity and worth","src":"Tufty, Chapter 33","f":[["Language","The abstract nouns ‘dignity’ and ‘worth’ assert pride."],["Form and structure","His activism builds towards the riots."],["Perceptive reading","He gives Leon words for his own value."],["Context","Black communities protested police racism in 1981."],["Writer's intention","To assert Black pride and resistance."]],"th":"Race · Injustice · Identity"},{"q":"You can manage in the sun what you can’t manage in the rain","src":"Tufty","f":[["Language","The weather metaphor turns hardship into folk wisdom."],["Form and structure","His advice offers Leon a way to endure."],["Perceptive reading","Hard times pass, and survival depends on waiting for better days."],["Context","Caribbean proverbs pass wisdom through generations."],["Writer's intention","To offer hope and resilience."]],"th":"Growth · Hope · Resilience"}]},{"n":"Mr Devlin","k":"Character","sum":"A gruff Irish allotment holder who is kind beneath his anger.","quotes":[{"q":"They’re the same all over the world [...] Small minds, big feet","src":"Mr Devlin","f":[["Language","The antithesis of ‘small minds’ and ‘big feet’ mocks the police."],["Form and structure","His humour hides deep distrust of authority."],["Perceptive reading","He sees police as clumsy and prejudiced."],["Context","Irish people faced suspicion during the IRA bombings."],["Writer's intention","To show distrust of authority."]],"th":"Authority · Injustice · Prejudice"},{"q":"There are no kings or queens, Leon. There are people.","src":"Mr Devlin","f":[["Language","The short contrast rejects hierarchy."],["Form and structure","It comes as the nation celebrates the royal wedding."],["Perceptive reading","He teaches Leon that everyone has equal worth."],["Context","The 1981 royal wedding."],["Writer's intention","To challenge class and status."]],"th":"Class · Equality · Identity"},{"q":"Oh, every Irishman is a terrorist, is that what you’re saying?","src":"Mr Devlin, Chapter 36","f":[["Language","The sarcastic rhetorical question shows anger."],["Form and structure","He confronts prejudice directly."],["Perceptive reading","He knows how it feels to be stereotyped, linking him to Leon."],["Context","IRA bombings caused anti Irish prejudice."],["Writer's intention","To expose prejudice."]],"th":"Prejudice · Injustice · Identity"}]},{"n":"Neglect and injustice","k":"Theme","sum":"Leon suffers neglect at home and witnesses injustice in the city.","quotes":[{"q":"Some days Leon doesn’t go to school at all, just stays at home with Jake while their mom sleeps","src":"Narrator, Chapter 4","f":[["Language","The matter of fact tone and ‘sleeps’ hint at Carol’s depression."],["Form and structure","Early in the novel it shows Leon as a young carer."],["Perceptive reading","Leon has been forced to become the parent."],["Context","Young carers were rarely noticed."],["Writer's intention","To show neglect through a child’s normality."]],"th":"Neglect · Family · Childhood"},{"q":"Resisting arrest. Nothing to see. Off you go. Off you go","src":"DC Green, Chapter 27","f":[["Language","The repetition dismisses witnesses."],["Form and structure","During the unrest, the clipped phrases show police control."],["Perceptive reading","Authority hides its own violence."],["Context","Police racism sparked the 1981 riots."],["Writer's intention","To expose injustice."]],"th":"Injustice · Race · Power"},{"q":"No one cares about me. No one cares about my brother.","src":"Leon, Chapter 37","f":[["Language","The repetition of ‘No one cares’ shows despair."],["Form and structure","At the climax Leon finally voices his pain."],["Perceptive reading","His outburst reveals the loneliness behind his coping."],["Context","Children in care were often unheard."],["Writer's intention","To make the reader feel Leon’s despair."]],"th":"Neglect · Family · Loss"}]}],"ctx9":[["The care system","In the early 1980s white babies were far more easily adopted than Black or mixed race children.","Jake’s quick adoption and Leon’s rejection expose a care system that ranked children by race while claiming to act in their best interests."],["Handsworth riots 1981","Young Black people rioted against police racism and the ‘sus’ laws.","De Waal filters the riots through Leon’s eyes, so the reader sees anger at injustice rather than the ‘mindless violence’ reported in newspapers."],["Royal wedding 1981","The wedding of Charles and Diana was watched by millions as a symbol of national unity.","Mr Devlin’s insistence that there are ‘no kings or queens’ punctures the fairy tale, reminding readers that national celebration ignored children like Leon."],["The Irish in Britain","IRA bombings in English cities led to widespread suspicion of Irish people.","Mr Devlin’s furious ‘every Irishman is a terrorist’ shows that Leon is not the only outsider, linking anti Irish and anti Black prejudice."],["Thatcher’s Britain","Rising unemployment and cuts to services hit inner city families hardest.","Carol’s collapse reflects a society that left vulnerable mothers without support, so de Waal blames neglect on the system as much as the individual."],["De Waal’s background","De Waal has Irish and Caribbean heritage and worked with children in care.","De Waal’s experience lets her give children in care a voice that official reports never recorded."]],"voc":{"v":[["neglect","failure to give proper care","Carol’s neglect forces Leon to care for Jake."],["institutional","relating to organisations such as social services","Institutional racism shapes Leon’s chances of adoption."],["resilient","able to recover from difficulty","Leon is resilient, finding comfort in the allotments."],["marginalised","pushed to the edge of society","Leon, Tufty and Mr Devlin are all marginalised."],["surrogate","taking the place of someone else","Tufty becomes a surrogate father."],["injustice","unfair treatment","Leon witnesses injustice at home and on the streets."],["vulnerable","easily hurt","As a child in care, Leon is deeply vulnerable."],["poignant","deeply moving","Leon’s attempts to stay connected to Jake are poignant."]],"m":[["L","Childlike voice","Big. Brother… My. Name. Is. Leon","Simple, fragmented sentences capture a nine year old’s view.",1],["L","Metaphor","These are babies [...] Fragile. Babies need looking after. Come","Plants become a metaphor for children who need nurture.",1],["S","Chronological structure","From Jake’s birth in 1980 to the riots of 1981","The timeline links Leon’s private story to public events.",0],["S","Short chapters","Many brief chapters","Short chapters mirror a child’s episodic memory.",0],["F","Third person limited narration","Some days Leon doesn’t go to school at all","We see only what Leon sees, so we feel his confusion.",1],["F","Coming of age novel","Leon’s growth towards hope","The form traces how he learns to belong.",0]]},"chron":[{"r":"Chapter 2","m":"Leon meets his newborn brother Jake.","q":"Big. Brother… My. Name. Is. Leon","t1":["Single word sentences","Each word is separated by a full stop.","The rhythm sounds like a solemn vow.","Being a ‘Big. Brother’ becomes the foundation of Leon’s identity, echoing the novel’s title."],"t2":["Childlike voice","The phrasing sounds like a child learning to speak formally.","Leon takes the role seriously.","His pride makes the later separation from Jake more painful."],"cx":"The novel is set in Birmingham in 1980 and 1981.","wi":"De Waal establishes Leon’s love for Jake as the emotional centre of the novel."},{"r":"Chapter 4","m":"As Carol’s depression deepens, Leon cares for Jake.","q":"Some days Leon doesn’t go to school at all, just stays at home with Jake while their mom sleeps","t1":["Matter of fact tone","The neglect is described plainly.","Leon sees it as normal.","The calm tone makes the reader, not Leon, recognise the danger."],"t2":["Verb ‘sleeps’","Sleeping in the day hints at depression.","Carol is absent though present.","Leon has become the parent, a young carer."],"cx":"Young carers were rarely identified by social services in the early 1980s.","wi":"De Waal shows neglect through a child’s normality."},{"r":"Chapter 12","m":"Maureen challenges the social worker about separating the brothers.","q":"Jake’s got a chance, you mean. You’ve split them up and in my books that’s a sin and I won’t change my mind on that","t1":["Religious noun","‘sin’ gives her anger moral force.","Separating siblings is presented as a moral wrong.","Maureen speaks the truth the system hides: Jake’s ‘chance’ comes at Leon’s cost."],"t2":["Colloquial phrase","‘in my books’ is homely and plain.","Maureen speaks from experience, not policy.","Her ordinary voice exposes bureaucratic injustice."],"cx":"White babies were adopted far more easily than Black or mixed race children.","wi":"De Waal criticises the racial bias of the care system."},{"r":"Chapter 27","m":"During unrest in Birmingham, Leon sees the police beat a man.","q":"Resisting arrest. Nothing to see. Off you go. Off you go","t1":["Repetition","‘Off you go’ is repeated like a dismissal.","Witnesses are pushed away.","The police hide their own violence behind routine phrases, so official language becomes a cover up."],"t2":["Minor sentences","The clipped fragments sound like orders.","Authority silences questions.","Leon learns that those in power are not always just, a turning point in his understanding of the adult world."],"cx":"Police harassment of young Black men under the ‘sus’ laws helped spark the 1981 riots in Handsworth, Brixton and Toxteth.","wi":"De Waal exposes institutional injustice through a child’s eyes."},{"r":"Chapter 31","m":"Leon spends time with Tufty at the allotments.","q":"Leon likes the sound of Tufty’s voice and the feel of Tufty’s hands on his shoulder. He likes the way Tufty looks worried","t1":["Repetition of ‘likes’","The repeated verb shows Leon savouring small comforts.","He feels safe with Tufty.","Being worried about is proof of being cared for, something Leon has rarely experienced."],"t2":["Sensory detail","Voice and touch create warmth and closeness.","Tufty becomes a father figure.","The allotment, a place where things grow, becomes a symbol of Leon’s own healing."],"cx":"Allotments in inner city Birmingham brought together people of different backgrounds.","wi":"De Waal shows that belonging can be found beyond blood family."},{"r":"Chapter 33","m":"Tufty speaks at a community meeting about racism.","q":"We have dignity and worth","t1":["Abstract nouns","‘dignity’ and ‘worth’ assert human value.","Tufty affirms Black pride against racism.","Leon, rejected by the care system because of his race, hears that he has value."],"t2":["Collective pronoun","‘We’ speaks for a whole community.","Identity is shared.","Leon begins to see himself as part of a community, not only as an unwanted child."],"cx":"Black British activism grew in response to police racism and discrimination in 1981.","wi":"De Waal affirms Black pride and community."},{"r":"Chapter 36","m":"Mr Devlin reacts angrily when a policeman treats him with suspicion.","q":"Oh, every Irishman is a terrorist, is that what you’re saying?","t1":["Sarcastic rhetorical question","Mr Devlin mocks the assumption behind the policeman’s words.","He faces suspicion because of his nationality.","His anger shows he understands prejudice from the inside, linking him to Leon."],"t2":["Generalisation","‘every Irishman’ exposes how stereotypes work.","One group is judged by the actions of a few.","De Waal shows that anti Irish and anti Black prejudice come from the same place."],"cx":"IRA bombings in English cities in the 1970s, including Birmingham in 1974, led to widespread suspicion of Irish people.","wi":"De Waal links different forms of prejudice, showing outsiders can find solidarity."},{"r":"Chapter 37","m":"At the climax, Leon finally voices his despair.","q":"No one cares about me. No one cares about my brother.","t1":["Anaphora","‘No one cares’ is repeated.","Leon’s despair is total.","After chapters of coping silently, the repetition releases everything he has held in."],"t2":["Short declaratives","The sentences are blunt and simple.","His pain is raw.","In a novel told in third person, this direct speech gives Leon his own voice at last."],"cx":"Children in care were often unheard by the adults making decisions about them.","wi":"De Waal makes readers feel the despair of children failed by the system."},{"r":"Chapter 41","m":"Near the end, Carol admits she cannot care for Leon.","q":"I can’t look after you properly, you know that, don’t you?","t1":["Tag question","‘don’t you?’ seeks agreement and forgiveness.","Carol is honest at last.","Her admission frees Leon to accept Maureen’s care without guilt."],"t2":["Modal verb ‘can’t’","It expresses inability rather than unwillingness.","Carol is ill, not simply selfish.","The line asks readers to pity rather than blame her."],"cx":"Support for mothers with mental illness was limited in the early 1980s.","wi":"De Waal shows compassion for Carol while affirming Leon’s need for stable care."}]},{"id":"tt","title":"Telling Tales","author":"AQA Anthology","kind":"Short story anthology","paper":"Paper 2, Section A","col":"#6D4C41","ctx":[["Seven stories","The Darkness Out There, Chemistry, Korea, Odour of Chrysanthemums, My Polish Teacher’s Tie, A Family Supper, Invisible Mass of the Back Row."],["The question","You answer one essay question on a named story (34 marks including 4 for SPaG)."],["Linking ideas","Relationships, families, generations and the past link the stories."],["Short story form","Compression, a single moment of change and an ending that shifts meaning."],["Settings","The stories range from England to Ireland, Japan and Jamaica."]],"groups":[{"n":"The Darkness Out There","k":"Penelope Lively","sum":"Sandra and Kerry visit Mrs Rutter, a seemingly sweet old woman who reveals she let a German airman die.","quotes":[{"q":"witches and wolves and tigers","src":"Sandra","f":[["Language","The alliterative list echoes fairy tale fears."],["Form and structure","Early in the story fear belongs to childish fantasy."],["Perceptive reading","Lively sets up imaginary monsters only to reveal that the real darkness is human."],["Context","Fairy tales warn children about danger in the woods."],["Writer's intention","To contrast fantasy fears with real evil."]],"th":"Fear · Innocence · Evil"},{"q":"eyes snapped and darted","src":"Mrs Rutter","f":[["Language","The verbs ‘snapped’ and ‘darted’ suggest a predator."],["Form and structure","The detail hints at her true nature before her confession."],["Perceptive reading","Appearance and reality clash: the cosy old lady is cold and cruel."],["Context","Wartime hatred of Germans lingered after 1945."],["Writer's intention","To foreshadow her cruelty."]],"th":"Appearance · Evil · Age"},{"q":"the darkness was out there and it was a part of you and you would never be without it, ever","src":"Sandra","f":[["Language","The polysyndeton and final ‘ever’ stress permanence."],["Form and structure","The ending is Sandra’s epiphany."],["Perceptive reading","Evil is not outside but within human nature, and Sandra’s innocence is lost."],["Context","The story echoes the cruelty of war."],["Writer's intention","To show the loss of innocence."]],"th":"Evil · Innocence · Growing up"}]},{"n":"Chemistry","k":"Graham Swift","sum":"After his father’s death, a boy, his mother and grandfather grow close until his mother’s new partner Ralph arrives; the grandfather poisons himself.","quotes":[{"q":"Chemistry is the science of change.","src":"Grandfather","f":[["Language","The metaphor links science to grief and family."],["Form and structure","The idea of change recurs as a motif."],["Perceptive reading","The grandfather knows change cannot be undone, which foreshadows his death."],["Context","Post war Britain saw families reshaped by death and remarriage."],["Writer's intention","To present change as inevitable and painful."]],"th":"Change · Family · Grief"},{"q":"We forgot we were three generations.","src":"Narrator","f":[["Language","The verb ‘forgot’ shows how close the family became."],["Form and structure","This happy moment comes before Ralph arrives."],["Perceptive reading","The unity is fragile, so its loss feels sharper."],["Context","Families pulled together after bereavement."],["Writer's intention","To show the closeness that will be lost."]],"th":"Family · Grief · Generations"},{"q":"I wanted to be told simple, precise facts.","src":"Narrator","f":[["Language","The adjectives ‘simple, precise’ show a longing for certainty."],["Form and structure","Late in the story it shows his confusion after the death."],["Perceptive reading","Like chemistry, he wants rules, but grief has none."],["Context","Science promised clear answers."],["Writer's intention","To show a child’s confusion in grief."]],"th":"Grief · Change · Childhood"}]},{"n":"Korea","k":"John McGahern","sum":"An Irish father and son fishing; the son realises his father may profit if he dies in the Korean War.","quotes":[{"q":"There’s no room for ambition in this poky place.","src":"Father","f":[["Language","The adjective ‘poky’ shows frustration with rural Ireland."],["Form and structure","His dialogue reveals his motive for sending his son away."],["Perceptive reading","His ambition is for money, not his son’s happiness."],["Context","Rural Irish poverty drove emigration."],["Writer's intention","To show how poverty shapes choices."]],"th":"Ambition · Poverty · Family"},{"q":"I feel I’d be giving you a chance I never got. I fought for this country.","src":"Father","f":[["Language","The repeated ‘I’ shows self focus behind generosity."],["Form and structure","He presents himself as selfless."],["Perceptive reading","His sacrifice for Ireland brought him nothing, so he seeks payment through his son."],["Context","The Irish War of Independence and Civil War."],["Writer's intention","To expose disappointment and self interest."]],"th":"War · Family · Sacrifice"},{"q":"No. I’m not going.","src":"Son","f":[["Language","The short sentences show defiance."],["Form and structure","The ending marks the son’s independence."],["Perceptive reading","He refuses to be traded for money."],["Context","American servicemen were paid compensation if killed in Korea."],["Writer's intention","To show the son taking control of his life."]],"th":"Family · Independence · War"}]},{"n":"Odour of Chrysanthemums","k":"D. H. Lawrence","sum":"Elizabeth Bates waits for her miner husband Walter, who is killed in a pit accident.","quotes":[{"q":"It was chrysanthemums when I married him, and chrysanthemums when you were born","src":"Elizabeth","f":[["Language","The repetition of ‘chrysanthemums’ links the flowers to every key event in her marriage."],["Form and structure","The flowers recur as a motif that ends in death."],["Perceptive reading","Her marriage has been shadowed by death from the start."],["Context","Chrysanthemums are traditional funeral flowers."],["Writer's intention","To foreshadow Walter’s death."]],"th":"Marriage · Death · Family"},{"q":"And she knew what a stranger he was to her.","src":"Narrator","f":[["Language","The noun ‘stranger’ shows emotional distance."],["Form and structure","Washing his body leads to her epiphany."],["Perceptive reading","She realises she never truly knew her husband."],["Context","Mining marriages were strained by poverty and drink."],["Writer's intention","To show isolation within marriage."]],"th":"Marriage · Isolation · Death"},{"q":"She knew she submitted to life, which was her immediate master. But from death, her ultimate master, she winced with fear and shame.","src":"Narrator","f":[["Language","The metaphor ‘master’ personifies life and death as powers over her."],["Form and structure","The final line closes the story on fear and shame."],["Perceptive reading","She is powerless before both life and death."],["Context","Mining deaths were common."],["Writer's intention","To show human powerlessness before death."]],"th":"Death · Life · Shame"}]},{"n":"My Polish Teacher’s Tie","k":"Helen Dunmore","sum":"Carla, a school catering assistant, writes to a visiting Polish teacher, Stefan.","quotes":[{"q":"I am half-Polish. They don’t know that here.","src":"Carla","f":[["Language","The short declaratives reveal a hidden identity."],["Form and structure","The opening confides directly in the reader."],["Perceptive reading","She hides her heritage in a place that does not see her."],["Context","Polish migrants settled in Britain after 1945."],["Writer's intention","To show hidden identity."]],"th":"Identity · Class · Heritage"},{"q":"Colleagues don’t wear blue overalls and white caps","src":"Carla","f":[["Language","The uniform symbolises her low status."],["Form and structure","Her bitter narration exposes the staffroom hierarchy."],["Perceptive reading","Class makes her invisible to the teachers."],["Context","Class divisions in schools."],["Writer's intention","To show class barriers."]],"th":"Class · Identity · Work"},{"q":"It was a terribly hopeful tie.","src":"Carla","f":[["Language","The adverb ‘terribly’ shows tenderness and sadness."],["Form and structure","The tie becomes a symbol."],["Perceptive reading","Stefan’s hope moves Carla to reclaim her identity."],["Context","Poland was under communist rule."],["Writer's intention","To show human connection across borders."]],"th":"Hope · Identity · Connection"}]},{"n":"A Family Supper","k":"Kazuo Ishiguro","sum":"A son returns to Japan and has a tense supper with his father and sister after his mother’s death from fugu poisoning.","quotes":[{"q":"It’s my belief that your mother’s death was no accident.","src":"Father","f":[["Language","The calm, formal tone hides horror."],["Form and structure","The revelation creates tension."],["Perceptive reading","Suicide and honour shadow the family."],["Context","Japanese ideas of honour."],["Writer's intention","To create unease."]],"th":"Death · Family · Honour"},{"q":"Not only must they lose their children, they must lose them to things they don’t understand.","src":"Father","f":[["Language","The repetition of ‘lose’ shows grief."],["Form and structure","His speech reveals the generational gap."],["Perceptive reading","He grieves his children’s rejection of his values."],["Context","Post war westernisation of Japan."],["Writer's intention","To show generational change."]],"th":"Family · Generations · Loss"},{"q":"I didn’t leave behind much. Just some empty rooms.","src":"Narrator","f":[["Language","The image of ‘empty rooms’ suggests loneliness."],["Form and structure","His understatement hides failure."],["Perceptive reading","He is isolated in both America and Japan."],["Context","Migration to America."],["Writer's intention","To show isolation."]],"th":"Isolation · Family · Identity"}]},{"n":"Invisible Mass of the Back Row","k":"Claudette Williams","sum":"Hortense, a dark skinned girl in a Jamaican school, challenges the colonial history lesson.","quotes":[{"q":"What was Columbus doing here anyway?","src":"Hortense","f":[["Language","The rhetorical question challenges authority."],["Form and structure","Her question disrupts the inspector’s visit."],["Perceptive reading","She rejects the idea of Columbus as a hero."],["Context","Colonial education taught British history."],["Writer's intention","To challenge colonial narratives."]],"th":"Colonialism · Education · Identity"},{"q":"Is what Columbus did want? Who invite him here?","src":"Hortense","f":[["Language","Jamaican patois gives her an authentic voice."],["Form and structure","Her defiance escalates."],["Perceptive reading","She sees Columbus as an invader."],["Context","Colonial history of Jamaica."],["Writer's intention","To give voice to the colonised."]],"th":"Colonialism · Identity · Power"},{"q":"Is ‘cause yu black and stupid why teacher meek yu sit a de back all de time","src":"Lorna","f":[["Language","The insult links darker skin with stupidity."],["Form and structure","The playground fight mirrors the classroom hierarchy."],["Perceptive reading","Colourism places dark skinned children at the back."],["Context","Jamaica’s colonial colour hierarchy."],["Writer's intention","To expose colourism."]],"th":"Colourism · Race · Education"}]}],"ctx9":[["Short story form","Short stories focus on a single moment of change or realisation.","Each story builds towards an epiphany, so endings such as Sandra’s realisation in ‘The Darkness Out There’ reframe everything before them."],["Mining communities","Lawrence grew up in Eastwood, a Nottinghamshire mining town; his father was a miner.","Lawrence presents the pit as both livelihood and killer, so Walter’s death exposes the cost of industrial labour on families."],["Irish history","The father in ‘Korea’ fought in the War of Independence and saw an execution.","McGahern links violence across generations, suggesting the father would trade his son’s life for money just as the state traded lives in war."],["Post war Japan","Japan’s defeat in 1945 brought shame and rapid westernisation.","The father’s longing for ‘the final weapon’ links him to wartime ideas of honour and death, which casts a shadow over the supper."],["Colonial Jamaica","Schools taught British history, such as Columbus’s ‘discovery’ of Jamaica.","Hortense’s question ‘Who invite him here?’ rewrites colonial history from the point of view of the colonised."],["Polish migration and class","Many Poles settled in Britain after the Second World War.","Carla’s hidden Polish heritage shows how class and migration silence identity in a staffroom that does not see her."]],"voc":{"v":[["epiphany","a sudden moment of understanding","Each story builds towards an epiphany that changes a character."],["estrangement","becoming distant from someone close","Odour of Chrysanthemums explores estrangement within marriage."],["disillusionment","losing a belief or hope","Sandra’s disillusionment comes when she learns Mrs Rutter’s secret."],["generational","relating to different generations","Chemistry and Korea explore generational conflict."],["colonial","relating to rule by an empire","Invisible Mass of the Back Row challenges colonial education."],["repression","holding back emotions","A Family Supper is full of repression and silence."],["mortality","the fact that all humans die","Lawrence’s ending confronts Elizabeth with her own mortality."],["identity","who someone is","My Polish Teacher’s Tie explores hidden identity."]],"m":[["L","Symbolism","It was chrysanthemums when I married him, and chrysanthemums when you were born","Lawrence’s flowers symbolise a marriage shadowed by death.",1],["L","Fairy tale imagery","witches and wolves and tigers","Lively contrasts childish fears with the real evil in human nature.",1],["S","Twist ending","Mrs Rutter’s confession in The Darkness Out There","A late revelation changes how we see every earlier detail.",0],["S","Single setting","Korea unfolds during one fishing trip on the river","The confined setting traps the son with his father as he realises the truth.",0],["F","First person narration","I am half-Polish. They don’t know that here.","Intimate narration lets readers share hidden feelings.",1],["F","Short story form","A single moment of change","Compression focuses on a turning point in a life.",0]]},"chron":[{"r":"The Darkness Out There: ending","m":"Leaving Mrs Rutter’s cottage after her confession, Sandra realises what she has learned.","q":"the darkness was out there and it was a part of you and you would never be without it, ever","t1":["Polysyndeton","‘and… and… and’ links the clauses breathlessly.","Sandra’s realisation tumbles out.","The darkness moves from ‘out there’ in the woods to ‘a part of you’, so evil is revealed as human, not imaginary."],"t2":["Final word ‘ever’","The isolated adverb stresses permanence.","Sandra’s innocence is lost for good.","Lively ends on an epiphany that reframes the whole story, a hallmark of the short story form."],"cx":"The story recalls the cruelty of the Second World War, when Mrs Rutter let a German airman die.","wi":"Lively shows readers that evil hides in ordinary, even kindly looking, people."},{"r":"Chemistry: the grandfather’s lesson","m":"The narrator remembers his grandfather explaining chemistry.","q":"Chemistry is the science of change.","t1":["Metaphor","Chemistry becomes a way of understanding grief and family change.","Things cannot be undone, only transformed.","The lesson foreshadows the grandfather’s own death by poison, an act of irreversible change."],"t2":["Short declarative","The plain definition sounds certain.","The grandfather offers the boy a rule for life.","Its simplicity contrasts with the messy emotions of a family reshaped by death and remarriage."],"cx":"Many post war families were reshaped by bereavement and new partners.","wi":"Swift explores how children cope with change they cannot control."},{"r":"Korea: on the river","m":"Fishing with his son, the father complains about life in rural Ireland.","q":"There’s no room for ambition in this poky place.","t1":["Adjective ‘poky’","The word makes home sound cramped and small.","The father feels trapped.","His frustration explains why he would send his son to America, even at terrible risk."],"t2":["Dialogue revealing motive","The father’s words hint at his plan.","The son slowly realises his father may profit if he is killed in Korea.","The quiet fishing trip becomes a moment of devastating discovery."],"cx":"Rural Ireland in the 1950s was poor, and many young people emigrated; American servicemen’s families received money if they died in the Korean War.","wi":"McGahern shows how poverty can corrupt even the bond between father and son."},{"r":"Odour of Chrysanthemums: final lines","m":"Having washed her dead husband’s body, Elizabeth faces life and death.","q":"She knew she submitted to life, which was her immediate master. But from death, her ultimate master, she winced with fear and shame.","t1":["Personification","Life and death become ‘masters’.","Elizabeth is presented as a servant to forces beyond her control.","The contrast of ‘immediate’ and ‘ultimate’ shows she must carry on living while knowing death will claim everything."],"t2":["Final epiphany","The story closes on Elizabeth’s realisation.","Her emotion is fear and shame, not simple grief.","She is ashamed that she never truly knew her husband, so death reveals the emptiness of their marriage."],"cx":"Lawrence grew up in Eastwood, a Nottinghamshire mining town, where pit deaths were common.","wi":"Lawrence shows how death exposes the truth about relationships."},{"r":"My Polish Teacher’s Tie: opening","m":"Carla, a school catering assistant, introduces herself.","q":"I am half-Polish. They don’t know that here.","t1":["Short declaratives","The two sentences sound like a confession.","Carla reveals a hidden part of herself.","‘They’ marks the teachers as outsiders to her real self."],"t2":["First person narration","Carla speaks directly to the reader.","We share her secret.","The intimacy contrasts with how invisible she is in the staffroom."],"cx":"Many Poles settled in Britain after the Second World War, and class barriers separated school staff.","wi":"Dunmore shows how class and migration silence identity."},{"r":"A Family Supper: after the meal","m":"The father speaks to his son about the mother’s death.","q":"It’s my belief that your mother’s death was no accident.","t1":["Understatement","The calm phrasing hides a shocking claim.","The mother may have taken her own life.","The quiet tone builds unease and suggests what remains unsaid."],"t2":["Restrained dialogue","The characters speak politely.","Emotion is repressed.","Ishiguro uses silence and formality to create tension."],"cx":"In post war Japan, older ideas of honour clashed with modern values.","wi":"Ishiguro creates tension through what is unsaid."},{"r":"Invisible Mass of the Back Row: the classroom","m":"Hortense questions the colonial history lesson.","q":"What was Columbus doing here anyway?","t1":["Rhetorical question","Hortense challenges authority.","She rejects the heroic story of Columbus.","Her question rewrites history from the point of view of the colonised."],"t2":["Colloquial ‘anyway’","The casual tone is defiant.","She refuses to be impressed.","Her voice from the ‘back row’ breaks the silence of the overlooked."],"cx":"Jamaican schools under colonial influence taught British history.","wi":"Williams gives voice to those history ignores."}]},{"id":"lr","title":"Love and Relationships","author":"","kind":"Poetry anthology","paper":"Paper 2, Section B","col":"#AD1457","ctx":[["Comparison","Compare a named poem with one other poem of your choice (30 marks)."],["Romantic love","Byron, Shelley and Barrett Browning explore passion and longing."],["Family","Heaney, Armitage, Duffy and Day Lewis explore parents and children."],["Loss","Hardy, Causley and Byron explore endings and grief."]],"groups":[{"n":"When We Two Parted","k":"Lord Byron","sum":"Compare with: Neutral Tones; Winter Swans; Porphyria’s Lover","quotes":[{"q":"In silence and tears","src":"When We Two Parted, Lord Byron","f":[["Language","The pairing of ‘silence’ and ‘tears’ suggests grief that cannot be spoken aloud, because the affair was secret and its end must be hidden too."],["Form","Short lines in a regular rhyme scheme make the speaker’s sorrow feel tightly controlled, as if he is holding back his emotion."],["Structure","The phrase opens the poem and returns, slightly changed, as ‘With silence and tears.’ at the end, so the poem is cyclical and his grief has no escape."],["Context","Byron was famous for scandalous affairs. The poem is often linked to Lady Frances Webster, whose secret relationship later became public gossip."],["Poet's intention","Byron presents loss and separation as private suffering, showing how secret love leaves the lovers unable even to grieve openly."],["Effect on the reader","The reader feels sympathy for a speaker trapped in lonely, unspoken pain."]],"th":""},{"q":"Colder thy kiss","src":"When We Two Parted, Lord Byron","f":[["Language","The comparative adjective ‘Colder’ shows the lover’s affection fading even as they part, and the kiss, a symbol of passion, becomes lifeless."],["Form","The very short line has a blunt, bitter rhythm, and the semicolon creates a pause that lets the coldness sink in."],["Structure","Placed in the first stanza, it acts as a warning sign, foreshadowing the betrayal revealed later in the poem."],["Context","In Regency society, reputation mattered greatly, and a woman could be ruined by rumours of an affair."],["Poet's intention","Byron presents romantic love as fragile and changeable, suggesting the coldness of the parting predicted the end of their relationship."],["Effect on the reader","The reader senses the chill of rejection and the speaker’s hurt pride."]],"th":""},{"q":"Thy vows are all broken","src":"When We Two Parted, Lord Byron","f":[["Language","The noun ‘vows’ has connotations of marriage and sacred promises, so ‘broken’ suggests a deep betrayal of trust."],["Form","Direct address with the archaic pronoun ‘Thy’ makes the line sound like an accusation spoken to the lover."],["Structure","The line comes in the second stanza, where the poem moves from the parting to the shame of public gossip."],["Context","Byron left England in 1816 amid scandal, and he understood how private love could be destroyed by public talk."],["Poet's intention","Byron presents betrayal and shame as part of romantic love, revealing the bitterness that follows broken promises."],["Effect on the reader","The reader shares the speaker’s sense of injustice and anger at being deceived."]],"th":""}],"pctx":["Byron (1788 to 1824) was famous for scandalous affairs; the poem is linked to Lady Frances Webster.","Byron presents secret love leaving only private, unspoken grief."],"voc":{"v":[["clandestine","secret, especially an affair","The clandestine affair forces the speaker to grieve ‘In silence and tears’."],["bitterness","anger and hurt after being treated unfairly","The speaker’s bitterness grows as he hears others speak of her."]],"m":[["L","Semantic field of coldness","Colder thy kiss","Coldness foreshadows the end of love and the speaker’s frozen grief.",1],["S","Cyclical structure","The poem returns to ‘silence and tears’","The ending mirrors the opening, showing he is trapped in heartbreak.",0],["F","Regular rhyme and metre","Four stanzas of alternate rhyme","Controlled form contrasts with the turmoil he hides.",0]]}},{"n":"Love’s Philosophy","k":"Percy Bysshe Shelley","sum":"Compare with: Sonnet 29; Porphyria’s Lover; Singh Song!","quotes":[{"q":"Nothing in the world is single","src":"Love’s Philosophy, Percy Bysshe Shelley","f":[["Language","The absolute pronoun ‘Nothing’ makes a sweeping claim that everything in nature is paired, so his desire seems natural and inevitable."],["Form","Regular rhyme and steady rhythm give the argument a confident, persuasive tone, like a cheerful song."],["Structure","Coming early in the first stanza, the statement sets up his whole argument, which he then supports with examples from nature."],["Context","Shelley was a Romantic poet who believed in free love and saw nature as a powerful spiritual force. The poem was published in 1819."],["Poet's intention","Shelley presents desire and longing through nature, using it as evidence to persuade a woman to return his love."],["Effect on the reader","The reader may be charmed by his playful logic, but also aware that he is trying to manipulate her."]],"th":""},{"q":"See the mountains kiss high Heaven","src":"Love’s Philosophy, Percy Bysshe Shelley","f":[["Language","Personification makes the mountains ‘kiss’ the sky, turning the landscape into a scene of romance and closeness."],["Form","The imperative ‘See’ directly addresses the woman, pressing her to look at the evidence around her."],["Structure","It opens the second stanza, which repeats the pattern of the first with more physical images, as his argument grows bolder."],["Context","Romantic poets often found religious meaning in nature, and ‘Heaven’ links his desire to something holy."],["Poet's intention","Shelley presents romantic love as part of a divine natural order, so refusing him seems almost unnatural."],["Effect on the reader","The reader is swept along by the grand, sensual images."]],"th":""},{"q":"If thou kiss not me?","src":"Love’s Philosophy, Percy Bysshe Shelley","f":[["Language","The simple monosyllables make the final request direct and personal after the poem’s sweeping images."],["Form","The rhetorical question ends each stanza, and its shorter line lands like a punchline."],["Structure","The poem ends on a question that is never answered, so we never learn whether his persuasion works."],["Context","Shelley’s own life was full of passionate and unconventional relationships, which shocked many in his society."],["Poet's intention","Shelley presents longing as unfulfilled, showing that desire depends on the other person’s choice."],["Effect on the reader","The reader is left in suspense, perhaps sensing that the woman’s silence is itself an answer."]],"th":""}],"pctx":["Shelley (1792 to 1822) was a Romantic poet who saw love as part of nature’s harmony.","Shelley uses nature’s unions to persuade, revealing love as desire and frustration."],"voc":{"v":[["persuasive","trying to convince","Shelley’s speaker builds a persuasive argument for a kiss."],["unrequited","not returned","The final question hints that his love may be unrequited."]],"m":[["L","Personification of nature","See the mountains kiss high Heaven","Nature is shown pairing up, so the beloved seems unnatural to refuse.",1],["S","Rhetorical question ending each stanza","If thou kiss not me?","Each stanza builds to a plea, showing frustration.",1],["F","Two stanza argument","Two eight line stanzas","The form mimics a logical case, though the logic is self serving.",0]]}},{"n":"Porphyria’s Lover","k":"Robert Browning","sum":"Compare with: The Farmer’s Bride; Love’s Philosophy; When We Two Parted","quotes":[{"q":"The sullen wind was soon awake","src":"Porphyria’s Lover, Robert Browning","f":[["Language","Pathetic fallacy and personification make the wind ‘sullen’, reflecting the speaker’s dark, resentful mood."],["Form","Steady rhyme and rhythm sound calm and controlled, which clashes disturbingly with the violent storm."],["Structure","The storm opens the poem, creating a sense of foreboding that prepares the reader for violence."],["Context","Published by Robert Browning in 1836, the poem reflects a growing nineteenth century interest in the minds of disturbed people."],["Poet's intention","Browning presents nature as a mirror of the speaker’s mind, hinting from the start that something is wrong."],["Effect on the reader","The reader feels unease and tension before anything has happened."]],"th":""},{"q":"That moment she was mine, mine, fair","src":"Porphyria’s Lover, Robert Browning","f":[["Language","The repeated possessive pronoun ‘mine’ reveals his obsession with owning Porphyria, while ‘fair’ reduces her to her beauty."],["Form","In this dramatic monologue, his own words expose his possessive thinking without any other voice to challenge him."],["Structure","This line comes just before the murder, marking the turning point where possession becomes violence."],["Context","Women in the nineteenth century had little power within relationships and were often seen as men’s property."],["Poet's intention","Browning presents power and control as dangerous, exposing how a man’s desire to possess a woman can destroy her."],["Effect on the reader","The reader is horrified by how calmly he treats her as an object."]],"th":""},{"q":"And yet God has not said a word!","src":"Porphyria’s Lover, Robert Browning","f":[["Language","The conjunction ‘yet’ suggests he is waiting for judgement, while the exclamation sounds triumphant or perhaps anxious."],["Form","The single, unbroken stanza ends here, as if his thoughts have run on without pause all night."],["Structure","The final line leaves the poem unresolved, with no punishment, which forces readers to judge him themselves."],["Context","Victorian readers were deeply religious, so God’s silence would have seemed shocking and troubling."],["Poet's intention","Browning presents a speaker who believes his crime is justified, criticising those who use religion to excuse themselves."],["Effect on the reader","The reader is left disturbed and uncertain, unsettled by the lack of justice."]],"th":""}],"pctx":["Browning (1812 to 1889) wrote dramatic monologues revealing disturbed minds; published 1836.","The speaker’s calm tone after murder exposes a chilling desire to possess and control."],"voc":{"v":[["possessive","wanting total control over someone","The speaker’s possessive love ends in murder."],["deranged","mentally unbalanced","The calm voice makes the deranged speaker more chilling."]],"m":[["L","Pathetic fallacy","The sullen wind was soon awake","The storm reflects the speaker’s dark mood.",1],["S","Enjambment in a regular pattern","Long sentences run across a strict rhyme scheme","Order on the surface hides madness beneath.",0],["F","Dramatic monologue","The speaker addresses the reader alone","We hear only his version, so he reveals more than he intends.",0]]}},{"n":"Sonnet 29: ‘I think of thee!’","k":"Elizabeth Barrett Browning","sum":"Compare with: Love’s Philosophy; Letters from Yorkshire; Winter Swans","quotes":[{"q":"my thoughts do twine and bud","src":"Sonnet 29: ‘I think of thee!’, Elizabeth Barrett Browning","f":[["Language","The verbs ‘twine and bud’ form an extended metaphor of a growing plant, showing how her thoughts of him multiply and spread."],["Form","The poem is a Petrarchan sonnet, the traditional form of love poetry, which suits her passionate feelings."],["Structure","The metaphor appears in the opening lines and develops through the octave, as her thoughts grow wilder."],["Context","Elizabeth Barrett wrote Sonnets from the Portuguese (1850) during her secret courtship with Robert Browning."],["Poet's intention","She presents desire and longing as overwhelming, showing how love can fill a person’s whole mind."],["Effect on the reader","The reader feels the intensity of her passion and her restless thoughts."]],"th":""},{"q":"Renew thy presence","src":"Sonnet 29: ‘I think of thee!’, Elizabeth Barrett Browning","f":[["Language","The imperative ‘Renew’ is a passionate command, showing that she wants the real man rather than her thoughts of him."],["Form","The direct address to ‘thy’ makes the sonnet feel like a private letter to her lover."],["Structure","This comes at the volta, where the poem turns from describing her thoughts to calling for his return."],["Context","Her father forbade his children to marry, so the couple married in secret in 1846 and fled to Italy."],["Poet's intention","Barrett Browning presents romantic love as needing physical presence, not just imagination."],["Effect on the reader","The reader senses her urgency and growing confidence in her love."]],"th":""},{"q":"I am too near thee.","src":"Sonnet 29: ‘I think of thee!’, Elizabeth Barrett Browning","f":[["Language","The adverb ‘too’ suggests that closeness to him is so complete that she no longer needs to think about him at all."],["Form","The short, simple sentence ends the sonnet with calm certainty after the excited exclamations."],["Structure","The final line resolves the poem, as longing gives way to fulfilment in his company."],["Context","Barrett Browning had been an invalid for many years, and her love for Browning gave her new energy and hope."],["Poet's intention","She presents romantic love as a joyful union in which two people are truly together."],["Effect on the reader","The reader feels a sense of peace and contentment."]],"th":""}],"pctx":["Elizabeth Barrett Browning (1806 to 1861) wrote the sonnet during her secret courtship with Robert Browning.","Barrett Browning uses the sonnet form to celebrate passionate love while longing for her lover’s presence."],"voc":{"v":[["devotion","deep love and loyalty","Barrett Browning’s sonnet expresses intense devotion."],["metaphorical","using one thing to describe another","The vine is a metaphorical image of her consuming thoughts."]],"m":[["L","Extended metaphor","my thoughts do twine and bud","Her thoughts grow like a vine around her lover, showing obsession.",1],["S","Volta","Renew thy presence","The turn shows she wants the real man, not her thoughts of him.",1],["F","Petrarchan sonnet","Fourteen lines with an octave and sestet","A traditional love form is used by a woman speaker, reclaiming it.",0]]}},{"n":"Neutral Tones","k":"Thomas Hardy","sum":"Compare with: When We Two Parted; Winter Swans; Porphyria’s Lover","quotes":[{"q":"We stood by a pond that winter day","src":"Neutral Tones, Thomas Hardy","f":[["Language","The setting of a ‘winter day’ uses pathetic fallacy, so the cold season reflects a relationship that has frozen and died."],["Form","Regular quatrains with an ABBA rhyme scheme feel trapped and enclosed, like the couple."],["Structure","The poem opens in the past tense, showing this is a memory that has stayed with him."],["Context","Thomas Hardy wrote the poem in 1867. He often wrote about unhappy love and a bleak view of fate."],["Poet's intention","Hardy presents loss and separation through a lifeless landscape that reflects dying love."],["Effect on the reader","The reader feels the chill and bleakness of the scene."]],"th":""},{"q":"The smile on your mouth was the deadest thing","src":"Neutral Tones, Thomas Hardy","f":[["Language","The superlative ‘deadest’ turns a smile, usually warm, into something lifeless, an oxymoron of a dead smile."],["Form","The longer line slows the pace, making the image linger like the painful memory."],["Structure","This central image comes in the third stanza, at the emotional heart of the poem."],["Context","Hardy’s own relationships were often unhappy, including his first marriage, which became cold and distant."],["Poet's intention","Hardy presents romantic love as something that can die, leaving only bitterness."],["Effect on the reader","The reader is struck by the coldness and cruelty of the image."]],"th":""},{"q":"keen lessons that love deceives","src":"Neutral Tones, Thomas Hardy","f":[["Language","The adjective ‘keen’ means sharp, suggesting that the lessons he has learned about love have been painful."],["Form","The final stanza breaks from the scene to reflect on the present, giving the poem a bitter moral."],["Structure","The last stanza returns to the pond, so the poem is cyclical and he is trapped by the memory."],["Context","Hardy rejected the optimism of many Victorians, presenting a world where love and hope often fail."],["Poet's intention","Hardy presents memory and the past as a source of lasting pain that shapes how he sees all love."],["Effect on the reader","The reader may feel sadness at his loss of faith in love."]],"th":""}],"pctx":["Hardy (1840 to 1928) wrote the poem in 1867 about the end of a relationship.","Hardy’s drained, colourless imagery reflects love turned bitter and lifeless."],"voc":{"v":[["bleak","cold and without hope","The bleak landscape mirrors a dying relationship."],["disillusioned","disappointed after losing faith","The speaker is disillusioned with love itself."]],"m":[["L","Oxymoron","The smile on your mouth was the deadest thing","A smile that is dead shows love turned cruel.",1],["S","Cyclical structure","The pond returns in the final stanza","Memory traps the speaker in that winter moment.",0],["F","Regular quatrains","Four line stanzas with an ABBA rhyme","The enclosing rhyme suggests feeling trapped.",0]]}},{"n":"Letters from Yorkshire","k":"Maura Dooley","sum":"Compare with: Sonnet 29; Winter Swans; Follower","quotes":[{"q":"his knuckles singing","src":"Letters from Yorkshire, Maura Dooley","f":[["Language","The personification of the knuckles ‘singing’ suggests the tingle of cold hands warming up, and the joy he feels in sharing his news."],["Form","Free verse in tercets gives the poem a relaxed, conversational voice, like a letter between friends."],["Structure","The image comes in the opening stanza, which describes his life outdoors before the poem turns to hers."],["Context","Maura Dooley’s collection Sound Barrier (2002) explores how people stay connected in a modern world."],["Poet's intention","Dooley presents nature and the outdoors as a source of joy that he wants to share with someone he loves."],["Effect on the reader","The reader feels the warmth of his eagerness to write to her."]],"th":""},{"q":"Is your life more real because you dig and sow?","src":"Letters from Yorkshire, Maura Dooley","f":[["Language","The verbs ‘dig and sow’ show his physical connection to the land, contrasting with her life of words and screens."],["Form","The rhetorical question makes the poem feel like an honest, private reflection."],["Structure","The question comes in the middle of the poem, at the point where she compares their two lives."],["Context","The poem reflects a time when more people worked in offices and cities, far from the countryside."],["Poet's intention","Dooley presents loss and separation as including different ways of life, not just distance."],["Effect on the reader","The reader is encouraged to wonder which way of living is more meaningful."]],"th":""},{"q":"our souls tap out messages across the icy miles.","src":"Letters from Yorkshire, Maura Dooley","f":[["Language","The metaphor of souls tapping out messages suggests a deep, almost spiritual bond, while ‘icy miles’ shows the cold distance between them."],["Form","The final line is longer and calmer, giving the poem a sense of resolution."],["Structure","Ending on the image of ‘souls’ moves the poem from everyday news to something deeper and lasting."],["Context","The word ‘tap’ may suggest typing or Morse code, linking the poem to modern ways of communicating."],["Poet's intention","Dooley presents a relationship in which love survives distance, because sharing everyday news keeps two people emotionally close."],["Effect on the reader","The reader feels comforted that the connection between them is strong."]],"th":""}],"pctx":["Dooley (born 1957) explores distance and connection between people living different lives.","Dooley shows how letters bridge physical distance through shared feelings."],"voc":{"v":[["correspondence","communication by letters","Their correspondence keeps them close across distance."],["contemplative","thoughtful","The speaker is contemplative about which life is more real."]],"m":[["L","Personification","his knuckles singing","Joy in nature is expressed through the body.",1],["S","Shift in pronouns","From ‘he’ to ‘our’","The move to ‘our souls’ shows growing closeness.",0],["F","Unrhymed tercets","Three line stanzas of free verse","The loose form mirrors natural, easy communication.",0]]}},{"n":"The Farmer’s Bride","k":"Charlotte Mew","sum":"Compare with: Porphyria’s Lover; When We Two Parted; Singh Song!","quotes":[{"q":"Her smile went out","src":"The Farmer’s Bride, Charlotte Mew","f":[["Language","The metaphor compares her smile to a light being extinguished, suggesting that marriage has crushed her happiness."],["Form","The dramatic monologue lets the farmer tell the story in his own words, so we only see her through his eyes."],["Structure","This happens early in the poem, straight after the wedding, showing how quickly the marriage went wrong."],["Context","Charlotte Mew published the poem in 1916, when rural women had few rights and were expected to marry young."],["Poet's intention","Mew presents marriage as a frightening trap for a young woman, giving a voice to her silent suffering."],["Effect on the reader","The reader feels pity for the young bride and her lost joy."]],"th":""},{"q":"We chased her, flying like a hare","src":"The Farmer’s Bride, Charlotte Mew","f":[["Language","The simile compares her to a hunted animal, and the verb ‘chased’ shows the community treating her like prey."],["Form","The rural dialect of the farmer’s voice makes the poem feel authentic and rooted in the countryside."],["Structure","The chase is the dramatic climax of the narrative, leading to her being locked away."],["Context","Women who rejected their husbands could be seen as mad or shameful in early twentieth century rural life."],["Poet's intention","Mew presents power and control within marriage, showing how a woman’s freedom could be taken from her."],["Effect on the reader","The reader is disturbed by the cruelty of the hunt."]],"th":""},{"q":"her eyes, her hair, her hair!","src":"The Farmer’s Bride, Charlotte Mew","f":[["Language","The repetition of ‘her hair’ shows the farmer’s growing desire and frustration as he thinks about his wife."],["Form","The exclamation and broken rhythm show him losing control of his words."],["Structure","The poem ends on this line, so it finishes with his unfulfilled desire rather than any resolution."],["Context","The poem reflects a time when wives were expected to obey their husbands, which makes his longing feel threatening."],["Poet's intention","Mew presents desire and longing as painful and possibly dangerous, leaving the reader uneasy."],["Effect on the reader","The reader feels both sympathy for his loneliness and fear for the bride."]],"th":""}],"pctx":["Mew (1869 to 1928) wrote about isolation and repressed desire; published 1916.","Mew exposes how marriage could trap a frightened woman with no say in her life."],"voc":{"v":[["patriarchal","controlled by men","The marriage reflects patriarchal ownership of women."],["frustration","feeling blocked from what you want","The farmer’s frustration turns to obsession."]],"m":[["L","Animal imagery","We chased her, flying like a hare","The bride is hunted like prey, revealing her fear.",1],["S","Broken final lines","her eyes, her hair, her hair!","Repetition and dashes show his desire losing control.",1],["F","Dramatic monologue in dialect","The farmer narrates in rural speech","We hear his side, which exposes his lack of understanding.",0]]}},{"n":"Walking Away","k":"Cecil Day Lewis","sum":"Compare with: Mother, any distance; Follower; Eden Rock","quotes":[{"q":"like a satellite / Wrenched from its orbit","src":"Walking Away, Cecil Day Lewis","f":[["Language","The simile presents the father as the planet his son has always circled, and the violent verb ‘Wrenched’ shows how painful the parting feels."],["Form","Enjambment across the line break mirrors the son drifting away from his father."],["Structure","This comes in the first stanza, as the father remembers the moment his son first walked away."],["Context","Cecil Day Lewis wrote the poem in 1956 about his eldest son Sean, remembering a moment from years before."],["Poet's intention","Day Lewis presents loss and separation as a painful but natural stage in a child growing up."],["Effect on the reader","The reader shares the father’s sense of loss and helplessness."]],"th":""},{"q":"Like a winged seed loosened from its parent stem","src":"Walking Away, Cecil Day Lewis","f":[["Language","The natural simile suggests that a child leaving home is as natural as a seed leaving a plant to grow on its own."],["Form","The regular five line stanzas with an ABACA rhyme give the poem a calm, reflective and controlled tone."],["Structure","The image comes in the third stanza, as the father begins to accept his son’s independence."],["Context","Day Lewis became Poet Laureate in 1968 and often wrote about family life."],["Poet's intention","Day Lewis presents family relationships as growing and changing, like life in nature."],["Effect on the reader","The reader feels that the separation is sad but hopeful."]],"th":""},{"q":"And love is proved in the letting go.","src":"Walking Away, Cecil Day Lewis","f":[["Language","The verb ‘proved’ suggests that letting go is the true test of a parent’s love."],["Form","The final line works like a proverb, giving the poem a wise, universal ending."],["Structure","The poem ends with resolution, as the father finally makes sense of his pain."],["Context","The poem was written many years after the memory, showing how long the feeling stayed with him."],["Poet's intention","Day Lewis presents family love as selfless, putting the child’s growth before the parent’s feelings."],["Effect on the reader","The reader is moved by the father’s wisdom and acceptance."]],"th":""}],"pctx":["Day Lewis (1904 to 1972), later Poet Laureate, wrote about watching his son leave for school.","Day Lewis presents love as the painful act of letting a child go."],"voc":{"v":[["poignant","deeply moving","A small moment of a son walking away is poignant."],["selfhood","a person’s own identity","Letting go allows the child’s selfhood."]],"m":[["L","Simile","like a satellite / Wrenched from its orbit","The violent verb ‘Wrenched’ shows the pain of separation.",1],["S","Final aphorism","And love is proved in the letting go.","The poem ends on wisdom learned through pain.",1],["F","Regular stanzas","Four five line stanzas","Controlled form reflects a father holding emotion in check.",0]]}},{"n":"Eden Rock","k":"Charles Causley","sum":"Compare with: Walking Away; Before You Were Mine; Climbing My Grandfather","quotes":[{"q":"My mother, twenty-three, in a sprigged dress","src":"Eden Rock, Charles Causley","f":[["Language","The precise detail of her age and the ‘sprigged dress’ makes the memory vivid and loving, as if from a photograph."],["Form","Calm, mostly regular quatrains with a gentle rhythm give the poem a peaceful, dreamlike tone, like a memory recalled slowly."],["Structure","The parents are introduced one by one in the opening stanzas, building a detailed picture of them."],["Context","Charles Causley’s father died in 1924, when Causley was a young child, from the effects of the First World War."],["Poet's intention","Causley presents memory and the past as a source of comfort, keeping his parents young forever."],["Effect on the reader","The reader feels nostalgia and tenderness for a family lost long ago."]],"th":""},{"q":"The sky whitens as if lit by three suns.","src":"Eden Rock, Charles Causley","f":[["Language","The image of ‘three suns’ creates an unreal, heavenly light, perhaps hinting at the afterlife."],["Form","The simple, complete sentence makes the strange, supernatural image feel calm and natural rather than frightening."],["Structure","It marks a shift in the poem from ordinary memory to a dreamlike vision."],["Context","Causley was a teacher in Cornwall, and his poetry often has a simple, ballad like voice."],["Poet's intention","Causley presents loss and separation from his parents as something that death may heal, presenting the afterlife as peaceful and bright."],["Effect on the reader","The reader feels a sense of wonder and calm, as if glimpsing heaven."]],"th":""},{"q":"I had not thought that it would be like this.","src":"Eden Rock, Charles Causley","f":[["Language","The plain, simple words suggest quiet surprise that death and reunion feel so gentle."],["Form","The line stands alone, separated from the quatrains above by white space, which visually represents the gap he is about to cross."],["Structure","The isolated final line leaves the speaker on the edge of the stream, about to cross."],["Context","Causley wrote the poem late in life, when he was thinking about his own death."],["Poet's intention","Causley presents family relationships as lasting beyond death, suggesting that his parents’ love is still waiting for him."],["Effect on the reader","The reader is left with a feeling of calm acceptance."]],"th":""}],"pctx":["Causley (1917 to 2003) wrote late in life imagining his dead parents waiting for him.","Causley presents death as a calm reunion with family in a timeless place."],"voc":{"v":[["idyllic","perfect and peaceful","The picnic is idyllic, like paradise."],["afterlife","life after death","The poem imagines parents waiting in the afterlife."]],"m":[["L","Biblical allusion","The title links to the Garden of Eden","The scene is a paradise beyond death.",0],["S","Isolated final line","I had not thought that it would be like this.","The separate line marks the moment of crossing over.",1],["F","Quatrains with half rhyme","Mostly regular stanzas","Near rhyme suggests something slightly unreal.",0]]}},{"n":"Follower","k":"Seamus Heaney","sum":"Compare with: Mother, any distance; Climbing My Grandfather; Walking Away","quotes":[{"q":"His shoulders globed like a full sail strung","src":"Follower, Seamus Heaney","f":[["Language","The simile compares the father’s shoulders to a ship’s sail, suggesting strength and power."],["Form","Six regular quatrains with a steady rhyme mirror the neat, ordered furrows the father ploughs so skilfully."],["Structure","The poem opens with admiration of the father before turning to the son."],["Context","Seamus Heaney grew up on a farm in County Derry, Northern Ireland. The poem is from Death of a Naturalist (1966)."],["Poet's intention","Heaney presents family relationships through a son’s deep admiration for his father."],["Effect on the reader","The reader shares the boy’s awe at his father’s strength and skill."]],"th":""},{"q":"I stumbled in his hob-nailed wake","src":"Follower, Seamus Heaney","f":[["Language","The verb ‘stumbled’ shows the boy’s clumsiness, and ‘wake’ continues the boat metaphor, as he trails behind."],["Form","First person narration makes the memory personal and honest, as the adult speaker admits his childhood clumsiness."],["Structure","The middle of the poem focuses on the boy trying and failing to follow his father."],["Context","Many farming families expected sons to follow their fathers into the same work."],["Poet's intention","Heaney presents memory and the past as a time of hero worship and wanting to be like his father."],["Effect on the reader","The reader feels affection for the eager child who idolises his father."]],"th":""},{"q":"It is my father who keeps stumbling","src":"Follower, Seamus Heaney","f":[["Language","The repeated verb ‘stumbling’ now describes the father, showing the roles have been reversed."],["Form","The final stanza shifts to the present tense, bringing the poem into the speaker’s adult life."],["Structure","The volta at ‘But today’ turns the poem, as the old father now follows the son."],["Context","Heaney left farming to become a writer and won the Nobel Prize in 1995."],["Poet's intention","Heaney presents power and control shifting within the family as parents grow old."],["Effect on the reader","The reader feels sympathy for the ageing father and the son’s mixed emotions of love and guilt."]],"th":""}],"pctx":["Heaney (1939 to 2013) grew up on a farm in Northern Ireland, admiring his father.","Heaney shows the reversal of roles as the son now cares for the father."],"voc":{"v":[["admiration","respect and approval","The boy’s admiration for his father is clear."],["role reversal","when roles swap","The ending shows role reversal as the son cares for the father."]],"m":[["L","Metaphor","His shoulders globed like a full sail strung","The father seems strong and powerful to the child.",1],["S","Volta","It is my father who keeps stumbling","The turn shows the son now leading the ageing father.",1],["F","Regular quatrains","Six four line stanzas","The neat form mirrors the father’s straight furrows.",0]]}},{"n":"Mother, any distance","k":"Simon Armitage","sum":"Compare with: Walking Away; Before You Were Mine; Follower","quotes":[{"q":"requires a second pair of hands.","src":"Mother, any distance, Simon Armitage","f":[["Language","The phrase ‘second pair of hands’ shows that the son still needs his mother’s help, even as he becomes independent."],["Form","The poem is a loose sonnet, a form linked with love poetry, which suits the love between mother and son."],["Structure","This comes in the opening lines, which set up the extended metaphor of measuring the new house."],["Context","Simon Armitage published the poem in Book of Matches (1993). He became Poet Laureate in 2019."],["Poet's intention","Armitage presents family relationships as supportive, showing that the mother’s practical help is also a sign of her love."],["Effect on the reader","The reader recognises the warmth of the mother’s help."]],"th":""},{"q":"Anchor. Kite.","src":"Mother, any distance, Simon Armitage","f":[["Language","The contrasting metaphors present the mother as an ‘Anchor’ giving security and the son as a ‘Kite’ longing to fly free."],["Form","Two one word sentences create a sharp pause, making the images stand out."],["Structure","These words sit at the centre of the poem, at the point where the tape stretches between them."],["Context","The poems in the first section of Book of Matches were designed to be read in the time it takes a match to burn."],["Poet's intention","Armitage presents desire and longing for freedom balanced against the need for family."],["Effect on the reader","The reader understands the tension in the son’s feelings."]],"th":""},{"q":"to fall or fly.","src":"Mother, any distance, Simon Armitage","f":[["Language","The alliteration links two opposite outcomes, failure or freedom, showing the risk of independence."],["Form","The final rhyme of ‘sky’ and ‘fly’ gives a sense of release."],["Structure","The poem ends at the very moment of choice, leaving the outcome open and the son’s future unknown."],["Context","The poem reflects the universal experience of leaving home for the first time."],["Poet's intention","Armitage presents power and control passing from parent to child, as the son must decide for himself."],["Effect on the reader","The reader feels excitement and anxiety for the son’s future."]],"th":""}],"pctx":["Armitage (born 1963) describes moving into his first home, helped by his mother.","Armitage presents growing up as a tension between independence and connection."],"voc":{"v":[["independence","being free from control","The son steps into independence."],["tension","strain between opposing forces","The tape measure shows the tension between holding on and letting go."]],"m":[["L","Extended metaphor","Anchor. Kite.","The mother anchors while the son flies, showing bond and freedom.",1],["S","Final half line","to fall or fly.","The poem ends on uncertainty as the son steps into the unknown.",1],["F","Loose sonnet","Fifteen lines that break sonnet form","Breaking the form mirrors breaking away from home.",0]]}},{"n":"Before You Were Mine","k":"Carol Ann Duffy","sum":"Compare with: Mother, any distance; Eden Rock; Climbing My Grandfather","quotes":[{"q":"Your polka-dot dress blows round your legs. Marilyn.","src":"Before You Were Mine, Carol Ann Duffy","f":[["Language","The allusion to Marilyn Monroe makes the mother seem glamorous, like a film star."],["Form","Direct address to ‘you’ makes the poem feel like a conversation between daughter and mother."],["Structure","The one word sentence ‘Marilyn.’ ends the line abruptly, freezing the image like a photograph or a still from a film."],["Context","Carol Ann Duffy grew up in Glasgow. The poem is from Mean Time (1993). She was Poet Laureate from 2009 to 2019."],["Poet's intention","Duffy presents memory and the past through a daughter’s admiring view of her mother’s youth."],["Effect on the reader","The reader is charmed by the playful, glamorous image."]],"th":""},{"q":"my loud, possessive yell","src":"Before You Were Mine, Carol Ann Duffy","f":[["Language","The adjective ‘possessive’ suggests that the baby took over her mother’s life, ending her freedom."],["Form","The conversational tone and the tag question ‘eh?’ make the daughter’s guilt feel honest, personal and gently humorous."],["Structure","This comes in the third stanza, as the daughter imagines how her own arrival changed everything."],["Context","In the 1950s, many women gave up work and social lives once they became mothers."],["Poet's intention","Duffy presents family relationships as loving but involving sacrifice, as a mother gives up her carefree youth for her child."],["Effect on the reader","The reader feels a mix of humour and guilt."]],"th":""},{"q":"stamping stars from the wrong pavement.","src":"Before You Were Mine, Carol Ann Duffy","f":[["Language","The metaphor of ‘stamping stars’ suggests the mother’s dancing still sparkles, even in ordinary life."],["Form","Free verse in five line stanzas gives the poem a relaxed, flowing voice."],["Structure","This comes in the final stanza, where the poem moves to the daughter’s own memories."],["Context","Duffy was raised in a Catholic family, and the stanza mentions walking home from Mass."],["Poet's intention","Duffy presents romantic love and glamour as part of the mother’s spirit that lasts."],["Effect on the reader","The reader feels joy at the mother’s lasting energy."]],"th":""}],"pctx":["Duffy (born 1955) imagines her mother’s glamorous life before motherhood.","Duffy explores how a mother’s identity is changed by having a child."],"voc":{"v":[["glamorous","attractive and exciting","The mother’s glamorous youth fascinates the speaker."],["possessive","wanting to own","The title is possessive, as the child claims the mother."]],"m":[["L","Cultural reference","Your polka-dot dress blows round your legs. Marilyn.","The comparison to Marilyn Monroe shows the mother’s glamour.",1],["S","Shifts in time","Present tense describing the past","Time collapses, so the speaker relives a life she missed.",0],["F","Regular quintains","Four five line stanzas","Controlled form shapes the speaker’s imagined memories.",0]]}},{"n":"Winter Swans","k":"Owen Sheers","sum":"Compare with: Neutral Tones; When We Two Parted; Letters from Yorkshire","quotes":[{"q":"gulping for breath at our feet","src":"Winter Swans, Owen Sheers","f":[["Language","Personification makes the waterlogged earth seem to be drowning, so the exhausted land reflects a relationship struggling to survive after an argument."],["Form","Unrhymed tercets give the poem a steady, walking
