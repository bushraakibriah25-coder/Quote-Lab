imple truth."],"t2":["Climax","The plea comes at the darkest moment of the novella.","The grave forces Scrooge to face the end his life is heading towards.","Placing the turning point beside a grave makes redemption feel like a rescue from death itself."],"cx":"Victorian readers knew the horror of pauper burials and deaths that no one mourned.","wi":"Dickens uses the fear of death to make readers reflect on how they want to be remembered."},{"r":"Stave 4","m":"Scrooge vows to change his life.","q":"I will honour Christmas in my heart, and try to keep it all the year.","t1":["Modal verb","‘will’ makes the promise firm and future focused.","Scrooge commits himself to action, not just feeling.","The humble ‘try’ makes him human: change is a lifelong effort rather than a single moment."],"t2":["Religious diction","‘honour’ suggests reverence and worship.","Christmas becomes a moral code rather than a date.","‘all the year’ turns the festival into a way of living, linking Christian values to everyday social responsibility."],"cx":"Dickens helped to popularise Christmas in the 1840s as a festival of family, generosity and goodwill.","wi":"Dickens encourages readers to live charitably every day, not just in December."},{"r":"Stave 5","m":"Scrooge wakes on Christmas morning, transformed.","q":"I am as light as a feather, I am as happy as an angel, I am as merry as a schoolboy","t1":["Triple similes","Three similes describe his joy: a feather, an angel, a schoolboy.","He feels weightless, holy and young again.","Each image reverses an earlier one: his chains are gone, his sin is forgiven and his lost childhood is restored."],"t2":["Anaphora","‘I am as’ is repeated three times.","The tumbling rhythm shows breathless excitement.","His speech has become as energetic and generous as his spirit, unlike his clipped replies in Stave 1."],"cx":"Victorian Christianity taught that any sinner could be redeemed through genuine repentance.","wi":"Dickens shows that change is joyful and possible, giving readers hope for themselves and society."},{"r":"Stave 5","m":"Scrooge becomes a generous friend, employer and man.","q":"He became as good a friend, as good a master, and as good a man, as the good old city knew","t1":["Repetition","The adjective ‘good’ is repeated again and again.","Scrooge’s goodness is complete and overflowing.","It answers the list of greedy verbs in Stave 1, completing the novella’s cyclical structure of sin and redemption."],"t2":["Tricolon","‘friend’, ‘master’, ‘man’ cover every role he plays.","His change touches family, work and society.","As a ‘master’ he becomes the employer the poor need, offering readers a practical model of reform."],"cx":"In an age without a welfare state, employers had enormous power over their workers’ lives.","wi":"Dickens offers wealthy readers a hopeful model of social responsibility."}]},{"id":"jh","title":"Jekyll and Hyde","author":"Stevenson","kind":"19th century novella","paper":"Paper 1, Section B","col":"#00695C","ctx":[["Two Edinburghs","Stevenson grew up in Edinburgh’s elegant, respectable New Town, a short walk from the crowded, poor Old Town, where crime was common. A city with two faces gave him the idea of one person with two faces."],["Deacon Brodie","An Edinburgh cabinet maker of the 1700s and town councillor who was a burglar by night. He was hanged in 1788. Stevenson grew up with a cabinet Brodie had made, and later wrote a play about him with his friend W. E. Henley."],["A strict religious childhood","His nanny, Alison Cunningham, known as Cummy, was a devout Calvinist who filled his head with stories of sin, hell and the devil. That fascination with good and evil never left him."],["His own double life","As a student he rebelled against his respectable family, drinking in Old Town taverns and mixing with people his parents would never have welcomed at home."],["Respectability","For a Victorian gentleman, reputation was everything. Drinking, gambling or any hint of scandal could ruin him, so vices were hidden rather than given up."],["Darwin and degeneration","Darwin’s On the Origin of Species (1859) suggested humans had evolved from earlier creatures. Many Victorians feared people could slip backwards into something primitive and violent."]],"groups":[{"n":"Chapter 1: Story of the Door","k":"Chapter","sum":"Utterson, a reserved lawyer, walks through London with his relative Enfield. Enfield points to a shabby door and tells how he saw a man trample a young girl, then pay her family with a cheque signed by a highly respectable name. The two men agree never to speak of it again.","quotes":[{"q":"a man of a rugged countenance that was never lighted by a smile","src":"Our very first description of Utterson.","f":[["Method","Light imagery"],["Analysis","Stevenson opens with a man who keeps himself shut away. ‘Never lighted’ suggests a closed room left in the dark, which suits a story about hidden lives. We’re also told he is somehow lovable, so even the novel’s steady, sensible figure has two sides."],["Context","The ideal Victorian gentleman showed very little emotion in public."],["In short","‘Never lighted’ suggests a closed, dark room. Even sensible Utterson has two sides: cold on the surface, yet somehow lovable."]],"th":""},{"q":"I let my brother go to the devil in his own way","src":"Utterson explains his attitude to friends who go wrong.","f":[["Method","Idiom and biblical allusion"],["Analysis","It sounds generous, but it’s also a neat way of never getting involved. The line comes straight after a reference to Cain, who asked God whether he was his brother’s keeper, so Stevenson hints that this kind of tolerance has a cost."],["Context","Ideas of sin and damnation from Stevenson’s Calvinist upbringing appear on the very first page."],["In short","Sounds tolerant, but it’s really a way of staying out of things. The Cain allusion hints that looking away has a cost."]],"th":""},{"q":"the marks of prolonged and sordid negligence","src":"Enfield and Utterson pass the door that will turn out to be Jekyll’s back entrance.","f":[["Method","Personification"],["Analysis","The door is described like a person who has let himself go. ‘Sordid’ means morally dirty as well as shabby, so the building already feels guilty. It belongs to a respectable house, which makes it the first image in the book of a fine front hiding a grubby secret."],["Context","Edinburgh’s grand New Town sat beside the decaying Old Town."],["In short","The neglected door is the back of a respectable house: a fine front hiding a grubby secret. ‘Sordid’ = morally dirty."]],"th":""},{"q":"the man trampled calmly over the child’s body","src":"Enfield describes Hyde colliding with a young girl at three in the morning.","f":[["Method","Verb and adverb"],["Analysis","‘Calmly’ is the word that chills. Violence in a rage is frightening, but violence carried out with no feeling at all is worse. A child is the most innocent victim imaginable, so Hyde is defined by cruelty from the moment we meet him."],["Context","Victorians worried about crime on dark city streets and about the safety of poor children."],["In short","‘Calmly’ is the chilling word: violence with no feeling at all. The victim is a child, the most innocent possible."]],"th":""},{"q":"like some damned Juggernaut","src":"Enfield tries to describe what he saw.","f":[["Method","Simile"],["Analysis","Enfield can’t describe Hyde as a man, so he reaches for an unstoppable crushing force. ‘Damned’ is strong language for a gentleman, and it also means condemned to hell, so the curse doubles as a judgement."],["Context","‘Juggernaut’ came into English through British rule in India and was used for any force that crushes everything in its way."],["In short","Hyde isn’t described as a man but as an unstoppable crushing force. ‘Damned’ is both a swear word and ‘condemned to hell’."]],"th":""},{"q":"carrying it off, sir, really like Satan","src":"Hyde faces the angry crowd with ‘a kind of black sneering coolness’.","f":[["Method","Simile"],["Analysis","Enfield is a man of the world, yet the only comparison he can find is Satan. It’s the first of many devilish descriptions, and it lifts Hyde from ordinary criminal to something spiritual and evil."],["Context","Stevenson was raised on vivid stories of the devil and damnation."],["In short","First of many devilish comparisons. Hyde moves from ordinary criminal to something spiritually evil."]],"th":""},{"q":"the more it looks like Queer Street, the less I ask","src":"Enfield explains why he never asks questions.","f":[["Method","Idiom"],["Analysis","‘Queer Street’ meant trouble, debt or scandal. Enfield’s rule is a recipe for looking away: the more suspicious something seems, the less he wants to know. Stevenson shows how respectable men protect each other by keeping quiet."],["Context","Reputation mattered more than truth to many Victorian gentlemen."],["In short","‘Queer Street’ = trouble or scandal. Enfield’s rule: the more suspicious it looks, the less he asks. Silence protects reputations."]],"th":""},{"q":"Let us make a bargain never to refer to this again","src":"The chapter’s closing agreement between Enfield and Utterson.","f":[["Method","Imperative and chapter ending"],["Analysis","The chapter ends with two gentlemen agreeing to forget. It’s polite and civilised, and it lets evil carry on unchecked. The reader is left knowing more than the characters are willing to admit."],["Context","Avoiding scandal was a key part of Victorian respectability."],["In short","The chapter ends in an agreement to forget. Polite and civilised, and it lets evil carry on."]],"th":""}]},{"n":"Chapter 2: Search for Mr Hyde","k":"Chapter","sum":"Utterson rereads Jekyll’s will, which leaves everything to Hyde, and fears blackmail. Dr Lanyon says he fell out with Jekyll over his strange science. Haunted by nightmares, Utterson waits by the door until he finally meets Hyde, and he comes away disgusted.","quotes":[{"q":"If he be Mr. Hyde,’ he had thought, ‘I shall be Mr. Seek.","src":"Utterson decides to watch the door until he sees Hyde.","f":[["Method","Pun"],["Analysis","It’s almost the only joke in the book, and it tells us a lot. Turning the name into hide and seek makes the story a game of detection, and it suggests the name is a clue: Hyde is the part of somebody that hides."],["Context","Detective fiction was becoming hugely popular; Sherlock Holmes first appeared the year after this novella."],["In short","Hide and seek pun: the story becomes a detective game, and Hyde’s name tells us he is the part of someone that hides."]],"th":""},{"q":"a figure to whom power was given","src":"Utterson’s nightmare of a faceless figure moving through the city.","f":[["Method","Dream imagery and passive voice"],["Analysis","In the dream, the figure glides through London and stands over sleepers. The passive ‘was given’ quietly raises a question: who gave him that power? By the end of the book we know the answer is Jekyll."],["Context","Stevenson said the story itself first came to him in a nightmare."],["In short","Passive ‘was given’ asks who gave Hyde his power. The answer, we later learn, is Jekyll."]],"th":""},{"q":"pale and dwarfish","src":"Utterson finally sees Hyde up close.","f":[["Method","Adjectives"],["Analysis","Hyde is small and pale, almost unfinished, as if he hasn’t grown properly. Jekyll later explains why: his evil side has been less exercised than his good side, so it is smaller. The description is also oddly vague, a sign that Hyde resists being pinned down."],["Context","Many Victorians believed criminals could be recognised by the shape of their bodies."],["In short","Small and pale, almost unfinished. Later we learn why: Jekyll’s evil side has had less use, so it’s smaller."]],"th":""},{"q":"a sort of murderous mixture of timidity and boldness","src":"Utterson describes Hyde’s manner.","f":[["Method","Juxtaposition and alliteration"],["Analysis","Hyde is shy and aggressive at the same time, which makes him impossible to predict. The alliteration of ‘murderous mixture’ makes the phrase stick, and the picture is almost animal: a creature that shrinks away and then strikes."],["Context","Fears of degeneration imagined criminals as more animal than human."],["In short","Shy and aggressive at once, like an animal that shrinks back then strikes. ‘Murderous mixture’ sticks in the mind."]],"th":""},{"q":"Something troglodytic, shall we say?","src":"Utterson struggles to put his disgust into words.","f":[["Method","Adjective and rhetorical question"],["Analysis","A troglodyte is a cave dweller, so Utterson places Hyde right at the start of human history, a throwback. The rhetorical question shows him groping for words, which becomes a pattern: nobody can quite describe Hyde."],["Context","Darwin’s theory led to fears that humans could slip back into a primitive state."],["In short","Troglodyte = cave dweller: Hyde is a primitive throwback. Utterson can’t find the words, and nobody ever can."]],"th":""},{"q":"if ever I read Satan’s signature upon a face, it is on that of your new friend","src":"Utterson thinks about Jekyll after meeting Hyde.","f":[["Method","Metaphor"],["Analysis","A signature is a mark of ownership, so the devil has signed Hyde’s face as if he belongs to him. It’s a fitting image for a lawyer who spends his days reading signed documents: Utterson reads faces the way he reads contracts."],["Context","Physiognomy, the belief that character shows in the face, was widely accepted."],["In short","The devil has signed Hyde’s face like a document: he belongs to Satan. A lawyer’s way of reading a face."]],"th":""},{"q":"Such unscientific balderdash","src":"Lanyon explains why he fell out with Jekyll.","f":[["Method","Noun and adjective"],["Analysis","‘Balderdash’ is a blunt, slightly comic word, and it shows how firmly Lanyon holds to traditional science. That certainty is exactly what makes his collapse later in the novella so shocking."],["Context","Victorian science was split between careful, traditional methods and experiments that seemed to stray into the supernatural."],["In short","Lanyon dismisses Jekyll as talking nonsense. His certainty makes his later collapse more shocking."]],"th":""},{"q":"the ghost of some old sin, the cancer of some concealed disgrace","src":"Utterson guesses Jekyll is being blackmailed over something from his youth.","f":[["Method","Metaphor and parallel structure"],["Analysis","A ghost comes back to haunt; a cancer grows unseen and kills. The two balanced images both describe a past that refuses to stay buried, and ‘concealed’ points straight at the theme of secrecy."],["Context","Respectable men with hidden vices were easy targets for blackmail."],["In short","Ghost = the past comes back to haunt. Cancer = it grows unseen and kills. A secret that won’t stay buried."]],"th":""}]},{"n":"Chapter 3: Dr Jekyll Was Quite at Ease","k":"Chapter","sum":"A fortnight later, Jekyll holds one of his dinner parties and Utterson stays behind. When Utterson raises the will, Jekyll goes pale and refuses to discuss Hyde. He insists he can be rid of Hyde whenever he likes, and makes Utterson promise to help Hyde if anything happens to him.","quotes":[{"q":"a large, well-made, smooth-faced man of fifty","src":"Our first proper look at Jekyll.","f":[["Method","Adjectives"],["Analysis","Jekyll is everything Hyde is not: large, well built and smooth. ‘Smooth’ is worth pausing on, though. Like the landlady in Chapter 4, whose face is ‘smoothed by hypocrisy’, smoothness can be a polished surface over something rougher."],["Context","This is the image of the successful, respectable Victorian professional."],["In short","Everything Hyde is not: large, well built, smooth. But ‘smooth’ can be a polished surface over something rougher."]],"th":""},{"q":"every mark of capacity and kindness","src":"The description of Jekyll continues.","f":[["Method","Abstract nouns"],["Analysis","Jekyll seems both capable and kind, and Stevenson clearly wants us to like him. That is what makes the truth so disturbing: the most likeable man in the book is the one hiding Hyde."],["Context","Victorians trusted that good manners and a good appearance meant a good man."],["In short","Stevenson makes us like Jekyll, which makes the truth more disturbing: the most likeable man is hiding Hyde."]],"th":""},{"q":"that hide-bound pedant, Lanyon","src":"Jekyll mocks his old friend.","f":[["Method","Insult and possible pun"],["Analysis","Jekyll’s charm slips for a moment. He sneers at Lanyon as narrow and fussy, which shows how proud he is of his own science. There may be a buried pun too: Jekyll is the one who is truly bound to Hyde."],["Context","Scientific rivalry between traditional and experimental thinkers."],["In short","Jekyll’s charm slips into arrogance. Possible pun: it’s Jekyll, not Lanyon, who is bound to Hyde."]],"th":""},{"q":"grew pale to the very lips","src":"Utterson mentions Hyde’s name.","f":[["Method","Physical description"],["Analysis","The mention of Hyde drains the colour from Jekyll’s face. Stevenson shows fear through the body rather than telling us about it, and Jekyll’s calm surface cracks the moment his secret is touched."],["Context","A gentleman was expected to stay composed, whatever he felt."],["In short","Hyde’s name drains Jekyll’s face. Fear shown through the body: his calm surface cracks."]],"th":""},{"q":"the moment I choose, I can be rid of Mr. Hyde","src":"Jekyll reassures Utterson that he is in control.","f":[["Method","Dramatic irony"],["Analysis","Jekyll truly believes he is in charge. Readers who know the ending hear the irony at once, and even first time readers may notice how much this sounds like the promise of someone caught in an addiction."],["Context","Victorians worried about addiction to drink and drugs such as laudanum."],["In short","Jekyll thinks he’s in control. It sounds like an addict’s promise, and the irony is huge."]],"th":""},{"q":"this is a private matter, and I beg of you to let it sleep","src":"Jekyll asks Utterson to drop the subject.","f":[["Method","Metaphor"],["Analysis","Jekyll asks for silence, and ‘let it sleep’ suggests something resting rather than dead. Things that sleep can wake, so the request carries a warning inside it."],["Context","A gentleman’s private life was not to be questioned."],["In short","‘Let it sleep’ = resting, not dead. Things that sleep can wake."]],"th":""}]},{"n":"Chapter 4: The Carew Murder Case","k":"Chapter","sum":"Nearly a year later, a maid at her window sees Hyde beat Sir Danvers Carew MP to death with a heavy cane. Utterson recognises the broken stick as one he gave Jekyll and leads the police to Hyde’s rooms in Soho. The rooms have been ransacked and Hyde has vanished.","quotes":[{"q":"a crime of singular ferocity","src":"The chapter’s opening line.","f":[["Method","Journalistic language"],["Analysis","Stevenson opens like a newspaper report, pulling the story out of private drawing rooms and into the public eye. ‘Singular’ means both unique and extreme, so London has never seen anything like it."],["Context","The Victorian press thrived on sensational crime."],["In short","Opens like a newspaper. ‘Singular’ = unique and extreme. Hyde’s evil is now public."]],"th":""},{"q":"an aged beautiful gentleman with white hair","src":"The maid watches Sir Danvers Carew approach Hyde in the moonlight.","f":[["Method","Adjectives and colour"],["Analysis","‘Aged’ and ‘beautiful’ come before we even reach ‘gentleman’, and ‘white hair’ completes the picture of a near saint. We’re seeing him through a maid who is ‘romantically given’, though, so Stevenson leaves room to ask whether he is truly good or just looks it."],["Context","Carew is an MP, a symbol of law and the establishment."],["In short","‘Aged’, ‘beautiful’, ‘white’: a near saintly victim. But it’s a romantic maid’s view."]],"th":""},{"q":"a great flame of anger","src":"Hyde suddenly explodes at Carew.","f":[["Method","Metaphor"],["Analysis","The anger ignites like fire: sudden, spreading and impossible to reason with. Fire also belongs to the imagery of hell that follows Hyde, and nothing Carew has done justifies it."],["Context","Stevenson’s Calvinist upbringing left him fascinated by sin and hellfire."],["In short","Anger ignites like fire. Hell imagery again, and completely unprovoked."]],"th":""},{"q":"like a madman","src":"Hyde stamps his foot and waves his cane.","f":[["Method","Simile"],["Analysis","‘Madman’ offers a comforting explanation: perhaps Hyde is simply insane. The novel later takes that comfort away, because Hyde isn’t ill. He is set free."],["Context","Victorians were preoccupied with insanity and asylums."],["In short","‘Madman’ is a comforting label the novel rejects. Hyde isn’t mad. He’s unleashed."]],"th":""},{"q":"with ape-like fury","src":"Hyde clubs Carew to the ground.","f":[["Method","Animal imagery"],["Analysis","‘Ape-like’ drags Hyde down the evolutionary ladder, and ‘fury’ goes beyond anger to something wild. Yet he is dressed as a gentleman and carrying a gentleman’s cane, so the ape is inside the gentleman."],["Context","Darwin’s ideas fed fears that civilised people could become savage."],["In short","Primitive and savage, but dressed as a gentleman. The beast is inside respectable men."]],"th":""},{"q":"a storm of blows, under which the bones were audibly shattered","src":"Hyde beats Carew to death.","f":[["Method","Metaphor and sound imagery"],["Analysis","A ‘storm’ is a force of nature, not a person who can be reasoned with. ‘Audibly’ puts us at the window beside the maid, hearing bones break."],["Context","Gothic fiction aimed to shock."],["In short","‘Storm’ = an unstoppable force. ‘Audibly’ puts us at the window, hearing the bones break."]],"th":""},{"q":"this insensate cruelty","src":"The heavy cane has snapped in two.","f":[["Method","Adjective and symbolism"],["Analysis","‘Insensate’ means both senseless and unfeeling. The cane is a gentleman’s stick, and it is Jekyll’s; broken in half, it becomes a picture of one respectable man split in two."],["Context","A cane was a mark of status."],["In short","Senseless and unfeeling. Jekyll’s gentleman’s cane, snapped in two: one man split in half."]],"th":""},{"q":"A great chocolate-coloured pall lowered over heaven","src":"Utterson travels by cab towards Soho the next morning.","f":[["Method","Metaphor and pathetic fallacy"],["Analysis","A pall is the cloth laid over a coffin, so the whole city seems dressed for a funeral. The fog blots out ‘heaven’ itself, leaving a London cut off from goodness."],["Context","Coal smoke fogs known as pea soupers were real and choking."],["In short","Pall = coffin cloth: London in mourning. Fog blots out ‘heaven’: a godless city."]],"th":""},{"q":"like a district of some city in a nightmare","src":"Soho glimpsed through the fog.","f":[["Method","Simile"],["Analysis","Real London turns dreamlike and unstable. ‘Some city’ could be anywhere, so the horror isn’t limited to one place, and Utterson’s nightmares from Chapter 2 seem to have leaked into the streets."],["Context","The novella itself began as one of Stevenson’s nightmares."],["In short","London becomes a nightmare. ‘Some city’ = anywhere. Utterson’s bad dreams have reached the streets."]],"th":""},{"q":"this mournful reinvasion of darkness","src":"Lamps have been lit in the daytime against the fog.","f":[["Method","Military metaphor"],["Analysis","‘Reinvasion’ makes the weather a war that darkness keeps winning. It mirrors Jekyll, whose better self will be overrun by Hyde again and again."],["Context","Gaslight was a proud symbol of Victorian progress."],["In short","Darkness keeps invading and light is losing, just as Hyde will overrun Jekyll."]],"th":""},{"q":"She had an evil face, smoothed by hypocrisy: but her manners were excellent.","src":"Hyde’s landlady opens the door in Soho.","f":[["Method","Antithesis"],["Analysis","The sentence turns on ‘but’, setting an evil face against excellent manners. It’s Jekyll and Hyde in miniature, and it suggests hypocrisy runs through every class, not just the rich."],["Context","Soho was linked to poverty and vice."],["In short","Evil face, excellent manners: Jekyll and Hyde in one sentence. Hypocrisy is everywhere."]],"th":""},{"q":"A flash of odious joy","src":"The landlady hears Hyde is in trouble.","f":[["Method","Metaphor"],["Analysis","A ‘flash’ is quick and involuntary, the moment the polite mask slips. Nobody, it seems, has any loyalty to Hyde."],["Context","Victorians loved a scandal."],["In short","The mask slips for a second. Nobody is loyal to Hyde."]],"th":""},{"q":"he had never been photographed","src":"The police try to trace Hyde.","f":[["Method","Plot detail"],["Analysis","Hyde slips past the newest tool for catching criminals. He has no family, few acquaintances and no picture, so he barely exists on paper."],["Context","Victorian police were beginning to photograph criminals."],["In short","No photo, no family, few friends. Hyde slips past modern detection."]],"th":""},{"q":"the haunting sense of unexpressed deformity","src":"Witnesses try to describe Hyde.","f":[["Method","Abstract nouns"],["Analysis","Nobody agrees on what Hyde looks like; they only share a feeling. ‘Unexpressed’ suggests evil that language cannot hold, and ‘haunting’ gives him the quality of a ghost."],["Context","Gothic fiction often presents evil as beyond words."],["In short","Hyde can’t be put into words. Evil is felt, not seen."]],"th":""}]},{"n":"Chapter 5: Incident of the Letter","k":"Chapter","sum":"Jekyll claims Hyde has gone; Utterson suspects forgery.","quotes":[{"q":"I swear to God I will never set eyes on him again","src":"Jekyll, Chapter 5","f":[["Language","Oath shows desperation."],["Form and structure","Dialogue with Utterson."],["Perceptive reading","Ironically untrue."],["Context","Religion and oaths."],["Writer's intention","To show self deception."]],"th":"Duality · Secrecy · Guilt"},{"q":"a murderer’s autograph","src":"Mr Guest, Chapter 5","f":[["Language","Chilling phrase."],["Form and structure","Handwriting clue."],["Perceptive reading","Evidence of duality."],["Context","Victorian detective fiction."],["Writer's intention","To build mystery."]],"th":"Mystery · Duality · Crime"},{"q":"the two hands are in many points identical: only differently sloped","src":"Mr Guest, Chapter 5","f":[["Language","Clue to identity."],["Form and structure","Detective structure."],["Perceptive reading","Jekyll and Hyde are one."],["Context","Handwriting analysis."],["Writer's intention","To hint at the truth."]],"th":"Duality · Mystery · Identity"}]},{"n":"Chapter 6: Remarkable Incident of Dr Lanyon","k":"Chapter","sum":"Lanyon collapses after a shock he will not explain.","quotes":[{"q":"I have had a shock, and I shall never recover","src":"Lanyon, Chapter 6","f":[["Language","Prediction of death."],["Form and structure","Mystery deepens."],["Perceptive reading","Truth destroys him."],["Context","Rational science."],["Writer's intention","To build suspense."]],"th":"Science · Horror · Mystery"},{"q":"I wish to see or hear no more of Dr. Jekyll","src":"Lanyon, Chapter 6","f":[["Language","Rejection of friend."],["Form and structure","Short refusal."],["Perceptive reading","Horror of knowledge."],["Context","Victorian reputation."],["Writer's intention","To build tension."]],"th":"Friendship · Secrecy · Horror"},{"q":"he had his death-warrant written legibly upon his face","src":"Narrator, Chapter 6","f":[["Language","Metaphor of a death warrant."],["Form and structure","Gothic imagery."],["Perceptive reading","Fear is physical."],["Context","Gothic tradition."],["Writer's intention","To foreshadow death."]],"th":"Death · Horror · Mystery"}]},{"n":"Chapter 7: Incident at the Window","k":"Chapter","sum":"Jekyll’s face changes in terror at the window.","quotes":[{"q":"the smile was struck out of his face","src":"Narrator, Chapter 7","f":[["Language","Violent verb ‘struck’."],["Form and structure","Sudden change."],["Perceptive reading","Transformation glimpsed."],["Context","Gothic horror."],["Writer's intention","To shock."]],"th":"Duality · Horror · Secrecy"},{"q":"an expression of such abject terror and despair","src":"Narrator, Chapter 7","f":[["Language","Strong emotion."],["Form and structure","Witnessed by Utterson."],["Perceptive reading","Jekyll losing control."],["Context","Repression."],["Writer's intention","To create suspense."]],"th":"Fear · Duality · Control"},{"q":"God forgive us, God forgive us","src":"Utterson, Chapter 7","f":[["Language","Repetition shows horror."],["Form and structure","Religious response."],["Perceptive reading","Guilt of witnessing."],["Context","Victorian religion."],["Writer's intention","To heighten horror."]],"th":"Religion · Horror · Guilt"}]},{"n":"Chapter 8: The Last Night","k":"Chapter","sum":"Utterson and Poole break into the cabinet and find Hyde dead.","quotes":[{"q":"the pale moon, lying on her back as though the wind had tilted her","src":"Narrator, Chapter 8","f":[["Language","Personification of the moon."],["Form and structure","Gothic setting."],["Perceptive reading","Nature disturbed."],["Context","Pathetic fallacy."],["Writer's intention","To create unease."]],"th":"Setting · Horror · Nature"},{"q":"Sir, if that was my master, why had he a mask upon his face?","src":"Poole, Chapter 8","f":[["Language","Question shows fear."],["Form and structure","Dialogue builds suspense."],["Perceptive reading","Mask suggests hidden identity."],["Context","Victorian masks of respectability."],["Writer's intention","To build mystery."]],"th":"Duality · Mystery · Identity"},{"q":"the body of a man sorely contorted and still twitching","src":"Narrator, Chapter 8","f":[["Language","Grotesque image."],["Form and structure","Climax."],["Perceptive reading","Hyde’s death."],["Context","Gothic horror."],["Writer's intention","To shock."]],"th":"Death · Horror · Duality"}]},{"n":"Chapter 9: Dr Lanyon’s Narrative","k":"Chapter","sum":"Lanyon describes watching Hyde transform into Jekyll.","quotes":[{"q":"O God!","src":"Lanyon, Chapter 9","f":[["Language","Exclamation shows horror."],["Form and structure","Repeated cries."],["Perceptive reading","Faith shaken."],["Context","Religion versus science."],["Writer's intention","To show horror."]],"th":"Religion · Science · Horror"},{"q":"there before my eyes—pale and shaken, and half fainting, and groping before him with his hands, like a man restored from death—there stood Henry Jekyll!","src":"Lanyon, Chapter 9","f":[["Language","Simile ‘like a man restored from death’."],["Form and structure","Climactic reveal."],["Perceptive reading","Duality confirmed."],["Context","Darwin and science."],["Writer's intention","To reveal the truth."]],"th":"Duality · Science · Horror"},{"q":"my life is shaken to its roots","src":"Lanyon, Chapter 9","f":[["Language","Metaphor of uprooting."],["Form and structure","Reflection."],["Perceptive reading","Science destroyed his certainty."],["Context","Scientific rationalism."],["Writer's intention","To show impact."]],"th":"Science · Horror · Death"}]},{"n":"Chapter 10: Henry Jekyll’s Full Statement","k":"Chapter","sum":"Jekyll explains the experiment and his loss of control.","quotes":[{"q":"man is not truly one, but truly two","src":"Jekyll, Chapter 10","f":[["Language","Antithesis of one and two."],["Form and structure","Thesis of the novella."],["Perceptive reading","Duality of human nature."],["Context","Victorian repression."],["Writer's intention","To explore duality."]],"th":"Duality · Identity · Morality"},{"q":"Edward Hyde, alone in the ranks of mankind, was pure evil","src":"Jekyll, Chapter 10","f":[["Language","Absolute ‘pure evil’."],["Form and structure","Confession."],["Perceptive reading","Evil separated."],["Context","Christian morality."],["Writer's intention","To show evil within."]],"th":"Evil · Duality · Morality"},{"q":"I was slowly losing hold of my original and better self","src":"Jekyll, Chapter 10","f":[["Language","Loss of control."],["Form and structure","Confession."],["Perceptive reading","Evil grows stronger."],["Context","Addiction parallels."],["Writer's intention","To warn about repression."]],"th":"Duality · Control · Identity"}]}],"ctx9":[["Victorian respectability","Gentlemen were expected to hide desires and protect their reputation.","Jekyll creates Hyde to indulge desires that respectable society forced him to repress."],["Darwin and evolution","‘On the Origin of Species’ (1859) suggested humans evolved from animals.","Hyde’s ‘ape-like fury’ reflects Victorian fears that the beast within man could resurface."],["Duality in Edinburgh","Stevenson’s city had an elegant New Town and a squalid Old Town.","The contrast between Jekyll’s house and Hyde’s door mirrors the double face of Victorian cities."],["Science and religion","Scientific progress challenged religious belief.","Lanyon’s horror shows rational science unable to cope with Jekyll’s transcendental experiments."],["Gothic and crime","1880s readers loved sensational crime fiction and Gothic horror.","Stevenson’s fog bound London creates a Gothic atmosphere where evil hides in plain sight."],["Deacon Brodie","An Edinburgh councillor by day and burglar by night, hanged in 1788.","Brodie’s double life inspired Stevenson’s exploration of the hidden self."]],"voc":{"v":[["duality","having two sides or natures","Stevenson explores the duality of human nature through Jekyll and Hyde."],["repression","holding back feelings or desires","Victorian repression drives Jekyll to create Hyde."],["atavistic","reverting to a primitive state","Hyde is atavistic, described as ‘ape-like’."],["reputation","how others view your character","Utterson protects Jekyll’s reputation above the truth."],["degeneration","decline into a worse state","Fears of degeneration haunted Victorian society."],["respectability","being socially acceptable","Victorian respectability hides private vice."],["transgression","breaking a moral or social rule","Hyde allows Jekyll to enjoy transgression without guilt."],["enigmatic","mysterious","Hyde remains enigmatic, with ‘unexpressed deformity’."]],"m":[["L","Animal imagery","with ape-like fury","Hyde is linked to Darwinian fears of humanity’s primitive past.",1],["L","Pathetic fallacy","A great chocolate-coloured pall lowered over heaven","The dark fog mirrors the moral darkness of London.",1],["S","Multiple narrators","Utterson, Lanyon and Jekyll’s statement","Fragmented accounts create mystery and delay the truth.",0],["S","Withheld revelation","The truth comes in the final chapter","Delayed revelation creates suspense like a detective story.",0],["F","Gothic novella","Secrets, doubles and night time violence","Gothic conventions explore hidden evil in respectable London.",0],["F","Testimony","Henry Jekyll’s Full Statement","A confession form gives the final word to the guilty man.",0]]},"chron":[{"r":"Chapter 1: Story of the Door","m":"On a Sunday walk, Enfield tells Utterson how a man knocked down a young girl.","q":"the man trampled calmly over the child’s body","t1":["Juxtaposition","The violent verb ‘trampled’ sits beside the adverb ‘calmly’.","Hyde feels no guilt, panic or emotion.","The calmness is more disturbing than rage would be, suggesting cruelty is natural to him rather than a loss of control."],"t2":["Second hand narration","We hear the story through Enfield, not Hyde.","Distance surrounds Hyde with mystery.","Stevenson withholds direct access throughout the novella, so Hyde remains a figure of rumour and fear, like the hidden vices of respectable London."],"cx":"Victorian London had high levels of street crime and child poverty, yet respectable gentlemen preferred not to discuss scandal.","wi":"Stevenson introduces Hyde as casual, motiveless evil to unsettle his middle class readers."},{"r":"Chapter 2: Search for Mr Hyde","m":"Utterson, worried by Jekyll’s will, resolves to find Hyde.","q":"If he be Mr. Hyde,’ he had thought, ‘I shall be Mr. Seek.","t1":["Pun","‘Hyde’ and ‘Seek’ play on the children’s game of hide and seek.","The playful tone briefly lightens the mystery.","The pun reveals Hyde’s name as a clue: he is what Jekyll hides, so the hunt is really for Jekyll’s secret self."],"t2":["Detective conventions","Utterson becomes an amateur investigator.","The novella borrows from crime fiction, inviting readers to solve the case.","Yet the ‘solution’ is not a criminal but a theory of human nature, subverting the genre."],"cx":"Detective fiction was booming in the 1880s; Conan Doyle’s first Holmes story appeared in 1887, a year after this novella.","wi":"Stevenson draws readers into the investigation so the final revelation shocks them."},{"r":"Chapter 2: Search for Mr Hyde","m":"Utterson finally meets Hyde and is unable to explain his disgust.","q":"Something troglodytic, shall we say?","t1":["Scientific diction","‘troglodytic’ means like a primitive cave dweller.","Hyde appears less evolved than civilised men.","The word links Hyde to fears that humans could regress down the evolutionary ladder."],"t2":["Rhetorical question","Utterson hesitates, seeking the right word.","Even a lawyer’s precise language fails him.","Hyde exists beyond rational description, reflecting the Victorian discomfort with what cannot be categorised."],"cx":"Darwin’s ‘On the Origin of Species’ (1859) raised fears of atavism, the idea that people could revert to primitive states.","wi":"Stevenson taps into anxieties about evolution to make Hyde feel scientifically as well as morally threatening."},{"r":"Chapter 3: Dr Jekyll Was Quite at Ease","m":"At a dinner party Jekyll brushes off Utterson’s concerns.","q":"the moment I choose, I can be rid of Mr. Hyde","t1":["Dramatic irony","Jekyll claims full control.","Readers already suspect he is wrong.","His confidence becomes tragic hubris once we learn that Hyde grows stronger with each transformation."],"t2":["Modal certainty","‘I can be rid’ sounds absolute.","Jekyll presents addiction as a choice.","The phrasing echoes how people talk about vices they cannot quit, hinting at Hyde as an addiction."],"cx":"Victorian gentlemen were expected to show self control and moral restraint.","wi":"Stevenson uses irony to show the danger of believing we can control our darker desires."},{"r":"Chapter 4: The Carew Murder Case","m":"A maid at her window sees Hyde beat Sir Danvers Carew to death.","q":"with ape-like fury","t1":["Animal imagery","Hyde attacks like an ‘ape’.","He is presented as primitive and bestial.","The image links to Darwinian fears that civilisation is a thin layer over animal instinct."],"t2":["Compound adjective","‘ape-like’ fuses human and animal.","Hyde is not fully either.","Victim and attacker contrast: Carew is an ‘aged beautiful gentleman’, so civilisation itself appears attacked."],"cx":"Victorians feared that the ‘criminal type’ was a throwback to an earlier stage of evolution.","wi":"Stevenson makes the murder a symbolic attack on respectable society by its own hidden beast."},{"r":"Chapter 4: The Carew Murder Case","m":"Utterson travels through Soho with the police inspector.","q":"A great chocolate-coloured pall lowered over heaven","t1":["Pathetic fallacy","The thick fog darkens the city.","It mirrors the moral confusion surrounding Jekyll.","‘pall’ also means the cloth over a coffin, so the city itself seems to be in mourning or already dead."],"t2":["Gothic setting","Dark, foggy London creates menace.","The fog hides crime and secrets.","London becomes a double city, respectable streets beside squalid Soho, mirroring Jekyll and Hyde."],"cx":"London’s ‘pea souper’ fogs, caused by coal smoke, were notorious in the 1880s.","wi":"Stevenson uses setting to make the city a symbol of the hidden darkness in its citizens."},{"r":"Chapter 5: Incident of the Letter","m":"Jekyll, pale and ill, assures Utterson that Hyde is gone.","q":"I swear to God I will never set eyes on him again","t1":["Religious oath","Jekyll swears by God.","He seems desperate to be believed.","Invoking God for a promise he cannot keep makes his eventual collapse a moral as well as physical fall."],"t2":["Absolute adverb","‘never’ is total and final.","He is trying to convince himself as much as Utterson.","Readers who return to the chapter after the ending see the promise as tragic dramatic irony."],"cx":"Victorian respectability depended on reputation; scandal could ruin a gentleman.","wi":"Stevenson builds tension through promises the reader suspects will be broken."},{"r":"Chapter 6: Remarkable Incident of Dr Lanyon","m":"Lanyon, now dying, refuses to speak of Jekyll.","q":"I have had a shock… and I shall never recover","t1":["Short declarative clauses","The plain statement is final.","Lanyon is broken by what he has seen.","The rational scientist is destroyed by knowledge, suggesting some truths overwhelm reason."],"t2":["Withheld information","He will not say what the shock was.","Suspense builds as readers are kept in the dark.","The mystery is only solved in Chapter 9, so the delay drives the narrative forward."],"cx":"Victorian science was confident that reason could explain everything.","wi":"Stevenson shows the limits of rationalism when faced with the supernatural."},{"r":"Chapter 7: Incident at the Window","m":"Utterson and Enfield see Jekyll’s face change in horror at his window.","q":"an expression of such abject terror and despair","t1":["Emotive adjectives","‘abject terror’ conveys total fear.","Jekyll is losing control of his transformations.","The horror is internal: the enemy is within his own body."],"t2":["Interrupted scene","The window shuts suddenly.","Readers do not see the change.","Stevenson’s restraint makes the unseen more frightening than any description."],"cx":"Victorians were expected to hide emotion behind a respectable face.","wi":"Stevenson builds dread by showing respectability crack."},{"r":"Chapter 8: The Last Night","m":"Poole and Utterson break down the door of Jekyll’s cabinet.","q":"the body of a man sorely contorted and still twitching","t1":["Grotesque imagery","‘contorted’ and ‘twitching’ make the body grotesque.","Death is ugly and unnatural.","The body is Hyde’s, so the moment shows Jekyll’s experiment ending in the destruction of both selves."],"t2":["Climax","The break in ends the mystery’s suspense.","It is the physical climax of the plot.","Yet the truth still waits in documents, delaying full understanding to the final chapters."],"cx":"Suicide was considered a sin and a disgrace in Victorian society.","wi":"Stevenson shows the horrifying consequence of Jekyll’s transgression."},{"r":"Chapter 9: Dr Lanyon’s Narrative","m":"Lanyon describes watching Hyde transform into Jekyll.","q":"O God!","t1":["Exclamation","Lanyon’s cry is short and desperate.","He is overwhelmed with horror.","A man of science calls on God, showing his rational worldview has collapsed."],"t2":["Epistolary form","The chapter is Lanyon’s letter.","First hand testimony gives authority.","Multiple documents build a case like evidence in court."],"cx":"Victorians debated science and faith after Darwin.","wi":"Stevenson shows science’s limits."},{"r":"Chapter 10: Henry Jekyll’s Full Statement","m":"Jekyll explains his theory of human duality.","q":"man is not truly one, but truly two","t1":["Antithesis","‘one’ is set against ‘two’.","Every human has a divided nature.","Jekyll universalises his condition, implicating readers in the same duality."],"t2":["Repetition","‘truly’ is repeated for emphasis.","The confession sounds certain and scientific.","As the final chapter, it gives Jekyll the last word, yet his voice fades into Hyde’s."],"cx":"Victorian morality demanded strict repression of desires, encouraging double lives.","wi":"Stevenson warns that repressing human nature creates monsters."}]},{"id":"ge","title":"Great Expectations","author":"Dickens","kind":"19th century novel","paper":"Paper 1, Section B","col":"#33691E","ctx":[["Social class","Victorian society was rigidly divided; gentlemen did not work with their hands."],["Bildungsroman","A coming of age novel tracing Pip’s moral growth."],["Transportation","Convicts like Magwitch were sent to Australia."],["Serialisation","Published weekly in 1860 to 1861, with cliffhangers."],["Dickens","His father was imprisoned for debt; Dickens worked in a factory as a child."]],"groups":[{"n":"Pip","k":"Character","sum":"An orphan whose ambition to be a gentleman leads him to snobbery before he learns humility.","quotes":[{"q":"Heaven knows we need never be ashamed of our tears","src":"Pip, leaving the forge, Chapter 19","f":[["Language","Tears are presented as honest and cleansing."],["Form and structure","The older narrator reflects on his younger self."],["Perceptive reading","Shows the narrator’s mature wisdom."],["Context","Victorian men were expected to hide emotion."],["Writer's intention","To show Pip’s moral growth."]],"th":"Growth · Emotion · Home"},{"q":"the long chain of iron or gold, of thorns or flowers","src":"Pip, Chapter 9","f":[["Language","The metaphor shows one day shaping a whole life."],["Form and structure","Direct address to the reader."],["Perceptive reading","Pip’s choices bind him like chains."],["Context","Bildungsroman form."],["Writer's intention","To show how small moments change lives."]],"th":"Fate · Choice · Ambition"},{"q":"I saw no shadow of another parting from her","src":"Pip, final chapter","f":[["Language","Hopeful ending suggests reunion with Estella."],["Form and structure","The revised ending is ambiguous."],["Perceptive reading","Pip may be deceiving himself."],["Context","Dickens changed the ending on advice."],["Writer's intention","To leave readers with hope."]],"th":"Love · Hope · Change"}]},{"n":"Miss Havisham","k":"Character","sum":"A jilted bride who stopped her clocks and raised Estella for revenge.","quotes":[{"q":"the bride within the bridal dress had withered like the dress","src":"Pip, Chapter 8","f":[["Language","The simile links her body to decay."],["Form and structure","Gothic description of Satis House."],["Perceptive reading","Time has been frozen but not stopped."],["Context","Victorian Gothic tradition."],["Writer's intention","To show the destructive power of bitterness."]],"th":"Decay · Revenge · Time"},{"q":"Break their hearts my pride and hope, break their hearts and have no mercy!","src":"Miss Havisham to Estella, Chapter 12","f":[["Language","Imperatives show her cruel instructions."],["Form and structure","Repetition shows obsession."],["Perceptive reading","She uses Estella as a weapon."],["Context","Women had little power except through marriage."],["Writer's intention","To show revenge corrupting others."]],"th":"Revenge · Love · Power"},{"q":"What have I done! What have I done!","src":"Miss Havisham, Chapter 49","f":[["Language","Repetition shows remorse."],["Form and structure","Exclamations show breakdown."],["Perceptive reading","She finally understands her cruelty."],["Context","Christian ideas of repentance."],["Writer's intention","To show redemption is possible."]],"th":"Guilt · Redemption · Change"}]},{"n":"Joe Gargery","k":"Character","sum":"The kind, loyal blacksmith who represents true goodness.","quotes":[{"q":"ever the best of friends","src":"Joe to Pip, repeated","f":[["Language","Simple phrase shows loyalty."],["Form and structure","Repeated throughout the novel."],["Perceptive reading","Joe’s love never changes."],["Context","Working class virtue."],["Writer's intention","To show true friendship."]],"th":"Loyalty · Love · Class"},{"q":"Life is made of ever so many partings welded together","src":"Joe, Chapter 27","f":[["Language","Blacksmith metaphor shows simple wisdom."],["Form and structure","Spoken during an awkward visit."],["Perceptive reading","Joe understands more than Pip."],["Context","Dickens valued working class people."],["Writer's intention","To show Joe’s wisdom."]],"th":"Loyalty · Class · Growth"},{"q":"this gentle Christian man","src":"Pip about Joe, Chapter 57","f":[["Language","Pip recognises Joe’s goodness."],["Form and structure","Late in the novel."],["Perceptive reading","Shows Pip’s changed values."],["Context","Christian ideals."],["Writer's intention","To redefine a true gentleman."]],"th":"Class · Morality · Growth"}]},{"n":"Estella","k":"Character","sum":"A beautiful, cold young woman raised to break men’s hearts.","quotes":[{"q":"He calls the knaves Jacks, this boy!","src":"Estella, Chapter 8","f":[["Language","She mocks Pip’s working class language."],["Form and structure","Exclamation shows contempt."],["Perceptive reading","Makes Pip ashamed of his class."],["Context","Class snobbery."],["Writer's intention","To show class prejudice."]],"th":"Class · Shame · Pride"},{"q":"what coarse hands he has! And what thick boots!","src":"Estella, Chapter 8","f":[["Language","Focus on hands and boots shows class markers."],["Form and structure","Exclamations show scorn."],["Perceptive reading","Triggers Pip’s ambition."],["Context","Physical labour marked lower class."],["Writer's intention","To show class divisions."]],"th":"Class · Shame · Ambition"},{"q":"I have no heart","src":"Estella to Pip, Chapter 29","f":[["Language","She admits emotional emptiness."],["Form and structure","Blunt declaration."],["Perceptive reading","Raised to be cold by Miss Havisham."],["Context","Nurture versus nature."],["Writer's intention","To show damage caused by revenge."]],"th":"Love · Revenge · Identity"}]},{"n":"Magwitch","k":"Character","sum":"The convict who becomes Pip’s secret benefactor.","quotes":[{"q":"Keep still, you little devil, or I’ll cut your throat!","src":"Magwitch, Chapter 1","f":[["Language","Violent threat creates fear."],["Form and structure","Dramatic opening scene."],["Perceptive reading","First impressions deceive."],["Context","Fear of convicts."],["Writer's intention","To create a dramatic opening."]],"th":"Crime · Fear · Appearance"},{"q":"A fearful man, all in coarse grey, with a great iron on his leg","src":"Pip, Chapter 1","f":[["Language","Description shows him as a convict."],["Form and structure","Listing builds a frightening picture."],["Perceptive reading","Society defines him by his crime."],["Context","Convicts and the prison hulks."],["Writer's intention","To create sympathy later."]],"th":"Crime · Class · Appearance"},{"q":"I’m your second father. You’re my son","src":"Magwitch, Chapter 39","f":[["Language","He claims a fatherly bond."],["Form and structure","Shocking revelation."],["Perceptive reading","Pip’s wealth came from a convict."],["Context","Transportation to Australia."],["Writer's intention","To challenge class assumptions."]],"th":"Family · Class · Identity"}]},{"n":"Class and ambition","k":"Theme","sum":"Pip’s desire to rise in society brings shame and loss before wisdom.","quotes":[{"q":"I want to be a gentleman","src":"Pip to Biddy, Chapter 17","f":[["Language","Simple declaration of ambition."],["Form and structure","Shows his growing dissatisfaction."],["Perceptive reading","Ambition is linked to Estella."],["Context","Victorian class mobility."],["Writer's intention","To explore ambition."]],"th":"Ambition · Class · Identity"},{"q":"It is a most miserable thing to feel ashamed of home","src":"Pip, Chapter 14","f":[["Language","Superlative shows deep shame."],["Form and structure","Reflective narrator."],["Perceptive reading","Ambition destroys contentment."],["Context","Class aspiration."],["Writer's intention","To show the cost of snobbery."]],"th":"Class · Shame · Home"},{"q":"I had believed in the forge as the glowing road to manhood and independence","src":"Pip, Chapter 14","f":[["Language","Metaphor of the forge as a road shows lost hope."],["Form and structure","Contrasts past and present."],["Perceptive reading","Ambition has changed his values."],["Context","Working class pride."],["Writer's intention","To show changing values."]],"th":"Class · Ambition · Identity"}]}],"ctx9":[["Class and the gentleman","Victorian society was rigidly divided; gentlemen did not work with their hands.","Pip’s shame at his ‘coarse hands’ reveals how class prejudice is internalised."],["Bildungsroman","A coming of age novel tracing moral growth.","Pip’s journey from snobbery to humility shows that true gentility is moral, not social."],["Transportation","Convicts were transported to Australia.","Magwitch’s secret wealth from Australia challenges the idea that class determines worth."],["Serialisation","Published weekly in 1860 to 1861 with cliffhangers.","The dramatic revelations, such as Magwitch’s return, were designed to keep weekly readers hooked."],["Women and marriage","Women’s value was tied to marriage.","Miss Havisham’s jilting leaves her frozen in time, showing how Victorian women’s lives depended on marriage."],["Dickens’s life","His father was imprisoned for debt; he knew poverty first hand.","Dickens’s sympathy for Joe and Magwitch reflects his own understanding of hardship."]],"voc":{"v":[["aspiration","a strong desire to achieve something","Pip’s aspiration to be a gentleman leads him to reject Joe."],["snobbery","looking down on people of lower class","Pip’s snobbery after his fortune shows how wealth corrupts."],["benefactor","someone who gives money to help another","Pip assumes Miss Havisham is his benefactor."],["vengeance","punishment for a wrong","Miss Havisham uses Estella for vengeance on men."],["humility","modesty","Joe’s humility contrasts with Pip’s pride."],["penitent","sorry for wrongdoing","Miss Havisham ends penitent, begging forgiveness."],["stagnation","lack of change or growth","Satis House symbolises stagnation, with stopped clocks."],["bildungsroman","a novel about a character’s growth","Great Expectations is a bildungsroman tracing Pip’s moral growth."]],"m":[["L","Symbolism","the bride within the bridal dress had withered like the dress","Decay symbolises a life frozen by betrayal.",1],["L","Metaphor","Life is made of ever so many partings welded together","Joe’s blacksmith metaphor gives him simple wisdom.",1],["S","Three stages","Pip’s three stages of expectations","Each stage marks a change in Pip’s identity.",0],["S","Retrospective narration","Older Pip narrates his youth","Adult hindsight allows judgement of his younger self.",0],["F","Bildungsroman","Pip’s growth from child to man","The form traces his moral education.",0],["F","Serialisation","Published weekly in 1860 to 1861","Cliffhangers kept readers buying each instalment.",0]]},"chron":[{"r":"Chapter 1","m":"In the marshes churchyard, an escaped convict seizes Pip.","q":"Keep still, you little devil, or I’ll cut your throat!","t1":["Imperative and threat","Magwitch’s commands are violent and immediate.","The child is terrified and powerless.","The ‘little devil’ insult is ironic, since Magwitch will become Pip’s secret benefactor and ‘second father’."],"t2":["In medias res opening","The novel begins with sudden danger.","Readers are gripped from the first page.","This brief act of mercy by Pip sets the whole plot in motion, showing how small choices shape lives."],"cx":"Convicts were held in prison ships (hulks) on the Thames estuary before transportation to Australia.","wi":"Dickens creates a shocking opening that will later challenge readers’ assumptions about who is good and who is criminal."},{"r":"Chapter 8","m":"Pip first visits Satis House and sees Miss Havisham.","q":"the bride within the bridal dress had withered like the dress","t1":["Simile","Miss Havisham has ‘withered like the dress’.","She is decaying along with her wedding clothes.","The image fuses person and object, suggesting she has become a relic of the moment she was jilted."],"t2":["Gothic imagery","Stopped clocks, rotting cake and yellowed silk create a Gothic scene.","Time has been frozen.","Satis House symbolises a life ruined by refusing to move on from pain."],"cx":"Victorian women’s lives were defined by marriage; a jilted woman faced shame.","wi":"Dickens presents Miss Havisham as a warning about bitterness and revenge."},{"r":"Chapter 8","m":"Estella mocks Pip as they play cards.","q":"He calls the knaves Jacks, this boy!","t1":["Exclamation","Estella’s scorn is open.","She mocks his working class vocabulary.","The small detail awakens Pip’s shame about his class, which drives his ambition."],"t2":["Demonstrative ‘this boy’","She does not use his name.","Pip is dismissed as unimportant.","Her contempt was taught by Miss Havisham, making Estella a victim as well as a tormentor."],"cx":"Class was marked by speech and manners in Victorian society.","wi":"Dickens shows how class snobbery wounds and shapes identity."},{"r":"Chapter 14","m":"Pip reflects on his shame about the forge.","q":"It is a most miserable thing to feel ashamed of home","t1":["Superlative","‘most miserable’ shows deep regret.","The adult narrator judges his younger self.","The confession invites sympathy while condemning snobbery."],"t2":["Retrospective narration","Older Pip looks back.","Hindsight brings moral insight.","The bildungsroman structure traces his moral growth."],"cx":"Social mobility was growing, but class prejudice remained strong.","wi":"Dickens criticises snobbery through Pip’s regret."},{"r":"Chapter 27","m":"Joe visits Pip in London and feels awkward and out of place.","q":"Life is made of ever so many partings welded together","t1":["Extended metaphor","Joe pictures life as metal pieces ‘welded together’.","He draws on the language of his trade as a blacksmith.","The image suggests partings are not breaks but joins, so even sad separations make a life strong."],"t2":["Dialect and simple syntax","‘ever so many’ marks Joe’s plain, working class speech.","His humble style contrasts with Pip’s new London polish.","The wisdom in simple words exposes Pip’s snobbery: the uneducated man is the true gentleman."],"cx":"Victorian society equated gentility with wealth and manners rather than character.","wi":"Dickens challenges readers to value goodness over refinement and class."},{"r":"Chapter 39","m":"Magwitch returns from Australia and reveals he is Pip’s benefactor.","q":"I’m your second father. You’re my son","t1":["Familial metaphor","Magwitch claims a father’s role.","He sees Pip as the gentleman he has ‘made’ with his money.","The revelation destroys Pip’s fantasy that Miss Havisham chose him for Estella, exposing how shallow his ‘expectations’ were."],"t2":["Short declarative sentences","The simple statements are blunt and emotional.","Magwitch’s pride contrasts with Pip’s horror.","The reversal forces Pip to confront his own snobbery towards the man who loved him most."],"cx":"Transported convicts were forbidden to return to England on pain of death.","wi":"Dickens challenges readers’ prejudice against criminals and the poor by revealing the convict as Pip’s true benefactor."},{"r":"Chapter 49","m":"Miss Havisham, finally understanding her cruelty, begs Pip’s forgiveness.","q":"What have I done! What have I done!","t1":["Repetition","The exclamation is repeated twice.","She is overwhelmed by sudden self knowledge.","Recognising how she broke Estella’s heart as well as Pip’s marks her move from revenge to remorse."],"t2":["Exclamatory sentences","Her cries are desperate and broken.","The controlled, cold voice of earlier chapters collapses.","Soon afterwards her dress catches fire, as if the frozen past is finally destroyed."],"cx":"Victorian Christianity taught that genuine repentance could bring forgiveness.","wi":"Dickens shows that even the most bitter characters can recognise their wrongs, though too late to undo them."},{"r":"Chapter 59","m":"Years later, Pip meets Estella in the ruins of Satis House.","q":"I saw no shadow of another parting from her","t1":["Ambiguity","The final sentence can be read in two ways.","It may promise that they will never part again.","It may also mean Pip simply could not foresee a parting, so the happy ending is uncertain."],"t2":["Imagery of shadow","‘shadow’ suggests something dark or hidden.","The past still lingers over both characters.","Both have been reshaped by suffering, so any future is built on humility rather than expectation."],"cx":"Dickens changed his original, sadder ending after advice from the novelist Edward Bulwer Lytton.","wi":"Dickens leaves readers with a hopeful but ambiguous ending that rewards moral growth."}]},{"id":"je","title":"Jane Eyre","author":"Charlotte Brontë","kind":"19th century novel","paper":"Paper 1, Section B","col":"#4A148C","ctx":[["Women’s rights","Victorian women had few rights; governesses were neither servants nor gentry."],["Religion","Christianity shapes Jane’s moral choices."],["Gothic","The red room and Thornfield’s secrets create suspense."],["Mental illness","Asylums and attitudes to madness were harsh."],["Brontë","Published 1847 under the male pen name Currer Bell."]],"groups":[{"n":"Jane","k":"Character","sum":"A plain, passionate orphan who insists on equality and integrity.","quotes":[{"q":"Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?","src":"Jane to Rochester, Chapter 23","f":[["Language","The list of adjectives shows how society sees her."],["Form and structure","Rhetorical question demands respect."],["Perceptive reading","She asserts spiritual equality."],["Context","Class and gender inequality."],["Writer's intention","To argue for women’s equality."]],"th":"Gender · Class · Identity"},{"q":"Reader, I married him.","src":"Jane, Chapter 38","f":[["Language","Direct address to the reader."],["Form and structure","Short sentence shows certainty."],["Perceptive reading","Jane is the active subject, not the object."],["Context","Victorian marriage conventions."],["Writer's intention","To show Jane’s agency."]],"th":"Love · Gender · Independence"},{"q":"I resisted all the way","src":"Jane, Chapter 2","f":[["Language","She fights being taken to the red room."],["Form and structure","Opening chapters show defiance."],["Perceptive reading","Her rebellion begins in childhood."],["Context","Children were expected to obey."],["Writer's intention","To establish Jane’s spirit."]],"th":"Rebellion · Childhood · Identity"}]},{"n":"Rochester","k":"Character","sum":"Jane’s brooding employer whose secret threatens their love.","quotes":[{"q":"I sometimes have a queer feeling with regard to you","src":"Rochester to Jane, Chapter 23","f":[["Language","He describes a deep connection."],["Form and structure","Leads to his proposal."],["Perceptive reading","Their bond is spiritual."],["Context","Romantic ideals."],["Writer's intention","To show intense love."]],"th":"Love · Connection · Identity"},{"q":"my equal is here, and my likeness","src":"Rochester, Chapter 23","f":[["Language","He presents Jane as his equal."],["Form and structure","Part of the proposal scene."],["Perceptive reading","Equality makes their love unusual."],["Context","Class differences."],["Writer's intention","To present equal love."]],"th":"Love · Equality · Gender"},{"q":"Jane, you please me, and you master me","src":"Rochester, Chapter 24","f":[["Language","He admits Jane has power over him."],["Form and structure","Reversal of gender roles."],["Perceptive reading","Love creates equality."],["Context","Men usually held power."],["Writer's intention","To challenge gender roles."]],"th":"Love · Power · Gender"}]},{"n":"Bertha Mason","k":"Character","sum":"Rochester’s first wife, locked in the attic.","quotes":[{"q":"a figure ran backwards and forwards","src":"Jane, Chapter 26","f":[["Language","Bertha is reduced to a ‘figure’."],["Form and structure","Gothic reveal."],["Perceptive reading","Dehumanised by the narrative."],["Context","Treatment of mental illness."],["Writer's intention","To create horror."]],"th":"Gothic · Identity · Gender"},{"q":"it grovelled, seemingly, on all fours; it snatched and growled like some strange wild animal","src":"Jane, Chapter 26","f":[["Language","Animal imagery dehumanises Bertha."],["Form and structure","Gothic description."],["Perceptive reading","She may represent repressed female anger."],["Context","Colonial and racial prejudice."],["Writer's intention","To create horror and question it."]],"th":"Gothic · Gender · Prejudice"},{"q":"the clothed hyena","src":"Jane, Chapter 26","f":[["Language","Metaphor presents her as an animal."],["Form and structure","Short shocking image."],["Perceptive reading","Victorian attitudes to madness."],["Context","Asylum treatment."],["Writer's intention","To show Bertha as Jane’s dark double."]],"th":"Gothic · Identity · Gender"}]},{"n":"Gateshead","k":"Setting","sum":"Jane’s cruel childhood home with the Reeds.","quotes":[{"q":"Wicked and cruel boy!","src":"Jane to John Reed, Chapter 1","f":[["Language","Exclamation shows defiance."],["Form and structure","Early rebellion."],["Perceptive reading","Jane refuses injustice."],["Context","Children’s powerlessness."],["Writer's intention","To show Jane’s courage."]],"th":"Injustice · Childhood · Rebellion"},{"q":"You are less than a servant, for you do nothing for your keep","src":"Miss Abbot to Jane, Chapter 2","f":[["Language","Insult shows Jane’s low status."],["Form and structure","Harsh treatment."],["Perceptive reading","Jane is an outsider."],["Context","Class hierarchy."],["Writer's intention","To show injustice."]],"th":"Class · Childhood · Identity"},{"q":"I resisted all the way","src":"Jane, Chapter 2","f":[["Language","Physical resistance."],["Form and structure","First chapter conflict."],["Perceptive reading","Shows spirit."],["Context","Obedience expected."],["Writer's intention","To show rebellion."]],"th":"Rebellion · Childhood · Identity"}]},{"n":"St John Rivers","k":"Character","sum":"A cold, ambitious clergyman who wants Jane as a missionary wife.","quotes":[{"q":"you are formed for labour, not for love","src":"St John to Jane, Chapter 34","f":[["Language","He reduces Jane to usefulness."],["Form and structure","Proposal without love."],["Perceptive reading","Marriage as duty."],["Context","Missionary work in India."],["Writer's intention","To contrast with Rochester."]],"th":"Love · Duty · Gender"},{"q":"I am cold: no fervour infects me","src":"St John, Chapter 32","f":[["Language","He admits coldness."],["Form and structure","Self description."],["Perceptive reading","Duty replaces emotion."],["Context","Religious duty."],["Writer's intention","To show cold religion."]],"th":"Religion · Duty · Love"},{"q":"he is good and great, but severe","src":"Jane about St John","f":[["Language","Contrast of praise and severity."],["Form and structure","Balanced judgement."],["Perceptive reading","Goodness can be harsh."],["Context","Victorian religion."],["Writer's intention","To show complex faith."]],"th":"Religion · Duty · Love"}]},{"n":"Independence and gender","k":"Theme","sum":"Jane fights for equality and self respect.","quotes":[{"q":"I am no bird; and no net ensnares me","src":"Jane, Chapter 23","f":[["Language","Metaphor rejects being trapped."],["Form and structure","Bird imagery recurs."],["Perceptive reading","She asserts freedom."],["Context","Women’s limited rights."],["Writer's intention","To promote independence."]],"th":"Freedom · Gender · Identity"},{"q":"Women are supposed to be very calm generally: but women feel just as men feel","src":"Jane, Chapter 12","f":[["Language","Contrasts expectation and reality."],["Form and structure","Narrator’s direct argument."],["Perceptive reading","Women deserve the same opportunities."],["Context","Early feminism."],["Writer's intention","To argue for equality."]],"th":"Gender · Equality · Freedom"},{"q":"I care for myself","src":"Jane, Chapter 27","f":[["Language","Short declaration of self respect."],["Form and structure","Leaving Rochester."],["Perceptive reading","Integrity over love."],["Context","Christian morality."],["Writer's intention","To show Jane’s integrity."]],"th":"Identity · Morality · Independence"}]}],"ctx9":[["Women’s rights","Victorian women had few legal rights and limited careers.","Jane’s claim that ‘women feel just as men feel’ was a radical demand for equality in 1847."],["Governesses","Educated but poor, governesses belonged neither to the family nor the servants.","Jane’s ambiguous status at Thornfield reflects the isolation of Victorian governesses."],["Religion","Christianity shaped moral choices.","Jane’s refusal to become Rochester’s mistress shows her integrity and faith."],["Gothic","Secrets, madness and haunted houses created suspense.","The red room and Bertha’s attic use Gothic imagery to suggest repressed female rage."],["Mental illness and empire","Asylums were harsh; colonial attitudes shaped views of Creole women.","Bertha’s animalistic portrayal reflects Victorian prejudice about madness and race."],["Currer Bell","Brontë published under a male pen name.","Brontë’s use of a male pseudonym mirrors Jane’s own struggle to be heard as an equal."]],"voc":{"v":[["autonomy","independence and control over your life","Jane demands autonomy in a world that limits women."],["oppression","unjust treatment or control","Jane faces oppression at Gateshead and Lowood."],["integrity","being honest and having strong principles","Jane’s integrity leads her to leave Rochester."],["passionate","showing strong feeling","Jane’s passionate nature clashes with Victorian expectations."],["subordinate","lower in rank","As a governess, Jane is socially subordinate."],["confinement","being kept in a small space","Bertha’s confinement mirrors women’s restricted lives."],["egalitarian","believing all people are equal","Jane’s egalitarian demand to be Rochester’s equal is radical."],["austere","severe or strict","St John Rivers is austere and cold."]],"m":[["L","Bird imagery","I am no bird; and no net ensnares me","Jane rejects being caged, asserting her freedom.",1],["L","Animal imagery","the clothed hyena","Bertha is dehumanised, revealing Victorian fears about madness and race.",1],["S","Five settings","Gateshead, Lowood, Thornfield, Moor House, Ferndean","Each location marks a stage in Jane’s journey.",0],["S","Direct address","Reader, I married him.","Jane controls her own story and speaks to us as an equal.",1],["F","Bildungsroman","Jane’s growth from orphan to wife","The form traces her moral and emotional development.",0],["F","Gothic elements","The red room and the mysterious laugh","Gothic fear expresses Jane’s repressed feelings.",0]]},"chron":[{"r":"Chapter 1","m":"Ten year old Jane is attacked by her cousin John Reed and fights back.","q":"Wicked and cruel boy!","t1":["Exclamatory insult","Jane’s outburst names John’s cruelty directly.","A child who was expected to be silent and grateful speaks back.","The first spark of rebellion establishes her lifelong refusal to accept injustice, the quality that defines the novel."],"t2":["Adjectives of moral judgement","‘Wicked’ and ‘cruel’ are strong moral words.","Jane judges the powerful by moral rather than social standards.","Her moral confidence foreshadows how she will later judge Rochester and St John by the same principles."],"cx":"Orphans and poor relations had no rights and were expected to show gratitude and obedience.","wi":"Brontë makes readers sympathise with a rebellious child, challenging Victorian ideals of submissive girlhood."},{"r":"Chapter 2","m":"Jane is dragged to the red room as punishment.","q":"I resisted all the way","t1":["First person retrospective voice","Adult Jane recalls her childhood resistance.","The plain declarative sounds proud rather than ashamed.","The phrase becomes a motto for her whole life, as she resists every attempt to control her."],"t2":["Verb choice","‘resisted’ suggests active struggle, not passive suffering.","Jane is presented as a fighter.","The physical struggle mirrors the psychological struggles to come at Lowood, Thornfield and Moor House."],"cx":"Victorian girls were taught that meekness and self denial were feminine virtues.","wi":"Brontë presents resistance as admirable, encouraging readers to value female strength."},{"r":"Chapter 12","m":"Restless at Thornfield, Jane reflects on women’s lives.","q":"Women are supposed to be very calm generally: but women feel just as men feel","t1":["Contrast","‘supposed to be’ is set against what women truly ‘feel’.","Society’s expectations clash with women’s real emotions.","The conjunction ‘but’ turns the sentence into an argument, giving the novel a political edge."],"t2":["Generalisation","Jane speaks for all women, not just herself.","Her personal story becomes a wider statement.","The voice of a governess, a woman with little status, challenges the gender order directly."],"cx":"Victorian ideology of separate spheres confined women to the home and quiet domestic duties.","wi":"Brontë uses Jane’s voice to argue for women’s emotional and intellectual equality."},{"r":"Chapter 23","m":"Believing Rochester will marry Blanche, Jane declares her worth.","q":"Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?","t1":["Rhetorical question","Jane challenges Rochester directly.","She demands recognition of her inner worth.","The question exposes the assumption that status and beauty determine value."],"t2":["Asyndetic list","‘poor, obscure, plain, and little’ lists society’s judgements.","Each adjective names a reason she is overlooked.","The list builds to ‘soulless and heartless’, turning society’s labels into an accusation."],"cx":"Governesses occupied an awkward place, neither servant nor family, and were often treated as invisible.","wi":"Brontë insists on the equal soul of every person regardless of class, beauty or gender."},{"r":"Chapter 26","m":"On the wedding day, Rochester reveals his wife Bertha in the attic.","q":"it grovelled, seemingly, on all fours; it snatched and growled like some strange wild animal","t1":["Dehumanising pronoun","Bertha is called ‘it’, not ‘she’.","She is stripped of humanity and identity.","Modern readers see her as a silenced woman whose madness may have been produced by confinement and by Rochester himself."],"t2":["Animal imagery","‘grovelled’, ‘snatched’ and ‘growled’ make her bestial.","She embodies Victorian fears of madness and of the colonial ‘other’.","Bertha can be read as Jane’s double, the rage Jane must control, locked in the attic."],"cx":"Victorians often locked away the mentally ill; Bertha is a white Creole from Jamaica, reflecting colonial attitudes.","wi":"Brontë creates Gothic horror while raising uncomfortable questions about how women and outsiders are treated."},{"r":"Chapter 27","m":"Jane refuses to stay as Rochester’s mistress and leaves Thornfield.","q":"I care for myself","t1":["Monosyllables","Four simple words state her decision.","The plainness shows unshakeable resolve.","For a woman to put herself first was radical, making the line a declaration of independence."],"t2":["Reflexive pronoun","‘myself’ places Jane at the centre.","She values self respect over love.","Her choice proves her integrity, so her eventual marriage will be between equals."],"cx":"A woman living as a mistress would lose all respectability and legal protection.","wi":"Brontë shows that self respect matters more than romance, a bold message for Victorian women."},{"r":"Chapter 34","m":"St John Rivers proposes a loveless missionary marriage.","q":"you are formed for labour, not for love","t1":["Antithesis and alliteration","‘labour’ and ‘love’ are set against each other.","St John sees Jane as a useful tool, not a person.","The alliteration makes his judgement sound neat and final, yet Jane rejects its cold logic."],"t2":["Passive verb ‘formed’","Jane is something shaped for a purpose.","He denies her own choice.","His religious authority is another form of control, as dangerous as Rochester’s passion."],"cx":"Victorian missionaries spread Christianity across the Empire, often expecting wives to serve.","wi":"Brontë shows that duty without love is another kind of imprisonment."},{"r":"Chapter 38","m":"Jane marries the blind, humbled Rochester.","q":"Reader, I married him.","t1":["Direct address","Jane speaks straight to the reader.","She claims ownership of her story.","The active ‘I married him’ makes her the subject of the sentence, reversing the usual ‘he married her’."],"t2":["Short declarative","The sentence is simple and final.","It closes the romance with quiet confidence.","The brevity reflects the calm equality she has finally achieved."],"cx":"Victorian marriage made women legally subordinate to their husbands.","wi":"Brontë gives her heroine the final word, presenting marriage as a choice between equals."}]},{"id":"pp","title":"Pride and Prejudice","author":"Jane Austen","kind":"19th century novel","paper":"Paper 1, Section B","col":"#AD1457","ctx":[["Marriage","For women, marriage was economic security."],["Entailment","Longbourn will pass to Mr Collins, not the Bennet daughters."],["Class","Landed gentry and aristocracy held status and wealth."],["Regency era","Published 1813; manners and reputation mattered."],["Austen","Never married; wrote with irony about marriage."]],"groups":[{"n":"Elizabeth Bennet","k":"Character","sum":"A witty, independent heroine who learns to overcome prejudice.","quotes":[{"q":"I could easily forgive his pride, if he had not mortified mine","src":"Elizabeth, Chapter 5","f":[["Language","She admits wounded pride."],["Form and structure","Witty balance."],["Perceptive reading","Her prejudice begins here."],["Context","Manners and reputation."],["Writer's intention","To show her own flaw."]],"th":"Pride · Prejudice · Identity"},{"q":"you were the last man in the world whom I could ever be prevailed on to marry","src":"Elizabeth to Darcy, Chapter 34","f":[["Language","Hyperbole rejects him."],["Form and structure","First proposal scene."],["Perceptive reading","Shows independence."],["Context","Women expected to accept wealthy men."],["Writer's intention","To challenge conventions."]],"th":"Marriage · Pride · Independence"},{"q":"Till this moment I never knew myself.","src":"Elizabeth, Chapter 36","f":[["Language","Self realisation."],["Form and structure","Turning point."],["Perceptive reading","She recognises her prejudice."],["Context","Moral growth."],["Writer's intention","To show change."]],"th":"Prejudice · Growth · Identity"}]},{"n":"Mr Darcy","k":"Character","sum":"A proud, wealthy gentleman who learns humility.","quotes":[{"q":"She is tolerable, but not handsome enough to tempt me","src":"Darcy, Chapter 3","f":[["Language","Insult shows pride."],["Form and structure","First impression."],["Perceptive reading","Pride creates prejudice."],["Context","Class pride."],["Writer's intention","To establish conflict."]],"th":"Pride · Class · Love"},{"q":"In vain I have struggled. It will not do.","src":"Darcy, Chapter 34","f":[["Language","Short sentences show emotion."],["Form and structure","Proposal opening."],["Perceptive reading","Love overcomes pride."],["Context","Class differences."],["Writer's intention","To show inner conflict."]],"th":"Love · Pride · Class"},{"q":"My good opinion once lost, is lost forever.","src":"Darcy, Chapter 11","f":[["Language","Repetition shows rigidity."],["Form and structure","Self description."],["Perceptive reading","He must learn flexibility."],["Context","Gentleman’s honour."],["Writer's intention","To show his flaw."]],"th":"Pride · Judgement · Change"}]},{"n":"Mrs Bennet","k":"Character","sum":"A silly, anxious mother determined to marry off her daughters.","quotes":[{"q":"The business of her life was to get her daughters married","src":"Narrator, Chapter 1","f":[["Language","‘business’ shows marriage as transaction."],["Form and structure","Ironic narration."],["Perceptive reading","Economic necessity."],["Context","Entailment."],["Writer's intention","To mock and explain her."]],"th":"Marriage · Money · Family"},{"q":"You take
