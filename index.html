y the Taliban in 2012 for going to school, and to Owen’s First World War poetry.","Alluding to Malala Yousafzai and to Owen’s war poetry, Dharker presents a girl’s right to education as a battle worth fighting."],"voc":{"v":[["defiance","bold resistance","The girl’s defiance makes education a battle."],["resilience","the strength to recover","The ending celebrates resilience."]],"m":[["L","Metaphor","the school-bell is a call to battle","Education becomes a dangerous struggle.",1],["S","Turn to triumph","You cannot kill a book","The poem moves from violence to defiant hope.",1],["F","Allusion to war poetry","Echoes of Owen","Linking her to soldiers gives her heroism.",0]]}},{"n":"The Jewellery Maker","k":"Louisa Adjoa Parker","sum":"Parker is a British poet of Ghanaian and English heritage who writes about ordinary lives. The poem describes a craftsman making gold jewellery for others while his own life stays simple.","quotes":[{"q":"like his father before him, and his father too","src":"The Jewellery Maker, Louisa Adjoa Parker","f":[["Language","The repetition of ‘father’ shows skill passed down through generations."],["Form and structure","The rhythm of the line feels continuous, like the tradition itself."],["Perceptive reading","It may also suggest he is trapped in a cycle, his life shaped by inheritance rather than choice."],["Context","Traditional crafts are often family trades handed down over generations."],["Writer's intention","Parker honours the dignity of inherited skill."]],"th":"Heritage · Family · Work"},{"q":"neat as soldiers","src":"The Jewellery Maker, Louisa Adjoa Parker","f":[["Language","The simile shows the precision of his tools, laid out in disciplined rows."],["Form and structure","Military imagery contrasts with the gentle craft, adding dignity and seriousness."],["Perceptive reading","It may hint at the discipline and sacrifice of work, as if his labour is a daily battle."],["Context","Skilled manual work requires precision and long training."],["Writer's intention","Parker presents craftsmanship as worthy of respect."]],"th":"Work · Identity · Pride"},{"q":"warming the metal his hands caress","src":"The Jewellery Maker, Louisa Adjoa Parker","f":[["Language","‘caress’ suggests love and tenderness, showing his emotional connection to his work."],["Form and structure","The poem ends with this gentle image of touch, closing on his contentment."],["Perceptive reading","The love he gives to gold for wealthy buyers contrasts with his own family’s plain, simple jewellery, hinting at inequality."],["Context","Global trade means skilled workers often make luxury goods they cannot afford."],["Writer's intention","Parker shows the quiet beauty and unfairness in his life."]],"th":"Inequality · Love · Work"}],"pctx":["Parker is a British poet of Ghanaian and English heritage who writes about ordinary lives. The poem describes a craftsman making gold jewellery for others while his own life stays simple.","Parker honours the dignity of skilled manual work while hinting at the inequality between those who make luxury and those who own it."],"voc":{"v":[["craftsmanship","skill in making things by hand","Parker celebrates the jeweller’s craftsmanship."],["tradition","customs passed down","His skill is a family tradition."]],"m":[["L","Simile","neat as soldiers","Military imagery gives his tools dignity and order.",1],["S","Generations","like his father before him, and his father too","Repetition shows skill passing through time.",1],["F","Gentle ending","warming the metal his hands caress","The poem closes on tenderness and contentment.",1]]}},{"n":"With Birds You’re Never Lonely","k":"Raymond Antrobus","sum":"Antrobus is a British Jamaican poet who is Deaf. The poem moves from a noisy London café to a memory of a New Zealand forest and Māori wisdom about birds.","quotes":[{"q":"I can’t hear the barista / over the coffee machine.","src":"With Birds You’re Never Lonely, Raymond Antrobus","f":[["Language","The plain opening statement shows the frustration of noise for a Deaf person in a busy city."],["Form and structure","Starting in the present tense in a café, the poem later shifts to a forest, contrasting city and nature."],["Perceptive reading","Not hearing may symbolise disconnection from urban life as a whole."],["Context","Antrobus writes about Deaf identity and how hearing society often excludes Deaf people."],["Writer's intention","He invites readers into his sensory experience of the world."]],"th":"Identity · Place · Isolation"},{"q":"I was tuned / into a silence","src":"With Birds You’re Never Lonely, Raymond Antrobus","f":[["Language","‘tuned’ suggests careful listening, turning silence into something he chooses rather than lacks."],["Form and structure","The enjambment creates a pause, letting the silence enter the poem."],["Perceptive reading","It is followed by ‘that was not an absence’, reframing deafness as a different way of experiencing the world."],["Context","Deaf culture challenges the idea that deafness is simply a loss."],["Writer's intention","Antrobus presents silence as rich and meaningful."]],"th":"Identity · Nature · Connection"},{"q":"The forest spat all the birds back","src":"With Birds You’re Never Lonely, Raymond Antrobus","f":[["Language","The verb ‘spat’ personifies the forest as alive and energetic, suddenly bursting with sound."],["Form and structure","This moment marks a structural shift from silence to noise."],["Perceptive reading","It suggests nature is not passive but has a voice, linking to Māori belief in nature’s spirit."],["Context","Māori culture values deep connection with the natural world and ancestors."],["Writer's intention","Antrobus suggests that connection to nature can end loneliness."]],"th":"Nature · Belonging · Culture"}],"pctx":["Antrobus is a British Jamaican poet who is Deaf. The poem moves from a noisy London café to a memory of a New Zealand forest and Māori wisdom about birds.","Antrobus, who is Deaf, reframes silence as a rich experience rather than an absence, challenging assumptions of a hearing society."],"voc":{"v":[["perception","the way we notice the world","Antrobus challenges hearing perceptions of silence."],["affinity","a natural closeness","He feels an affinity with the birds."]],"m":[["L","Metaphor","I was tuned / into a silence","Silence becomes a chosen, rich experience.",1],["S","Shift in setting","From a café to a forest","The move contrasts city noise with natural peace.",0],["F","Free verse","Irregular lines","The open form suits a personal reflection.",0]]}},{"n":"A Portable Paradise","k":"Roger Robinson","sum":"Robinson is a British Trinidadian poet. His collection A Portable Paradise won the 2019 T. S. Eliot Prize and explores migration, racism and resilience.","quotes":[{"q":"white sands, green hills and fresh fish","src":"A Portable Paradise, Roger Robinson","f":[["Language","The list of sensory images describes a Caribbean paradise of beauty and abundance."],["Form and structure","The tricolon gives the memory a rhythmic, comforting quality."],["Perceptive reading","It is idealised, perhaps showing how memory transforms home into something perfect."],["Context","Many Caribbean migrants cherished memories of home while facing hardship in Britain."],["Writer's intention","Robinson celebrates the power of memory and heritage."]],"th":"Heritage · Place · Memory"},{"q":"carry it always / on my person","src":"A Portable Paradise, Roger Robinson","f":[["Language","The idea of carrying paradise suggests inner strength and comfort kept within."],["Form and structure","The enjambment separates ‘always’ from ‘on my person’, emphasising permanence."],["Perceptive reading","It may suggest paradise is a state of mind rather than a place, making it impossible to steal."],["Context","The advice comes from his grandmother, linking resilience to family wisdom."],["Writer's intention","Robinson encourages readers to find strength within themselves."]],"th":"Resilience · Identity · Family"},{"q":"like the fresh hope / of morning","src":"A Portable Paradise, Roger Robinson","f":[["Language","The simile links paradise to dawn, a symbol of new beginnings."],["Form and structure","The poem ends on hope, giving a positive resolution."],["Perceptive reading","It suggests resilience is renewed daily, despite ‘sustained and daily’ stresses."],["Context","Migrants and working class people often face daily pressures and discrimination."],["Writer's intention","Robinson leaves readers with optimism."]],"th":"Hope · Resilience · Belonging"}],"pctx":["Robinson is a British Trinidadian poet. His collection A Portable Paradise won the 2019 T. S. Eliot Prize and explores migration, racism and resilience.","Robinson, a British Trinidadian poet, presents memory and heritage as an inner refuge against the daily pressures migrants face."],"voc":{"v":[["sanctuary","a place of safety","Memory becomes a portable sanctuary."],["adversity","difficulty or hardship","The speaker carries paradise through adversity."]],"m":[["L","Sensory imagery","white sands, green hills and fresh fish","The tricolon creates a warm, abundant paradise.",1],["S","Hopeful ending","like the fresh hope / of morning","The poem resolves on hope.",1],["F","Instructional voice","carry it always / on my person","Advice passed down gives comfort and strength.",1]]}},{"n":"Like an Heiress","k":"Grace Nichols","sum":"Nichols was born in Guyana and moved to Britain in 1977. The poem describes returning to an Atlantic beach of her childhood, expecting treasure and finding rubbish.","quotes":[{"q":"lone / wave of rubbish","src":"Like an Heiress, Grace Nichols","f":[["Language","The ‘wave of rubbish’ is a shocking metaphor that turns the ocean’s beauty into waste."],["Form and structure","The enjambment isolates ‘lone’, emphasising emptiness and loss."],["Perceptive reading","‘wave’ suggests rubbish is now as natural to the sea as water, a disturbing reversal."],["Context","Plastic pollution in the oceans has become a global environmental crisis."],["Writer's intention","Nichols wants readers to confront the damage humans cause to nature."]],"th":"Nature · Environment · Loss"},{"q":"car tyres, plastic bottles, styrofoam cups","src":"Like an Heiress, Grace Nichols","f":[["Language","The list of man made objects contrasts with natural beauty."],["Form and structure","The asyndetic list piles up the rubbish, creating a sense of overwhelming waste."],["Perceptive reading","Everyday objects suggest everyone shares responsibility for pollution."],["Context","Consumer culture produces vast amounts of disposable plastic."],["Writer's intention","Nichols criticises modern consumerism."]],"th":"Environment · Responsibility · Place"},{"q":"the sun’s burning treasury","src":"Like an Heiress, Grace Nichols","f":[["Language","The metaphor presents the sun as a store of wealth, linking to the title ‘heiress’."],["Form and structure","The poem returns to images of treasure, contrasting what she hoped to inherit with what she found."],["Perceptive reading","‘burning’ may hint at climate change, the sun now a threat as well as a treasure."],["Context","Rising temperatures threaten Caribbean and coastal communities."],["Writer's intention","Nichols makes readers consider the planet future generations will inherit."]],"th":"Nature · Inheritance · The future"}],"pctx":["Nichols was born in Guyana and moved to Britain in 1977. The poem describes returning to an Atlantic beach of her childhood, expecting treasure and finding rubbish.","Returning to the beach of her Guyanese childhood, Nichols confronts plastic pollution and the damaged world future generations will inherit."],"voc":{"v":[["pollution","harmful waste in the environment","The beach is ruined by pollution."],["inheritance","what is passed down","The speaker inherits rubbish rather than treasure."]],"m":[["L","Asyndetic list","car tyres, plastic bottles, styrofoam cups","Piled up waste overwhelms the natural scene.",1],["S","Contrast of treasure and rubbish","the sun’s burning treasury","The poem contrasts what she hoped to inherit with what she found.",1],["F","Free verse with enjambment","lone / wave of rubbish","Isolated words emphasise loss.",1]]}},{"n":"Thirteen","k":"Caleb Femi","sum":"Femi is a British Nigerian poet who grew up in Peckham, South London. The poem describes a thirteen year old Black boy stopped by police and treated as a man.","quotes":[{"q":"the warmth of your teeth","src":"Thirteen, Caleb Femi","f":[["Language","The detail of ‘warmth’ shows the boy’s natural joy and innocence."],["Form and structure","This image comes early, before fear takes over, structurally contrasting innocence with threat."],["Perceptive reading","It suggests his smile is a sign of childhood that the police refuse to see."],["Context","Young Black boys are disproportionately stopped and searched by police in the UK."],["Writer's intention","Femi shows the humanity of the boy."]],"th":"Childhood · Identity · Innocence"},{"q":"fear condenses on your lips","src":"Thirteen, Caleb Femi","f":[["Language","‘condenses’ suggests fear turning physical, like breath on a cold window."],["Form and structure","The second person ‘you’ draws the reader into the boy’s experience."],["Perceptive reading","It suggests fear silences him, taking away his voice."],["Context","Stop and search can leave young people feeling powerless and criminalised."],["Writer's intention","Femi makes readers feel the injustice personally."]],"th":"Power and injustice · Race · Fear"},{"q":"black holes","src":"Thirteen, Caleb Femi","f":[["Language","The cosmic metaphor suggests young Black boys are ‘dying stars’, their potential collapsing."],["Form and structure","The poem ends on this image, leaving a bleak conclusion."],["Perceptive reading","Black holes are powerful, perhaps hinting at anger or energy that society cannot contain."],["Context","Racial profiling can damage young people’s sense of self and future."],["Writer's intention","Femi warns readers about the cost of injustice."]],"th":"Race · Injustice · Loss of childhood"}],"pctx":["Femi is a British Nigerian poet who grew up in Peckham, South London. The poem describes a thirteen year old Black boy stopped by police and treated as a man.","Femi, who grew up in Peckham, exposes how racial profiling robs young Black boys of their childhood."],"voc":{"v":[["injustice","unfair treatment","Femi exposes the injustice of racial profiling."],["innocence","childlike purity","The boy’s innocence is stolen."]],"m":[["L","Metaphor","black holes","Cosmic imagery suggests potential collapsing.",1],["S","Innocence to fear","the warmth of your teeth","Early warmth contrasts with later fear.",1],["F","Second person","fear condenses on your lips","‘your’ forces the reader into the boy’s experience.",1]]}}],"ctx9":[["Romantic and Victorian poets","Wordsworth, Shelley, Brontë and Eliot write about nature, power and the city.","The pre 1914 poems show early concerns about industry, power and human cruelty."],["Migration","Windrush and South Asian migration shaped modern Britain.","Berry and Mundair explore how migrants were seen as outsiders."],["Identity and language","Accents, names and heritage shape who we are.","Homing and Name Journeys present language as a key part of identity."],["Power and injustice","Monarchy, colonialism, racism and police power.","Shelley and Femi, centuries apart, both expose those in power failing the people."],["Environment","Pollution and climate change.","Like an Heiress warns about the planet future generations will inherit."],["Comparison","Compare a named poem with one other.","Grade 9 answers compare methods and context, not just ideas."]]}];
const UNSEEN = {"q1":[{"h":"Paragraph 1: rejecting how others see her","p":[["P","Angelou presents the speaker’s attitude to growing old as one of quiet frustration at the way other people see the elderly, insisting that she has an inner life that others ignore."],["E","She imagines others seeing her ‘sitting quietly, / Like a sack left on the shelf,’."],["T","Angelou uses a simile combined with alliteration in ‘sack’ and ‘shelf’."],["A","The simile suggests that society treats old people like objects: shapeless, useless and put away out of sight. The noun ‘sack’ connotes something heavy, dull and without value, while ‘left on the shelf’ implies being forgotten or abandoned. The hissing sibilance may even hint at the speaker’s irritation at being judged so unfairly."],["W","Angelou may intend to make readers confront the dismissive way they think about older people."],["L","Therefore, the speaker’s attitude begins with a rejection of the role society gives her."],["E","This develops when she explains, ‘I’m listening to myself.’"],["T","Angelou uses a short, simple declarative sentence in the first person."],["A","This suggests that her silence is not emptiness but reflection; she is thoughtful and self sufficient. The reflexive pronoun ‘myself’ implies independence, as if she is her own best company. Alternatively, it could suggest that age has given her wisdom and a deeper understanding of herself."],["W","Angelou wants the reader to see that older people still have rich inner lives."],["L","Overall, the speaker presents growing old as something that others misunderstand rather than something to be pitied."]]},{"h":"Paragraph 2: proud defiance","p":[["P","Angelou also presents the speaker’s attitude as defiant and proud, as she refuses to be pitied."],["E","She commands, ‘Hold! Stop! Don’t pity me!’"],["T","Angelou uses a series of exclamatory imperatives, repeated in the following line."],["A","The short, forceful commands create a sharp, urgent rhythm, suggesting that the speaker is fierce and full of energy, far from the passive ‘sack’ others imagine. The repetition of ‘Hold! Stop!’ shows how strongly she rejects sympathy, as if she is physically holding back other people’s pity. Perhaps the exclamation marks also convey anger that she has to defend her dignity at all."],["W","Angelou may intend to challenge the idea that the elderly should be grateful for pity."],["L","Therefore, the speaker’s attitude to growing old is one of strength and pride."],["E","This defiance is reinforced when she asks only one favour: ‘Don’t bring me no rocking chair.’"],["T","Angelou uses informal language, including a double negative, and the symbol of the rocking chair."],["A","The rocking chair is a familiar symbol of old age, inactivity and giving up, so rejecting it suggests that she refuses to retire from life. The conversational double negative ‘Don’t… no’ creates a warm, humorous voice, implying that she faces age with good humour as well as determination."],["W","Angelou wants the reader to admire the speaker’s spirit and refusal to accept stereotypes."],["L","Overall, the speaker’s attitude is one of humorous but firm resistance to the expectations placed on the old."]]},{"h":"Paragraph 3: acceptance and gratitude","p":[["P","Finally, Angelou presents the speaker as accepting the physical effects of ageing with honesty, humour and gratitude."],["E","She admits she has ‘A little less hair, a little less chin, / A lot less lungs and much less wind.’"],["T","Angelou uses a list with repetition of ‘less’ and rhyme."],["A","The repeated ‘less’ acknowledges her physical decline openly, yet the light, rhythmic rhyme of ‘chin’ and ‘wind’ makes it sound playful rather than tragic. This suggests that she accepts the losses of age without self pity; the comic image of ‘less chin’ even invites the reader to laugh with her."],["W","Angelou may intend to show that ageing can be faced honestly and cheerfully."],["L","Therefore, the speaker’s attitude is one of realistic acceptance."],["E","This leads to the final line, ‘But ain’t I lucky I can still breathe in.’"],["T","Angelou uses the conjunction ‘But’ to create a volta, ending on a rhetorical question without a question mark."],["A","The conjunction ‘But’ turns the poem from loss to celebration, suggesting that being alive matters more than anything she has lost. The adjective ‘lucky’ conveys gratitude, and the simple act of breathing becomes a symbol of life itself. The colloquial ‘ain’t’ keeps her voice warm and genuine to the very end."],["W","Angelou wants the reader to finish the poem uplifted, valuing life at every age."],["L","Overall, the speaker’s attitude to growing old moves from frustration to pride and finally to joyful gratitude."]]}],"q2":[{"h":"Paragraph 1: perspective and voice","p":[["P","Both poets present attitudes to the effects of growing old, but while Angelou’s speaker describes her own ageing with defiance, Williams’s speaker observes her grandmother’s age with tenderness and wonder."],["E","In ‘On Aging’, the speaker insists, ‘I’m the same person I was back then,’."],["T","Angelou uses a first person, conversational voice."],["A","This suggests that age has not changed who she is inside, and the direct voice makes her sound confident and in control of her own story."],["W","Angelou wants readers to see the person behind the ageing body."],["L","Therefore, Angelou presents age from the inside, as an experience the speaker owns."],["E","In contrast, ‘Jessie Emily Schofield’ ends with ‘My mother’s mother under my hands.’"],["T","Williams uses a third person portrait seen through the grandchild’s eyes, ending on a single, simple line."],["A","The phrase ‘My mother’s mother’ emphasises the chain of generations, suggesting love and connection, while ‘under my hands’ shows the grandchild now caring for the woman who once cared for others."],["W","Williams wants the reader to feel the tenderness of caring for an elderly relative."],["L","Overall, Angelou presents ageing as a personal challenge to be faced proudly, whereas Williams presents it as a gentle reversal of roles within a family."]]},{"h":"Paragraph 2: images of frailty","p":[["P","Both poets use physical imagery to present the frailty of age, but with very different effects."],["E","Angelou’s speaker admits, ‘When my bones are stiff and aching, / And my feet won’t climb the stair,’."],["T","Angelou uses concrete physical detail followed by a request that rejects pity."],["A","The adjectives ‘stiff and aching’ acknowledge pain honestly, yet she immediately refuses the rocking chair, suggesting that physical weakness will not defeat her spirit."],["W","Angelou wants readers to separate physical decline from personal worth."],["L","Therefore, Angelou presents frailty as something to be resisted."],["E","In contrast, Williams describes how her grandmother’s ‘wet head felt delicate as a birdskull’."],["T","Williams uses a simile drawn from nature."],["A","The simile presents fragility as something beautiful and precious rather than shameful, and the earlier image of her walking ‘Like a learning child’ suggests that old age brings people full circle, back to the vulnerability of childhood."],["W","Williams wants the reader to respond to age with gentleness and awe."],["L","Overall, both poets acknowledge the body’s decline, but Angelou meets it with defiance, while Williams meets it with tenderness."]]}]};

function bump(q, ok){ P.m[q.id] = Math.max(0, Math.min(3, (P.m[q.id]||0) + (ok?1:-1))); save(); totals(); }
function startGame(kind){
  const pool = shuffle(scopeQuotes());
  if (kind === "ctx" && !pool.some((q)=>fieldOf(q,/Context/))) { $("#stagebox").innerHTML = `<div class="stage empty">No context notes for this selection.</div>`; return; }
  const n = Math.min(10, pool.length); let i = 0, score = 0;
  const box = $("#stagebox");
  box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  const next = () => { if (i >= n) return done(); const q = pool[i++]; ({flash, gap, order, who, match, ctx})[kind](q); };
  const head = (title) => `<div class="top"><span><b style="color:var(--ink)">${title}</b></span><span>Question ${i} of ${n} · Score ${score}</span></div>`;
  const done = () => { box.innerHTML = `<div class="stage"><h2>Round complete</h2><p class="lede">You scored ${score} out of ${n}. Quotations you got right move towards ‘learnt’.</p><div class="row" style="margin-top:14px"><button class="btn primary" id="again">Play again</button><button class="btn" id="back">Choose another game</button></div></div>`; $("#again").onclick=()=>startGame(kind); $("#back").onclick=games; };
  const nextBtn = () => `<div class="row" style="margin-top:16px"><button class="btn primary" id="nx">${i>=n?"See score":"Next"}</button></div>`;
  const mc = (q, title, prompt, options, correct) => {
    box.innerHTML = `<div class="stage">${head(title)}${prompt}<div class="opts">${options.map((o,ix)=>`<button class="opt" data-i="${ix}">${o}</button>`).join("")}</div><div id="fb"></div></div>`;
    box.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      const ok = +b.dataset.i === correct; if (ok) score++; bump(q, ok);
      box.querySelectorAll(".opt").forEach((x,ix)=>{ x.disabled = true; if (ix===correct) x.classList.add("right"); else if (x===b) x.classList.add("wrong"); });
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"Not quite. The right answer is highlighted."}</p>${nextBtn()}`; $("#nx").onclick = next;
    });
  };
  const distract = (q, fn, k=3) => shuffle(cur.t.all.filter((x)=>x!==q && fn(x) && fn(x)!==fn(q))).reduce((a,x)=>{ if(a.length<k && !a.includes(fn(x))) a.push(fn(x)); return a; },[]);

  function flash(q){
    box.innerHTML = `<div class="stage">${head("Flashcards")}<div class="q">${esc(q.q)}</div><div class="src">${esc(q.src)}</div><p class="small">Say the analysis out loud, then flip.</p><div class="row"><button class="btn hl" id="flip">Flip card</button></div><div id="back"></div></div>`;
    $("#flip").onclick = () => { $("#flip").remove(); $("#back").innerHTML = `<div class="fields">${q.f.map(([l,x])=>`<div class="field"><b>${esc(l)}</b><p>${esc(x)}</p></div>`).join("")}</div><div class="row" style="margin-top:16px"><button class="btn primary" id="k1">I knew it</button><button class="btn" id="k0">Still learning</button></div>`;
      $("#k1").onclick = () => { score++; bump(q,true); next(); }; $("#k0").onclick = () => { bump(q,false); next(); }; };
  }
  function gap(q){
    const words = q.q.split(/\s+/);
    const stop = new Set(["the","and","that","with","from","this","have","they","their","them","your","what","which","when","will","into","then","than","were","been","shall","there"]);
    const cand = words.map((w,ix)=>[norm(w),ix]).filter(([w])=>w.length>=4 && !stop.has(w));
    const pickN = Math.min(words.length > 9 ? 2 : 1, cand.length || 1);
    const hide = shuffle(cand.length ? cand : words.map((w,ix)=>[norm(w),ix])).slice(0,pickN).map(([,ix])=>ix).sort((a,b)=>a-b);
    const shown = words.map((w,ix)=> hide.includes(ix) ? `<span class="blank">${esc(w)}</span>` : esc(w)).join(" ");
    box.innerHTML = `<div class="stage">${head("Fill the gap")}<div class="q">${shown}</div><div class="src">${esc(q.src)}</div>
      <div class="row" style="margin-top:14px">${hide.map((ix,k)=>`<input type="text" id="g${k}" autocomplete="off" aria-label="Missing word ${k+1}" placeholder="Word ${k+1}">`).join("")}<button class="btn primary" id="chk">Check</button><button class="btn" id="hint">Hint</button></div><div id="fb"></div></div>`;
    const first = $("#g0"); first && first.focus({preventScroll:true});
    $("#hint").onclick = () => { hide.forEach((ix,k)=>{ const el=$("#g"+k); if(!el.value) el.placeholder = words[ix].replace(/[^A-Za-z’']/g,"").slice(0,2) + "…"; }); };
    const check = () => {
      const ok = hide.every((ix,k)=> norm($("#g"+k).value) === norm(words[ix]));
      if (ok) score++; bump(q, ok);
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Word perfect.":"Not quite. The full quotation is:"}</p><div class="q" style="font-size:18px">${esc(q.q)}</div>${nextBtn()}`;
      $("#chk").disabled = true; $("#nx").onclick = next;
    };
    $("#chk").onclick = check;
    box.querySelectorAll("input").forEach((el)=> el.onkeydown = (e)=>{ if(e.key==="Enter" && !$("#chk").disabled) check(); });
  }
  function order(q){
    const words = q.q.replace(/ \/ /g," / ").split(/\s+/).filter((w)=>w!=="/");
    if (words.length < 3) return gap(q);
    const tiles = shuffle(words.map((w,ix)=>({w,ix})));
    let built = [];
    box.innerHTML = `<div class="stage">${head("Rebuild the quote")}<div class="src">${esc(q.src)}</div><div class="built" id="built" aria-live="polite"></div><div class="tiles" id="tiles">${tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.w)}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" id="undo">Undo</button></div><div id="fb"></div></div>`;
    const draw = () => { $("#built").textContent = built.map((k)=>tiles[k].w).join(" "); box.querySelectorAll(".tile").forEach((b)=>b.classList.toggle("used", built.includes(+b.dataset.k))); };
    box.querySelectorAll(".tile").forEach((b)=> b.onclick = () => { built.push(+b.dataset.k); draw(); if (built.length === words.length) {
      const ok = built.map((k)=>norm(tiles[k].w)).join(" ") === words.map(norm).join(" ");
      if (ok) score++; bump(q, ok); $("#undo").disabled = true;
      $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Perfect order.":"Not quite. It should read:"}</p>${ok?"":`<div class="q" style="font-size:18px">${esc(q.q)}</div>`}${nextBtn()}`; $("#nx").onclick = next; } });
    $("#undo").onclick = () => { built.pop(); draw(); };
  }
  function who(q){
    const opts = shuffle([q.g.n, ...distract(q, (x)=>x.g.n)]);
    mc(q, isPoetry(cur.t) ? "Which poem?" : "Who or where?", `<div class="q">${esc(q.q)}</div>`, opts.map(esc), opts.indexOf(q.g.n));
  }
  function match(q){
    const a = fieldOf(q,/Language|Analysis|Layer 1/) || q.f[0][1];
    const opts = shuffle([q.q, ...distract(q,(x)=>x.q)]);
    mc(q, "Analysis match", `<p class="small">Which quotation does this analysis explain?</p><div class="panel" style="background:var(--paper)">${esc(a)}</div>`, opts.map((o)=>`<span class="q" style="font-size:18px">${esc(o)}</span>`), opts.indexOf(q.q));
  }
  function ctx(q){
    const c = fieldOf(q,/Context/); if (!c) return next();
    const opts = shuffle([c, ...distract(q,(x)=>fieldOf(x,/Context/))]);
    mc(q, "Context quiz", `<div class="q">${esc(q.q)}</div><div class="src">${esc(q.src)}</div><p class="small">Which context links best to this quotation?</p>`, opts.map(esc), opts.indexOf(c));
  }
  next();
}

// ---------- PETACWL ETACWL ----------
const STARTERS = {
  P:["[Writer] presents [character/theme] as…","At this point, [writer] portrays…","[Writer] explores the idea that…"],
  E:["This is shown when [character] says, ‘…’","[Writer] describes how ‘…’","This is evident in the line ‘…’"],
  T:["[Writer] uses the metaphor / simile / imperative / juxtaposition…","The technique of… is used here.","The structural choice of…"],
  A:["The word ‘…’ suggests…","This connotes… On a deeper level, …","Alternatively, this could imply…"],
  C:["This reflects the [era] belief that…","A [Victorian / Jacobean / 1945] audience would…","This links to [poet / writer]'s own life, as…"],
  W:["[Writer] intends to criticise / warn / celebrate…","[Writer] wants the reader to feel…","Ultimately, [writer]'s purpose is to…"],
  L:["Therefore, [character/theme] is presented as…","This links back to the question because…","This shows that…"],
};
const STARTERS2 = {
  E:["This idea is developed further when ‘…’","Similarly, later in the text, ‘…’","In contrast, [writer] later writes ‘…’"],
  T:["Here, [writer] uses…","This time, the [technique] of…","The shift to… is significant because…"],
  A:["This deepens the idea because ‘…’ suggests…","Building on this, the word ‘…’ implies…","A more perceptive reading is that…"],
  C:["This would resonate with [audience] because…","This reflects [context] further, as…","Historically, …"],
  W:["Through this, [writer] reinforces the message that…","[Writer] therefore warns / urges…","[Writer]'s purpose here is to…"],
  L:["Overall, [character/theme] is presented as…","Ultimately, this answers the question because…","This builds to the conclusion that…"],
};
const writerOf = (t, q) => isPoetry(t) ? q.src.split(", ").slice(-1)[0] : t.id === "tt" ? q.g.k : t.author;
const gname = (g) => { const n = g.n.replace(/^Chapter \d+: /,""); return g.k === "Theme" ? n.toLowerCase() : n; };
function partner(q){
  const t = cur.t, tags = (q.th||"").split(" · ").filter(Boolean);
  const same = q.g.quotes.filter((x)=>x!==q);
  const other = t.all.filter((x)=>x.g!==q.g && tags.some((tg)=>(x.th||"").includes(tg)));
  return same.length ? same[Math.floor(Math.random()*same.length)] : other[0] || t.all.find((x)=>x!==q);
}
function chain(t, q, first, name){
  const nmc = t.id === "tt" ? `the characters in ‘${name}’` : name;
  const writer = writerOf(t, q);
  const lang = fieldOf(q,/Language|Analysis|Layer 1/) || "", fs = fieldOf(q,/Form|Structure|Layer 2|Method/) || "", alt = fieldOf(q,/Perceptive|Layer 3|In short/) || "", c = fieldOf(q,/Context/) || "", w = fieldOf(q,/intention/i) || "";
  const pill = (k) => `<span class="pill" style="background:${STEP_COL[k]}">${k}</span>`;
  return `${first ? `${pill("P")}${esc(writer)} presents ${esc(nmc)} in a way that reveals ${esc((q.th||"its key ideas").split(" · ").slice(0,2).join(" and ").toLowerCase())}. ` : ""}
    ${pill("E")}${first ? "This is shown in the line" : "This idea is developed further in the line"} ‘${esc(q.q)}’${first ? "" : ` (${esc(q.src)})`}.
    ${pill("T")}${esc(fs || "Name the method here.")}
    ${pill("A")}${esc(lang)} ${esc(alt)}
    ${c ? `${pill("C")}${esc(c)}` : ""}
    ${w ? `${pill("W")}${esc(w)}` : ""}
    ${pill("L")}${first ? `Therefore, ${esc(writer)} presents ${esc(nmc)} as…` : `Overall, ${esc(writer)} presents ${esc(nmc)} as… which answers the question because…`}`;
}
function petacwl(){
  const t = cur.t, pool = scopeQuotes(), q = pool[Math.floor(Math.random()*pool.length)], q2 = partner(q);
  const stepRow = (s, st, n) => `<div class="step"><span class="L" style="background:${STEP_COL[s]}">${s}</span><div class="body"><b>${STEP_NAME[s]}${n ? " (second quotation)" : ""}</b>${st[s].map((x)=>`<p class="small">${esc(x)}</p>`).join("")}</div></div>`;
  $("#pane").innerHTML = `
  <div class="panel"><h2>How to build a PETACWL ETACWL paragraph</h2>
    <p class="lede">Each paragraph has thirteen steps. Make your point and analyse your first quotation (PETACWL), then develop the same point with a second quotation (ETACWL). For unseen poetry, leave out both Cs.</p>
    <h3 style="margin-top:16px">Part 1: PETACWL, first quotation</h3>
    <div class="steps">${"PETACWL".split("").map((s)=>stepRow(s, STARTERS, false)).join("")}</div>
    <h3 style="margin-top:18px">Part 2: ETACWL, second quotation</h3>
    <div class="steps">${"ETACWL".split("").map((s)=>stepRow(s, STARTERS2, true)).join("")}</div>
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="row" style="justify-content:space-between"><h2>Worked example</h2><button class="btn" id="another">Another example</button></div>
    <p class="small">Built from: ${esc(q.g.n)}${q2.g!==q.g ? " and " + esc(q2.g.n) : ""}</p>
    <p class="para">${chain(t, q, true, gname(q.g))}</p>
    <p class="para">${chain(t, q2, false, gname(q.g))}</p>
    <p class="small">The ‘…’ after each Link is where you finish the sentence in your own words.</p>
  </div>`;
  $("#another").onclick = petacwl;
}

    const question = t.id === "tt" ? `How does ${g.k} present ideas about ${(themes[0]||"relationships").toLowerCase()} in ‘${name}’?` : isPoetry(t) ? `Compare how poets present ${(themes[0]||"conflict").toLowerCase()} in ‘${name}’ and in one other poem from ‘${t.title}’.` : g.k === "Theme" ? `How does ${t.author} present ideas about ${name.toLowerCase()} in ‘${t.title}’?` : `How does ${t.author} present ${name} in ‘${t.title}’?`;

          const a = fieldOf(qq,/Language|Analysis|Layer 1/)||"", f = fieldOf(qq,/Form|Structure|Layer 2|Method/)||"", c = fieldOf(qq,/Context/)||"", w = fieldOf(qq,/intention/i)||"";

          ${c?`<div class="step"><span class="L" style="background:${STEP_COL.C}">C</span><div class="body"><b>Context</b><p>${esc(c)}</p></div></div>`:""}

  const mCards = (rows) => `<div class="mgrid">${["L","S","F"].map((k)=>rows.filter((x)=>x[0]===k).map((x)=>`<div class="mcard" style="--mc:${MCOL[k]}"><span class="mk">${MNAME[k]}</span><h4>${esc(x[1])}</h4><p class="mex">${x[4] ? "" : "<span class=\"small\">Example: </span>"}${exq(x[2], x[4])}</p><p class="small" style="margin:6px 0 0">${esc(x[3])}</p></div>`).join("")).join("")}</div>`;
  const body = poetry
    ? gs.map((g)=> g.voc ? `<div class="panel" style="margin-top:14px"><div class="small">${esc(g.k)}</div><h2>${esc(g.n)}</h2><h3 style="margin-top:10px">Tier 2 vocabulary</h3>${vTable(g.voc.v)}<h3 style="margin-top:14px">Language, structure and form</h3>${mCards(g.voc.m)}</div>` : "").join("")
    : `<div class="panel" style="margin-top:14px"><h2>Grade 9 Tier 2 vocabulary</h2><p class="small">Use these words to sound precise and conceptual. Each sentence shows the word working in an essay.</p>${vTable(t.voc.v)}</div>
       <div class="panel" style="margin-top:14px"><h2>Language, structure and form</h2><p class="small">The methods that matter most in this text, with an example and its effect. Pink is language, green is structure, purple is form.</p>${mCards(t.voc.m)}</div>`;
  $("#pane").innerHTML = `<div class="panel"><h2>Practise</h2><p class="small">${v.length} words and ${m.length} methods${poetry && cur.scope==="all" ? " across every poem" : ""}. Use the Focus menu to practise one ${poetry ? "poem" : "text"} at a time.</p>
    <div class="games" style="margin-top:10px">${VDRILLS.map(([k,n,d])=>`<button class="game" data-k="${k}"><strong>${n}</strong><span class="small">${d}</span></button>`).join("")}</div></div>
    <div id="stagebox"></div>${body}`;
  $("#pane").querySelectorAll(".game").forEach((b)=> b.onclick = () => vocDrill(b.dataset.k));
}
function vocDrill(kind){
  const { v, m } = vocPools(cur.t);
  const items = kind[0] === "v" ? v : m;
  const qs = shuffle(items).slice(0, 10).map((it)=> makeQ(kind, it, items));
  drill($("#stagebox"), VDRILLS.find((x)=>x[0]===kind)[1], qs, () => vocDrill(kind));
}
function makeQ(kind, it, pool){
  const others = (fn) => shuffle([...new Set(pool.map(fn).filter((x)=>x!==fn(it)))]).slice(0,3);
  if (kind === "vquiz") { const opts = shuffle([it.w, ...others((x)=>x.w)]); return { type:"mc", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${esc(it.d)}</p><p class="small">Which word has this meaning?</p>`, options:opts, answer:it.w, reveal:it.s }; }
  if (kind === "vrecall") return { type:"type", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${esc(it.d)}</p><p class="small">Type the word. It starts with ‘${esc(it.w[0])}’ and has ${it.w.replace(/\s/g,"").length} letters.</p>`, answer:it.w, reveal:it.s };
  if (kind === "vgap") { const re = new RegExp("\\b" + reEsc(it.w) + "\\b", "i"); if (!re.test(it.s)) return makeQ("vrecall", it, pool);
    return { type:"type", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${esc(it.s).replace(new RegExp("\\b" + reEsc(esc(it.w)) + "\\b", "i"), '<span class="blank">______</span>')}</p><p class="small">Hint: ${esc(it.d)}</p>`, answer:it.w, reveal:it.s }; }
  if (kind === "mquiz") { const opts = shuffle([it.n, ...others((x)=>x.n)]); return { type:"mc", prompt:`<p class="small">${esc(it.src)}</p><p class="ex">${exq(it.e, it.iq)}</p><p>${esc(it.x)}</p><p class="small">Which ${MNAME[it.k].toLowerCase()} technique is this?</p>`, options:opts, answer:it.n, reveal:`${MNAME[it.k]}: ${it.n}` }; }
  if (kind === "mrecall") return { type:"flip", prompt:`<p class="small">${esc(it.src)} · ${MNAME[it.k]}</p><h3>${esc(it.n)}</h3><p class="ex">${exq(it.e, it.iq)}</p><p class="small">Explain the effect out loud, then check.</p>`, answer:it.x };
  return { type:"type", prompt:`<p class="small">${esc(it.src)} · ${MNAME[it.k]}</p><p style="font-size:19px;line-height:1.6">${it.iq ? `In ‘${esc(it.e)}’` : `In this example (${esc(it.e)})`}, the writer uses <span class="blank">______</span>. ${esc(it.x)}</p><p class="small">Hint: it starts with ‘${esc(it.n[0])}’.</p>`, answer:it.n, reveal:`${it.n}: ${it.x}` };
}
function drill(box, title, qs, again){
  let i = 0, score = 0;
  box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  const head = () => `<div class="top"><span><b style="color:var(--ink)">${esc(title)}</b></span><span>Question ${i} of ${qs.length} · Score ${score}</span></div>`;
  const nextBtn = () => `<div class="row" style="margin-top:16px"><button class="btn primary" id="nx">${i>=qs.length?"See score":"Next"}</button></div>`;
  const done = () => { box.innerHTML = `<div class="stage"><h2>Round complete</h2><p class="lede">You scored ${score} out of ${qs.length}.</p><div class="row" style="margin-top:14px"><button class="btn primary" id="again">Play again</button></div></div>`; $("#again").onclick = again; };
  const next = () => {
    if (i >= qs.length) return done(); const q = qs[i++];
    if (q.type === "mc") {
      box.innerHTML = `<div class="stage">${head()}${q.prompt}<div class="opts">${q.options.map((o,ix)=>`<button class="opt" data-i="${ix}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
      box.querySelectorAll(".opt").forEach((b)=> b.onclick = () => { const ok = q.options[+b.dataset.i] === q.answer; if (ok) score++;
        box.querySelectorAll(".opt").forEach((x,ix)=>{ x.disabled = true; if (q.options[ix]===q.answer) x.classList.add("right"); else if (x===b) x.classList.add("wrong"); });
        $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"Not quite. The right answer is highlighted."}</p>${q.reveal?`<p class="small">${esc(q.reveal)}</p>`:""}${nextBtn()}`; $("#nx").onclick = next; });
    } else if (q.type === "type") {
      box.innerHTML = `<div class="stage">${head()}${q.prompt}<div class="row" style="margin-top:12px"><input type="text" id="ans" autocomplete="off" aria-label="Your answer" placeholder="Type your answer"><button class="btn primary" id="chk">Check</button><button class="btn" id="show">Show answer</button></div><div id="fb"></div></div>`;
      const inp = $("#ans"); inp.focus({preventScroll:true});
      const fin = (ok) => { if (ok) score++; $("#chk").disabled = true; $("#show").disabled = true; inp.disabled = true;
        $("#fb").innerHTML = `<p class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"The answer is ‘"+esc(q.answer)+"’."}</p>${q.reveal?`<p class="small">${esc(q.reveal)}</p>`:""}${nextBtn()}`; $("#nx").onclick = next; };
      $("#chk").onclick = () => fin(loose(inp.value) === loose(q.answer));
      $("#show").onclick = () => fin(false);
      inp.onkeydown = (e) => { if (e.key === "Enter" && !$("#chk").disabled) $("#chk").click(); };
    } else {
      box.innerHTML = `<div class="stage">${head()}${q.prompt}<div class="row"><button class="btn hl" id="flip">Check the answer</button></div><div id="fb"></div></div>`;
      $("#flip").onclick = () => { $("#flip").remove(); $("#fb").innerHTML = `<div class="panel" style="background:var(--paper)">${esc(q.answer)}</div><div class="row" style="margin-top:16px"><button class="btn primary" id="k1">I knew it</button><button class="btn" id="k0">Still learning</button></div>`;
        $("#k1").onclick = () => { score++; next(); }; $("#k0").onclick = next; };
    }
  };
  next();
}

    : tab === "dgap" ? { type:"type", prompt:`<p style="font-size:19px;line-height:1.6"><span class="blank">______</span> is ${esc(x.d.charAt(0).toLowerCase()+x.d.slice(1))} For example, ${exq(x.e, x.iq)}${/[.!?’]$/.test(x.e) && x.iq ? '' : '.'}</p><p class="small">Hint: it starts with ‘${esc(x.n[0])}’.</p>`, answer:x.n, reveal:x.x }
    : { type:"mc", prompt:`<p class="small">Which device creates this effect?</p><p class="ex">${esc(x.x)}</p>`, options:opts(x), answer:x.n, reveal:`${x.n}: ${x.d}` });
  drill($("#stagebox"), DTABS.find((d)=>d[0]===tab)[1], qs, () => devicesView(tab));
}

 ["Enjambment","A sentence runs on over the end of a line without punctuation."],["Caesura","A pause in the middle of a line, usually created by punctuation."],

 ["Refrain","A line or phrase repeated throughout a poem."],["Rhyming couplet","Two consecutive lines that rhyme."],
