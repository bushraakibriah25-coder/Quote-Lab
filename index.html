itical reading turns the description back on respectable society, where polite surfaces hide private vice."]],"th":""},{"q":"A flash of odious joy","src":"The landlady hears Hyde is in trouble.","f":[["Method","Metaphor"],["Analysis","A ‘flash’ is quick and involuntary, the moment the polite mask slips. Nobody, it seems, has any loyalty to Hyde."],["Context","Victorians loved a scandal."],["In short","The mask slips for a second. Nobody is loyal to Hyde."],["Critical and conceptual reading","Hyde’s housekeeper shows ‘a flash of odious joy’ at the prospect of his arrest. Conceptually, cruelty and pleasure are linked even in minor characters. A critical reading suggests that the darker impulses Hyde represents are present throughout society."]],"th":""},{"q":"he had never been photographed","src":"The police try to trace Hyde.","f":[["Method","Plot detail"],["Analysis","Hyde slips past the newest tool for catching criminals. He has no family, few acquaintances and no picture, so he barely exists on paper."],["Context","Victorian police were beginning to photograph criminals."],["In short","No photo, no family, few friends. Hyde slips past modern detection."],["Critical and conceptual reading","Hyde has ‘never been photographed’, so he cannot be identified. Conceptually, he exists outside the systems that record and control people. A critical reading sees him as the elusive, unrecorded self that modern society cannot capture."]],"th":""},{"q":"the haunting sense of unexpressed deformity","src":"Witnesses try to describe Hyde.","f":[["Method","Abstract nouns"],["Analysis","Nobody agrees on what Hyde looks like; they only share a feeling. ‘Unexpressed’ suggests evil that language cannot hold, and ‘haunting’ gives him the quality of a ghost."],["Context","Gothic fiction often presents evil as beyond words."],["In short","Hyde can’t be put into words. Evil is felt, not seen."],["Critical and conceptual reading","Witnesses agree on a ‘haunting sense of unexpressed deformity’ but cannot describe it. Conceptually, Hyde’s evil is felt rather than seen, beyond language. A critical reading sees him as a projection of each witness’s own fears."]],"th":""}]},{"n":"Chapter 5: Incident of the Letter","k":"Chapter","sum":"Jekyll claims Hyde has gone; Utterson suspects forgery.","quotes":[{"q":"I swear to God I will never set eyes on him again","src":"Jekyll, Chapter 5","f":[["Language","Oath shows desperation."],["Form and structure","Dialogue with Utterson."],["Perceptive reading","Ironically untrue."],["Context","Religion and oaths."],["Writer's intention","To show self deception."],["Critical and conceptual reading","Jekyll swears by God that he has finished with Hyde. Conceptually, religious language gives weight to a promise he cannot keep. Dramatic irony makes the oath tragic, since Hyde is already stronger than Jekyll’s will."]],"th":"Duality · Secrecy · Guilt"},{"q":"a murderer’s autograph","src":"Mr Guest, Chapter 5","f":[["Language","Chilling phrase."],["Form and structure","Handwriting clue."],["Perceptive reading","Evidence of duality."],["Context","Victorian detective fiction."],["Writer's intention","To build mystery."],["Critical and conceptual reading","Guest calls Hyde’s handwriting ‘a murderer’s autograph’. Conceptually, identity is written in the body and its traces. A critical reading notes the irony that the handwriting is really Jekyll’s, so the respectable doctor’s hand is literally a murderer’s."]],"th":"Mystery · Duality · Crime"},{"q":"the two hands are in many points identical: only differently sloped","src":"Mr Guest, Chapter 5","f":[["Language","Clue to identity."],["Form and structure","Detective structure."],["Perceptive reading","Jekyll and Hyde are one."],["Context","Handwriting analysis."],["Writer's intention","To hint at the truth."],["Critical and conceptual reading","The two handwritings are identical except for the slope. Conceptually, Jekyll and Hyde are one person tilted in different directions, a perfect image of duality. A critical reading sees Utterson suppressing the truth to protect his friend’s reputation."]],"th":"Duality · Mystery · Identity"}]},{"n":"Chapter 6: Remarkable Incident of Dr Lanyon","k":"Chapter","sum":"Lanyon collapses after a shock he will not explain.","quotes":[{"q":"I have had a shock, and I shall never recover","src":"Lanyon, Chapter 6","f":[["Language","Prediction of death."],["Form and structure","Mystery deepens."],["Perceptive reading","Truth destroys him."],["Context","Rational science."],["Writer's intention","To build suspense."],["Critical and conceptual reading","Lanyon’s shock is so great he will never recover. Conceptually, knowledge itself can destroy, an idea that echoes ‘Frankenstein’. A critical reading sees rational science shattered by what it cannot explain."]],"th":"Science · Horror · Mystery"},{"q":"I wish to see or hear no more of Dr. Jekyll","src":"Lanyon, Chapter 6","f":[["Language","Rejection of friend."],["Form and structure","Short refusal."],["Perceptive reading","Horror of knowledge."],["Context","Victorian reputation."],["Writer's intention","To build tension."],["Critical and conceptual reading","Lanyon refuses to hear Jekyll’s name again. Conceptually, silence becomes his defence against horror. A critical reading sees the gentlemanly refusal to speak as the same repression that created Hyde."]],"th":"Friendship · Secrecy · Horror"},{"q":"he had his death-warrant written legibly upon his face","src":"Narrator, Chapter 6","f":[["Language","Metaphor of a death warrant."],["Form and structure","Gothic imagery."],["Perceptive reading","Fear is physical."],["Context","Gothic tradition."],["Writer's intention","To foreshadow death."],["Critical and conceptual reading","Lanyon has his ‘death-warrant written legibly upon his face’. Conceptually, the body reveals inner truth, as with Jekyll’s pallor and Hyde’s deformity. A critical reading sees knowledge as fatal in this novella."]],"th":"Death · Horror · Mystery"}]},{"n":"Chapter 7: Incident at the Window","k":"Chapter","sum":"Jekyll’s face changes in terror at the window.","quotes":[{"q":"the smile was struck out of his face","src":"Narrator, Chapter 7","f":[["Language","Violent verb ‘struck’."],["Form and structure","Sudden change."],["Perceptive reading","Transformation glimpsed."],["Context","Gothic horror."],["Writer's intention","To shock."],["Critical and conceptual reading","Jekyll’s smile is ‘struck out of his face’, as if by a blow. Conceptually, the transformation is violent and involuntary. A critical reading sees the window scene as the moment Jekyll’s control visibly fails."]],"th":"Duality · Horror · Secrecy"},{"q":"an expression of such abject terror and despair","src":"Narrator, Chapter 7","f":[["Language","Strong emotion."],["Form and structure","Witnessed by Utterson."],["Perceptive reading","Jekyll losing control."],["Context","Repression."],["Writer's intention","To create suspense."],["Critical and conceptual reading","The ‘abject terror and despair’ on Jekyll’s face shows a man losing himself. Conceptually, the horror is internal: the monster is inside his own body. Stevenson’s refusal to describe what happens makes the unseen more frightening."]],"th":"Fear · Duality · Control"},{"q":"God forgive us, God forgive us","src":"Utterson, Chapter 7","f":[["Language","Repetition shows horror."],["Form and structure","Religious response."],["Perceptive reading","Guilt of witnessing."],["Context","Victorian religion."],["Writer's intention","To heighten horror."],["Critical and conceptual reading","Utterson’s repeated prayer shows the gentlemen grasping for religion. Conceptually, faith is the only response left when reason fails. A critical reading sees Victorian society confronting a darkness its science cannot explain."]],"th":"Religion · Horror · Guilt"}]},{"n":"Chapter 8: The Last Night","k":"Chapter","sum":"Utterson and Poole break into the cabinet and find Hyde dead.","quotes":[{"q":"the pale moon, lying on her back as though the wind had tilted her","src":"Narrator, Chapter 8","f":[["Language","Personification of the moon."],["Form and structure","Gothic setting."],["Perceptive reading","Nature disturbed."],["Context","Pathetic fallacy."],["Writer's intention","To create unease."],["Critical and conceptual reading","The moon ‘lying on her back’ looks tilted and unnatural. Conceptually, pathetic fallacy shows the natural order disturbed. A critical reading links the strange sky to the unnatural experiment behind the locked door."]],"th":"Setting · Horror · Nature"},{"q":"Sir, if that was my master, why had he a mask upon his face?","src":"Poole, Chapter 8","f":[["Language","Question shows fear."],["Form and structure","Dialogue builds suspense."],["Perceptive reading","Mask suggests hidden identity."],["Context","Victorian masks of respectability."],["Writer's intention","To build mystery."],["Critical and conceptual reading","Poole’s question about the mask shows the household sensing that something is wrong. Conceptually, the mask symbolises hidden identity throughout the novella. A critical reading sees servants noticing what the gentlemen refuse to see."]],"th":"Duality · Mystery · Identity"},{"q":"the body of a man sorely contorted and still twitching","src":"Narrator, Chapter 8","f":[["Language","Grotesque image."],["Form and structure","Climax."],["Perceptive reading","Hyde’s death."],["Context","Gothic horror."],["Writer's intention","To shock."],["Critical and conceptual reading","The ‘sorely contorted and still twitching’ body is grotesque and unnatural. Conceptually, Hyde’s death ends both selves, since Jekyll cannot survive without him. A critical reading sees the corpse as the final, physical cost of Jekyll’s attempt to separate good from evil."]],"th":"Death · Horror · Duality"}]},{"n":"Chapter 9: Dr Lanyon’s Narrative","k":"Chapter","sum":"Lanyon describes watching Hyde transform into Jekyll.","quotes":[{"q":"O God!","src":"Lanyon, Chapter 9","f":[["Language","Exclamation shows horror."],["Form and structure","Repeated cries."],["Perceptive reading","Faith shaken."],["Context","Religion versus science."],["Writer's intention","To show horror."],["Critical and conceptual reading","Lanyon’s cry of ‘O God!’ shows a man of science overwhelmed by what he sees. Conceptually, reason collapses into prayer when it meets the inexplicable. A critical reading sees the Victorian conflict between science and faith compressed into a single exclamation."]],"th":"Religion · Science · Horror"},{"q":"there before my eyes—pale and shaken, and half fainting, and groping before him with his hands, like a man restored from death—there stood Henry Jekyll!","src":"Lanyon, Chapter 9","f":[["Language","Simile ‘like a man restored from death’."],["Form and structure","Climactic reveal."],["Perceptive reading","Duality confirmed."],["Context","Darwin and science."],["Writer's intention","To reveal the truth."],["Critical and conceptual reading","Lanyon sees Jekyll emerge ‘like a man restored from death’. Conceptually, the transformation parodies resurrection, a blasphemous mirror of Christian miracle. A critical reading sees Jekyll playing God, like Victor Frankenstein."]],"th":"Duality · Science · Horror"},{"q":"my life is shaken to its roots","src":"Lanyon, Chapter 9","f":[["Language","Metaphor of uprooting."],["Form and structure","Reflection."],["Perceptive reading","Science destroyed his certainty."],["Context","Scientific rationalism."],["Writer's intention","To show impact."],["Critical and conceptual reading","Lanyon’s life is ‘shaken to its roots’, an image of a tree torn from the ground. Conceptually, his rational worldview has been uprooted by the transformation. A critical reading sees knowledge as fatal in this novella, since Lanyon soon dies from what he has learned."]],"th":"Science · Horror · Death"}]},{"n":"Chapter 10: Henry Jekyll’s Full Statement","k":"Chapter","sum":"Jekyll explains the experiment and his loss of control.","quotes":[{"q":"man is not truly one, but truly two","src":"Jekyll, Chapter 10","f":[["Language","Antithesis of one and two."],["Form and structure","Thesis of the novella."],["Perceptive reading","Duality of human nature."],["Context","Victorian repression."],["Writer's intention","To explore duality."],["Critical and conceptual reading","Jekyll’s claim that man is ‘truly two’ universalises his condition. Conceptually, every reader shares this duality. A critical reading sees Stevenson implicating his respectable Victorian readers in Jekyll’s double life."]],"th":"Duality · Identity · Morality"},{"q":"Edward Hyde, alone in the ranks of mankind, was pure evil","src":"Jekyll, Chapter 10","f":[["Language","Absolute ‘pure evil’."],["Form and structure","Confession."],["Perceptive reading","Evil separated."],["Context","Christian morality."],["Writer's intention","To show evil within."],["Critical and conceptual reading","Jekyll insists that Hyde alone is ‘pure evil’. Conceptually, he separates himself from his own sin, a convenient self deception. A critical reading notes Jekyll remains mixed, so he cannot escape responsibility."]],"th":"Evil · Duality · Morality"},{"q":"I was slowly losing hold of my original and better self","src":"Jekyll, Chapter 10","f":[["Language","Loss of control."],["Form and structure","Confession."],["Perceptive reading","Evil grows stronger."],["Context","Addiction parallels."],["Writer's intention","To warn about repression."],["Critical and conceptual reading","Jekyll feels his ‘original and better self’ slipping away. Conceptually, the repressed self becomes dominant. A critical reading sees addiction and the loss of self control as the novella’s final warning."]],"th":"Duality · Control · Identity"}]}],"ctx9":[["Victorian respectability","Gentlemen were expected to hide desires and protect their reputation.","Jekyll creates Hyde to indulge desires that respectable society forced him to repress."],["Darwin and evolution","‘On the Origin of Species’ (1859) suggested humans evolved from animals.","Hyde’s ‘ape-like fury’ reflects Victorian fears that the beast within man could resurface."],["Duality in Edinburgh","Stevenson’s city had an elegant New Town and a squalid Old Town.","The contrast between Jekyll’s house and Hyde’s door mirrors the double face of Victorian cities."],["Science and religion","Scientific progress challenged religious belief.","Lanyon’s horror shows rational science unable to cope with Jekyll’s transcendental experiments."],["Gothic and crime","1880s readers loved sensational crime fiction and Gothic horror.","Stevenson’s fog bound London creates a Gothic atmosphere where evil hides in plain sight."],["Deacon Brodie","An Edinburgh councillor by day and burglar by night, hanged in 1788.","Brodie’s double life inspired Stevenson’s exploration of the hidden self."]],"voc":{"v":[["duality","having two sides or natures","Stevenson explores the duality of human nature through Jekyll and Hyde."],["repression","holding back feelings or desires","Victorian repression drives Jekyll to create Hyde."],["atavistic","reverting to a primitive state","Hyde is atavistic, described as ‘ape-like’."],["reputation","how others view your character","Utterson protects Jekyll’s reputation above the truth."],["degeneration","decline into a worse state","Fears of degeneration haunted Victorian society."],["respectability","being socially acceptable","Victorian respectability hides private vice."],["transgression","breaking a moral or social rule","Hyde allows Jekyll to enjoy transgression without guilt."],["enigmatic","mysterious","Hyde remains enigmatic, with ‘unexpressed deformity’."]],"m":[["L","Animal imagery","with ape-like fury","Hyde is linked to Darwinian fears of humanity’s primitive past.",1],["L","Pathetic fallacy","A great chocolate-coloured pall lowered over heaven","The dark fog mirrors the moral darkness of London.",1],["S","Multiple narrators","Utterson, Lanyon and Jekyll’s statement","Fragmented accounts create mystery and delay the truth.",0],["S","Withheld revelation","The truth comes in the final chapter","Delayed revelation creates suspense like a detective story.",0],["F","Gothic novella","Secrets, doubles and night time violence","Gothic conventions explore hidden evil in respectable London.",0],["F","Testimony","Henry Jekyll’s Full Statement","A confession form gives the final word to the guilty man.",0]]},"chron":[{"r":"Chapter 1: Story of the Door","m":"On a Sunday walk, Enfield tells Utterson how a man knocked down a young girl.","q":"the man trampled calmly over the child’s body","t1":["Juxtaposition","The violent verb ‘trampled’ sits beside the adverb ‘calmly’.","Hyde feels no guilt, panic or emotion.","The calmness is more disturbing than rage would be, suggesting cruelty is natural to him rather than a loss of control."],"t2":["Second hand narration","We hear the story through Enfield, not Hyde.","Distance surrounds Hyde with mystery.","Stevenson withholds direct access throughout the novella, so Hyde remains a figure of rumour and fear, like the hidden vices of respectable London."],"cx":"Victorian London had high levels of street crime and child poverty, yet respectable gentlemen preferred not to discuss scandal.","wi":"Stevenson introduces Hyde as casual, motiveless evil to unsettle his middle class readers."},{"r":"Chapter 2: Search for Mr Hyde","m":"Utterson, worried by Jekyll’s will, resolves to find Hyde.","q":"If he be Mr. Hyde,’ he had thought, ‘I shall be Mr. Seek.","t1":["Pun","‘Hyde’ and ‘Seek’ play on the children’s game of hide and seek.","The playful tone briefly lightens the mystery.","The pun reveals Hyde’s name as a clue: he is what Jekyll hides, so the hunt is really for Jekyll’s secret self."],"t2":["Detective conventions","Utterson becomes an amateur investigator.","The novella borrows from crime fiction, inviting readers to solve the case.","Yet the ‘solution’ is not a criminal but a theory of human nature, subverting the genre."],"cx":"Detective fiction was booming in the 1880s; Conan Doyle’s first Holmes story appeared in 1887, a year after this novella.","wi":"Stevenson draws readers into the investigation so the final revelation shocks them."},{"r":"Chapter 2: Search for Mr Hyde","m":"Utterson finally meets Hyde and is unable to explain his disgust.","q":"Something troglodytic, shall we say?","t1":["Scientific diction","‘troglodytic’ means like a primitive cave dweller.","Hyde appears less evolved than civilised men.","The word links Hyde to fears that humans could regress down the evolutionary ladder."],"t2":["Rhetorical question","Utterson hesitates, seeking the right word.","Even a lawyer’s precise language fails him.","Hyde exists beyond rational description, reflecting the Victorian discomfort with what cannot be categorised."],"cx":"Darwin’s ‘On the Origin of Species’ (1859) raised fears of atavism, the idea that people could revert to primitive states.","wi":"Stevenson taps into anxieties about evolution to make Hyde feel scientifically as well as morally threatening."},{"r":"Chapter 3: Dr Jekyll Was Quite at Ease","m":"At a dinner party Jekyll brushes off Utterson’s concerns.","q":"the moment I choose, I can be rid of Mr. Hyde","t1":["Dramatic irony","Jekyll claims full control.","Readers already suspect he is wrong.","His confidence becomes tragic hubris once we learn that Hyde grows stronger with each transformation."],"t2":["Modal certainty","‘I can be rid’ sounds absolute.","Jekyll presents addiction as a choice.","The phrasing echoes how people talk about vices they cannot quit, hinting at Hyde as an addiction."],"cx":"Victorian gentlemen were expected to show self control and moral restraint.","wi":"Stevenson uses irony to show the danger of believing we can control our darker desires."},{"r":"Chapter 4: The Carew Murder Case","m":"A maid at her window sees Hyde beat Sir Danvers Carew to death.","q":"with ape-like fury","t1":["Animal imagery","Hyde attacks like an ‘ape’.","He is presented as primitive and bestial.","The image links to Darwinian fears that civilisation is a thin layer over animal instinct."],"t2":["Compound adjective","‘ape-like’ fuses human and animal.","Hyde is not fully either.","Victim and attacker contrast: Carew is an ‘aged beautiful gentleman’, so civilisation itself appears attacked."],"cx":"Victorians feared that the ‘criminal type’ was a throwback to an earlier stage of evolution.","wi":"Stevenson makes the murder a symbolic attack on respectable society by its own hidden beast."},{"r":"Chapter 4: The Carew Murder Case","m":"Utterson travels through Soho with the police inspector.","q":"A great chocolate-coloured pall lowered over heaven","t1":["Pathetic fallacy","The thick fog darkens the city.","It mirrors the moral confusion surrounding Jekyll.","‘pall’ also means the cloth over a coffin, so the city itself seems to be in mourning or already dead."],"t2":["Gothic setting","Dark, foggy London creates menace.","The fog hides crime and secrets.","London becomes a double city, respectable streets beside squalid Soho, mirroring Jekyll and Hyde."],"cx":"London’s ‘pea souper’ fogs, caused by coal smoke, were notorious in the 1880s.","wi":"Stevenson uses setting to make the city a symbol of the hidden darkness in its citizens."},{"r":"Chapter 5: Incident of the Letter","m":"Jekyll, pale and ill, assures Utterson that Hyde is gone.","q":"I swear to God I will never set eyes on him again","t1":["Religious oath","Jekyll swears by God.","He seems desperate to be believed.","Invoking God for a promise he cannot keep makes his eventual collapse a moral as well as physical fall."],"t2":["Absolute adverb","‘never’ is total and final.","He is trying to convince himself as much as Utterson.","Readers who return to the chapter after the ending see the promise as tragic dramatic irony."],"cx":"Victorian respectability depended on reputation; scandal could ruin a gentleman.","wi":"Stevenson builds tension through promises the reader suspects will be broken."},{"r":"Chapter 6: Remarkable Incident of Dr Lanyon","m":"Lanyon, now dying, refuses to speak of Jekyll.","q":"I have had a shock… and I shall never recover","t1":["Short declarative clauses","The plain statement is final.","Lanyon is broken by what he has seen.","The rational scientist is destroyed by knowledge, suggesting some truths overwhelm reason."],"t2":["Withheld information","He will not say what the shock was.","Suspense builds as readers are kept in the dark.","The mystery is only solved in Chapter 9, so the delay drives the narrative forward."],"cx":"Victorian science was confident that reason could explain everything.","wi":"Stevenson shows the limits of rationalism when faced with the supernatural."},{"r":"Chapter 7: Incident at the Window","m":"Utterson and Enfield see Jekyll’s face change in horror at his window.","q":"an expression of such abject terror and despair","t1":["Emotive adjectives","‘abject terror’ conveys total fear.","Jekyll is losing control of his transformations.","The horror is internal: the enemy is within his own body."],"t2":["Interrupted scene","The window shuts suddenly.","Readers do not see the change.","Stevenson’s restraint makes the unseen more frightening than any description."],"cx":"Victorians were expected to hide emotion behind a respectable face.","wi":"Stevenson builds dread by showing respectability crack."},{"r":"Chapter 8: The Last Night","m":"Poole and Utterson break down the door of Jekyll’s cabinet.","q":"the body of a man sorely contorted and still twitching","t1":["Grotesque imagery","‘contorted’ and ‘twitching’ make the body grotesque.","Death is ugly and unnatural.","The body is Hyde’s, so the moment shows Jekyll’s experiment ending in the destruction of both selves."],"t2":["Climax","The break in ends the mystery’s suspense.","It is the physical climax of the plot.","Yet the truth still waits in documents, delaying full understanding to the final chapters."],"cx":"Suicide was considered a sin and a disgrace in Victorian society.","wi":"Stevenson shows the horrifying consequence of Jekyll’s transgression."},{"r":"Chapter 9: Dr Lanyon’s Narrative","m":"Lanyon describes watching Hyde transform into Jekyll.","q":"O God!","t1":["Exclamation","Lanyon’s cry is short and desperate.","He is overwhelmed with horror.","A man of science calls on God, showing his rational worldview has collapsed."],"t2":["Epistolary form","The chapter is Lanyon’s letter.","First hand testimony gives authority.","Multiple documents build a case like evidence in court."],"cx":"Victorians debated science and faith after Darwin.","wi":"Stevenson shows science’s limits."},{"r":"Chapter 10: Henry Jekyll’s Full Statement","m":"Jekyll explains his theory of human duality.","q":"man is not truly one, but truly two","t1":["Antithesis","‘one’ is set against ‘two’.","Every human has a divided nature.","Jekyll universalises his condition, implicating readers in the same duality."],"t2":["Repetition","‘truly’ is repeated for emphasis.","The confession sounds certain and scientific.","As the final chapter, it gives Jekyll the last word, yet his voice fades into Hyde’s."],"cx":"Victorian morality demanded strict repression of desires, encouraging double lives.","wi":"Stevenson warns that repressing human nature creates monsters."}]},{"id":"ge","title":"Great Expectations","author":"Dickens","kind":"19th century novel","paper":"Paper 1, Section B","col":"#33691E","ctx":[["Social class","Victorian society was rigidly divided; gentlemen did not work with their hands."],["Bildungsroman","A coming of age novel tracing Pip’s moral growth."],["Transportation","Convicts like Magwitch were sent to Australia."],["Serialisation","Published weekly in 1860 to 1861, with cliffhangers."],["Dickens","His father was imprisoned for debt; Dickens worked in a factory as a child."]],"groups":[{"n":"Pip","k":"Character","sum":"An orphan whose ambition to be a gentleman leads him to snobbery before he learns humility.","quotes":[{"q":"Heaven knows we need never be ashamed of our tears","src":"Pip, leaving the forge, Chapter 19","f":[["Language","Tears are presented as honest and cleansing."],["Form and structure","The older narrator reflects on his younger self."],["Perceptive reading","Shows the narrator’s mature wisdom."],["Context","Victorian men were expected to hide emotion."],["Writer's intention","To show Pip’s moral growth."],["Critical and conceptual reading","Pip’s defence of tears rejects the stiff upper lip of Victorian masculinity. Conceptually, emotional honesty becomes a sign of moral growth, as the boy who once hid his feelings learns to accept them. A critical reading sees Dickens valuing sensitivity over the cold self control associated with gentlemanly status."]],"th":"Growth · Emotion · Home"},{"q":"the long chain of iron or gold, of thorns or flowers","src":"Pip, Chapter 9","f":[["Language","The metaphor shows one day shaping a whole life."],["Form and structure","Direct address to the reader."],["Perceptive reading","Pip’s choices bind him like chains."],["Context","Bildungsroman form."],["Writer's intention","To show how small moments change lives."],["Critical and conceptual reading","The ‘long chain’ suggests that a single day can bind a whole life. Conceptually, the image echoes Marley’s chain, linking memory, fate and moral consequence. A critical reading notes the choice between ‘iron or gold, thorns or flowers’, implying lives are shaped by chance encounters like Pip’s visit to Satis House."]],"th":"Fate · Choice · Ambition"},{"q":"I saw no shadow of another parting from her","src":"Pip, final chapter","f":[["Language","Hopeful ending suggests reunion with Estella."],["Form and structure","The revised ending is ambiguous."],["Perceptive reading","Pip may be deceiving himself."],["Context","Dickens changed the ending on advice."],["Writer's intention","To leave readers with hope."],["Critical and conceptual reading","The ambiguous final line can promise lasting union or simply Pip’s inability to foresee another parting. Conceptually, the ending refuses certainty, matching a novel about mistaken expectations. Dickens’s revised ending was more hopeful, so critics still debate whether it betrays the book’s realism."]],"th":"Love · Hope · Change"}]},{"n":"Miss Havisham","k":"Character","sum":"A jilted bride who stopped her clocks and raised Estella for revenge.","quotes":[{"q":"the bride within the bridal dress had withered like the dress","src":"Pip, Chapter 8","f":[["Language","The simile links her body to decay."],["Form and structure","Gothic description of Satis House."],["Perceptive reading","Time has been frozen but not stopped."],["Context","Victorian Gothic tradition."],["Writer's intention","To show the destructive power of bitterness."],["Critical and conceptual reading","Miss Havisham has withered alongside her wedding dress, fusing person and object. Conceptually, she has frozen time at the moment of betrayal, turning grief into a living death. A feminist reading sees a woman destroyed by a society that defined her entirely by marriage."]],"th":"Decay · Revenge · Time"},{"q":"Break their hearts my pride and hope, break their hearts and have no mercy!","src":"Miss Havisham to Estella, Chapter 12","f":[["Language","Imperatives show her cruel instructions."],["Form and structure","Repetition shows obsession."],["Perceptive reading","She uses Estella as a weapon."],["Context","Women had little power except through marriage."],["Writer's intention","To show revenge corrupting others."],["Critical and conceptual reading","Miss Havisham’s command shows she has turned Estella into a weapon against men. Conceptually, revenge passes from one generation to the next, corrupting a child. A critical reading sees her as both victim and abuser, shaped by the cruelty done to her."]],"th":"Revenge · Love · Power"},{"q":"What have I done! What have I done!","src":"Miss Havisham, Chapter 49","f":[["Language","Repetition shows remorse."],["Form and structure","Exclamations show breakdown."],["Perceptive reading","She finally understands her cruelty."],["Context","Christian ideas of repentance."],["Writer's intention","To show redemption is possible."],["Critical and conceptual reading","Miss Havisham’s repeated cry shows sudden, painful self knowledge. Conceptually, her remorse proves that redemption is possible even for the most bitter characters, though it comes too late to undo harm. Her death by fire soon after symbolically destroys the frozen past."]],"th":"Guilt · Redemption · Change"}]},{"n":"Joe Gargery","k":"Character","sum":"The kind, loyal blacksmith who represents true goodness.","quotes":[{"q":"ever the best of friends","src":"Joe to Pip, repeated","f":[["Language","Simple phrase shows loyalty."],["Form and structure","Repeated throughout the novel."],["Perceptive reading","Joe’s love never changes."],["Context","Working class virtue."],["Writer's intention","To show true friendship."],["Critical and conceptual reading","Joe’s simple refrain ‘ever the best of friends’ captures his loyalty. Conceptually, Joe represents unconditional love that money cannot buy. A Marxist reading sees the working class man as the true moral centre, set against the hollow gentility Pip pursues."]],"th":"Loyalty · Love · Class"},{"q":"Life is made of ever so many partings welded together","src":"Joe, Chapter 27","f":[["Language","Blacksmith metaphor shows simple wisdom."],["Form and structure","Spoken during an awkward visit."],["Perceptive reading","Joe understands more than Pip."],["Context","Dickens valued working class people."],["Writer's intention","To show Joe’s wisdom."],["Critical and conceptual reading","Joe’s blacksmith metaphor suggests partings are not breaks but joins that make life strong. Conceptually, simple language carries deep wisdom, exposing the shallowness of Pip’s refinement. A critical reading sees Dickens defining true gentility as goodness rather than class."]],"th":"Loyalty · Class · Growth"},{"q":"this gentle Christian man","src":"Pip about Joe, Chapter 57","f":[["Language","Pip recognises Joe’s goodness."],["Form and structure","Late in the novel."],["Perceptive reading","Shows Pip’s changed values."],["Context","Christian ideals."],["Writer's intention","To redefine a true gentleman."],["Critical and conceptual reading","Pip finally sees Joe as a ‘gentle Christian man’, uniting the words gentleman and goodness. Conceptually, the phrase redefines the novel’s central ambition: a true gentleman is gentle in spirit. Pip’s recognition marks the completion of his moral education."]],"th":"Class · Morality · Growth"}]},{"n":"Estella","k":"Character","sum":"A beautiful, cold young woman raised to break men’s hearts.","quotes":[{"q":"He calls the knaves Jacks, this boy!","src":"Estella, Chapter 8","f":[["Language","She mocks Pip’s working class language."],["Form and structure","Exclamation shows contempt."],["Perceptive reading","Makes Pip ashamed of his class."],["Context","Class snobbery."],["Writer's intention","To show class prejudice."],["Critical and conceptual reading","Estella mocks Pip’s working class vocabulary, awakening his shame. Conceptually, class is marked by language, and shame drives Pip’s ambition. A critical reading sees Estella herself as a victim, trained by Miss Havisham to wound."]],"th":"Class · Shame · Pride"},{"q":"what coarse hands he has! And what thick boots!","src":"Estella, Chapter 8","f":[["Language","Focus on hands and boots shows class markers."],["Form and structure","Exclamations show scorn."],["Perceptive reading","Triggers Pip’s ambition."],["Context","Physical labour marked lower class."],["Writer's intention","To show class divisions."],["Critical and conceptual reading","Estella’s scorn for Pip’s hands and boots makes class visible on the body. Conceptually, Pip learns to see himself through the eyes of the wealthy, a turning point in his self image. A critical reading notes the irony that Estella’s own parents are a criminal and a murderer."]],"th":"Class · Shame · Ambition"},{"q":"I have no heart","src":"Estella to Pip, Chapter 29","f":[["Language","She admits emotional emptiness."],["Form and structure","Blunt declaration."],["Perceptive reading","Raised to be cold by Miss Havisham."],["Context","Nurture versus nature."],["Writer's intention","To show damage caused by revenge."],["Critical and conceptual reading","Estella’s admission that she has ‘no heart’ reveals the damage done by Miss Havisham. Conceptually, she is a created being, shaped by revenge like Frankenstein’s creature. A feminist reading sees a woman denied emotional freedom by another woman’s trauma."]],"th":"Love · Revenge · Identity"}]},{"n":"Magwitch","k":"Character","sum":"The convict who becomes Pip’s secret benefactor.","quotes":[{"q":"Keep still, you little devil, or I’ll cut your throat!","src":"Magwitch, Chapter 1","f":[["Language","Violent threat creates fear."],["Form and structure","Dramatic opening scene."],["Perceptive reading","First impressions deceive."],["Context","Fear of convicts."],["Writer's intention","To create a dramatic opening."],["Critical and conceptual reading","Magwitch’s violent threat terrifies the child Pip. Conceptually, the ‘little devil’ insult is ironic, since the convict will become Pip’s devoted benefactor. A critical reading challenges Victorian assumptions that criminals are irredeemably wicked."]],"th":"Crime · Fear · Appearance"},{"q":"A fearful man, all in coarse grey, with a great iron on his leg","src":"Pip, Chapter 1","f":[["Language","Description shows him as a convict."],["Form and structure","Listing builds a frightening picture."],["Perceptive reading","Society defines him by his crime."],["Context","Convicts and the prison hulks."],["Writer's intention","To create sympathy later."],["Critical and conceptual reading","The ‘great iron on his leg’ marks Magwitch as a prisoner of the state. Conceptually, iron links him to Joe’s forge and to the chains of society. A Marxist reading sees him as a product of poverty and an unjust legal system."]],"th":"Crime · Class · Appearance"},{"q":"I’m your second father. You’re my son","src":"Magwitch, Chapter 39","f":[["Language","He claims a fatherly bond."],["Form and structure","Shocking revelation."],["Perceptive reading","Pip’s wealth came from a convict."],["Context","Transportation to Australia."],["Writer's intention","To challenge class assumptions."],["Critical and conceptual reading","Magwitch’s claim to be Pip’s ‘second father’ shatters Pip’s illusions. Conceptually, Pip’s gentility was built on a convict’s labour, exposing the hidden foundations of wealth. A critical reading sees Dickens questioning the boundary between respectability and criminality."]],"th":"Family · Class · Identity"}]},{"n":"Class and ambition","k":"Theme","sum":"Pip’s desire to rise in society brings shame and loss before wisdom.","quotes":[{"q":"I want to be a gentleman","src":"Pip to Biddy, Chapter 17","f":[["Language","Simple declaration of ambition."],["Form and structure","Shows his growing dissatisfaction."],["Perceptive reading","Ambition is linked to Estella."],["Context","Victorian class mobility."],["Writer's intention","To explore ambition."],["Critical and conceptual reading","Pip’s ambition to be a gentleman drives the whole plot. Conceptually, the desire springs from shame rather than virtue. A Marxist reading sees class mobility as a seductive but corrupting promise in Victorian society."]],"th":"Ambition · Class · Identity"},{"q":"It is a most miserable thing to feel ashamed of home","src":"Pip, Chapter 14","f":[["Language","Superlative shows deep shame."],["Form and structure","Reflective narrator."],["Perceptive reading","Ambition destroys contentment."],["Context","Class aspiration."],["Writer's intention","To show the cost of snobbery."],["Critical and conceptual reading","Pip’s regret at being ashamed of home is the voice of the older narrator. Conceptually, retrospective narration lets Dickens condemn snobbery from within. A critical reading sees the line as the novel’s moral confession."]],"th":"Class · Shame · Home"},{"q":"I had believed in the forge as the glowing road to manhood and independence","src":"Pip, Chapter 14","f":[["Language","Metaphor of the forge as a road shows lost hope."],["Form and structure","Contrasts past and present."],["Perceptive reading","Ambition has changed his values."],["Context","Working class pride."],["Writer's intention","To show changing values."],["Critical and conceptual reading","Pip once believed the forge was ‘the glowing road to manhood and independence’. Conceptually, Satis House has redirected his dreams from honest work to gentility. A Marxist reading mourns the loss of working class pride, replaced by shame learned from the wealthy."]],"th":"Class · Ambition · Identity"}]}],"ctx9":[["Class and the gentleman","Victorian society was rigidly divided; gentlemen did not work with their hands.","Pip’s shame at his ‘coarse hands’ reveals how class prejudice is internalised."],["Bildungsroman","A coming of age novel tracing moral growth.","Pip’s journey from snobbery to humility shows that true gentility is moral, not social."],["Transportation","Convicts were transported to Australia.","Magwitch’s secret wealth from Australia challenges the idea that class determines worth."],["Serialisation","Published weekly in 1860 to 1861 with cliffhangers.","The dramatic revelations, such as Magwitch’s return, were designed to keep weekly readers hooked."],["Women and marriage","Women’s value was tied to marriage.","Miss Havisham’s jilting leaves her frozen in time, showing how Victorian women’s lives depended on marriage."],["Dickens’s life","His father was imprisoned for debt; he knew poverty first hand.","Dickens’s sympathy for Joe and Magwitch reflects his own understanding of hardship."]],"voc":{"v":[["aspiration","a strong desire to achieve something","Pip’s aspiration to be a gentleman leads him to reject Joe."],["snobbery","looking down on people of lower class","Pip’s snobbery after his fortune shows how wealth corrupts."],["benefactor","someone who gives money to help another","Pip assumes Miss Havisham is his benefactor."],["vengeance","punishment for a wrong","Miss Havisham uses Estella for vengeance on men."],["humility","modesty","Joe’s humility contrasts with Pip’s pride."],["penitent","sorry for wrongdoing","Miss Havisham ends penitent, begging forgiveness."],["stagnation","lack of change or growth","Satis House symbolises stagnation, with stopped clocks."],["bildungsroman","a novel about a character’s growth","Great Expectations is a bildungsroman tracing Pip’s moral growth."]],"m":[["L","Symbolism","the bride within the bridal dress had withered like the dress","Decay symbolises a life frozen by betrayal.",1],["L","Metaphor","Life is made of ever so many partings welded together","Joe’s blacksmith metaphor gives him simple wisdom.",1],["S","Three stages","Pip’s three stages of expectations","Each stage marks a change in Pip’s identity.",0],["S","Retrospective narration","Older Pip narrates his youth","Adult hindsight allows judgement of his younger self.",0],["F","Bildungsroman","Pip’s growth from child to man","The form traces his moral education.",0],["F","Serialisation","Published weekly in 1860 to 1861","Cliffhangers kept readers buying each instalment.",0]]},"chron":[{"r":"Chapter 1","m":"In the marshes churchyard, an escaped convict seizes Pip.","q":"Keep still, you little devil, or I’ll cut your throat!","t1":["Imperative and threat","Magwitch’s commands are violent and immediate.","The child is terrified and powerless.","The ‘little devil’ insult is ironic, since Magwitch will become Pip’s secret benefactor and ‘second father’."],"t2":["In medias res opening","The novel begins with sudden danger.","Readers are gripped from the first page.","This brief act of mercy by Pip sets the whole plot in motion, showing how small choices shape lives."],"cx":"Convicts were held in prison ships (hulks) on the Thames estuary before transportation to Australia.","wi":"Dickens creates a shocking opening that will later challenge readers’ assumptions about who is good and who is criminal."},{"r":"Chapter 8","m":"Pip first visits Satis House and sees Miss Havisham.","q":"the bride within the bridal dress had withered like the dress","t1":["Simile","Miss Havisham has ‘withered like the dress’.","She is decaying along with her wedding clothes.","The image fuses person and object, suggesting she has become a relic of the moment she was jilted."],"t2":["Gothic imagery","Stopped clocks, rotting cake and yellowed silk create a Gothic scene.","Time has been frozen.","Satis House symbolises a life ruined by refusing to move on from pain."],"cx":"Victorian women’s lives were defined by marriage; a jilted woman faced shame.","wi":"Dickens presents Miss Havisham as a warning about bitterness and revenge."},{"r":"Chapter 8","m":"Estella mocks Pip as they play cards.","q":"He calls the knaves Jacks, this boy!","t1":["Exclamation","Estella’s scorn is open.","She mocks his working class vocabulary.","The small detail awakens Pip’s shame about his class, which drives his ambition."],"t2":["Demonstrative ‘this boy’","She does not use his name.","Pip is dismissed as unimportant.","Her contempt was taught by Miss Havisham, making Estella a victim as well as a tormentor."],"cx":"Class was marked by speech and manners in Victorian society.","wi":"Dickens shows how class snobbery wounds and shapes identity."},{"r":"Chapter 14","m":"Pip reflects on his shame about the forge.","q":"It is a most miserable thing to feel ashamed of home","t1":["Superlative","‘most miserable’ shows deep regret.","The adult narrator judges his younger self.","The confession invites sympathy while condemning snobbery."],"t2":["Retrospective narration","Older Pip looks back.","Hindsight brings moral insight.","The bildungsroman structure traces his moral growth."],"cx":"Social mobility was growing, but class prejudice remained strong.","wi":"Dickens criticises snobbery through Pip’s regret."},{"r":"Chapter 27","m":"Joe visits Pip in London and feels awkward and out of place.","q":"Life is made of ever so many partings welded together","t1":["Extended metaphor","Joe pictures life as metal pieces ‘welded together’.","He draws on the language of his trade as a blacksmith.","The image suggests partings are not breaks but joins, so even sad separations make a life strong."],"t2":["Dialect and simple syntax","‘ever so many’ marks Joe’s plain, working class speech.","His humble style contrasts with Pip’s new London polish.","The wisdom in simple words exposes Pip’s snobbery: the uneducated man is the true gentleman."],"cx":"Victorian society equated gentility with wealth and manners rather than character.","wi":"Dickens challenges readers to value goodness over refinement and class."},{"r":"Chapter 39","m":"Magwitch returns from Australia and reveals he is Pip’s benefactor.","q":"I’m your second father. You’re my son","t1":["Familial metaphor","Magwitch claims a father’s role.","He sees Pip as the gentleman he has ‘made’ with his money.","The revelation destroys Pip’s fantasy that Miss Havisham chose him for Estella, exposing how shallow his ‘expectations’ were."],"t2":["Short declarative sentences","The simple statements are blunt and emotional.","Magwitch’s pride contrasts with Pip’s horror.","The reversal forces Pip to confront his own snobbery towards the man who loved him most."],"cx":"Transported convicts were forbidden to return to England on pain of death.","wi":"Dickens challenges readers’ prejudice against criminals and the poor by revealing the convict as Pip’s true benefactor."},{"r":"Chapter 49","m":"Miss Havisham, finally understanding her cruelty, begs Pip’s forgiveness.","q":"What have I done! What have I done!","t1":["Repetition","The exclamation is repeated twice.","She is overwhelmed by sudden self knowledge.","Recognising how she broke Estella’s heart as well as Pip’s marks her move from revenge to remorse."],"t2":["Exclamatory sentences","Her cries are desperate and broken.","The controlled, cold voice of earlier chapters collapses.","Soon afterwards her dress catches fire, as if the frozen past is finally destroyed."],"cx":"Victorian Christianity taught that genuine repentance could bring forgiveness.","wi":"Dickens shows that even the most bitter characters can recognise their wrongs, though too late to undo them."},{"r":"Chapter 59","m":"Years later, Pip meets Estella in the ruins of Satis House.","q":"I saw no shadow of another parting from her","t1":["Ambiguity","The final sentence can be read in two ways.","It may promise that they will never part again.","It may also mean Pip simply could not foresee a parting, so the happy ending is uncertain."],"t2":["Imagery of shadow","‘shadow’ suggests something dark or hidden.","The past still lingers over both characters.","Both have been reshaped by suffering, so any future is built on humility rather than expectation."],"cx":"Dickens changed his original, sadder ending after advice from the novelist Edward Bulwer Lytton.","wi":"Dickens leaves readers with a hopeful but ambiguous ending that rewards moral growth."}]},{"id":"je","title":"Jane Eyre","author":"Charlotte Brontë","kind":"19th century novel","paper":"Paper 1, Section B","col":"#4A148C","ctx":[["Women’s rights","Victorian women had few rights; governesses were neither servants nor gentry."],["Religion","Christianity shapes Jane’s moral choices."],["Gothic","The red room and Thornfield’s secrets create suspense."],["Mental illness","Asylums and attitudes to madness were harsh."],["Brontë","Published 1847 under the male pen name Currer Bell."]],"groups":[{"n":"Jane","k":"Character","sum":"A plain, passionate orphan who insists on equality and integrity.","quotes":[{"q":"Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?","src":"Jane to Rochester, Chapter 23","f":[["Language","The list of adjectives shows how society sees her."],["Form and structure","Rhetorical question demands respect."],["Perceptive reading","She asserts spiritual equality."],["Context","Class and gender inequality."],["Writer's intention","To argue for women’s equality."],["Critical and conceptual reading","Jane’s rhetorical question demands that her inner worth be judged apart from wealth, status or beauty. Conceptually, it asserts the equality of souls, a radical idea for a poor governess addressing her employer. A feminist reading sees the speech as a manifesto for women’s emotional and spiritual equality."]],"th":"Gender · Class · Identity"},{"q":"Reader, I married him.","src":"Jane, Chapter 38","f":[["Language","Direct address to the reader."],["Form and structure","Short sentence shows certainty."],["Perceptive reading","Jane is the active subject, not the object."],["Context","Victorian marriage conventions."],["Writer's intention","To show Jane’s agency."],["Critical and conceptual reading","The active ‘I married him’ makes Jane the subject of her own story. Conceptually, marriage is presented as her choice, made only after she has gained independence and Rochester has been humbled. A critical reading debates whether the ending fulfils or compromises her feminist journey."]],"th":"Love · Gender · Independence"},{"q":"I resisted all the way","src":"Jane, Chapter 2","f":[["Language","She fights being taken to the red room."],["Form and structure","Opening chapters show defiance."],["Perceptive reading","Her rebellion begins in childhood."],["Context","Children were expected to obey."],["Writer's intention","To establish Jane’s spirit."],["Critical and conceptual reading","Jane’s resistance to being dragged to the red room defines her spirit. Conceptually, resistance becomes the pattern of her life, at Gateshead, Lowood, Thornfield and Moor House. A feminist reading celebrates a heroine whose defiance is presented as virtue rather than sin."]],"th":"Rebellion · Childhood · Identity"}]},{"n":"Rochester","k":"Character","sum":"Jane’s brooding employer whose secret threatens their love.","quotes":[{"q":"I sometimes have a queer feeling with regard to you","src":"Rochester to Jane, Chapter 23","f":[["Language","He describes a deep connection."],["Form and structure","Leads to his proposal."],["Perceptive reading","Their bond is spiritual."],["Context","Romantic ideals."],["Writer's intention","To show intense love."],["Critical and conceptual reading","Rochester’s ‘queer feeling’ describes an invisible string tying him to Jane. Conceptually, love is presented as a spiritual and almost physical bond between equals. A critical reading notes the imagery of strings and cords hints at both connection and control."]],"th":"Love · Connection · Identity"},{"q":"my equal is here, and my likeness","src":"Rochester, Chapter 23","f":[["Language","He presents Jane as his equal."],["Form and structure","Part of the proposal scene."],["Perceptive reading","Equality makes their love unusual."],["Context","Class differences."],["Writer's intention","To present equal love."],["Critical and conceptual reading","Rochester recognises Jane as his ‘equal’ and ‘likeness’. Conceptually, love depends on equality of mind and soul, not rank. A critical reading notes that his first proposal still hides a wife in the attic, so real equality must wait until both are transformed."]],"th":"Love · Equality · Gender"},{"q":"Jane, you please me, and you master me","src":"Rochester, Chapter 24","f":[["Language","He admits Jane has power over him."],["Form and structure","Reversal of gender roles."],["Perceptive reading","Love creates equality."],["Context","Men usually held power."],["Writer's intention","To challenge gender roles."],["Critical and conceptual reading","Rochester admits that Jane both pleases and masters him. Conceptually, the reversal of power excites him, suggesting a relationship of mutual influence. A feminist reading sees Jane holding emotional power despite her lower social position."]],"th":"Love · Power · Gender"}]},{"n":"Bertha Mason","k":"Character","sum":"Rochester’s first wife, locked in the attic.","quotes":[{"q":"a figure ran backwards and forwards","src":"Jane, Chapter 26","f":[["Language","Bertha is reduced to a ‘figure’."],["Form and structure","Gothic reveal."],["Perceptive reading","Dehumanised by the narrative."],["Context","Treatment of mental illness."],["Writer's intention","To create horror."],["Critical and conceptual reading","Bertha is first glimpsed as a shapeless ‘figure’ running in the dark. Conceptually, she is reduced to a mystery and a Gothic horror. A postcolonial reading, influenced by Jean Rhys’s ‘Wide Sargasso Sea’, sees her as a silenced Creole woman imprisoned by an English husband."]],"th":"Gothic · Identity · Gender"},{"q":"it grovelled, seemingly, on all fours; it snatched and growled like some strange wild animal","src":"Jane, Chapter 26","f":[["Language","Animal imagery dehumanises Bertha."],["Form and structure","Gothic description."],["Perceptive reading","She may represent repressed female anger."],["Context","Colonial and racial prejudice."],["Writer's intention","To create horror and question it."],["Critical and conceptual reading","Bertha is described as a grovelling, growling animal. Conceptually, she embodies Victorian fears of madness, female passion and racial ‘otherness’. A feminist reading sees her as Jane’s dark double, the rage Jane must control, locked away in the attic."]],"th":"Gothic · Gender · Prejudice"},{"q":"the clothed hyena","src":"Jane, Chapter 26","f":[["Language","Metaphor presents her as an animal."],["Form and structure","Short shocking image."],["Perceptive reading","Victorian attitudes to madness."],["Context","Asylum treatment."],["Writer's intention","To show Bertha as Jane’s dark double."],["Critical and conceptual reading","Rochester calls Bertha a ‘clothed hyena’, stripping her of humanity. Conceptually, the image exposes how madness and difference were dehumanised. A postcolonial reading condemns the colonial attitudes that made Bertha a commodity in a marriage arranged for money."]],"th":"Gothic · Identity · Gender"}]},{"n":"Gateshead","k":"Setting","sum":"Jane’s cruel childhood home with the Reeds.","quotes":[{"q":"Wicked and cruel boy!","src":"Jane to John Reed, Chapter 1","f":[["Language","Exclamation shows defiance."],["Form and structure","Early rebellion."],["Perceptive reading","Jane refuses injustice."],["Context","Children’s powerlessness."],["Writer's intention","To show Jane’s courage."],["Critical and conceptual reading","Jane’s outburst against John Reed is her first act of rebellion. Conceptually, she judges the powerful by moral rather than social standards. A critical reading sees her childhood defiance foreshadowing her refusal to accept injustice as an adult."]],"th":"Injustice · Childhood · Rebellion"},{"q":"You are less than a servant, for you do nothing for your keep","src":"Miss Abbot to Jane, Chapter 2","f":[["Language","Insult shows Jane’s low status."],["Form and structure","Harsh treatment."],["Perceptive reading","Jane is an outsider."],["Context","Class hierarchy."],["Writer's intention","To show injustice."],["Critical and conceptual reading","Miss Abbot tells Jane she is ‘less than a servant’, defining her by economic usefulness. Conceptually, the poor relation’s status is precarious and humiliating. A Marxist reading sees the Reeds’ cruelty rooted in class and dependence."]],"th":"Class · Childhood · Identity"},{"q":"I resisted all the way","src":"Jane, Chapter 2","f":[["Language","Physical resistance."],["Form and structure","First chapter conflict."],["Perceptive reading","Shows spirit."],["Context","Obedience expected."],["Writer's intention","To show rebellion."],["Critical and conceptual reading","The repeated line ‘I resisted all the way’ becomes a motto for Jane’s life. Conceptually, resistance defines her identity. A critical reading sees Brontë turning a child’s struggle into a lifelong principle."]],"th":"Rebellion · Childhood · Identity"}]},{"n":"St John Rivers","k":"Character","sum":"A cold, ambitious clergyman who wants Jane as a missionary wife.","quotes":[{"q":"you are formed for labour, not for love","src":"St John to Jane, Chapter 34","f":[["Language","He reduces Jane to usefulness."],["Form and structure","Proposal without love."],["Perceptive reading","Marriage as duty."],["Context","Missionary work in India."],["Writer's intention","To contrast with Rochester."],["Critical and conceptual reading","St John sees Jane as useful for labour rather than love. Conceptually, religious duty becomes a form of control as dangerous as Rochester’s passion. A feminist reading sees Jane rejecting a marriage that would erase her self."]],"th":"Love · Duty · Gender"},{"q":"I am cold: no fervour infects me","src":"St John, Chapter 32","f":[["Language","He admits coldness."],["Form and structure","Self description."],["Perceptive reading","Duty replaces emotion."],["Context","Religious duty."],["Writer's intention","To show cold religion."],["Critical and conceptual reading","St John admits his coldness, revealing a man ruled by ambition and duty. Conceptually, he is the opposite of Rochester, reason without warmth. A critical reading sees Brontë rejecting both extremes in favour of balance."]],"th":"Religion · Duty · Love"},{"q":"he is good and great, but severe","src":"Jane about St John","f":[["Language","Contrast of praise and severity."],["Form and structure","Balanced judgement."],["Perceptive reading","Goodness can be harsh."],["Context","Victorian religion."],["Writer's intention","To show complex faith."],["Critical and conceptual reading","Jane’s verdict that St John is ‘good and great, but severe’ balances admiration with criticism. Conceptually, goodness without warmth is incomplete. A critical reading sees Jane’s mature ability to judge male authority on her own terms, refusing both passion without principle and principle without love."]],"th":"Religion · Duty · Love"}]},{"n":"Independence and gender","k":"Theme","sum":"Jane fights for equality and self respect.","quotes":[{"q":"I am no bird; and no net ensnares me","src":"Jane, Chapter 23","f":[["Language","Metaphor rejects being trapped."],["Form and structure","Bird imagery recurs."],["Perceptive reading","She asserts freedom."],["Context","Women’s limited rights."],["Writer's intention","To promote independence."],["Critical and conceptual reading","Jane’s declaration ‘I am no bird’ rejects the image of the caged woman. Conceptually, freedom becomes a moral right. A feminist reading sees this as one of the novel’s most powerful statements of independence."]],"th":"Freedom · Gender · Identity"},{"q":"Women are supposed to be very calm generally: but women feel just as men feel","src":"Jane, Chapter 12","f":[["Language","Contrasts expectation and reality."],["Form and structure","Narrator’s direct argument."],["Perceptive reading","Women deserve the same opportunities."],["Context","Early feminism."],["Writer's intention","To argue for equality."],["Critical and conceptual reading","Jane’s reflection on women’s feelings argues for emotional equality. Conceptually, it challenges the separate spheres ideology. A feminist reading sees Brontë’s narrator speaking for all restricted women."]],"th":"Gender · Equality · Freedom"},{"q":"I care for myself","src":"Jane, Chapter 27","f":[["Language","Short declaration of self respect."],["Form and structure","Leaving Rochester."],["Perceptive reading","Integrity over love."],["Context","Christian morality."],["Writer's intention","To show Jane’s integrity."],["Critical and conceptual reading","Jane’s simple ‘I care for myself’ puts self respect above love and comfort. Conceptually, integrity defines her identity more than any relationship. A feminist reading celebrates the choice as radical for a Victorian woman, who was expected to sacrifice herself for others."]],"th":"Identity · Morality · Independence"}]}],"ctx9":[["Women’s rights","Victorian women had few legal rights and limited careers.","Jane’s claim that ‘women feel just as men feel’ was a radical demand for equality in 1847."],["Governesses","Educated but poor, governesses belonged neither to the family nor the servants.","Jane’s ambiguous status at Thornfield reflects the isolation of Victorian governesses."],["Religion","Christianity shaped moral choices.","Jane’s refusal to become Rochester’s mistress shows her integrity and faith."],["Gothic","Secrets, madness and haunted houses created suspense.","The red room and Bertha’s attic use Gothic imagery to suggest repressed female rage."],["Mental illness and empire","Asylums were harsh; colonial attitudes shaped views of Creole women.","Bertha’s animalistic portrayal reflects Victorian prejudice about madness and race."],["Currer Bell","Brontë published under a male pen name.","Brontë’s use of a male pseudonym mirrors Jane’s own struggle to be heard as an equal."]],"voc":{"v":[["autonomy","independence and control over your life","Jane demands autonomy in a world that limits women."],["oppression","unjust treatment or control","Jane faces oppression at Gateshead and Lowood."],["integrity","being honest and having strong principles","Jane’s integrity leads her to leave Rochester."],["passionate","showing strong feeling","Jane’s passionate nature clashes with Victorian expectations."],["subordinate","lower in rank","As a governess, Jane is socially subordinate."],["confinement","being kept in a small space","Bertha’s confinement mirrors women’s restricted lives."],["egalitarian","believing all people are equal","Jane’s egalitarian demand to be Rochester’s equal is radical."],["austere","severe or strict","St John Rivers is austere and cold."]],"m":[["L","Bird imagery","I am no bird; and no net ensnares me","Jane rejects being caged, asserting her freedom.",1],["L","Animal imagery","the clothed hyena","Bertha is dehumanised, revealing Victorian fears about madness and race.",1],["S","Five settings","Gateshead, Lowood, Thornfield, Moor House, Ferndean","Each location marks a stage in Jane’s journey.",0],["S","Direct address","Reader, I married him.","Jane controls her own story and speaks to us as an equal.",1],["F","Bildungsroman","Jane’s growth from orphan to wife","The form traces her moral and emotional development.",0],["F","Gothic elements","The red room and the mysterious laugh","Gothic fear expresses Jane’s repressed feelings.",0]]},"chron":[{"r":"Chapter 1","m":"Ten year old Jane is attacked by her cousin John Reed and fights back.","q":"Wicked and cruel boy!","t1":["Exclamatory insult","Jane’s outburst names John’s cruelty directly.","A child who was expected to be silent and grateful speaks back.","The first spark of rebellion establishes her lifelong refusal to accept injustice, the quality that defines the novel."],"t2":["Adjectives of moral judgement","‘Wicked’ and ‘cruel’ are strong moral words.","Jane judges the powerful by moral rather than social standards.","Her moral confidence foreshadows how she will later judge Rochester and St John by the same principles."],"cx":"Orphans and poor relations had no rights and were expected to show gratitude and obedience.","wi":"Brontë makes readers sympathise with a rebellious child, challenging Victorian ideals of submissive girlhood."},{"r":"Chapter 2","m":"Jane is dragged to the red room as punishment.","q":"I resisted all the way","t1":["First person retrospective voice","Adult Jane recalls her childhood resistance.","The plain declarative sounds proud rather than ashamed.","The phrase becomes a motto for her whole life, as she resists every attempt to control her."],"t2":["Verb choice","‘resisted’ suggests active struggle, not passive suffering.","Jane is presented as a fighter.","The physical struggle mirrors the psychological struggles to come at Lowood, Thornfield and Moor House."],"cx":"Victorian girls were taught that meekness and self denial were feminine virtues.","wi":"Brontë presents resistance as admirable, encouraging readers to value female strength."},{"r":"Chapter 12","m":"Restless at Thornfield, Jane reflects on women’s lives.","q":"Women are supposed to be very calm generally: but women feel just as men feel","t1":["Contrast","‘supposed to be’ is set against what women truly ‘feel’.","Society’s expectations clash with women’s real emotions.","The conjunction ‘but’ turns the sentence into an argument, giving the novel a political edge."],"t2":["Generalisation","Jane speaks for all women, not just herself.","Her personal story becomes a wider statement.","The voice of a governess, a woman with little status, challenges the gender order directly."],"cx":"Victorian ideology of separate spheres confined women to the home and quiet domestic duties.","wi":"Brontë uses Jane’s voice to argue for women’s emotional and intellectual equality."},{"r":"Chapter 23","m":"Believing Rochester will marry Blanche, Jane declares her worth.","q":"Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?","t1":["Rhetorical question","Jane challenges Rochester directly.","She demands recognition of her inner worth.","The question exposes the assumption that status and beauty determine value."],"t2":["Asyndetic list","‘poor, obscure, plain, and little’ lists society’s judgements.","Each adjective names a reason she is overlooked.","The list builds to ‘soulless and heartless’, turning society’s labels into an accusation."],"cx":"Governesses occupied an awkward place, neither servant nor family, and were often treated as invisible.","wi":"Brontë insists on the equal soul of every person regardless of class, beauty or gender."},{"r":"Chapter 26","m":"On the wedding day, Rochester reveals his wife Bertha in the attic.","q":"it grovelled, seemingly, on all fours; it snatched and growled like some strange wild animal","t1":["Dehumanising pronoun","Bertha is called ‘it’, not ‘she’.","She is stripped of humanity and identity.","Modern readers see her as a silenced woman whose madness may have been produced by confinement and by Rochester himself."],"t2":["Animal imagery","‘grovelled’, ‘snatched’ and ‘growled’ make her bestial.","She embodies Victorian fears of madness and of the colonial ‘other’.","Bertha can be read as Jane’s double, the rage Jane must control, locked in the attic."],"cx":"Victorians often locked away the mentally ill; Bertha is a white Creole from Jamaica, reflecting colonial attitudes.","wi":"Brontë creates Gothic horror while raising uncomfortable questions about how women and outsiders are treated."},{"r":"Chapter 27","m":"Jane refuses to stay as Rochester’s mistress and leaves Thornfield.","q":"I care for myself","t1":["Monosyllables","Four simple words state her decision.","The plainness shows unshakeable resolve.","For a woman to put herself first was radical, making the line a declaration of independence."],"t2":["Reflexive pronoun","‘myself’ places Jane at the centre.","She values self respect over love.","Her choice proves her integrity, so her eventual marriage will be between equals."],"cx":"A woman living as a mistress would lose all respectability and legal protection.","wi":"Brontë shows that self respect matters more than romance, a bold message for Victorian women."},{"r":"Chapter 34","m":"St John Rivers proposes a loveless missionary marriage.","q":"you are formed for labour, not for love","t1":["Antithesis and alliteration","‘labour’ and ‘love’ are set against each other.","St John sees Jane as a useful tool, not a person.","The alliteration makes his judgement sound neat and final, yet Jane rejects its cold logic."],"t2":["Passive verb ‘formed’","Jane is something shaped for a purpose.","He denies her own choice.","His religious authority is another form of control, as dangerous as Rochester’s passion."],"cx":"Victorian missionaries spread Christianity across the Empire, often expecting wives to serve.","wi":"Brontë shows that duty without love is another kind of imprisonment."},{"r":"Chapter 38","m":"Jane marries the blind, humbled Rochester.","q":"Reader, I married him.","t1":["Direct address","Jane speaks straight to the reader.","She claims ownership of her story.","The active ‘I married him’ makes her the subject of the sentence, reversing the usual ‘he married her’."],"t2":["Short declarative","The sentence is simple and final.","It closes the romance with quiet confidence.","The brevity reflects the calm equality she has finally achieved."],"cx":"Victorian marriage made women legally subordinate to their husbands.","wi":"Brontë gives her heroine the final word, presenting marriage as a choice between equals."}]},{"id":"pp","title":"Pride and Prejudice","author":"Jane Austen","kind":"19th century novel","paper":"Paper 1, Section B","col":"#AD1457","ctx":[["Marriage","For women, marriage was economic security."],["Entailment","Longbourn will pass to Mr Collins, not the Bennet daughters."],["Class","Landed gentry and aristocracy held status and wealth."],["Regency era","Published 1813; manners and reputation mattered."],["Austen","Never married; wrote with irony about marriage."]],"groups":[{"n":"Elizabeth Bennet","k":"Character","sum":"A witty, independent heroine who learns to overcome prejudice.","quotes":[{"q":"I could easily forgive his pride, if he had not mortified mine","src":"Elizabeth, Chapter 5","f":[["Language","She admits wounded pride."],["Form and structure","Witty balance."],["Perceptive reading","Her prejudice begins here."],["Context","Manners and reputation."],["Writer's intention","To show her own flaw."],["Critical and conceptual reading","Elizabeth’s balanced sentence reveals that her prejudice springs from wounded pride. Conceptually, the novel’s title applies to both lovers: she is as proud as Darcy. A critical reading sees her wit masking vulnerability, since his insult at the ball hurt more than she admits."]],"th":"Pride · Prejudice · Identity"},{"q":"you were the last man in the world whom I could ever be prevailed on to marry","src":"Elizabeth to Darcy, Chapter 34","f":[["Language","Hyperbole rejects him."],["Form and structure","First proposal scene."],["Perceptive reading","Shows independence."],["Context","Women expected to accept wealthy men."],["Writer's intention","To challenge conventions."],["Critical and conceptual reading","Elizabeth’s hyperbolic rejection is dramatic irony, since she will marry him. Conceptually, it shows how prejudice blinds her judgement. A feminist reading celebrates her right to refuse a wealthy man, rare in a society that pressured women to accept security."]],"th":"Marriage · Pride · Independence"},{"q":"Till this moment I never knew myself.","src":"Elizabeth, Chapter 36","f":[["Language","Self realisation."],["Form and structure","Turning point."],["Perceptive reading","She recognises her prejudice."],["Context","Moral growth."],["Writer's intention","To show change."],["Critical and conceptual reading","Elizabeth’s epiphany marks the novel’s turning point. Conceptually, self knowledge is presented as the highest form of wisdom. A critical reading notes that the heroine changes before the hero, giving Elizabeth moral authority."]],"th":"Prejudice · Growth · Identity"}]},{"n":"Mr Darcy","k":"Character","sum":"A proud, wealthy gentleman who learns humility.","quotes":[{"q":"She is tolerable, but not handsome enough to tempt me","src":"Darcy, Chapter 3","f":[["Language","Insult shows pride."],["Form and structure","First impression."],["Perceptive reading","Pride creates prejudice."],["Context","Class pride."],["Writer's intention","To establish conflict."],["Critical and conceptual reading","Darcy’s cold understatement wounds Elizabeth and sets the plot in motion. Conceptually, his pride is rooted in class arrogance. A critical reading sees the line as the ‘first impression’ that both characters must overcome."]],"th":"Pride · Class · Love"},{"q":"In vain I have struggled. It will not do.","src":"Darcy, Chapter 34","f":[["Language","Short sentences show emotion."],["Form and structure","Proposal opening."],["Perceptive reading","Love overcomes pride."],["Context","Class differences."],["Writer's intention","To show inner conflict."],["Critical and conceptual reading","Darcy’s abrupt declaration frames love as a defeat of his judgement. Conceptually, pride corrupts even his proposal. A critical reading sees his struggle as a battle between class loyalty and genuine feeling."]],"th":"Love · Pride · Class"},{"q":"My good opinion once lost, is lost forever.","src":"Darcy, Chapter 11","f":[["Language","Repetition shows rigidity."],["Form and structure","Self description."],["Perceptive reading","He must learn flexibility."],["Context","Gentleman’s honour."],["Writer's intention","To show his flaw."],["Critical and conceptual reading","Darcy admits ‘My good opinion once lost, is lost forever’, revealing unforgiving pride. Conceptually, he presents rigidity as principle. A critical reading sees his later change as proof that even the proudest character can learn humility, which is the novel’s moral journey for both lovers."]],"th":"Pride · Judgement · Change"}]},{"n":"Mrs Bennet","k":"Character","sum":"A silly, anxious mother determined to marry off her daughters.","quotes":[{"q":"The business of her life was to get her daughters married","src":"Narrator, Chapter 1","f":[["Language","‘business’ shows marriage as transaction."],["Form and structure","Ironic narration."],["Perceptive reading","Economic necessity."],["Context","Entailment."],["Writer's intention","To mock and explain her."],["Critical and conceptual reading","The narrator mocks Mrs Bennet’s single minded pursuit of husbands. Conceptually, Austen satirises a society that left women no option but marriage. A feminist reading sees Mrs Bennet’s anxiety as rational given the entail."]],"th":"Marriage · Money · Family"},{"q":"You take delight in vexing me. You have no compassion for my poor nerves.","src":"Mrs Bennet, Chapter 1","f":[["Language","Comic complaint."],["Form and structure","Repeated motif of nerves."],["Perceptive reading","Self pity."],["Context","Women’s anxieties."],["Writer's intention","To create comedy."],["Critical and conceptual reading","Mrs Bennet’s complaint about her ‘nerves’ is comic hypochondria. Conceptually, it reveals her frustration and powerlessness. A critical reading sees her as a product of a narrow life rather than simple foolishness."]],"th":"Family · Marriage · Comedy"},{"q":"a woman of mean understanding, little information, and uncertain temper","src":"Narrator, Chapter 1","f":[["Language","List of flaws."],["Form and structure","Ironic tone."],["Perceptive reading","Austen’s satire."],["Context","Education of women."],["Writer's intention","To satirise."],["Critical and conceptual reading","The narrator sums up Mrs Bennet as ‘a woman of mean understanding’. Conceptually, Austen’s irony judges her sharply. A feminist reading notes that Mrs Bennet’s limited education and anxiety about the entail are products of a society that offered women little beyond marriage."]],"th":"Family · Gender · Comedy"}]},{"n":"Mr Collins and Charlotte","k":"Character","sum":"A pompous clergyman and the practical friend who marries him.","quotes":[{"q":"the violence of my affection","src":"Mr Collins, Chapter 19","f":[["Language","Ironic, unromantic proposal."],["Form and structure","Pompous speech."],["Perceptive reading","Marriage as duty."],["Context","Entailment."],["Writer's intention","To mock loveless marriage."],["Critical and conceptual reading","Mr Collins’s pompous ‘violence of my affection’ turns a proposal into parody, since his speech is anything but passionate. Conceptually, Austen exposes marriage as an obligation dressed up in the language of romance. A critical reading sees the clergyman’s self importance as satire of a Church more concerned with patronage than feeling."]],"th":"Marriage · Comedy · Money"},{"q":"I am not romantic, you know; I never was. I ask only a comfortable home","src":"Charlotte, Chapter 22","f":[["Language","Practical view of marriage."],["Form and structure","Honest dialogue."],["Perceptive reading","Economic security over love."],["Context","Women’s limited options."],["Writer's intention","To show realism."],["Critical and conceptual reading","Charlotte’s pragmatic choice exposes the economics behind courtship. Conceptually, security outweighs romance for a woman with no fortune and few prospects. A feminist reading treats her decision as rational survival rather than failure, which is why Austen never wholly condemns her."]],"th":"Marriage · Money · Gender"},{"q":"it is usual with young ladies to reject the addresses of the man whom they secretly mean to accept","src":"Mr Collins, Chapter 19","f":[["Language","He refuses to accept rejection."],["Form and structure","Comic arrogance."],["Perceptive reading","Ignores Elizabeth’s voice."],["Context","Gender assumptions."],["Writer's intention","To criticise male entitlement."],["Critical and conceptual reading","Mr Collins assumes Elizabeth’s refusal is a coy form of acceptance. Conceptually, he cannot imagine a woman genuinely saying no. A feminist reading sees Austen mocking male entitlement while showing how little weight a woman’s refusal carried."]],"th":"Gender · Marriage · Comedy"}]},{"n":"Lady Catherine","k":"Character","sum":"Darcy’s aunt, proud of rank and determined to stop his marriage.","quotes":[{"q":"Are the shades of Pemberley to be thus polluted?","src":"Lady Catherine, Chapter 56","f":[["Language","Rhetorical question shows snobbery."],["Form and structure","Confrontation with Elizabeth."],["Perceptive reading","Class prejudice."],["Context","Aristocratic pride."],["Writer's intention","To mock snobbery."],["Critical and conceptual reading","Lady Catherine’s outraged question presents Elizabeth as a pollutant to Pemberley. Conceptually, the aristocracy fears social mixing as contamination of bloodlines and land. A critical reading sees Austen satirising a class whose authority rests on birth rather than merit."]],"th":"Class · Pride · Marriage"},{"q":"Obstinate, headstrong girl!","src":"Lady Catherine, Chapter 56","f":[["Language","Insult shows anger."],["Form and structure","Exclamation."],["Perceptive reading","Elizabeth refuses to obey."],["Context","Female independence."],["Writer's intention","To show Elizabeth’s strength."],["Critical and conceptual reading","Lady Catherine means ‘Obstinate, headstrong’ as an insult, but readers hear praise. Conceptually, Elizabeth’s independence threatens the social hierarchy that Lady Catherine defends. Ironically, the confrontation gives Darcy hope and brings the lovers together."]],"th":"Independence · Class · Gender"},{"q":"I am almost the nearest relation he has in the world","src":"Lady Catherine, Chapter 56","f":[["Language","She claims authority."],["Form and structure","Assertion of power."],["Perceptive reading","Family control."],["Context","Aristocratic families."],["Writer's intention","To show interference."],["Critical and conceptual reading","Lady Catherine claims authority through family connection. Conceptually, rank is presented as a right to control others’ lives. A critical reading sees Elizabeth’s refusal to bow as a quiet revolution of individual judgement over inherited power."]],"th":"Family · Power · Class"}]},{"n":"Marriage","k":"Theme","sum":"The novel explores marriage for love, money and security.","quotes":[{"q":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.","src":"Narrator, Chapter 1","f":[["Language","Ironic opening."],["Form and structure","Famous first line."],["Perceptive reading","Women need wealthy husbands, not the reverse."],["Context","Marriage market."],["Writer's inte
