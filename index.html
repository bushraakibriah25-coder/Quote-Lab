 delight in vexing me. You have no compassion for my poor nerves.","src":"Mrs Bennet, Chapter 1","f":[["Language","Comic complaint."],["Form and structure","Repeated motif of nerves."],["Perceptive reading","Self pity."],["Context","Women’s anxieties."],["Writer's intention","To create comedy."]],"th":"Family · Marriage · Comedy"},{"q":"a woman of mean understanding, little information, and uncertain temper","src":"Narrator, Chapter 1","f":[["Language","List of flaws."],["Form and structure","Ironic tone."],["Perceptive reading","Austen’s satire."],["Context","Education of women."],["Writer's intention","To satirise."]],"th":"Family · Gender · Comedy"}]},{"n":"Mr Collins and Charlotte","k":"Character","sum":"A pompous clergyman and the practical friend who marries him.","quotes":[{"q":"the violence of my affection","src":"Mr Collins, Chapter 19","f":[["Language","Ironic, unromantic proposal."],["Form and structure","Pompous speech."],["Perceptive reading","Marriage as duty."],["Context","Entailment."],["Writer's intention","To mock loveless marriage."]],"th":"Marriage · Comedy · Money"},{"q":"I am not romantic, you know; I never was. I ask only a comfortable home","src":"Charlotte, Chapter 22","f":[["Language","Practical view of marriage."],["Form and structure","Honest dialogue."],["Perceptive reading","Economic security over love."],["Context","Women’s limited options."],["Writer's intention","To show realism."]],"th":"Marriage · Money · Gender"},{"q":"it is usual with young ladies to reject the addresses of the man whom they secretly mean to accept","src":"Mr Collins, Chapter 19","f":[["Language","He refuses to accept rejection."],["Form and structure","Comic arrogance."],["Perceptive reading","Ignores Elizabeth’s voice."],["Context","Gender assumptions."],["Writer's intention","To criticise male entitlement."]],"th":"Gender · Marriage · Comedy"}]},{"n":"Lady Catherine","k":"Character","sum":"Darcy’s aunt, proud of rank and determined to stop his marriage.","quotes":[{"q":"Are the shades of Pemberley to be thus polluted?","src":"Lady Catherine, Chapter 56","f":[["Language","Rhetorical question shows snobbery."],["Form and structure","Confrontation with Elizabeth."],["Perceptive reading","Class prejudice."],["Context","Aristocratic pride."],["Writer's intention","To mock snobbery."]],"th":"Class · Pride · Marriage"},{"q":"Obstinate, headstrong girl!","src":"Lady Catherine, Chapter 56","f":[["Language","Insult shows anger."],["Form and structure","Exclamation."],["Perceptive reading","Elizabeth refuses to obey."],["Context","Female independence."],["Writer's intention","To show Elizabeth’s strength."]],"th":"Independence · Class · Gender"},{"q":"I am almost the nearest relation he has in the world","src":"Lady Catherine, Chapter 56","f":[["Language","She claims authority."],["Form and structure","Assertion of power."],["Perceptive reading","Family control."],["Context","Aristocratic families."],["Writer's intention","To show interference."]],"th":"Family · Power · Class"}]},{"n":"Marriage","k":"Theme","sum":"The novel explores marriage for love, money and security.","quotes":[{"q":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.","src":"Narrator, Chapter 1","f":[["Language","Ironic opening."],["Form and structure","Famous first line."],["Perceptive reading","Women need wealthy husbands, not the reverse."],["Context","Marriage market."],["Writer's intention","To satirise society."]],"th":"Marriage · Money · Irony"},{"q":"Happiness in marriage is entirely a matter of chance.","src":"Charlotte, Chapter 6","f":[["Language","Cynical view."],["Form and structure","Foreshadows her marriage."],["Perceptive reading","Practicality over romance."],["Context","Women’s options."],["Writer's intention","To present realism."]],"th":"Marriage · Love · Gender"},{"q":"I am not romantic, you know","src":"Charlotte, Chapter 22","f":[["Language","Honest admission."],["Form and structure","Contrasts Elizabeth."],["Perceptive reading","Security matters."],["Context","Economic need."],["Writer's intention","To show different choices."]],"th":"Marriage · Money · Gender"}]}],"ctx9":[["Marriage and money","Women needed marriage for financial security.","Charlotte’s acceptance of Mr Collins shows marriage as an economic necessity for women."],["Entailment","Longbourn passes to Mr Collins, not the Bennet daughters.","The entail explains Mrs Bennet’s desperation to marry off her daughters."],["Class","Landed gentry and aristocracy guarded their status.","Lady Catherine’s fury at the ‘polluted’ shades of Pemberley satirises aristocratic snobbery."],["Regency manners","Reputation and propriety mattered greatly.","Lydia’s elopement threatens the whole family’s reputation, not just her own."],["Irony","Austen used free indirect speech and irony to satirise society.","The famous opening line ironically reveals that it is women who need wealthy husbands."],["Austen’s life","She never married and depended on her family.","Austen’s own situation gives her portrayal of women’s limited options its sharpness."]],"voc":{"v":[["prejudice","an opinion formed without knowledge","Elizabeth’s prejudice against Darcy blinds her to his worth."],["propriety","correct social behaviour","Lydia’s elopement breaks every rule of propriety."],["mercenary","motivated by money","Charlotte’s marriage seems mercenary but is practical."],["entailment","a legal rule passing property to male heirs","The entailment leaves the Bennet sisters without security."],["pompous","self important","Mr Collins is pompous and ridiculous."],["vulgarity","lack of good manners","Mrs Bennet’s vulgarity embarrasses Elizabeth."],["condescension","behaving as if superior","Lady Catherine’s condescension reveals class arrogance."],["epiphany","a sudden realisation","Elizabeth’s epiphany comes after reading Darcy’s letter."]],"m":[["L","Irony","It is a truth universally acknowledged","The opening mocks society’s obsession with marriage.",1],["L","Free indirect discourse","Till this moment I never knew myself.","Austen moves inside Elizabeth’s thoughts while keeping ironic distance.",1],["S","Two proposals","Darcy proposes twice","The contrast shows how both characters have changed.",0],["S","Letter","Darcy’s letter after the first proposal","The letter turns the plot and Elizabeth’s judgement.",0],["F","Novel of manners","Balls, visits and dinners","Social rituals expose character and class.",0],["F","Romantic comedy","Misunderstanding leads to happy marriage","Comedy allows Austen to criticise society gently.",0]]},"chron":[{"r":"Chapter 1","m":"The narrator opens with a famous observation as Mrs Bennet hears of Bingley.","q":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife","t1":["Irony","The grand claim of a ‘truth universally acknowledged’ is really gossip.","In practice it is women who need rich husbands, not the reverse.","Austen’s narrator mocks a society that dresses economic need up as universal truth."],"t2":["Hyperbole and formal register","The lofty, philosophical tone exaggerates the claim.","The style sounds like a moral essay.","The gap between grand style and trivial subject sets up the novel’s comic satire."],"cx":"Under the law of entail and coverture, women had few ways to secure money except through marriage.","wi":"Austen opens with satire so readers question society’s obsession with marriage and money."},{"r":"Chapter 3","m":"At the Meryton ball, Darcy refuses to dance with Elizabeth within her hearing.","q":"She is tolerable, but not handsome enough to tempt me","t1":["Understatement","‘tolerable’ is cold, faint praise.","Darcy dismisses Elizabeth as barely acceptable.","The insult creates Elizabeth’s prejudice and wounds her pride, giving the title its double meaning."],"t2":["Overheard speech","Elizabeth hears the remark by chance.","First impressions are formed on partial information.","The novel’s original title, ‘First Impressions’, shows how this moment shapes the plot."],"cx":"Upper class men had great social power; being chosen as a dance partner mattered for a woman’s prospects.","wi":"Austen shows how pride and hasty judgement shape relationships."},{"r":"Chapter 22","m":"Charlotte Lucas explains why she has accepted Mr Collins.","q":"I am not romantic, you know; I never was. I ask only a comfortable home","t1":["Plain declaratives","Charlotte states her choice calmly.","She chooses security over love.","Her honesty exposes the harsh economics facing women without fortune."],"t2":["Contrast with Elizabeth","Charlotte accepts the proposal Elizabeth rejected.","The parallel invites comparison.","Austen neither fully condemns nor praises Charlotte, making readers think about women’s limited choices."],"cx":"At twenty seven, unmarried and without money, Charlotte risked becoming a burden on her family.","wi":"Austen exposes how marriage was often a financial necessity for women."},{"r":"Chapter 34","m":"Darcy proposes to Elizabeth at Hunsford.","q":"In vain I have struggled. It will not do.","t1":["Short sentences","The abrupt sentences burst out of Darcy.","His feelings overpower his pride.","The language of ‘struggle’ shows he sees loving Elizabeth as a defeat, revealing his arrogance even as he proposes."],"t2":["Inversion","‘In vain I have struggled’ places the struggle first.","His resistance is emphasised.","The proposal is insulting because it stresses her inferiority."],"cx":"Marrying beneath one’s class was seen as degrading.","wi":"Austen shows pride corrupting even love."},{"r":"Chapter 34","m":"Elizabeth angrily rejects Darcy’s proposal.","q":"you were the last man in the world whom I could ever be prevailed on to marry","t1":["Hyperbole","‘the last man in the world’ is an absolute rejection.","Elizabeth’s anger is total.","The extreme language becomes ironic, since she will later marry him, showing how prejudice blinds her."],"t2":["Formal diction","‘prevailed on’ is polite yet cutting.","She maintains decorum while delivering an insult.","Her controlled fury shows a woman claiming the right to refuse, rare in her society."],"cx":"Refusing a wealthy man was almost unthinkable for a woman with little fortune.","wi":"Austen presents Elizabeth as a heroine who values respect over money."},{"r":"Chapter 36","m":"After reading Darcy’s letter, Elizabeth realises she misjudged him and Wickham.","q":"Till this moment I never knew myself.","t1":["Epiphany","The line marks sudden self knowledge.","Elizabeth recognises her own prejudice.","It is the turning point of the novel, where the heroine changes before the hero does."],"t2":["Free indirect discourse","Austen moves inside Elizabeth’s thoughts.","Readers experience her shame directly.","The technique blends narrator and character, letting Austen judge Elizabeth gently while sympathising."],"cx":"Georgian ideals praised reason and self examination.","wi":"Austen shows that wisdom comes from recognising one’s own faults."},{"r":"Chapter 56","m":"Lady Catherine confronts Elizabeth about a rumoured engagement to Darcy.","q":"Are the shades of Pemberley to be thus polluted?","t1":["Rhetorical question","Lady Catherine asks in outrage.","She sees Elizabeth as a threat to her family’s status.","Her grand language makes her snobbery ridiculous."],"t2":["Metaphor of pollution","‘polluted’ presents Elizabeth as dirt.","Class mixing is seen as contamination.","Austen mocks the aristocracy’s fear of social change."],"cx":"The landed gentry guarded their estates and bloodlines.","wi":"Austen satirises aristocratic arrogance."},{"r":"Chapter 56","m":"Lady Catherine leaves in fury after Elizabeth refuses to promise anything.","q":"Obstinate, headstrong girl!","t1":["Exclamation","Lady Catherine’s insult is furious.","She cannot control Elizabeth.","The ‘insult’ is praise to readers: Elizabeth’s independence is her virtue."],"t2":["Adjectives","‘Obstinate, headstrong’ condemn Elizabeth’s will.","Women were expected to be obedient.","The visit ironically gives Darcy hope, bringing the lovers together."],"cx":"Young women were expected to defer to their social superiors.","wi":"Austen celebrates female independence."}]},{"id":"fr","title":"Frankenstein","author":"Mary Shelley","kind":"19th century novel","paper":"Paper 1, Section B","col":"#1B5E20","ctx":[["Science","Galvanism experiments used electricity on dead bodies."],["Romanticism","Nature is sublime and healing; ambition defies it."],["Gothic","Horror, isolation and monstrous creations."],["Prometheus","The Titan punished for stealing fire from the gods."],["Mary Shelley","Written aged 18 in 1816; published 1818."]],"groups":[{"n":"Victor Frankenstein","k":"Character","sum":"A scientist whose ambition creates life and destroys everyone he loves.","quotes":[{"q":"the beauty of the dream vanished, and breathless horror and disgust filled my heart","src":"Victor, Chapter 5","f":[["Language","Contrast of ‘beauty’ and ‘horror’."],["Form and structure","Turning point at creation."],["Perceptive reading","His ambition turns to revulsion."],["Context","Galvanism experiments."],["Writer's intention","To warn against ambition."]],"th":"Ambition · Science · Horror"},{"q":"Learn from me, if not by my precepts, at least by my example, how dangerous is the acquirement of knowledge","src":"Victor to Walton, Chapter 4","f":[["Language","Imperative warns Walton."],["Form and structure","Frame narrative."],["Perceptive reading","Knowledge can destroy."],["Context","Enlightenment science."],["Writer's intention","To warn readers."]],"th":"Knowledge · Ambition · Danger"},{"q":"A new species would bless me as its creator","src":"Victor, Chapter 4","f":[["Language","He imagines being worshipped."],["Form and structure","Shows hubris."],["Perceptive reading","Playing God."],["Context","Religious concerns."],["Writer's intention","To show arrogance."]],"th":"Ambition · Religion · Power"}]},{"n":"The Creature","k":"Character","sum":"Victor’s creation, gentle at first, made monstrous by rejection.","quotes":[{"q":"I ought to be thy Adam, but I am rather the fallen angel","src":"The Creature, Chapter 10","f":[["Language","Biblical allusion to Paradise Lost."],["Form and structure","Eloquent speech."],["Perceptive reading","He feels rejected by his creator."],["Context","Christian creation stories."],["Writer's intention","To create sympathy."]],"th":"Religion · Rejection · Identity"},{"q":"I am malicious because I am miserable","src":"The Creature, Chapter 17","f":[["Language","Cause and effect shows nurture."],["Form and structure","Short, balanced sentence."],["Perceptive reading","Society creates monsters."],["Context","Nature versus nurture."],["Writer's intention","To question who is monstrous."]],"th":"Isolation · Nurture · Revenge"},{"q":"I shall be with you on your wedding-night","src":"The Creature, Chapter 20","f":[["Language","A chilling threat."],["Form and structure","Foreshadows Elizabeth’s death."],["Perceptive reading","Revenge targets love."],["Context","Gothic suspense."],["Writer's intention","To build tension."]],"th":"Revenge · Love · Fear"}]},{"n":"Robert Walton","k":"Character","sum":"An ambitious explorer whose letters frame the novel.","quotes":[{"q":"One man’s life or death were but a small price to pay","src":"Walton, Letter 4","f":[["Language","He devalues life for discovery."],["Form and structure","Echoes Victor."],["Perceptive reading","Ambition blinds him."],["Context","Exploration age."],["Writer's intention","To parallel Victor."]],"th":"Ambition · Knowledge · Danger"},{"q":"I have no friend, Margaret","src":"Walton, Letter 2","f":[["Language","Direct address shows loneliness."],["Form and structure","Letters frame the story."],["Perceptive reading","Isolation links all narrators."],["Context","Epistolary form."],["Writer's intention","To show isolation."]],"th":"Isolation · Friendship · Ambition"},{"q":"You seek for knowledge and wisdom, as I once did","src":"Victor to Walton, Letter 4","f":[["Language","Victor sees himself in Walton."],["Form and structure","Frame narrative."],["Perceptive reading","A warning passed on."],["Context","Romantic ideas."],["Writer's intention","To show cycles of ambition."]],"th":"Knowledge · Ambition · Warning"}]},{"n":"Elizabeth","k":"Character","sum":"Victor’s adopted sister and bride, a victim of his ambition.","quotes":[{"q":"a pretty present for my Victor","src":"Victor’s mother, Chapter 1","f":[["Language","Elizabeth is presented as a gift."],["Form and structure","Possessive language."],["Perceptive reading","Women treated as objects."],["Context","Gender roles."],["Writer's intention","To criticise women’s passivity."]],"th":"Gender · Family · Love"},{"q":"She was there, lifeless and inanimate, thrown across the bed","src":"Victor, Chapter 23","f":[["Language","Brutal image of death."],["Form and structure","Climax of revenge."],["Perceptive reading","Victor’s ambition kills her."],["Context","Gothic horror."],["Writer's intention","To show consequences."]],"th":"Death · Revenge · Love"},{"q":"the beautiful and adored companion of all my occupations and my pleasures","src":"Victor, Chapter 1","f":[["Language","Idealised description."],["Form and structure","Possessive tone."],["Perceptive reading","Elizabeth lacks her own voice."],["Context","Ideal Victorian woman."],["Writer's intention","To show passive women."]],"th":"Gender · Love · Family"}]},{"n":"Isolation","k":"Theme","sum":"Rejection and loneliness turn characters to despair and violence.","quotes":[{"q":"I was benevolent and good; misery made me a fiend","src":"The Creature, Chapter 10","f":[["Language","Contrast shows transformation."],["Form and structure","Balanced sentence."],["Perceptive reading","Society creates evil."],["Context","Rousseau’s ideas of nature."],["Writer's intention","To argue for compassion."]],"th":"Isolation · Nurture · Morality"},{"q":"Satan had his companions, fellow devils","src":"The Creature, Chapter 15","f":[["Language","Even Satan was less alone."],["Form and structure","Biblical allusion."],["Perceptive reading","His isolation is absolute."],["Context","Paradise Lost."],["Writer's intention","To create sympathy."]],"th":"Isolation · Religion · Rejection"},{"q":"When I looked around I saw and heard of none like me","src":"The Creature, Chapter 13","f":[["Language","He realises he is unique and alone."],["Form and structure","Reflective tone."],["Perceptive reading","Identity crisis."],["Context","Enlightenment ideas."],["Writer's intention","To show loneliness."]],"th":"Isolation · Identity · Rejection"}]},{"n":"Science and creation","k":"Theme","sum":"Unchecked science creates horror.","quotes":[{"q":"dull yellow eye of the creature open","src":"Victor, Chapter 5","f":[["Language","Colour imagery creates horror."],["Form and structure","Moment of creation."],["Perceptive reading","Life without beauty."],["Context","Galvanism."],["Writer's intention","To create horror."]],"th":"Science · Horror · Creation"},{"q":"his yellow skin scarcely covered the work of muscles and arteries","src":"Victor, Chapter 5","f":[["Language","Grotesque detail."],["Form and structure","Gothic description."],["Perceptive reading","Creation is unnatural."],["Context","Anatomy studies."],["Writer's intention","To show science’s dark side."]],"th":"Science · Horror · Nature"},{"q":"Learn from me","src":"Victor, Chapter 4","f":[["Language","Imperative warning."],["Form and structure","Narrative frame."],["Perceptive reading","Knowledge’s danger."],["Context","Enlightenment."],["Writer's intention","To warn readers."]],"th":"Science · Ambition · Danger"}]}],"ctx9":[["Galvanism","Scientists experimented with electricity on dead bodies.","Victor’s ‘spark of being’ reflects real experiments that made reanimation seem possible."],["Romanticism","Nature was seen as sublime and healing.","Victor finds peace in the Alps, suggesting nature’s power to restore what ambition destroys."],["Prometheus","The Titan punished for giving fire to humanity.","The subtitle presents Victor as a modern Prometheus, punished for overreaching."],["Paradise Lost","Milton’s epic about Satan’s rebellion.","The creature’s comparison to ‘the fallen angel’ shows him rejected by his creator."],["Nature versus nurture","Rousseau argued humans are born good and corrupted by society.","The creature’s claim that ‘misery made me a fiend’ argues that society creates monsters."],["Mary Shelley","Wrote the novel at 18; her mother died soon after her birth.","Shelley’s own losses may shape the novel’s focus on absent parents and abandoned creations."]],"voc":{"v":[["hubris","excessive pride","Victor’s hubris leads him to play God."],["abhorrent","inspiring disgust","Victor finds his creation abhorrent."],["isolation","being alone and cut off","Isolation turns the Creature to violence."],["monstrous","very ugly or wicked","The novel asks who is truly monstrous."],["benevolent","kind","The Creature begins benevolent but is rejected."],["transgressive","going beyond accepted limits","Victor’s science is transgressive."],["sublime","awe inspiring beauty or terror","The sublime Alps contrast with Victor’s guilt."],["culpability","responsibility for wrongdoing","Victor never fully accepts his culpability."]],"m":[["L","Biblical allusion","I ought to be thy Adam, but I am rather the fallen angel","The Creature compares himself to Satan, casting Victor as a failed God.",1],["L","Emotive contrast","I was benevolent and good; misery made me a fiend","Society, not nature, creates monsters.",1],["S","Frame narrative","Walton’s letters frame Victor’s and the Creature’s stories","Layers of narration make truth uncertain.",0],["S","Parallel characters","Walton mirrors Victor","Walton’s choice to turn back shows a lesson learned.",0],["F","Gothic","Night time creation and graveyards","Gothic horror explores the dangers of ambition.",0],["F","Epistolary","Letters to Margaret","The letter form creates intimacy and a sense of truth.",0]]},"chron":[{"r":"Letter 4","m":"Walton, trapped in Arctic ice, writes to his sister about his ambition.","q":"One man’s life or death were but a small price to pay","t1":["Hyperbolic understatement","A human life is called ‘a small price’.","Walton values discovery above life.","His recklessness mirrors Victor’s, so the frame narrator is a warning double before Victor even appears."],"t2":["Economic metaphor","‘price’ and ‘pay’ turn life into a transaction.","Knowledge is something to be bought at any cost.","The novel will reveal the true price, paid by William, Justine, Clerval and Elizabeth."],"cx":"Polar exploration fascinated readers in 1818, as expeditions searched for the Northwest Passage.","wi":"Shelley opens with an ambitious explorer so readers see Victor’s story as a lesson Walton must learn."},{"r":"Chapter 4","m":"Victor, narrating his story, warns Walton about the pursuit of knowledge.","q":"Learn from me, if not by my precepts, at least by my example, how dangerous is the acquirement of knowledge","t1":["Imperative","‘Learn from me’ addresses Walton and the reader.","Victor casts himself as a cautionary tale.","The novel becomes didactic, warning against science that ignores ethics."],"t2":["Retrospective narration","Victor tells the story after the disasters.","His hindsight creates foreboding.","Readers know the outcome is tragic before it unfolds, building dramatic tension."],"cx":"The Romantic movement questioned the Enlightenment’s faith in unlimited scientific progress.","wi":"Shelley warns readers about the dangers of ambition without responsibility."},{"r":"Chapter 5","m":"Victor brings the creature to life and immediately recoils.","q":"the beauty of the dream vanished, and breathless horror and disgust filled my heart","t1":["Contrast","‘beauty of the dream’ is set against ‘horror and disgust’.","Victor’s fantasy collapses into revulsion.","His rejection is based on appearance, the first of many judgements that will turn the creature to violence."],"t2":["Emotive language","‘breathless horror’ shows physical shock.","Victor is overwhelmed.","His failure to care for his creation mirrors a parent abandoning a child."],"cx":"Galvanism experiments used electricity to make dead animals twitch, fuelling ideas about reanimation.","wi":"Shelley shows the moral failure of a creator who abandons responsibility."},{"r":"Chapter 10","m":"The creature confronts Victor on the glacier at Montanvert.","q":"I ought to be thy Adam, but I am rather the fallen angel","t1":["Biblical allusion","The creature compares himself to Adam and Satan from ‘Paradise Lost’.","He should have been loved like God’s first creation but was cast out.","Victor is cast as a failed God, so the novel questions humans playing creator."],"t2":["Archaic pronoun","‘thy’ creates formal, biblical language.","The creature speaks eloquently.","His articulate voice challenges the idea that he is a monster."],"cx":"Milton’s ‘Paradise Lost’ was central to Romantic thought about rebellion and creation.","wi":"Shelley makes readers question who the real monster is."},{"r":"Chapter 13","m":"Hidden in the hovel, the creature realises how alone he is in the world.","q":"When I looked around I saw and heard of none like me","t1":["Verbs of perception","‘looked’, ‘saw’ and ‘heard’ show him searching for others.","He longs for companionship and recognition.","His education through the De Laceys teaches him what he lacks, so knowledge brings pain rather than joy, echoing Victor."],"t2":["First person nested narrative","The creature tells his own story at the centre of the novel.","Readers hear his voice directly, without Victor’s prejudice.","Placing his narrative at the heart of the book gives the ‘monster’ the moral centre, challenging our first impression of him."],"cx":"Romantic writers such as Rousseau valued feeling, sympathy and the natural goodness of the outcast.","wi":"Shelley builds sympathy for the rejected so readers question who deserves the label ‘monster’."},{"r":"Chapter 17","m":"The creature demands that Victor make him a female companion.","q":"I am malicious because I am miserable","t1":["Cause and effect structure","‘because’ links malice directly to misery.","Rejection, not nature, has created his violence.","The line is the novel’s central argument that society makes its own monsters."],"t2":["Alliteration","‘malicious’ and ‘miserable’ are bound by the repeated ‘m’.","The sound ties cause and effect together.","The memorable phrasing makes his argument as persuasive as a legal plea, testing Victor’s, and our, sense of justice."],"cx":"Rousseau argued that humans are born good but corrupted by society.","wi":"Shelley suggests that cruelty breeds cruelty, urging compassion for outsiders."},{"r":"Chapter 20","m":"After Victor destroys the half finished female, the creature threatens him.","q":"I shall be with you on your wedding-night","t1":["Ominous modal verb","‘shall’ makes the threat certain.","The creature will strike at Victor’s happiness.","Victor assumes he is the target, so his selfishness blinds him to the danger to Elizabeth, a tragic irony."],"t2":["Foreshadowing","The line predicts the novel’s darkest moment.","Suspense builds as the wedding approaches.","The wedding night, a symbol of new life, will become a scene of death, reversing creation."],"cx":"Gothic novels thrived on revenge, doubles and the violation of domestic safety.","wi":"Shelley builds Gothic dread and shows the consequences of Victor’s broken promise."},{"r":"Chapter 23","m":"Victor finds Elizabeth murdered on their wedding night.","q":"She was there, lifeless and inanimate, thrown across the bed","t1":["Adjectives of death","‘lifeless and inanimate’ repeat the idea of death.","Elizabeth is reduced to an object.","‘inanimate’ echoes the lifeless matter Victor once animated, so his ambition to create life is reversed into destruction."],"t2":["Passive verb","‘thrown’ shows violence done to her.","She is powerless, as women in the novel often are.","Justine, Elizabeth and the female creature all suffer for men’s ambition, revealing Shelley’s critique of male power."],"cx":"Women in 1818 had little legal or social power; Shelley’s own mother, Mary Wollstonecraft, argued for women’s rights.","wi":"Shelley shows that the cost of male ambition falls on innocent women."}]},{"id":"sf","title":"The Sign of Four","author":"Arthur Conan Doyle","kind":"19th century novel","paper":"Paper 1, Section B","col":"#263238","ctx":[["Empire","Britain ruled India; the Indian Mutiny of 1857 shaped the plot."],["Victorian London","Fog, crime and poverty filled the city."],["Detective fiction","Holmes uses logic and deduction."],["Drugs","Cocaine was legal and used medically."],["Prejudice","Racist attitudes to colonised peoples were common."]],"groups":[{"n":"Sherlock Holmes","k":"Character","sum":"A brilliant detective who craves mental stimulation.","quotes":[{"q":"My mind rebels at stagnation","src":"Holmes, Chapter 1","f":[["Language","Personification of his mind."],["Form and structure","Opening chapter."],["Perceptive reading","He needs puzzles to live."],["Context","Victorian intellectual ideals."],["Writer's intention","To show his genius."]],"th":"Intellect · Boredom · Crime"},{"q":"when you have eliminated the impossible, whatever remains, however improbable, must be the truth","src":"Holmes, Chapter 6","f":[["Language","Logical reasoning."],["Form and structure","Famous principle."],["Perceptive reading","Deduction over emotion."],["Context","Scientific method."],["Writer's intention","To celebrate logic."]],"th":"Deduction · Truth · Intellect"},{"q":"For me, there still remains the cocaine-bottle.","src":"Holmes, Chapter 12","f":[["Language","Final line shows emptiness."],["Form and structure","Ending reveals darkness."],["Perceptive reading","Genius has a cost."],["Context","Drug use in Victorian era."],["Writer's intention","To show his flaws."]],"th":"Addiction · Isolation · Intellect"}]},{"n":"Watson and Mary","k":"Character","sum":"Holmes’s companion and the woman he falls in love with.","quotes":[{"q":"What a very attractive woman!","src":"Watson, Chapter 2","f":[["Language","Exclamation shows attraction."],["Form and structure","Contrast with Holmes."],["Perceptive reading","Emotion versus logic."],["Context","Romance in detective fiction."],["Writer's intention","To show Watson’s warmth."]],"th":"Love · Emotion · Gender"},{"q":"Miss Morstan entered the room with a firm step and an outward composure of manner","src":"Watson, Chapter 2","f":[["Language","Mary is composed and strong."],["Form and structure","First impression."],["Perceptive reading","Victorian ideal woman."],["Context","Gender roles."],["Writer's intention","To present Mary positively."]],"th":"Gender · Character · Love"},{"q":"Thank God!","src":"Watson, Chapter 11","f":[["Language","Relief that the treasure is lost."],["Form and structure","Love over wealth."],["Perceptive reading","He can now propose."],["Context","Class and wealth."],["Writer's intention","To show love above money."]],"th":"Love · Money · Class"}]},{"n":"Jonathan Small","k":"Character","sum":"A one-legged convict seeking the Agra treasure.","quotes":[{"q":"The sign of the four","src":"Note left at the crime scene, Chapter 6","f":[["Language","The pact’s name."],["Form and structure","Title significance."],["Perceptive reading","Loyalty among criminals."],["Context","Empire and crime."],["Writer's intention","To show bonds."]],"th":"Loyalty · Crime · Empire"},{"q":"Jonathan, with his wooden leg, is utterly unable to reach the lofty room","src":"Holmes, Chapter 6","f":[["Language","Physical detail marks Small as damaged by his past."],["Form and structure","Holmes deduces from clues."],["Perceptive reading","His body bears the cost of empire."],["Context","Colonial wars left men injured."],["Writer's intention","To link crime to empire."]],"th":"Identity · Crime · Empire"},{"q":"the Indian Mutiny","src":"Narrator, background","f":[["Language","Historical event."],["Form and structure","Backstory."],["Perceptive reading","Empire’s violence."],["Context","1857 rebellion."],["Writer's intention","To link crime and empire."]],"th":"Empire · Violence · Crime"}]},{"n":"Tonga and empire","k":"Theme","sum":"Doyle’s portrayal reflects Victorian imperial prejudice.","quotes":[{"q":"savage, distorted creature","src":"Holmes and Watson about Tonga","f":[["Language","Dehumanising language."],["Form and structure","Climax chase."],["Perceptive reading","Imperial racism."],["Context","Colonial attitudes."],["Writer's intention","To expose prejudice, read critically."]],"th":"Empire · Prejudice · Identity"},{"q":"naturally hideous","src":"Holmes reading a gazetteer, Chapter 8","f":[["Language","Racist description."],["Form and structure","From a reference book."],["Perceptive reading","Victorian pseudoscience."],["Context","Scientific racism."],["Writer's intention","To show imperial attitudes."]],"th":"Empire · Prejudice · Science"},{"q":"a little black man","src":"Small, Chapter 12","f":[["Language","Diminutive language."],["Form and structure","Colonial voice."],["Perceptive reading","Prejudice in narrative."],["Context","Empire."],["Writer's intention","To show attitudes."]],"th":"Empire · Prejudice · Identity"}]},{"n":"London","k":"Setting","sum":"A foggy, dangerous city full of crime.","quotes":[{"q":"dense drizzly fog lay low upon the great city","src":"Watson, Chapter 3","f":[["Language","Pathetic fallacy."],["Form and structure","Gothic atmosphere."],["Perceptive reading","Fog hides crime."],["Context","Victorian London fog."],["Writer's intention","To create mystery."]],"th":"Setting · Mystery · Crime"},{"q":"Mud-coloured clouds drooped sadly over the muddy streets","src":"Watson, Chapter 3","f":[["Language","Personified clouds."],["Form and structure","Gloomy description."],["Perceptive reading","City reflects mood."],["Context","Industrial pollution."],["Writer's intention","To create gloom."]],"th":"Setting · Mood · Crime"},{"q":"monster tentacles","src":"Watson, Chapter 3","f":[["Language","Metaphor of the city."],["Form and structure","Gothic imagery."],["Perceptive reading","London as a beast."],["Context","Urban growth."],["Writer's intention","To show danger."]],"th":"Setting · Danger · Crime"}],"pctx":["Blake (1757 to 1827) was a radical poet and engraver; ‘London’ (1794) appeared in Songs of Experience during the French Revolution.","Blake’s ‘mind-forg’d manacles’ suggest that the people’s oppression is both imposed and self accepted."]},{"n":"Crime and deduction","k":"Theme","sum":"The novel celebrates logic while exposing greed.","quotes":[{"q":"Detection is, or ought to be, an exact science","src":"Holmes, Chapter 1","f":[["Language","Scientific language."],["Form and structure","Holmes’s philosophy."],["Perceptive reading","Logic defines him."],["Context","Scientific progress."],["Writer's intention","To present detection as science."]],"th":"Deduction · Science · Crime"},{"q":"You really are an automaton","src":"Watson to Holmes, Chapter 2","f":[["Language","Metaphor of a machine."],["Form and structure","Watson’s criticism."],["Perceptive reading","Holmes lacks emotion."],["Context","Industrial age."],["Writer's intention","To show his coldness."]],"th":"Emotion · Intellect · Identity"},{"q":"the Agra treasure","src":"Throughout","f":[["Language","Symbol of greed."],["Form and structure","Drives the plot."],["Perceptive reading","Wealth corrupts."],["Context","Imperial plunder."],["Writer's intention","To criticise greed."]],"th":"Greed · Empire · Crime"}]}],"ctx9":[["The British Empire","Britain ruled India; the 1857 Indian Mutiny shaped British fears.","The Agra treasure, stolen during the Mutiny, links London’s crime to imperial greed."],["Victorian London","A foggy, overcrowded city of crime and poverty.","Doyle’s ‘mud-coloured clouds’ create a city where crime thrives in obscurity."],["Detective fiction","A popular genre celebrating logic.","Holmes’s deduction reflects Victorian faith in science and reason."],["Drugs","Cocaine was legal and used medically.","Holmes’s cocaine habit shows the darker side of genius and boredom."],["Racism and empire","Victorian pseudoscience promoted racist ideas.","Tonga’s dehumanising description reflects imperial racism that modern readers must read critically."],["Women","Women were expected to be gentle and dependent.","Mary Morstan is presented as an ideal Victorian woman, contrasting with the violence around her."]],"voc":{"v":[["deduction","reaching a conclusion through reasoning","Holmes uses deduction to solve the crime."],["imperialism","a country extending power over others","The novel reflects Victorian imperialism through the Agra treasure."],["xenophobic","fearful of foreigners","The description of Tonga is xenophobic."],["stagnation","inactivity","Holmes hates stagnation, turning to cocaine."],["avarice","extreme greed","Avarice drives the theft of the treasure."],["rational","based on logic","Holmes is rational, while Watson is emotional."],["exotic","from a distant country","The East is presented as exotic and dangerous."],["corruption","dishonest behaviour","The treasure brings corruption to all who seek it."]],"m":[["L","Pathetic fallacy","dense drizzly fog lay low upon the great city","The fog creates mystery and moral murk.",1],["L","Dehumanising language","savage, distorted creature","Racist imagery reflects imperial attitudes.",1],["S","Small’s confession","The backstory is told at the end","Delayed explanation reveals the past crime.",0],["S","Chase sequence","The boat chase on the Thames","Action creates excitement before the resolution.",0],["F","Detective fiction","Crime, clues and solution","The genre reassures readers that order can be restored.",0],["F","First person narrator","Watson narrates","We see Holmes’s genius through an admiring friend.",0]]},"chron":[{"r":"Chapter 1: The Science of Deduction","m":"Bored between cases, Holmes justifies his cocaine use to Watson.","q":"My mind… rebels at stagnation","t1":["Personification","His ‘mind rebels’ as if it were a separate, restless being.","Holmes needs constant stimulation.","The violent verb suggests his genius is close to addiction, explaining his drug use."],"t2":["Abstract noun","‘stagnation’ suggests still, rotting water.","Ordinary life feels decaying to him.","Holmes’s restlessness mirrors a Victorian culture obsessed with progress."],"cx":"Cocaine was legal in the 1880s and some doctors praised it as a stimulant.","wi":"Conan Doyle presents Holmes as a flawed genius, fascinating readers."},{"r":"Chapter 1: The Science of Deduction","m":"Holmes explains his method.","q":"Detection is, or ought to be, an exact science","t1":["Scientific metaphor","Detection is compared to science.","Holmes values logic and evidence.","The novella celebrates Victorian faith in reason to solve problems."],"t2":["Self correction","‘or ought to be’ qualifies the claim.","Holmes admits the ideal is not always achieved.","It suggests the messy human world resists perfect logic."],"cx":"The Victorian period saw rapid advances in forensic science.","wi":"Conan Doyle presents reason as the answer to crime and disorder."},{"r":"Chapter 2: The Statement of the Case","m":"Mary Morstan arrives at Baker Street to ask for help.","q":"Miss Morstan entered the room with a firm step and an outward composure of manner","t1":["Adjectives of strength","‘firm’ and ‘composure’ suggest a calm, capable woman.","Mary is not the hysterical heroine of sensation fiction.","‘outward’ hints that she hides anxiety beneath her control, inviting Watson’s sympathy."],"t2":["Watson’s first person perspective","Watson describes her admiringly.","The romance plot begins through his eyes.","His emotional response contrasts with Holmes’s cold reasoning, setting up the novella’s tension between heart and head."],"cx":"Victorian ideals of womanhood valued modesty, composure and self control.","wi":"Conan Doyle blends a romance with the mystery to appeal to a wide readership."},{"r":"Chapter 3: In Quest of a Solution","m":"Holmes, Watson and Mary drive through London to a mysterious meeting.","q":"dense drizzly fog lay low upon the great city","t1":["Pathetic fallacy","The fog creates an atmosphere of mystery.","London becomes hidden, confusing and dangerous.","The fog also suggests the moral murk of a capital built on imperial wealth, like the stolen Agra treasure."],"t2":["Alliteration","‘dense drizzly’ creates a heavy, slow sound.","The line feels oppressive.","The ‘great city’ is diminished beneath the fog, hinting that its greatness hides darkness."],"cx":"London’s coal smoke fogs were notorious, and the city was the heart of the British Empire.","wi":"Conan Doyle creates a Gothic atmosphere that turns London itself into a source of mystery."},{"r":"Chapter 6: Sherlock Holmes Gives a Demonstration","m":"Holmes explains how to reason about the locked room at Pondicherry Lodge.","q":"when you have eliminated the impossible, whatever remains, however improbable, must be the truth","t1":["Aphorism","The maxim is phrased like a scientific law.","Holmes’s method seems absolute and reliable.","It reassures readers that even baffling crimes can be solved by reason."],"t2":["Antithesis","‘impossible’ is distinguished from ‘improbable’.","The subtle distinction shows Holmes’s precise mind.","It invites readers to think like a detective, part of the genre’s pleasure."],"cx":"The late Victorian era trusted science and logic to explain the world.","wi":"Conan Doyle celebrates rational deduction as a source of order."},{"r":"Chapter 10: The End of the Islander","m":"During the Thames chase, Tonga appears at the stern of the boat.","q":"savage, distorted creature","t1":["Dehumanising adjectives","‘savage’ and ‘distorted’ deny Tonga’s humanity.","He is presented as monstrous and primitive.","The description reflects imperial racism that justified colonial rule."],"t2":["Noun ‘creature’","Tonga is called a ‘creature’ rather than a man.","He is ‘othered’ completely.","Modern readers see the prejudice of Watson’s narration, which the novella never questions."],"cx":"Victorian imperialism portrayed colonised peoples as savage to justify empire.","wi":"Conan Doyle reflects the imperial attitudes of his readers, which modern readers can challenge."},{"r":"Chapter 12: The Strange Story of Jonathan Small","m":"Small confesses the history of the Agra treasure and the pact of the four.","q":"The sign of the four","t1":["Symbolism","The sign represents an oath between four men.","Loyalty binds them together.","The pact is built on theft and murder, exposing the greed at the heart of empire."],"t2":["Title echo","The phrase gives the novel its title.","It links the London crime to its roots in India.","The crime is literally imported from the Empire, suggesting imperial wealth carries guilt home."],"cx":"The Indian Rebellion of 1857 shaped British fears and attitudes towards India.","wi":"Conan Doyle links crime to empire, suggesting the colonial past haunts Britain."},{"r":"Chapter 12: The Strange Story of Jonathan Small","m":"Watson is engaged to Mary; Holmes reflects on what is left for him.","q":"For me, there still remains the cocaine-bottle.","t1":["Final line","The novella ends on Holmes’s drug.","His loneliness is exposed at the moment of Watson’s happiness.","The genius who solves every mystery cannot solve his own emptiness."],"t2":["Contrast","Watson gains love while Holmes is left with a bottle.","Emotion and reason are set against each other.","The ending suggests reason alone cannot bring fulfilment."],"cx":"Cocaine was legal and fashionable in the 1880s, but its dangers were becoming known.","wi":"Conan Doyle ends on a melancholy note that makes Holmes more complex and human."}]},{"id":"aic","title":"An Inspector Calls","author":"Priestley","kind":"Modern play","paper":"Paper 2, Section A","col":"#A1263A","ctx":[["1912 setting","Edwardian Britain: rigid class system, no welfare state, women could not vote."],["1945 audience","Two world wars, shared wartime sacrifice and the Labour landslide of July 1945."],["Priestley's socialism","He co-founded the Common Wealth Party and broadcast about a fairer Britain."],["The welfare state","The NHS and welfare state were about to put ‘one body’ into practice."],["Titanic, 1912","Birling calls it ‘unsinkable’; the audience knows it sank."]],"groups":[{"n":"Inspector Goole","k":"Character","sum":"","quotes":[{"q":"an impression of massiveness, solidity and purposefulness","src":"Stage direction, Act 1","f":[["Language","The abstract nouns ‘massiveness’ and ‘solidity’ make the Inspector seem physically and morally weighty, while ‘purposefulness’ shows he has come with a clear aim."],["Form","Priestley uses the stage direction to tell the actor and director how the Inspector should dominate the stage before he even speaks."],["Structure","He arrives just after Birling’s speech about a man looking after himself, so his entrance seems to answer and challenge that selfish view."],["Context","The play is set in 1912 but was written in 1945, when Priestley wanted Britain to build a fairer society after the Second World War."],["Writer's intention","Priestley presents the Inspector as a powerful moral force who will expose the Birlings and teach the message of social responsibility."],["Effect on a 1945 audience","After six years of war, a 1945 audience would see the Inspector as the voice of a new, fairer Britain arriving to challenge the complacent rich of 1912."]],"th":"Social responsibility · Power · Appearance and reality"},{"q":"responsibilities as well as privileges.","src":"The Inspector to Mr Birling","f":[["Language","The balanced contrast between ‘responsibilities’ and ‘privileges’ reminds Birling that wealth and status bring duties to others, not just benefits."],["Form","The Inspector speaks calmly and directly, refusing to be impressed by Birling’s position as a former Lord Mayor and magistrate."],["Structure","The line comes as Birling tries to use his status to control the interrogation, showing that the Inspector cannot be intimidated."],["Context","In 1912 the wealthy had huge power and little duty to help the poor; by 1945, many voters wanted a welfare state."],["Writer's intention","Priestley presents social responsibility as the duty of the powerful, criticising capitalists who enjoy privilege without care for others."],["Effect on a 1945 audience","Voters who had just elected a Labour government in 1945 would see this as the principle behind the welfare state: wealth must serve the whole community."]],"th":"Social responsibility · Class · Capitalism and socialism"},{"q":"It’s better to ask for the earth than to take it.","src":"The Inspector to Mr Birling, Act 1","f":[["Language","The Inspector turns Birling’s own phrase ‘asking for the earth’ against him, suggesting that the rich, not the poor, are the real takers."],["Form","The short, proverb like sentence sounds like a moral lesson, showing the Inspector’s role as a teacher."],["Structure","It comes in Act 1, as Birling explains why he sacked Eva for asking for higher wages, setting up the first moral challenge."],["Context","Eva led a strike for a pay rise of a few shillings; strikes over low pay were common in the years before the First World War."],["Writer's intention","Priestley presents class inequality through the Inspector, defending workers who ask for fair treatment."],["Effect on a 1945 audience","A 1945 audience, many of them workers who had sacrificed in the war, would cheer this rebuke of employers who ‘take’ while condemning the poor for ‘asking’."]],"th":"Class · Capitalism and socialism · Social responsibility"}]},{"n":"Arthur Birling","k":"Character","sum":"","quotes":[{"q":"unsinkable, absolutely unsinkable","src":"Mr Birling on the Titanic, Act 1","f":[["Language","The repetition and the adverb ‘absolutely’ show Birling’s arrogant certainty, which the audience knows is completely wrong."],["Form","Dramatic irony: the 1945 audience knew the Titanic sank in April 1912, so Birling is made to look foolish."],["Structure","This comes in his opening speech, so Priestley undermines Birling’s judgement before the Inspector arrives."],["Context","Birling also claims there will be no war, yet the First World War began in 1914 and the Second in 1939."],["Writer's intention","Priestley presents capitalist confidence as blind and dangerous, encouraging the audience to reject Birling’s views."],["Effect on a 1945 audience","In 1945 the audience knows the Titanic sank and two world wars followed, so Birling’s confidence is ridiculous and his capitalist views are discredited."]],"th":"Capitalism and socialism · Age and generations · Power"},{"q":"community and all that nonsense","src":"Mr Birling, Act 1","f":[["Language","The dismissive noun ‘nonsense’ shows his contempt for the idea that people should look after one another."],["Form","His long, self satisfied speeches to Gerald and Eric show him lecturing the younger generation."],["Structure","His selfish views are interrupted by the doorbell as the Inspector arrives, as if the play itself rejects them."],["Context","Priestley was a socialist who helped found the Common Wealth Party in 1942 and campaigned for a fairer Britain."],["Writer's intention","Priestley presents Birling as a mouthpiece for selfish capitalism, the opposite of social responsibility."],["Effect on a 1945 audience","After the shared sacrifice of the Blitz and rationing, a 1945 audience valued community, so Birling’s sneer would make him seem selfish and out of touch."]],"th":"Social responsibility · Capitalism and socialism · Age and generations"},{"q":"I’d give thousands","src":"Mr Birling to the Inspector, Act 3","f":[["Language","The offer of ‘thousands’ shows Birling believes money can solve any problem, even a death."],["Form","His broken, desperate speech contrasts with his confident tone in Act 1, showing he is losing control."],["Structure","This comes after Eric’s confession in Act 3, when Birling’s main fear is a public scandal."],["Context","Eva was sacked for asking for a few extra shillings a week, so his offer now highlights his hypocrisy."],["Writer's intention","Priestley presents class and money as Birling’s only values, showing he has learned nothing about responsibility."],["Effect on a 1945 audience","A 1945 audience rebuilding a fairer society would be disgusted that he tries to buy his way out of guilt instead of accepting responsibility."]],"th":"Guilt and blame · Class · Morality and hypocrisy"}]},{"n":"Sybil Birling","k":"Character","sum":"","quotes":[{"q":"a rather cold woman and her husband’s social superior","src":"Stage direction, Act 1","f":[["Language","The adjective ‘cold’ suggests she lacks warmth and compassion, while ‘social superior’ shows she comes from a higher class than her husband."],["Form","Priestley uses the stage direction to establish her character before she speaks, guiding the actor’s performance."],["Structure","This description at the start prepares the audience for her lack of sympathy when she is questioned in Act 2."],["Context","In Edwardian society, class was rigid, and upper class women often looked down on those who made money through trade."],["Writer's intention","Priestley presents Mrs Birling as a symbol of upper class snobbery and the coldness of the privileged."],["Effect on a 1945 audience","Many in 1945 had seen class barriers weaken during the war, so Sybil’s coldness and snobbery would mark her as a symbol of an unfair old order."]],"th":"Class · Social responsibility · Gender"},{"q":"Girls of that class","src":"Mrs Birling about Eva, Act 2","f":[["Language","The noun ‘class’ shows she judges Eva by her social position rather than as an individual."],["Form","Her short, dismissive phrases show her refusal to engage with the Inspector’s questions."],["Structure","This comes during her interrogation in Act 2, when she still believes she did nothing wrong."],["Context","Mrs Birling chairs the Brumley Women’s Charity Organisation, yet she refused to help Eva when she asked for help."],["Writer's intention","Priestley presents class prejudice through Mrs Birling, exposing the hypocrisy of upper class charity."],["Effect on a 1945 audience","After working class people had fought and worked for the nation, a 1945 audience would be angered by her contempt for ‘Girls of that class’."]],"th":"Class · Gender · Social responsibility"},{"q":"she had only herself to blame","src":"Mrs Birling, Act 2","f":[["Language","The pronoun ‘herself’ shifts all responsibility onto Eva, showing Mrs Birling’s refusal to accept guilt."],["Form","Dramatic irony: she blames the father of the child without realising it is her own son, Eric."],["Structure","Her insistence on blaming the father sets a trap she falls into at the end of Act 2, when Eric’s guilt is revealed."],["Context","Unmarried mothers in 1912 faced shame and poverty, with little support from society."],["Writer's intention","Priestley presents Mrs Birling as someone who avoids responsibility, showing how the powerful blame the powerless."],["Effect on a 1945 audience","A 1945 audience, believing in shared responsibility, would see her blaming the victim as the attitude Britain needed to leave behind."]],"th":"Guilt and blame · Morality and hypocrisy · Class · Gender"}]},{"n":"Sheila Birling","k":"Character","sum":"","quotes":[{"q":"very pleased with life and rather excited","src":"Stage direction, Act 1","f":[["Language","The adjectives show Sheila is happy and carefree at the start, enjoying her engagement and comfortable life."],["Form","The stage direction presents her as young and naive, establishing a starting point for her character’s change."],["Structure","Her happiness at the opening contrasts with her guilt and maturity by the end, showing her development."],["Context","Young women of Sheila’s class in 1912 were expected to marry well and had little independence."],["Writer's intention","Priestley presents Sheila as a character who will change most, showing hope for the younger generation."],["Effect on a 1945 audience","Women in 1945 had worked in factories and served in the war, so they would recognise how far Sheila must grow from this sheltered, carefree girl."]],"th":"Gender · Age and generations · Change"},{"q":"these girls aren’t cheap labour","src":"Sheila to her father, Act 1","f":[["Language","The phrase ‘cheap labour’ shows Sheila rejecting her father’s view of workers as tools for profit, as she insists they are people."],["Form","Her direct contradiction of her father shows her beginning to challenge his authority."],["Structure","This comes early in Act 1, showing that Sheila is quick to sympathise with Eva even before her own part is revealed."],["Context","Women workers in 1912 were paid less than men and had few rights at work."],["Writer's intention","Priestley presents social responsibility through Sheila, who begins to see workers as human beings."],["Effect on a 1945 audience","A 1945 audience would see Sheila as the hopeful voice of the young, who rejected the idea that workers are simply ‘labour’ to be exploited."]],"th":"Class · Social responsibility · Age and generations · Capitalism and socialism"},{"q":"it frightens me the way you talk","src":"Sheila to her parents, Act 3","f":[["Language","The verb ‘frightens’ shows that Sheila is now disturbed by her parents’ refusal to change."],["Form","Her lines in Act 3 echo the Inspector’s views, as if she has become his voice within the family."],["Structure","This comes near the end, when her parents try to pretend nothing has happened, showing the gap between generations."],["Context","Priestley believed the young people of 1945 could build a better society after two world wars."],["Writer's intention","Priestley presents generations as divided, with the young open to change and the old stuck in their ways."],["Effect on a 1945 audience","For a 1945 audience, Sheila’s fear of her parents’ attitude echoes the determination that the selfishness of the past must never return."]],"th":"Age and generations · Change · Social responsibility"}]},{"n":"Eric Birling","k":"Character","sum":"","quotes":[{"q":"half shy, half assertive","src":"Stage direction, Act 1","f":[["Language","The contrasting adjectives ‘shy’ and ‘assertive’ show that Eric is awkward and uncomfortable, unsure of his place in the family."],["Form","The stage direction hints to the audience that Eric is hiding something from the very start."],["Structure","His nervous behaviour in Act 1 prepares for the revelation of his drinking and his treatment of Eva in Act 3."],["Context","Young men of Eric’s class in 1912 were expected to follow their fathers into business, whatever their own wishes."],["Writer's intention","Priestley presents Eric as a troubled young man, showing the damage done by a cold, uncaring family."],["Effect on a 1945 audience","A 1945 audience would sense that something is wrong in this respectable family, preparing them for the hidden truths behind its comfortable surface."]],"th":"Appearance and reality · Age and generations · Guilt and blame"},{"q":"Why shouldn’t they try for higher wages?","src":"Eric to his father, Act 1","f":[["Language","The rhetorical question challenges his father’s treatment of workers, showing Eric’s sympathy for Eva and the strikers."],["Form","His interruption of his father’s story shows a young man beginning to question authority."],["Structure","This comes early, as Birling explains sacking Eva, showing the first sign of conflict between father and son."],["Context","Trade unions and strikes were growing in the years before the First World War, as workers fought for fairer pay."],["Writer's intention","Priestley presents class conflict through Eric, using the younger generation to challenge capitalist views."],["Effect on a 1945 audience","Post war audiences who supported workers’ rights and trade unions would agree with Eric’s simple, fair question and side against his father."]],"th":"Class · Capitalism and socialism · Age and generations · Social responsibility"},{"q":"you’re not the kind of father a chap could go to when he’s in trouble","src":"Eric to Mr Birling, Act 3","f":[["Language","The colloquial noun ‘chap’ and the phrase ‘in trouble’ show Eric’s frustration that he could never turn to his father for help."],["Form","This bitter accusation is one of the most emotional moments in the play, as Eric openly turns on his father."],["Structure","It comes in Act 3, after his confession, when the family begins to fall apart."],["Context","Edwardian fathers were often distant figures who expected obedience rather than offering emotional support."],["Writer's intention","Priestley presents a breakdown between generations, showing that Birling’s selfishness has harmed his own family."],["Effect on a 1945 audience","A 1945 audience would see that Birling’s selfish values have failed even his own family, making his views on responsibility seem empty."]],"th":"Age and generations · Social responsibility · Guilt and blame"}]},{"n":"Gerald Croft","k":"Character","sum":"","quotes":[{"q":"the easy well-bred young man-about-town","src":"Stage direction, Act 1","f":[["Language","The adjective ‘well-bred’ suggests Gerald’s upper class upbringing, and ‘man-about-town’ hints at a confident social life outside the home."],["Form","Priestley uses the stage direction to present Gerald as charming and socially polished."],["Structure","This first impression prepares for the revelation of his affair with Eva, then called Daisy Renton, in Act 2."],["Context","Gerald is the son of Sir George and Lady Croft, so his engagement to Sheila raises the Birlings’ social status."],["Writer's intention","Priestley presents Gerald as a symbol of the upper class, outwardly respectable but hiding secrets."],["Effect on a 1945 audience","A 1945 audience, suspicious of privilege, might admire Gerald’s charm at first but would come to see him as a product of the class that needed to change."]],"th":"Class · Appearance and reality · Gender"},{"q":"All right. I knew her. Let’s leave it at that.","src":"Gerald to Sheila, Act 1","f":[["Language","The short, clipped sentences show Gerald trying to end the conversation and avoid further questions."],["Form","His curt tone contrasts with his usual easy charm, showing he is under pressure."],["Structure","This admission comes just before the end of Act 1, building suspense for Act 2."],["Context","Upper class men in 1912 often kept mistresses, and such affairs were hidden to protect reputations."],["Writer's intention","Priestley presents Gerald as someone who hides the truth to protect himself, linking to the theme of responsibility."],["Effect on a 1945 audience","A 1945 audience would see Gerald as a man who expects his class to protect his secrets, which the Inspector is about to expose."]],"th":"Appearance and reality · Guilt and blame · Gender"},{"q":"Everything’s all right now, Sheila.","src":"Gerald to Sheila, Act 3","f":[["Language","The adjective phrase ‘all right’ shows Gerald’s relief that the Inspector may not have been real, as if nothing has changed."],["Form","He offers Sheila the ring again, showing he wants to return to the way things were."],["Structure","This comes just before the final phone call, so his relief is immediately undercut."],["Context","Priestley wanted his 1945 audience to reject the old attitudes that had led to inequality and war."],["Writer's intention","Priestley presents Gerald as part of the older way of thinking, unwilling to accept responsibility."],["Effect on a 1945 audience","In 1945, an audience determined that society must change would be frustrated that Gerald returns to the old attitudes as soon as he feels safe."]],"th":"Change · Guilt and blame · Gender · Social responsibility"}]},{"n":"Eva Smith","k":"Character","sum":"","quotes":[{"q":"Burnt her inside out, of course.","src":"The Inspector, Act 1","f":[["Language","The brutal image of being ‘Burnt’ from the inside shows the horror of Eva’s suicide by swallowing disinfectant."],["Form","The Inspector’s blunt, graphic language deliberately shocks the comfortable family, shattering the cheerful mood of the engagement party."],["Structure","This detail comes at the start of the investigation, so the horror of her death hangs over the whole play."],["Context","Many working class women in 1912 lived in poverty with no welfare state to support them."],["Writer's intention","Priestley presents Eva as a victim of the selfishness of the rich, making her death impossible to ignore."],["Effect on a 1945 audience","A 1945 audience who had seen wartime suffering would be horrified, and would recognise Eva’s death as the cost of a society without a safety net."]],"th":"Social responsibility · Class · Guilt and blame"},{"q":"as if she was an animal, a thing","src":"The Inspector to Eric, Act 3","f":[["Language","The nouns ‘animal’ and ‘thing’ show how Eric dehumanised Eva, using her without respect."],["Form","The Inspector’s anger shows his role as a voice for those who cannot speak for themselves."],["Structure","This comes in Act 3, after Eric’s confession, as the Inspector sums up how each member of the family used her."],["Context","Working class women in 1912 had little protection and were often exploited by wealthier men."],["Writer's intention","Priestley presents gender and class inequality through Eva, showing how she was treated as worthless."],["Effect on a 1945 audience","After a war fought against regimes that treated people as less than human, a 1945 audience would be disgusted that Eva was treated as ‘a thing’."]],"th":"Class · Gender · Social responsibility"},{"q":"elaborate fine feelings","src":"Mrs Birling about Eva, Act 2","f":[["Language","The sarcastic adjectives ‘elaborate’ and ‘fine’ show Mrs Birling mocking Eva for having pride and principles."],["Form","Her dismissive, sarcastic tone in front of the Inspector reveals her snobbery and complete lack of compassion."],["Structure","This comes during her interrogation, as she explains why she refused Eva help."],["Context","Upper class people often believed the poor could not have the same feelings or morals as themselves."],["Writer's intention","Priestley presents Eva as a person of dignity, exposing the prejudice of the wealthy."],["Effect on a 1945 audience","A 1945 audience would admire Eva’s dignity and see Mrs Birling’s sarcasm as the arrogant snobbery that the post war world rejected."]],"th":"Class · Gender · Morality and hypocrisy"}]},{"n":"Social Responsibility","k":"Theme","sum":"","quotes":[{"q":"We are members of one body.","src":"The Inspector’s final speech, Act 3","f":[["Language","The metaphor of ‘one body’ suggests that society is connected, so harming one person harms everyone, like an injury to a single body."],["Form","The Inspector’s final speech works like a sermon delivered to the audience as well as the family."],["Structure","It comes as his final speech just before he leaves, so it is the climax of the play’s message."],["Context","The phrase echoes the Bible, which describes Christians as members of one body; Priestley turns it into a call for social justice."],["Writer's intention","Priestley presents social responsibility as a moral duty, urging his audience to care for others."],["Effect on a 1945 audience","This line captures the spirit of 1945 Britain: a nation united by war, about to create the NHS and welfare state to care for every citizen."]],"th":"Social responsibility · Capitalism and socialism · Class"},{"q":"fire and blood and anguish.","src":"The Inspector’s final speech, Act 3","f":[["Language","The polysyndeton of ‘and’ builds a terrifying list, suggesting suffering that piles up without end."],["Form","The prophetic warning sounds almost biblical, giving the Inspector a mysterious, godlike authority."],["Structure","These are among his last words before he leaves, so the warning hangs over the rest of the play."],["Context","The 1945 audience had lived through two world wars, so they knew the ‘fire and blood’ had already come true."],["Writer's intention","Priestley presents a warning that selfishness leads to disaster, urging the audience to change."],["Effect on a 1945 audience","For a 1945 audience who had lived through two world wars, the prophecy has already come true, making the warning chillingly real."]],"th":"Social responsibility · Guilt and blame · Power"},{"q":"has to look after himself","src":"Mr Birling’s speech, Act 1","f":[["Language","The reflexive pronoun ‘himself’ sums up Birling’s selfish philosophy, focused only on his own interests."],["Form","His speech to the younger men is long and pompous, showing his arrogance."],["Structure","The doorbell interrupts his speech as the Inspector arrives, as if to challenge his views directly."],["Context","Birling’s views reflect the laissez faire capitalism of the Edwardian era, which Priestley opposed."],["Writer's intention","Priestley presents Birling’s selfishness as the opposite of social responsibility, to be rejected."],["Effect on a 1945 audience","A 1945 audience knew where this selfishness had led, so Birling’s speech would sound dangerous and wrong, especially as the Inspector interrupts it."]],"th":"Capitalism and socialism · Social responsibility · Age and generations"}]},{"n":"Class","k":"Theme","sum":"","quotes":[{"q":"millions and millions and millions of Eva Smiths and John Smiths","src":"The Inspector’s final speech, Act 3","f":[["Language","The repetition of ‘millions’ shows the huge number of working class people, while the common surname ‘Smith’ makes Eva represent them all."],["Form","The Inspector speaks to the family and to the audience, widening the play’s message to all of society."],["Structure","This comes in his final speech, turning one woman’s story into a lesson about the whole working class."],["Context","In 1945, the Labour Party won a landslide victory, promising a welfare state to support ordinary people."],["Writer's intention","Priestley presents class inequality as a national problem, showing that Eva stands for millions of workers."],["Effect on a 1945 audience","In 1945, with millions of ordinary people expecting a better life after the war, the audience would feel Eva stands for them all."]],"th":"Class · Social responsibility · Gender"},{"q":"a girl of that sort","src":"Mrs Birling about Eva, Act 2","f":[["Language","The phrase ‘that sort’ shows Mrs Birling’s snobbery, dismissing Eva as an inferior type of person."],["Form","Her dismissive tone shows her refusal to see Eva as an individual."],["Structure","This comes during her interrogation, as she tries to justify refusing Eva help."],["Context","Class divisions in 1912 were rigid, and many in the upper class believed the poor were morally inferior."],["Writer's intention","Priestley presents class prejudice as cruel and unjust, exposing the snobbery of the upper class."],["Effect on a 1945 audience","A 1945 audience that had seen people of all classes work together during the war would reject Mrs Birling’s dismissive snobbery."]],"th":"Class · Gender · Morality and hypocrisy"},{"q":"for lower costs and higher prices","src":"Mr Birling to Gerald, Act 1","f":[["Language","The contrast of ‘lower costs’ and ‘higher prices’ shows that Birling cares only about profit, not workers."],["Form","Birling’s toast at the engagement dinner shows he sees even marriage as a business deal."],["Structure","This comes in the opening scene, establishing Birling’s capitalist values from the start."],["Context","Birling hopes the marriage will join his firm with Crofts Limited, a larger and more established company."],["Writer's intention","Priestley presents class and capitalism as linked, showing that the rich profit at the expense of workers."],["Effect on a 1945 audience","Post war audiences hoping for fair wages and nationalised industries would see Birling’s greed as the very attitude that kept workers poor."]],"th":"Capitalism and socialism · Class · Gender"}]},{"n":"Gender","k":"Theme","sum":"","quotes":[{"q":"mean something quite different to a woman","src":"Mr Birling about clothes, Act 1","f":[["Language","The noun ‘woman’ shows Birling stereotyping women as interested only in appearance and fashion."],["Form","His patronising comment shows the attitudes of an Edwardian man towards women."],["Structure","This comes in Act 1, before Sheila begins to show her independence and moral strength."],["Context","In 1912 women could not vote, and the suffragettes were campaigning for women’s rights."],["Writer's intention","Priestley presents gender inequality through Birling’s patronising views, which the play challenges."],["Effect on a 1945 audience","Women in 1945 had proved themselves in factories and the forces, so Birling’s patronising view of women would seem old fashioned and insulting."]],"th":"Gender · Age and generations · Power"},{"q":"men with important work to do","src":"Mrs Birling to Sheila, Act 1","f":[["Language","The adjective ‘important’ shows Mrs Birling accepting that men’s work matters more than women’s lives."],["Form","Her advice to Sheila shows how women passed on traditional gender roles to their daughters."],["Structure","This comes in Act 1, setting up the contrast with Sheila’s growing independence later."],["Context","Married women in 1912 were expected to support their husbands and accept their absence."],["Writer's intention","Priestley presents traditional gender roles as limiting, showing women taught to accept a secondary place in marriage."],["Effect on a 1945 audience","A 1945 audience, many of whom had taken on ‘men’s work’ in the war, would see how unfairly women were expected to accept second place."]],"th":"Gender · Age and generations · Appearance and reality"},{"q":"I was in that state when a chap easily turns nasty","src":"Eric, Act 3","f":[["Language","The colloquial phrase ‘turns nasty’ shows Eric admitting his aggressive behaviour towards Eva while drunk."],["Form","His confession is uncomfortable and halting, and his use of ‘a chap’ suggests he is trying to distance himself from his own shame."],["Structure","This comes in Act 3, as the final and most shocking part of Eva’s story is revealed."],["Context","Working class women in 1912 were vulnerable to exploitation by wealthier men, with little protection."],["Writer's intention","Priestley presents the abuse of power by men over women, especially those of a lower class."],["Effect on a 1945 audience","A 1945 audience would be deeply disturbed, recognising how men of power exploited vulnerable women with no protection or rights."]],"th":"Gender · Class · Guilt and blame · Power"}]},{"n":"Age and Generations","k":"Theme","sum":"","quotes":[{"q":"the famous younger generation who know it all","src":"Mr Birling, Act 3","f":[["Language","The sarcastic adjective ‘famous’ shows Birling mocking the young for thinking they understand the world better than he does."],["Form","His sarcasm shows his refusal to listen to the younger generation’s new understanding."],["Structure","This comes in Act 3, after the Inspector leaves, as the older and younger generations divide."],["Context","Priestley believed the young people of 1945 could build a fairer society after the war."],["Writer's intention","Priestley presents the older generation as stubborn and unwilling to change, clinging to the selfish values the play condemns."],["Effect on a 1945 audience","In 1945 the younger generation had fought the war and voted for change, so Birling’s mockery would make the audience side with Sheila and Eric."]],"th":"Age and generations · Change · Power"},{"q":"he’s only a boy","src":"Mrs Birling about Eric","f":[["Language","The adverb ‘only’ shows Mrs Birling refusing to see Eric as an adult, excusing his behaviour."],["Form","Her protective, dismissive tone reveals how little she understands her own son or his heavy drinking."],["Structure","This shows her blindness to Eric’s drinking, which is later revealed in full."],["Context","Edwardian parents often expected children to obey rather than confide in them, so many knew little about their children’s lives."],["Writer's intention","Priestley presents a gap between parents and children, showing the failure of the older generation."],["Effect on a 1945 audience","A 1945 audience would see the irony, as Eric has done adult wrongs, and recognise how the older generation refused to see the truth."]],"th":"Age and generations · Appearance and reality · Guilt and blame"},{"q":"you don’t seem to have learnt anything","src":"Sheila to her parents, Act 3","f":[["Language","The verb ‘learnt’ shows that Sheila sees the evening as a lesson that her parents have failed."],["Form","Sheila’s lines echo the Inspector’s views, showing how much she has changed."],["Structure","This comes near the end, after the Inspector has left, highlighting the growing division between the generations."],["Context","Priestley hoped his 1945 audience would learn from the past and build a better future."],["Writer's intention","Priestley presents the younger generation as open to change and moral growth."],["Effect on a 1945 audience","For a 1945 audience, Sheila speaks for a generation determined not to repeat the mistakes that led to two world wars."]],"th":"Age and generations · Change · Social responsibility"}]},{"n":"Guilt and Blame","k":"Theme","sum":"","quotes":[{"q":"But each of you helped to kill her.","src":"The Inspector, Act 3","f":[["Language","The pronoun ‘each’ shows that every member of the family shares responsibility for Eva’s death."],["Form","The Inspector’s blunt, accusing tone shows his role as a judge, passing sentence on the whole family at once."],["Structure","This comes as he sums up before leaving, linking all the separate stories together."],["Context","Priestley wanted the audience to see that society as a whole shares responsibility for the poor."],["Writer's intention","Priestley presents collective guilt, showing that small selfish acts can combine to destroy a life."],["Effect on a 1945 audience","A 1945 audience would feel the line directed at them: everyone in society shares responsibility for the vulnerable."]],"th":"Guilt and blame · Social responsibility · Class"},{"q":"I know I’m to blame","src":"Sheila, Act 2","f":[["Language","The verb phrase ‘to blame’ shows Sheila accepting responsibility for her actions."],["Form","Her honest, emotional confession contrasts sharply with her parents’ denials and attempts to avoid blame."],["Structure","This comes in Act 2, showing that Sheila is the first to accept guilt."],["Context","Priestley believed that accepting responsibility was the first step to building a fairer society."],["Writer's intention","Priestley presents guilt as a positive force, because accepting blame is what allows Sheila to change."],["Effect on a 1945 audience","A 1945 audience would see Sheila as a model citizen for the new Britain, willing to admit fault and change."]],"th":"Guilt and blame · Change · Age and generations · Gender"},{"q":"There’ll be a public scandal","src":"Mr Birling, Act 3","f":[["Language","The noun ‘scandal’ shows Birling cares more about his reputation than about Eva’s death."],["Form","His panic, focused on gossip and his position, shows the shallowness of his values."],["Structure","This comes in Act 3, after the full story is revealed, showing he has not changed."],["Context","Birling hopes for a knighthood, so a scandal would destroy his social ambitions."],["Writer's intention","Priestley presents Birling as refusing true guilt, only fearing the consequences for himself."],["Effect on a 1945 audience","In 1945, with the country focused on rebuilding, a self interested businessman worried about scandal rather than a death would seem shameful."]],"th":"Guilt and blame · Appearance and reality · Class · Morality and hypocrisy"}]}],"ctx9":[["1912 setting","Edwardian Britain had a rigid class system, no welfare state and no votes for women.","Setting the play in 1912 lets Priestley expose the complacency of the Edwardian elite."],["The 1945 audience","They had lived through two world wars and the shared sacrifice of the Blitz.","A 1945 audience knows that Birling’s confident predictions of peace were catastrophically wrong."],["Priestley’s socialism","He co-founded the Common Wealth Party and broadcast about a fairer Britain.","The Inspector’s ‘We are members of one body’ voices Priestley’s socialist vision."],["The welfare state","Labour’s 1945 victory led to the NHS and welfare state.","Eva’s fate shows why a safety net was needed, echoing debates of 1945."],["Women’s rights","Women could not vote in 1912; working women had few protections.","Eva’s treatment exposes how vulnerable working class women were."],["Dramatic irony","The audience knows more than the characters.","Birling’s ‘unsinkable’ Titanic makes him look foolish and discredits his capitalist views."]],"voc":{"v":[["capitalist","believing in private profit and business","Birling is a capitalist who puts profit before people."],["socialist","believing in shared responsibility","The Inspector voices Priestley’s socialist message."],["complacent","smugly satisfied","Birling is complacent about war and the Titanic."],["culpable","deserving blame","Each Birling is culpable in Eva’s death."],["hypocritical","claiming morals you do not follow","Mrs Birling is hypocritical, judging Eva while ignoring her son."],["omniscient","knowing everything","The Inspector seems omniscient."],["patriarchal","dominated by men","Gerald’s treatment of Daisy reveals patriarchal power."],["didactic","intending to teach","Priestley’s play is
